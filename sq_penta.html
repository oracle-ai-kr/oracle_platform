<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>🎭 펜타슬론</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e8002a;--red2:#ff1a42;--green:#00c853;--green2:#00e676;
  --gold:#ffd600;--teal:#1a8899;--teal2:#22b8cc;--orange:#ff7020;--orange2:#ff9040;
  --bg:#0a0a0a;--panel:#161616;--panel2:#1e1e1e;
  --text:#f0ece8;--text2:#9a9490;--text3:#4a4642;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;font-family:'Noto Sans KR',sans-serif;background:var(--bg);}

/* ══ 운동장 배경 ══ */
#bg{
  position:fixed;inset:0;z-index:0;
  background:linear-gradient(180deg,
    #87CEEB 0%,#b8e4ff 16%,
    #c8f0a0 16%,#a8d868 22%,
    #c8a050 22%,#b89040 100%);
}
#bg::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 30% at 50% 10%,rgba(255,240,100,.18),transparent);}
#bg::after{content:'';position:absolute;top:16%;left:0;right:0;height:6%;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(100,180,40,.15) 0px,rgba(100,180,40,.15) 6px,transparent 6px,transparent 14px);}
.cloud{position:fixed;background:rgba(255,255,255,.88);border-radius:50px;pointer-events:none;z-index:0;}
.c1{width:80px;height:26px;top:2%;left:5%;animation:cloudMove 22s linear infinite;}
.c2{width:60px;height:20px;top:5%;left:42%;animation:cloudMove 30s linear infinite;}
.c3{width:100px;height:30px;top:1%;left:72%;animation:cloudMove 25s linear infinite;}
@keyframes cloudMove{0%{transform:translateX(-140px)}100%{transform:translateX(110vw)}}
.dirt{position:fixed;top:22%;left:0;right:0;bottom:0;z-index:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.03) 0px,rgba(0,0,0,.03) 1px,transparent 1px,transparent 12px);}
.fence{position:fixed;bottom:0;left:0;right:0;height:16px;z-index:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,#8B4513 0px,#8B4513 12px,transparent 12px,transparent 20px);opacity:.5;}

/* ══ 헤더 ══ */
#header{
  position:fixed;top:0;left:0;right:0;z-index:200;height:50px;
  display:flex;align-items:center;gap:8px;padding:0 12px;
  background:rgba(0,0,0,.58);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,214,0,.2);
}
#backBtn{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--text2);font-size:.9rem;display:flex;align-items:center;justify-content:center;cursor:pointer;}
#backBtn:active{opacity:.7;}
.hd-title{font-family:'Black Han Sans',sans-serif;font-size:.95rem;letter-spacing:.06em;color:var(--gold);flex:1;}
/* 진행 도트 */
#progressDots{display:flex;gap:5px;align-items:center;}
.prog-dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.15);transition:all .3s;}
.prog-dot.done{background:var(--green2);box-shadow:0 0 6px var(--green);}
.prog-dot.current{background:var(--gold);box-shadow:0 0 8px var(--gold);animation:dotPulse .8s ease infinite alternate;}
@keyframes dotPulse{0%{transform:scale(1)}100%{transform:scale(1.3)}}

/* ══ 게임 이름 배너 ══ */
#gameBanner{
  position:fixed;top:50px;left:0;right:0;z-index:150;
  padding:8px 14px;
  background:rgba(0,0,0,.55);backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(255,214,0,.12);
  display:flex;align-items:center;gap:10px;
}
#gameNumBadge{
  font-family:'Black Han Sans',sans-serif;font-size:.65rem;
  background:rgba(255,214,0,.15);border:1px solid rgba(255,214,0,.3);
  color:var(--gold);border-radius:8px;padding:3px 9px;white-space:nowrap;
}
#gameNameText{font-family:'Black Han Sans',sans-serif;font-size:.9rem;color:#fff;flex:1;}
#gameTimer{font-family:'Black Han Sans',sans-serif;font-size:1rem;color:var(--red2);}

/* ══ 메인 게임 영역 ══ */
#gameArea{
  position:fixed;top:94px;left:0;right:0;bottom:0;z-index:1;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:16px 16px 20px;
}

/* ══ 공통 시각화 영역 ══ */
#visualArea{
  flex:1;width:100%;max-width:380px;
  display:flex;align-items:stretch;justify-content:center;
  position:relative;min-height:0;
}

/* ══ 공통 컨트롤 ══ */
#controlArea{
  width:100%;max-width:380px;
  display:flex;flex-direction:column;gap:8px;
}

/* ══ 전환 오버레이 ══ */
#transitionOverlay{
  position:fixed;inset:0;z-index:400;
  background:rgba(0,0,0,.92);backdrop-filter:blur(6px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
}
#transitionOverlay.hidden{display:none;}
.tr-num{font-family:'Black Han Sans',sans-serif;font-size:3.5rem;color:var(--gold);text-shadow:0 0 30px rgba(255,214,0,.5);}
.tr-name{font-family:'Black Han Sans',sans-serif;font-size:1.4rem;color:#fff;letter-spacing:.06em;}
.tr-sub{font-size:.78rem;color:var(--text2);letter-spacing:.08em;}
.tr-dots{display:flex;gap:8px;}
.tr-dot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.15);}
.tr-dot.d{background:var(--green2);}
.tr-dot.c{background:var(--gold);animation:dotPulse .8s ease infinite alternate;}

/* ══ 시작 팝업 ══ */
#startOverlay{
  position:fixed;inset:0;z-index:500;
  background:rgba(0,0,0,.88);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:24px;
}
#startOverlay.hidden{display:none;}
.popup-box{background:#1a1a1a;border-radius:22px;padding:28px 22px 22px;width:100%;max-width:360px;text-align:center;position:relative;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.8);}
.popup-box::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--gold),var(--orange),var(--red));}
.popup-box::after{content:'○  △  □';position:absolute;bottom:10px;right:14px;font-size:.55rem;color:rgba(255,255,255,.06);letter-spacing:.2em;pointer-events:none;}
.p-icon{font-size:3rem;margin-bottom:10px;display:block;}
.p-title{font-family:'Black Han Sans',sans-serif;font-size:1.4rem;letter-spacing:.06em;color:var(--gold);margin-bottom:14px;}
.p-rules{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:12px 14px;margin-bottom:16px;text-align:left;}
.rule-row{display:flex;gap:8px;font-size:.75rem;color:var(--text2);line-height:1.6;margin-bottom:5px;}
.rule-row:last-child{margin-bottom:0;}
.rule-row b{color:#fff;}.hl{color:var(--red2);font-weight:900;}.hlg{color:var(--green2);font-weight:900;}
.p-btn{width:100%;padding:14px;border:none;border-radius:13px;font-family:'Black Han Sans',sans-serif;font-size:.95rem;letter-spacing:.04em;cursor:pointer;margin-bottom:9px;transition:all .15s;}
.p-btn:last-child{margin-bottom:0;}
.p-btn.primary{background:linear-gradient(135deg,var(--gold),var(--orange));color:#000;box-shadow:0 3px 14px rgba(255,214,0,.35);}
.p-btn.secondary{background:rgba(255,255,255,.07);color:var(--text2);border:1px solid rgba(255,255,255,.1);}
.p-btn:active{opacity:.8;}

/* ══ 카운트다운 ══ */
#countdown{position:fixed;inset:0;z-index:450;background:rgba(0,0,0,.85);backdrop-filter:blur(4px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;}
#countdown.hidden{display:none;}
#cdNum{font-family:'Black Han Sans',sans-serif;font-size:6rem;color:var(--gold);text-shadow:0 0 40px rgba(255,214,0,.8);animation:cdPop .9s ease infinite;}
@keyframes cdPop{0%{transform:scale(1.25)}80%{transform:scale(.95)}100%{transform:scale(1.25)}}
#cdSub{font-size:.85rem;color:rgba(255,255,255,.6);letter-spacing:.12em;}

/* ══ 결과 팝업 ══ */
#resultOverlay{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.88);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:24px;}
#resultOverlay.show{display:flex;}
.result-box{background:#1a1a1a;border-radius:22px;padding:28px 22px 22px;width:100%;max-width:360px;text-align:center;position:relative;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.8);animation:popIn .28s ease;}
@keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.result-box::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;}
.result-box.win::before{background:linear-gradient(90deg,var(--green),var(--green2));}
.result-box.lose::before{background:linear-gradient(90deg,var(--red),var(--red2));}
.result-box::after{content:'○  △  □';position:absolute;bottom:10px;right:14px;font-size:.55rem;color:rgba(255,255,255,.06);letter-spacing:.2em;pointer-events:none;}
.r-icon{font-size:3.4rem;margin-bottom:10px;display:block;}
.r-title{font-family:'Black Han Sans',sans-serif;font-size:1.5rem;letter-spacing:.06em;margin-bottom:8px;}
.r-title.win{color:var(--green2);}.r-title.lose{color:var(--red2);}
.r-desc{font-size:.78rem;color:var(--text2);line-height:1.75;margin-bottom:14px;white-space:pre-line;}
.r-reward{border-radius:10px;padding:10px;margin-bottom:18px;font-size:.9rem;font-weight:900;}
.r-reward.earn{background:rgba(0,200,83,.1);border:1px solid rgba(0,200,83,.22);color:var(--green2);}
.r-reward.loss{background:rgba(232,0,42,.08);border:1px solid rgba(232,0,42,.2);color:#ff6680;}
.r-btn{width:100%;padding:14px;border:none;border-radius:13px;font-family:'Black Han Sans',sans-serif;font-size:.95rem;letter-spacing:.04em;cursor:pointer;margin-bottom:10px;}
.r-btn:last-child{margin-bottom:0;}
.r-btn.primary{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;box-shadow:0 3px 14px rgba(232,0,42,.4);}
.r-btn.secondary{background:rgba(255,255,255,.07);color:var(--text2);border:1px solid rgba(255,255,255,.1);}
.r-btn:active{opacity:.8;}

/* ══ 이펙트 ══ */
/* ══ 이펙트 → squid_fx.js 대체 ══ */

/* ══ 토스트 ══ */
#toast{position:fixed;top:58px;left:50%;transform:translateX(-50%) translateY(-8px);background:rgba(10,10,10,.97);border:1px solid rgba(255,214,0,.25);border-radius:10px;padding:8px 18px;font-size:.78rem;color:var(--text);opacity:0;transition:all .28s;pointer-events:none;z-index:400;white-space:nowrap;max-width:88vw;text-align:center;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ══ 파티클 ══ */
.particle{position:fixed;pointer-events:none;z-index:700;font-size:1.2rem;animation:pfly 1.4s ease forwards;}
@keyframes pfly{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(-120px) rotate(360deg)}}

/* ════════════════════
   게임 1 — 제기차기 (핀볼)
════════════════════ */
#jegi-field{
  width:100%;height:100%;position:relative;
  background:rgba(0,0,0,.35);border-radius:16px;
  border:2px solid rgba(255,255,255,.1);overflow:hidden;
  min-height:200px;
}
/* 바닥 위험선 (점선 — 경고, 하단) */
#jegi-danger-line{
  position:absolute;bottom:15%;left:0;right:0;height:2px;
  background:repeating-linear-gradient(90deg,rgba(232,0,42,.6) 0,rgba(232,0,42,.6) 8px,transparent 8px,transparent 16px);
}
/* 실격선 (완전 바닥) */
#jegi-fail-line{
  position:absolute;bottom:4px;left:0;right:0;height:2px;
  background:rgba(232,0,42,.8);
}
#jegi-ball{
  position:absolute;width:40px;height:40px;
  object-fit:contain;
  filter:drop-shadow(0 0 8px rgba(255,214,0,.4));
  transform:translate(-50%,-50%);
  pointer-events:none;
}
/* 유저 발 */
#jegi-foot{
  position:absolute;bottom:14%;
  font-size:2.4rem;line-height:1;
  transform:translateX(-50%);
  transition:left .08s ease;
  filter:hue-rotate(20deg) saturate(3.5) brightness(1.0);
  z-index:2;
}
/* 히트존 네모칸 (발 주변) */
#jegi-hit-zone{
  position:absolute;bottom:12%;height:64px;
  background:rgba(0,200,83,.15);border:2px solid rgba(0,200,83,.5);
  border-radius:10px;transform:translateX(-50%);
  pointer-events:none;transition:left .08s ease;
}
/* 카운트 */
#jegi-count{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);
  font-family:'Black Han Sans',sans-serif;font-size:1.6rem;
  color:var(--gold);text-shadow:0 0 12px rgba(255,214,0,.5);
  pointer-events:none;
}
/* 발 까딱 애니메이션 */
@keyframes footKick{
  0%  {transform:translateX(-50%) rotate(0deg);}
  30% {transform:translateX(-50%) rotate(-35deg) translateY(-6px);}
  60% {transform:translateX(-50%) rotate(10deg);}
  100%{transform:translateX(-50%) rotate(0deg);}
}
#jegi-foot.kick{animation:footKick .25s ease forwards;}
.jegi-trail{
  position:absolute;font-size:1rem;opacity:.4;
  transform:translate(-50%,-50%);pointer-events:none;
  animation:trailFade .3s ease forwards;
}
@keyframes trailFade{0%{opacity:.4}100%{opacity:0;transform:translate(-50%,-50%) scale(.5)}}
/* 컨트롤 */
.jegi-ctrl-row{display:flex;gap:8px;}
.jegi-side-btn{
  width:70px;height:68px;border:none;border-radius:14px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  color:#fff;font-size:1.4rem;cursor:pointer;transition:all .1s;
  display:flex;align-items:center;justify-content:center;
}
.jegi-side-btn:active{background:rgba(255,255,255,.22);transform:scale(.94);}
.jegi-hit-btn{
  flex:1;height:68px;border:none;border-radius:14px;
  background:linear-gradient(135deg,var(--teal),var(--teal2));
  color:#fff;font-family:'Black Han Sans',sans-serif;font-size:1rem;
  letter-spacing:.04em;box-shadow:0 4px 16px rgba(26,136,153,.5);
  cursor:pointer;transition:all .1s;
}
.jegi-hit-btn:active{transform:scale(.96);}

/* ════════════════════
   게임 2 — 공기놀이
════════════════════ */
#gonggi-wrap{width:100%;height:100%;position:relative;background:rgba(0,0,0,.3);border-radius:16px;border:2px solid rgba(255,255,255,.1);}
.gonggi-stone{
  position:absolute;width:52px;height:52px;border-radius:50%;
  background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;
  font-family:'Black Han Sans',sans-serif;font-size:1.4rem;color:#fff;
  cursor:pointer;transition:transform .12s,opacity .25s,background .2s;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));
}
.gonggi-stone.next-target{background:rgba(255,214,0,.3);border-color:rgba(255,214,0,.8);color:var(--gold);
  box-shadow:0 0 14px rgba(255,214,0,.5);animation:stonePulse .6s ease infinite alternate;}
@keyframes stonePulse{0%{transform:scale(1)}100%{transform:scale(1.08)}}
.gonggi-stone.caught{opacity:0;transform:scale(0)!important;pointer-events:none;}
.gonggi-stone.wrong{background:rgba(232,0,42,.4);border-color:var(--red2);}
#gonggi-order{position:absolute;top:8px;left:50%;transform:translateX(-50%);
  font-family:'Black Han Sans',sans-serif;font-size:.75rem;color:var(--text2);white-space:nowrap;}

/* ════════════════════
   게임 3 — 딱지치기
════════════════════ */
#ddakji-wrap{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;}
#ddakji-enemy{font-size:5rem;line-height:1;filter:drop-shadow(0 4px 12px rgba(0,0,0,.4));transition:transform .2s;}
#ddakji-enemy.hit{animation:ddakjiHit .3s ease;}
@keyframes ddakjiHit{0%{transform:rotate(0)}30%{transform:rotate(-25deg) scale(1.15)}70%{transform:rotate(8deg)}100%{transform:rotate(0)}}
#ddakji-enemy.flip{animation:ddakjiFlip .45s ease forwards;}
@keyframes ddakjiFlip{0%{transform:rotateY(0) scale(1)}50%{transform:rotateY(90deg) scale(.7)}100%{transform:rotateY(180deg) scale(1)}}
#ddakji-count-wrap{font-family:'Black Han Sans',sans-serif;font-size:.85rem;color:var(--text2);text-align:center;}
#ddakji-count{font-size:2rem;color:var(--gold);}
/* 게이지바 공통 */
.gauge-wrap{position:relative;height:44px;background:rgba(255,255,255,.06);border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.1);width:100%;}
.gauge-success-zone{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.25);border-left:2px solid rgba(255,255,255,.9);border-right:2px solid rgba(255,255,255,.9);}
.gauge-ball{position:absolute;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,#fff,var(--gold));box-shadow:0 0 12px rgba(255,214,0,.8);}
.gauge-hit-txt{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Black Han Sans',sans-serif;font-size:.85rem;opacity:0;transition:opacity .2s;pointer-events:none;}
.gauge-hit-txt.show-good{color:var(--green2);opacity:1;}
.gauge-hit-txt.show-bad{color:var(--red2);opacity:1;}

/* ════════════════════
   게임 4 — 팽이치기
════════════════════ */
#paengyi-wrap{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
#paengyi-top{font-size:5rem;line-height:1;filter:drop-shadow(0 4px 12px rgba(0,0,0,.4));}
#paengyi-speed-wrap{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px 14px;}
.py-label{display:flex;justify-content:space-between;margin-bottom:6px;}
.py-text{font-size:.65rem;color:var(--text3);}
.py-val{font-family:'Black Han Sans',sans-serif;font-size:.75rem;color:var(--gold);}
.py-bar-bg{height:12px;background:rgba(255,255,255,.07);border-radius:6px;overflow:hidden;}
#paengyi-bar{height:100%;border-radius:6px;transition:width .15s;}
#paengyi-time{font-family:'Black Han Sans',sans-serif;font-size:2rem;color:var(--gold);text-align:center;}
.paengyi-btn{width:100%;height:80px;border:none;border-radius:16px;
  background:linear-gradient(135deg,var(--orange),var(--orange2));
  color:#fff;font-family:'Black Han Sans',sans-serif;font-size:1.2rem;
  box-shadow:0 4px 20px rgba(255,112,32,.5);cursor:pointer;transition:all .1s;}
.paengyi-btn:active{transform:scale(.96);}

/* ════════════════════
   게임 5 — 투호
════════════════════ */
#tuho-wrap{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
#tuho-jar{font-size:4.5rem;line-height:1;filter:drop-shadow(0 4px 12px rgba(0,0,0,.4));}
#tuho-count{font-family:'Black Han Sans',sans-serif;font-size:2rem;color:var(--gold);text-align:center;}
.tuho-btn{width:100%;height:80px;border:none;border-radius:16px;
  background:linear-gradient(135deg,var(--red),var(--red2));
  color:#fff;font-family:'Black Han Sans',sans-serif;font-size:1.2rem;
  box-shadow:0 4px 20px rgba(232,0,42,.5);cursor:pointer;transition:all .1s;}
.tuho-btn:active{transform:scale(.96);}

@keyframes successPop{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.success-anim{animation:successPop .3s ease;}
</style>
</head>
<body>
<script>if(!sessionStorage.getItem("ORACLE_ENTRY")<body><body>window.self===window.top){window.location.replace("index.html");}</script>

<div id="bg"></div>
<div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
<div class="dirt"></div><div class="fence"></div>

<!-- 헤더 -->
<div id="header">
  <button id="backBtn" onclick="doBack()">←</button>
  <div class="hd-title">🎭 펜타슬론</div>
  <div id="progressDots">
    <div class="prog-dot" id="dot0"></div>
    <div class="prog-dot" id="dot1"></div>
    <div class="prog-dot" id="dot2"></div>
    <div class="prog-dot" id="dot3"></div>

<script src="squid_fx.js"></script>
<script>
// ════════════════════════════
// 상수
// ════════════════════════════
const GAME_ID = 'sq_penta';

const GAMES = [
  {id:'jegi',    name:'제기차기', emoji:'🎯'},
  {id:'gonggi',  name:'공기놀이', emoji:'🪨'},
  {id:'ddakji',  name:'딱지치기', emoji:'📄'},
  {id:'paengyi', name:'팽이치기', emoji:'🌀'},
  {id:'tuho',    name:'투호',     emoji:'🏹'},
];

// ════════════════════════════
// 상태
// ════════════════════════════
let gameInfo    = null;
let phase       = 'start';
let currentGame = 0; // 0~4
let rafId       = null;
let timerIv     = null;
let gonggiTIv   = null;
let ddakjiChargeIv = null;
let paengyiTIv  = null;
let paengyiDecayIv = null;
// 공기놀이
let gonggiOrder=[], gonggiNext=0, gonggiTimer=3;
// 딱지치기
let ddakjiSuccess=0, ddakjiTarget=3;
let ddakjiCharging=false, ddakjiChargeVal=0;
let ddakjiLinePos=0;
// 팽이치기
let paengyiSpeed=100, paengyiTimeLeft=10;
let footMoveIv  = null;
// 제기차기
let jegi_rafId  = null;
let jegiX=50, jegiY=50;
let jegiVX=0, jegiVY2=0;
let jegiGoingDown=true;
let jegiCount=0;
let footX=50;
let lastJegiTs=0;
let driftTimer=0;
// 투호
let tuhoRafId   = null;
let tuhoActive  = false;
let tuhoLastTs  = 0;
let tuhoSuccess = 0, tuhoTarget = 5;
let tuhoBallPos = 0, tuhoBallDir = 1, tuhoBallSpeed = 1.4;
let tuhoSuccessLeft = 0, tuhoSuccessW = 20;
let tuhoFakeTimer = 0;

// ════════════════════════════
// 진동
// ════════════════════════════
function vib(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }

// ════════════════════════════
// 초기화
// ════════════════════════════
function init(){
  const raw = sessionStorage.getItem('SQ_CURRENT_GAME');
  if(raw) gameInfo = JSON.parse(raw);
  updateDots(-1);
}

// ════════════════════════════
// 카운트다운
// ════════════════════════════
function startCountdown(){
  document.getElementById('startOverlay').classList.add('hidden');
  document.getElementById('countdown').classList.remove('hidden');
  let n=3;
  document.getElementById('cdNum').textContent=n;
  SQ.vignette(true, true);
  SQ.vibrate([100,50,100]);
  const tick=setInterval(()=>{
    n--;
    if(n>0){
      document.getElementById('cdNum').textContent=n;
      vib(n===2?[120,50,120]:[150,50,150]);
    } else {
      clearInterval(tick);
      SQ.vignette(false);
      SQ.flash('white', 120);
      document.getElementById('cdNum').textContent='GO!';
      document.getElementById('cdSub').textContent='첫 번째 게임!';
      vib([80,40,80,40,80,40,200]);
      setTimeout(()=>{
        document.getElementById('countdown').classList.add('hidden');
        startCurrentGame();
      },700);
    }
  },900);
}

// ════════════════════════════
// 진행 도트
// ════════════════════════════
function updateDots(cur){
  for(let i=0;i<5;i++){
    const el=document.getElementById(`dot${i}`);
    el.className='prog-dot';
    if(i<cur) el.classList.add('done');
    else if(i===cur) el.classList.add('current');
  }
}

// ════════════════════════════
// 게임 배너 업데이트
// ════════════════════════════
function updateBanner(idx, timerText=''){
  document.getElementById('gameNumBadge').textContent=`${idx+1} / 5`;
  document.getElementById('gameNameText').textContent=
    `${GAMES[idx].emoji} ${GAMES[idx].name}`;
  document.getElementById('gameTimer').textContent=timerText;
}

// ════════════════════════════
// 현재 게임 시작
// ════════════════════════════
function startCurrentGame(){
  cancelAnimationFrame(jegi_rafId); jegi_rafId=null;
  cancelAnimationFrame(tuhoRafId); tuhoRafId=null;
  clearInterval(timerIv); timerIv=null;
  clearInterval(gonggiTIv); gonggiTIv=null;
  clearInterval(paengyiTIv); paengyiTIv=null;
  clearInterval(paengyiDecayIv); paengyiDecayIv=null;
  clearInterval(ddakjiChargeIv); ddakjiChargeIv=null;
  clearInterval(footMoveIv); footMoveIv=null;
  phase='playing';
  SQ.announce('시즌2 두 번째 게임', {type:'system', duration:1800});
  setTimeout(()=>{ SQ.announce('🎭 펜타슬론 — 다섯 가지 시련!', {type:'guard', duration:2500, typing:true}); }, 2000);
  document.getElementById('gameArea').classList.remove('hidden');
  updateDots(currentGame);
  updateBanner(currentGame);
  const g = GAMES[currentGame];
  if(g.id==='jegi')    startJegi();
  else if(g.id==='gonggi')  startGonggi();
  else if(g.id==='ddakji')  startDdakji();
  else if(g.id==='paengyi') startPaengyi();
  else if(g.id==='tuho')    startTuho();
}

// ════════════════════════════
// 게임 성공 → 다음으로
// ════════════════════════════
function onGameSuccess(){
  phase='transition'; // 전환 중 재진입 차단
  cancelAnimationFrame(jegi_rafId); jegi_rafId=null;
  cancelAnimationFrame(tuhoRafId); tuhoRafId=null;
  clearInterval(timerIv); timerIv=null;
  clearInterval(gonggiTIv); gonggiTIv=null;
  clearInterval(paengyiTIv); paengyiTIv=null;
  clearInterval(paengyiDecayIv); paengyiDecayIv=null;
  clearInterval(ddakjiChargeIv); ddakjiChargeIv=null;
  clearInterval(footMoveIv); footMoveIv=null;

  flashEffect('green');
  vib([40,20,60]);
  spawnParticles('✨');

  if(currentGame >= 4){
    updateDots(5);
    setTimeout(()=>endGame('win'), 600);
    return;
  }

  currentGame++;
  const next = GAMES[currentGame];
  showTransition(currentGame, next.name, ()=> startCurrentGame());
}

// ════════════════════════════
// 게임 실패
// ════════════════════════════
function onGameFail(reason=''){
  clearAll();
  flashEffect('red');
  vib([200,80,200,80,400]);
  showToast(`💀 ${reason||'실패!'}`);
  setTimeout(()=>endGame('lose', reason), 1200);
}

// ════════════════════════════
// 전환 오버레이
// ════════════════════════════
function showTransition(idx, name, cb){
  const ov = document.getElementById('transitionOverlay');
  document.getElementById('trNum').textContent = `${idx+1}번째`;
  document.getElementById('trName').textContent = name;
  document.getElementById('trSub').textContent = '다음 게임 준비!';

  // 도트
  const td = document.getElementById('trDots');
  td.innerHTML='';
  for(let i=0;i<5;i++){
    const d=document.createElement('div');
    d.className='tr-dot';
    if(i<idx) d.classList.add('d');
    else if(i===idx) d.classList.add('c');
    td.appendChild(d);
  }

  ov.classList.remove('hidden');
  vib([80,40,80]);

  setTimeout(()=>{
    ov.classList.add('hidden');
    cb();
  }, 1800);
}

// ════════════════════════════
// clearAll — 타이머/RAF 정지
// ════════════════════════════
function clearAll(){
  phase='idle';
  clearInterval(timerIv); timerIv=null;
  cancelAnimationFrame(rafId); rafId=null;
  cancelAnimationFrame(jegi_rafId); jegi_rafId=null;
  cancelAnimationFrame(tuhoRafId); tuhoRafId=null;
  clearInterval(gonggiTIv); gonggiTIv=null;
  clearInterval(paengyiTIv); paengyiTIv=null;
  clearInterval(paengyiDecayIv); paengyiDecayIv=null;
  clearInterval(ddakjiChargeIv); ddakjiChargeIv=null;
  clearInterval(footMoveIv); footMoveIv=null;
}

// ════════════════════════════
// ── 게임 1: 제기차기 ──
// ════════════════════════════
// ════════════════════════════
// ── 게임 1: 제기차기 (핀볼) ──

function jegiLoop(ts){
  if(phase!=='playing') return;
  if(lastJegiTs===0){ lastJegiTs=ts; jegi_rafId=requestAnimationFrame(jegiLoop); return; }
  const dt=Math.min((ts-lastJegiTs)/1000,.05);
  lastJegiTs=ts;

  // 상하 왕복
  if(jegiGoingDown){
    jegiY+=jegiVY2*dt;
  } else {
    jegiY-=jegiVY2*dt;
  }

  // 위 벽 반사
  if(jegiY<=5){
    jegiY=5;
    jegiGoingDown=true;
    jegiVY2=JEGI_VY; // 첫 출발 후 정상 속도로 전환
    // 좌우도 정상 속도로
    if(Math.abs(jegiVX)<15) jegiVX=(jegiVX<0?-1:1)*(15+Math.random()*15);
  }

  // 좌우 이동
  jegiX+=jegiVX*dt;

  // 좌우 벽 반사
  if(jegiX<=3){  jegiX=3;  jegiVX=Math.abs(jegiVX); }
  if(jegiX>=97){ jegiX=97; jegiVX=-Math.abs(jegiVX); }

  // 좌우 랜덤 방향 변화
  driftTimer+=dt;
  if(driftTimer > 1.5+Math.random()*1.5){
    driftTimer=0;
    jegiVX+=(Math.random()-.5)*20;
    jegiVX=Math.max(-45, Math.min(45, jegiVX));
    if(Math.abs(jegiVX)<8) jegiVX=(jegiVX<0?-1:1)*8; // 최소 속도 보장
  }

  // UI 업데이트
  const field=document.getElementById('jegi-field');
  if(!field){ cancelAnimationFrame(jegi_rafId); return; }
  const fw=field.clientWidth, fh=field.clientHeight;
  if(!fw||!fh){ jegi_rafId=requestAnimationFrame(jegiLoop); return; }

  // 완전 바닥(실격선) 도달 → 실격
  if(jegiY >= 97 && jegiGoingDown){
    cancelAnimationFrame(jegi_rafId);
    onGameFail('제기를 떨어뜨렸습니다!');
    return;
  }

  const ball=document.getElementById('jegi-ball');
  const foot=document.getElementById('jegi-foot');
  const hitZone=document.getElementById('jegi-hit-zone');
  if(!ball||!foot||!hitZone){ jegi_rafId=requestAnimationFrame(jegiLoop); return; }

  ball.style.left=(jegiX/100*fw)+'px';
  ball.style.top=(jegiY/100*fh)+'px';
  // 내려올 때 뒤집기
  ball.style.transform=`translate(-50%,-50%) scaleY(${jegiGoingDown ? -1 : 1})`;

  const footPx=footX/100*fw;
  foot.style.left=footPx+'px';
  hitZone.style.left=footPx+'px';
  hitZone.style.width=(JEGI_HIT_W/100*fw*2)+'px';

  jegi_rafId=requestAnimationFrame(jegiLoop);
}

// 좌우 버튼 홀드 이동

function jegiMoveLeft(e){
  e.preventDefault();
  if(phase!=='playing') return;
  clearInterval(footMoveIv);
  footMoveIv = setInterval(()=>{
    if(phase!=='playing'){ clearInterval(footMoveIv); return; }
    footX = Math.max(5, footX - FOOT_STEP*0.4);
    vib(8);
  }, 60);
}
function jegiMoveRight(e){
  e.preventDefault();
  if(phase!=='playing') return;
  clearInterval(footMoveIv);
  footMoveIv = setInterval(()=>{
    if(phase!=='playing'){ clearInterval(footMoveIv); return; }
    footX = Math.min(95, footX + FOOT_STEP*0.4);
    vib(8);
  }, 60);
}
function jegiMoveStop(e){
  e.preventDefault();
  clearInterval(footMoveIv);
  footMoveIv = null;
}

function jegiHit(e){
  e.preventDefault();
  if(phase!=='playing') return;
  vib(20);

  // 발 까딱 애니메이션
  const foot=document.getElementById('jegi-foot');
  if(foot){
    foot.classList.remove('kick');
    void foot.offsetWidth;
    foot.classList.add('kick');
    setTimeout(()=>foot.classList.remove('kick'), 260);
  }

  // 판정: 히트존 Y(72~88%) + X(footX ± HIT_W) 안이면 성공
  const inY = jegiY >= 72 && jegiY <= 94;
  const inX = Math.abs(jegiX - footX) <= JEGI_HIT_W;

  if(inX && inY){
    // 성공 — 위로 튕김
    jegiGoingDown=false;
    jegiY=70;
    jegiVX+=(Math.random()-.5)*30;
    jegiVX=Math.max(-40, Math.min(40, jegiVX));

    jegiCount++;
    flashEffect('green');
    vib([30,20,50]);
    const cnt=document.getElementById('jegi-count');
    if(cnt) cnt.textContent=`${jegiCount} / ${JEGI_TARGET}`;
    spawnJegiTrail();

    if(jegiCount>=JEGI_TARGET){
      cancelAnimationFrame(jegi_rafId); jegi_rafId=null;
      onGameSuccess();
    }
  } else if(jegiY < 72){
    // 아직 내려오지 않음 — 무시
  } else {
    // X 위치 못 맞춤
    vib([60,20,60]);
    showToast('⚠️ 빗나갔습니다!');
  }
}

function spawnJegiTrail(){
  const field=document.getElementById('jegi-field');
  if(!field) return;
  const fw=field.clientWidth, fh=field.clientHeight;
  const t=document.createElement('div');
  t.className='jegi-trail'; t.textContent='✨';
  t.style.left=(jegiX/100*fw)+'px';
  t.style.top=(jegiY/100*fh)+'px';
  field.appendChild(t);
  setTimeout(()=>t.remove(),350);
}

// ════════════════════════════
// ── 게임 2: 공기놀이 ──
// 랜덤 번호 순서대로 탭, 3초 제한
// ════════════════════════════

function startGonggi(){
  gonggiNext=0; gonggiTimer=3;
  showToast('🪨 숫자 순서대로 빠르게 터치!', 2500);
  // 1~5 랜덤 배치
  gonggiOrder=[1,2,3,4,5].sort(()=>Math.random()-.5);

  let html='<div id="gonggi-wrap">';
  html+=`<div id="gonggi-order">다음: <span id="gonggi-next" style="color:var(--gold);font-size:1.1rem;">${gonggiOrder[0]}</span> 번을 눌러라!</div>`;
  gonggiOrder.forEach((num,i)=>{
    const x=12+Math.random()*72;
    const y=18+Math.random()*58;
    const isNext=(i===0);
    html+=`<div class="gonggi-stone${isNext?' next-target':''}" id="gs${num}"
      style="left:${x}%;top:${y}%;"
      ontouchstart="tapGonggi(event,${num})">${num}</div>`;
  });
  html+='</div>';
  document.getElementById('visualArea').innerHTML=html;
  document.getElementById('controlArea').innerHTML=`
    <div style="text-align:center;font-family:'Black Han Sans';font-size:.85rem;color:var(--text2);">
      ⏱ <span id="gonggi-timer" style="color:var(--red2);font-size:1.2rem;">${gonggiTimer}</span>초
    </div>`;

  updateBanner(currentGame, `${gonggiTimer}초`);
  gonggiTIv=setInterval(()=>{
    gonggiTimer--;
    const el=document.getElementById('gonggi-timer');
    if(el) el.textContent=gonggiTimer;
    updateBanner(currentGame, `${gonggiTimer}초`);
    if(gonggiTimer<=0){ clearInterval(gonggiTIv); gonggiTIv=null; onGameFail('시간 초과!'); }
  },1000);
}

function tapGonggi(e, num){
  e.preventDefault();
  if(phase!=='playing') return;
  const expected=gonggiOrder[gonggiNext];
  if(num===expected){
    // 정답
    const el=document.getElementById(`gs${num}`);
    if(el){ el.classList.remove('next-target'); el.classList.add('caught'); }
    gonggiNext++;
    vib([20,10,30]); flashEffect('green');
    if(gonggiNext>=5){
      clearInterval(gonggiTIv); gonggiTIv=null;
      onGameSuccess();
    } else {
      // 다음 번호 하이라이트
      const nextNum=gonggiOrder[gonggiNext];
      const nextEl=document.getElementById(`gs${nextNum}`);
      if(nextEl) nextEl.classList.add('next-target');
      const nd=document.getElementById('gonggi-next');
      if(nd) nd.textContent=nextNum;
    }
  } else {
    // 오답
    vib([100,40,100]);
    const el=document.getElementById(`gs${num}`);
    if(el){ el.classList.add('wrong'); setTimeout(()=>el.classList.remove('wrong'),220); }
    showToast(`❌ ${expected}번을 먼저 눌러야 해요!`);
    onGameFail('순서가 틀렸습니다!');
  }
}

// ── 게임 3: 딱지치기 ──

function startDdakji(){
  ddakjiSuccess=0;
  showToast('📄 꾹 눌러 힘을 모아 딱지를 뒤집어라!', 2500);
  document.getElementById('visualArea').innerHTML=`
    <div id="ddakji-wrap">
      <div id="ddakji-enemy">🟥</div>
      <div id="ddakji-count-wrap">
        <span id="ddakji-count">${ddakjiSuccess}</span> / ${ddakjiTarget} 뒤집기
      </div>
    </div>`;
  document.getElementById('controlArea').innerHTML=`
    <div style="display:flex;flex-direction:column;gap:8px;">
      <div class="gauge-wrap" id="ddakji-gauge">
        <div class="gauge-success-zone" id="ddakji-zone" style="left:0%;width:0%;"></div>
        <div class="gauge-ball" id="ddakji-ball" style="left:0%;"></div>
        <div class="gauge-hit-txt" id="ddakji-hit"></div>
      </div>
      <button style="width:100%;height:68px;border:none;border-radius:14px;
        background:linear-gradient(135deg,var(--red),var(--red2));
        color:#fff;font-family:'Black Han Sans';font-size:1rem;letter-spacing:.04em;
        box-shadow:0 4px 16px rgba(232,0,42,.45);cursor:pointer;"
        ontouchstart="ddakjiPress(event)" ontouchend="ddakjiRelease(event)"
       >
        🟥 꾹 눌러서 차징!
      </button>
    </div>`;
  ddakjiNewLine();
}

function ddakjiNewLine(){
  // 새 경계선 랜덤 위치 (70~90%)
  ddakjiLinePos=70+Math.random()*20;
  const zone=document.getElementById('ddakji-zone');
  if(zone){
    zone.style.left=(ddakjiLinePos-2)+'%';
    zone.style.width='4%';
  }
  ddakjiChargeVal=0;
  const ball=document.getElementById('ddakji-ball');
  if(ball) ball.style.left='0%';
}

function ddakjiPress(e){
  e.preventDefault();
  if(phase!=='playing') return;
  ddakjiCharging=true; ddakjiChargeVal=0;
  clearInterval(ddakjiChargeIv);
  ddakjiChargeIv=setInterval(()=>{
    if(!ddakjiCharging||phase!=='playing') return;
    ddakjiChargeVal=Math.min(100, ddakjiChargeVal+1.2);
    const ball=document.getElementById('ddakji-ball');
    if(ball) ball.style.left=ddakjiChargeVal+'%';
    // 100% 넘어가면 실패
    if(ddakjiChargeVal>=100){
      clearInterval(ddakjiChargeIv);
      ddakjiCharging=false;
      showDdakjiHit(false);
      vib([100,40,100]);
      showToast('❌ 너무 많이 차징했어요!');
      setTimeout(()=>ddakjiNewLine(), 400);
    }
  },16);
}

function ddakjiRelease(e){
  e.preventDefault();
  if(!ddakjiCharging||phase!=='playing') return;
  clearInterval(ddakjiChargeIv);
  ddakjiCharging=false;

  const inZone=Math.abs(ddakjiChargeVal-ddakjiLinePos)<=2;
  if(inZone){
    ddakjiSuccess++;
    showDdakjiHit(true);
    flashEffect('green'); vib([40,20,60]);
    const enemy=document.getElementById('ddakji-enemy');
    if(enemy){
      if(ddakjiSuccess>=ddakjiTarget){
        phase='transition'; // 재입력 즉시 차단
        enemy.classList.add('flip');
        setTimeout(()=>onGameSuccess(),500);
        return;
      } else {
        enemy.classList.add('hit');
        setTimeout(()=>enemy.classList.remove('hit'),350);
      }
    }
    const cnt=document.getElementById('ddakji-count');
    if(cnt) cnt.textContent=ddakjiSuccess;
    showToast(`✅ ${ddakjiSuccess}/${ddakjiTarget} 뒤집기!`);
    setTimeout(()=>ddakjiNewLine(), 400);
  } else {
    showDdakjiHit(false);
    vib([80,30,80]);
    showToast(`⚠️ 경계선(${Math.round(ddakjiLinePos)}%) 근처에서 떼세요!`);
    setTimeout(()=>ddakjiNewLine(), 400);
  }
}

function showDdakjiHit(ok){
  const el=document.getElementById('ddakji-hit');
  if(!el) return;
  el.textContent=ok?'✅ 히트!':'❌ 실패!';
  el.className=`gauge-hit-txt ${ok?'show-good':'show-bad'}`;
  setTimeout(()=>{ el.className='gauge-hit-txt'; el.textContent=''; },600);
}

// ════════════════════════════
// ── 게임 4: 팽이치기 ──
// 게이지 감소, 탭으로 유지, 10초 버티기
// ════════════════════════════
const PAENGYI_TARGET_TIME=10;
const PAENGYI_TAP_BOOST=18;
const PAENGYI_DECAY=4;

function startPaengyi(){
  paengyiSpeed=100; paengyiTimeLeft=PAENGYI_TARGET_TIME;
  showToast('🌀 탭해서 팽이 속도를 유지하라!', 2500);

  // 스핀 스타일
  if(!document.getElementById('paengyi-style')){
    const s=document.createElement('style');
    s.id='paengyi-style';
    s.textContent='@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}';
    document.head.appendChild(s);
  }

  document.getElementById('visualArea').innerHTML=`
    <div id="paengyi-wrap">
      <div id="paengyi-top" style="animation:spin 0.8s linear infinite">🌀</div>
      <div id="paengyi-speed-wrap">
        <div class="py-label">
          <span class="py-text">🌀 팽이 속도</span>
          <span class="py-val" id="paengyi-val">100%</span>
        </div>
        <div class="py-bar-bg"><div id="paengyi-bar" style="width:100%;background:linear-gradient(90deg,var(--teal),var(--green2));"></div></div>
      </div>
      <div id="paengyi-time">${paengyiTimeLeft}초</div>
    </div>`;
  document.getElementById('controlArea').innerHTML=`
    <button class="paengyi-btn"
      ontouchstart="paengyiTap(event)">
      🌀 채찍질!
    </button>`;

  updateBanner(currentGame, `${paengyiTimeLeft}초`);

  paengyiDecayIv=setInterval(()=>{
    if(phase!=='playing') return;
    paengyiSpeed=Math.max(0, paengyiSpeed-PAENGYI_DECAY);
    updatePaengyiUI();
    if(paengyiSpeed > 0 && paengyiSpeed <= 25) vib([40,20,40]);
    if(paengyiSpeed<=0){
      clearInterval(paengyiDecayIv); paengyiDecayIv=null;
      clearInterval(paengyiTIv); paengyiTIv=null;
      onGameFail('팽이가 멈췄습니다!');
    }
  },200);

  paengyiTIv=setInterval(()=>{
    paengyiTimeLeft--;
    updateBanner(currentGame, `${paengyiTimeLeft}초`);
    const el=document.getElementById('paengyi-time');
    if(el) el.textContent=paengyiTimeLeft+'초';
    if(paengyiTimeLeft<=0){
      clearInterval(paengyiTIv); paengyiTIv=null;
      clearInterval(paengyiDecayIv); paengyiDecayIv=null;
      onGameSuccess();
    }
  },1000);
}

function paengyiTap(e){
  e.preventDefault();
  if(phase!=='playing') return;
  paengyiSpeed=Math.min(100, paengyiSpeed+PAENGYI_TAP_BOOST);
  vib(15); updatePaengyiUI();
  const top=document.getElementById('paengyi-top');
  if(top) top.style.animationDuration=`${Math.max(0.15, 0.8*(1-paengyiSpeed/200))}s`;
}

function updatePaengyiUI(){
  const bar=document.getElementById('paengyi-bar');
  const val=document.getElementById('paengyi-val');
  if(bar){
    bar.style.width=paengyiSpeed+'%';
    if(paengyiSpeed<30) bar.style.background='linear-gradient(90deg,var(--red2),var(--red))';
    else if(paengyiSpeed<60) bar.style.background='linear-gradient(90deg,var(--gold),var(--orange))';
    else bar.style.background='linear-gradient(90deg,var(--teal),var(--green2))';
  }
  if(val) val.textContent=Math.round(paengyiSpeed)+'%';
}

// ── 게임 5: 투호 ──
// 오징어게임 게이지바 이식, fake 패턴, 5번 성공
// ════════════════════════════

function startTuho(){
  tuhoSuccess=0;
  showToast('🏹 녹색 구간에 맞춰 던져라! 5회 성공!', 2500);
  document.getElementById('visualArea').innerHTML=`
    <div id="tuho-wrap">
      <div id="tuho-jar">🏺</div>
      <div id="tuho-count">${tuhoSuccess} / ${tuhoTarget}</div>
    </div>`;
  document.getElementById('controlArea').innerHTML=`
    <div style="display:flex;flex-direction:column;gap:8px;">
      <div class="gauge-wrap" id="tuho-gauge">
        <div class="gauge-success-zone" id="tuho-zone"></div>
        <div class="gauge-ball" id="tuho-ball" style="left:0%;"></div>
        <div class="gauge-hit-txt" id="tuho-hit"></div>
      </div>
      <button class="tuho-btn"
        ontouchstart="tuhoThrow(event)">
        🏹 던져라!
      </button>
    </div>`;
  tuhoSetupGauge();
}

function tuhoSetupGauge(){
  // 성공할수록 구간 좁아지고 속도 빨라짐
  tuhoSuccessW=Math.max(12, 24-tuhoSuccess*1.8);
  tuhoBallSpeed=1.3+tuhoSuccess*0.25;
  tuhoSuccessLeft=10+Math.random()*(80-tuhoSuccessW);
  tuhoBallPos=0; tuhoBallDir=1; tuhoFakeTimer=0;

  const zone=document.getElementById('tuho-zone');
  if(zone){
    zone.style.left=tuhoSuccessLeft+'%';
    zone.style.width=tuhoSuccessW+'%';
  }
  const ball=document.getElementById('tuho-ball');
  if(ball) ball.style.left='0%';
  const hit=document.getElementById('tuho-hit');
  if(hit){ hit.className='gauge-hit-txt'; hit.textContent=''; }

  tuhoActive=true;
  tuhoLastTs=performance.now();
  if(tuhoRafId) cancelAnimationFrame(tuhoRafId);
  tuhoRafId=requestAnimationFrame(tuhoLoop);
}

function tuhoLoop(ts){
  if(!tuhoActive||phase!=='playing') return;
  const dt=Math.min((ts-tuhoLastTs)/1000,0.05);
  tuhoLastTs=ts;

  // fake 패턴 — 가끔 방향 반전
  tuhoFakeTimer+=dt;
  if(tuhoFakeTimer>0.6+Math.random()*0.5){
    tuhoFakeTimer=0;
    if(Math.random()<0.35) tuhoBallDir*=-1;
  }

  tuhoBallPos+=tuhoBallDir*tuhoBallSpeed*55*dt;
  if(tuhoBallPos>=100){tuhoBallPos=100;tuhoBallDir=-1;}
  if(tuhoBallPos<=0){tuhoBallPos=0;tuhoBallDir=1;}

  const ball=document.getElementById('tuho-ball');
  if(ball) ball.style.left=tuhoBallPos+'%';

  tuhoRafId=requestAnimationFrame(tuhoLoop);
}

function tuhoThrow(e){
  e.preventDefault();
  if(!tuhoActive||phase!=='playing') return;
  tuhoActive=false;
  cancelAnimationFrame(tuhoRafId);
  vib(30);

  const ok=(tuhoBallPos>=tuhoSuccessLeft && tuhoBallPos<=tuhoSuccessLeft+tuhoSuccessW);
  const hit=document.getElementById('tuho-hit');
  if(hit){
    hit.textContent=ok?'✅ 투호!':'❌ 빗나감!';
    hit.className=`gauge-hit-txt ${ok?'show-good':'show-bad'}`;
    setTimeout(()=>{ hit.className='gauge-hit-txt'; hit.textContent=''; },600);
  }

  if(ok){
    tuhoSuccess++;
    flashEffect('green'); vib([40,20,60]);
    const jar=document.getElementById('tuho-jar');
    if(jar){ jar.classList.add('success-anim'); setTimeout(()=>jar.classList.remove('success-anim'),300); }
    const cnt=document.getElementById('tuho-count');
    if(cnt) cnt.textContent=`${tuhoSuccess} / ${tuhoTarget}`;
    if(tuhoSuccess>=tuhoTarget){
      cancelAnimationFrame(tuhoRafId); tuhoRafId=null; tuhoActive=false;
      onGameSuccess(); return;
    }
    showToast(`✅ ${tuhoSuccess}/${tuhoTarget} 투호 성공!`);
    setTimeout(()=>tuhoSetupGauge(), 700);
  } else {
    flashEffect('red'); vib([80,30,80]);
    showToast('❌ 빗나갔습니다! 다시!');
    setTimeout(()=>tuhoSetupGauge(), 700);
  }
}

// ════════════════════════════
// 게임 종료
// ════════════════════════════
function endGame(outcome, reason=''){
  clearAll();
  const isWin=outcome==='win';
  const isNew=gameInfo?gameInfo.isNew:true;

  sessionStorage.setItem('SQ_GAME_RESULT', JSON.stringify({
    gameId:GAME_ID, outcome:isWin?'clear':'fail'
  }));

  const box=document.getElementById('resultBox');
  box.className=`result-box ${isWin?'win':'lose'}`;
  document.getElementById('rIcon').textContent=isWin?'🏆':'💀';
  const rt=document.getElementById('rTitle');
  rt.textContent=isWin?(isNew?'첫 클리어!':'클리어!'):'탈락!';
  rt.className=`r-title ${isWin?'win':'lose'}`;

  document.getElementById('rDesc').textContent=isWin
    ?`5가지 전통놀이 전부 클리어!\n🎯제기 → 🪨공기 → 📄딱지 → 🌀팽이 → 🏹투호\n펜타슬론 완전 정복!`
    :`${currentGame+1}번째 ${GAMES[currentGame].name}에서 탈락!\n${reason}\n${currentGame}/5 클리어`;

  const reward=isWin?(isNew?600000:180000):0;
  const fee=gameInfo?gameInfo.fee:(isNew?300000:100000);
  const rr=document.getElementById('rReward');
  rr.className=`r-reward ${isWin?'earn':'loss'}`;
  rr.textContent=isWin
    ?`+${reward.toLocaleString('ko-KR')}원 획득!`
    :`-${fee.toLocaleString('ko-KR')}원`;

  if(isWin){ SQ.clearEffect(); SQ.bigText('통과!', 1500); spawnParticles('🎭'); SQ.vibrate([60,40,60,40,60,40,150]); }
  else { SQ.eliminateEffect({x: window.innerWidth/2, y: window.innerHeight/2}); SQ.bigText('탈락!', 1500); SQ.vibrate([200,60,200,60,300]); }

  setTimeout(()=>{ SQ.cleanup(); window.location.href='squid_hub.html'; },2000);
}

// ════════════════════════════
// 유틸

function flashEffect(c){

function showToast(msg,dur=1800){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),dur);
}
function spawnParticles(emoji){
  for(let i=0;i<12;i++) setTimeout(()=>{
    const p=document.createElement('div');
    p.className='particle'; p.textContent=emoji;
    p.style.left=`${Math.random()*80+10}vw`;
    p.style.top=`${Math.random()*60+10}vh`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),1500);
  },i*80);
}
function goHub(){ SQ.cleanup(); window.location.href='squid_hub.html'; }
function doBack(){
  SQ.cleanup();
  clearAll();
  if(phase!=='start'&&phase!=='result')
    sessionStorage.setItem('SQ_GAME_RESULT',JSON.stringify({gameId:GAME_ID,outcome:'fail'}));
  window.location.href='squid_hub.html';
}
