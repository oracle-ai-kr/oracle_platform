<!DOCTYPE html>
<html lang="ko">
<head><script>
// ── ORACLE 토큰가드 ──
(function(){
  var t=sessionStorage.getItem('ORACLE_ENTRY');
  var ok=t&&(Date.now()-Number(t)<5000);
  if(ok) sessionStorage.removeItem('ORACLE_ENTRY');
  if(ok) return;
  function _show404(){
    document.body.style.cssText='margin:0;padding:0;overflow:hidden';
    Array.from(document.body.children).forEach(function(el){el.style.display='none'});
    var d=document.createElement('div');
    d.id='_oracle404';
    d.innerHTML='<div style="position:fixed;inset:0;z-index:999999;background:#0f1724;color:#e8eaf0;'
      +'font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;display:flex;align-items:center;'
      +'justify-content:center;text-align:center;padding:20px">'
      +'<div style="max-width:360px">'
      +'<div style="width:120px;height:120px;background:#fff;border-radius:50%;margin:0 auto 32px;'
      +'display:flex;align-items:center;justify-content:center">'
      +'<div style="width:72px;height:52px;border:3px solid #333;border-radius:6px;position:relative;'
      +'display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:24px;'
      +'font-weight:700;color:#d32f2f">404</div></div>'
      +'<h1 style="font-size:20px;font-weight:700;margin:0 0 12px">페이지를 찾을 수 없습니다.</h1>'
      +'<p style="font-size:14px;color:#8a91a0;line-height:1.6;margin:0 0 32px">'
      +'존재하지 않는 주소를 입력하셨거나,<br>'
      +'요청하신 페이지의 주소가 변경/삭제되어 찾을 수 없습니다.</p>'
      +'<a href="index.html" style="display:block;width:100%;padding:16px;background:#d32f2f;color:#fff;'
      +'font-size:16px;font-weight:700;border:none;border-radius:8px;cursor:pointer;text-decoration:none;'
      +'text-align:center">홈으로 이동</a>'
      +'</div></div>';
    document.body.appendChild(d);
  }
  if(document.body) _show404();
  else document.addEventListener('DOMContentLoaded', _show404);
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>🏇 경마</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&family=DM+Mono:wght@400;500&family=Teko:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ★ iframe 여부를 JS로 감지해 padding-top 동적 조정 (단독:54px / iframe:8px) */
:root{
  --bg:#07080f;--panel:#0d1810;--panel2:#0f1e12;
  --gold:#f59e0b;--gold2:#fbbf24;
  --green:#22c55e;--green2:#4ade80;
  --red:#ef4444;--orange:#f97316;
  --text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;
  --border:rgba(34,197,94,.22);--radius:14px;
  --accent:#22c55e;--accent2:#4ade80;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;overflow-x:hidden}

/* ★ topBar — slot.html 동일 패턴 */
#topBar{
  position:sticky;top:0;left:0;right:0;z-index:200;
  height:44px;
  background:rgba(7,8,15,.97);
  border-bottom:1px solid rgba(168,85,247,.22);
  display:flex;align-items:center;padding:0 10px;gap:6px;
  backdrop-filter:blur(12px);
}
#topBarHomeBtn{
  width:34px;height:34px;background:rgba(245,200,66,.18);
  border:1px solid rgba(245,200,66,.5);border-radius:9px;
  color:#f5c842;font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
#topBarTitle{font-family:'Teko',sans-serif;font-size:18px;letter-spacing:2px;font-weight:700;color:#4ade80;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.tb-spacer{flex:1;}
#topBarBal{
  background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.28);
  border-radius:8px;padding:4px 8px;
  font-size:12px;color:#f59e0b;font-weight:700;white-space:nowrap;
}
#topBarPoint{
  background:rgba(168,85,247,.15);border:1px solid rgba(168,85,247,.35);
  border-radius:8px;padding:4px 8px;
  font-size:12px;color:#c084fc;font-weight:700;white-space:nowrap;
}
#topBarCharge{
  background:linear-gradient(135deg,#7c3aed,#a855f7);border:none;
  border-radius:8px;color:#fff;font-size:12px;font-weight:700;
  padding:5px 10px;cursor:pointer;white-space:nowrap;
}
.main{
  padding-top:10px;padding-bottom:30px;
  max-width:480px;margin:0 auto;
  display:flex;flex-direction:column;gap:8px;
  padding-left:10px;padding-right:10px;
}
  transition:opacity .2s;
}
.charge-btn:hover{opacity:.85}

/* ── 트랙 ── */
.track-section{
  position:relative;overflow:hidden;
  border-radius:var(--radius);
  border:1px solid rgba(34,197,94,.2);
}
.track-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.88}
.track-top-fade{position:absolute;top:0;left:0;right:0;height:16px;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.45),transparent)}
.track-bot-fade{position:absolute;bottom:0;left:0;right:0;height:16px;z-index:2;pointer-events:none;background:linear-gradient(0deg,rgba(0,0,0,.45),transparent)}
.track-section.shake{animation:cam-shake .42s ease-out}
@keyframes cam-shake{0%{transform:translate(0,0)}15%{transform:translate(-4px,2px)}30%{transform:translate(4px,-2px)}50%{transform:translate(-3px,2px)}70%{transform:translate(2px,-1px)}100%{transform:translate(0,0)}}

#particleCanvas{position:absolute;inset:0;z-index:20;pointer-events:none}
.race-banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:22;pointer-events:none;font-family:'Black Han Sans',sans-serif;font-size:26px;letter-spacing:4px;color:var(--gold2);text-shadow:0 0 24px rgba(251,191,36,.8);opacity:0;transition:opacity .2s;white-space:nowrap}
.race-banner.show{opacity:1}
.track-ev-msg{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:24;pointer-events:none;font-family:'Black Han Sans',sans-serif;font-size:13px;letter-spacing:1.5px;padding:5px 14px;border-radius:10px;background:rgba(0,0,0,.82);border:1.5px solid rgba(255,255,255,.18);color:var(--gold2);opacity:0;transition:opacity .25s;white-space:nowrap}
.track-ev-msg.show{opacity:1}
.track-ev-msg.red{color:#ff7070;border-color:rgba(239,68,68,.4)}
.track-ev-msg.green{color:var(--accent2);border-color:rgba(34,197,94,.4)}
.track-ev-msg.orange{color:var(--orange);border-color:rgba(249,115,22,.4)}

.finish-flag{position:absolute;top:0;bottom:0;right:6px;width:22px;z-index:10;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.finish-pole{width:2px;height:100%;background:linear-gradient(180deg,#fff,#bbb);border-radius:2px;box-shadow:0 0 8px rgba(255,255,255,.4)}
.finish-checker{position:absolute;top:5px;left:2px;width:14px;background:repeating-conic-gradient(#fff 0% 25%,#111 0% 50%) 0 0/8px 8px;border-radius:2px;box-shadow:0 2px 6px rgba(0,0,0,.6)}

.lanes-wrap{position:relative;z-index:3;padding:7px 30px 7px 10px;display:flex;flex-direction:column;gap:4px}

/* ── 레인 ── */
.lane{position:relative;height:50px;border-radius:7px;background:rgba(0,0,0,.15);border:1px solid rgba(255,255,255,.09);overflow:visible;transition:border-color .2s,box-shadow .2s}
.lane.sel{border-color:rgba(245,200,66,.65);background:rgba(245,200,66,.07);box-shadow:0 0 0 1px rgba(245,200,66,.18)}
.lane.ev-burst{animation:fl-burst .6s forwards}
@keyframes fl-burst{0%{background:rgba(255,210,50,.28);box-shadow:0 0 18px rgba(255,210,50,.4)}100%{background:rgba(0,0,0,.15);box-shadow:none}}
.lane.ev-stumble{animation:fl-stumble .6s forwards}
@keyframes fl-stumble{0%{background:rgba(239,68,68,.3);box-shadow:0 0 18px rgba(239,68,68,.35)}100%{background:rgba(0,0,0,.15);box-shadow:none}}
.lane.ev-photo{animation:fl-photo 1s ease-in-out infinite alternate}
@keyframes fl-photo{0%{background:rgba(200,245,66,.05)}100%{background:rgba(200,245,66,.13)}}

.horse-rider{position:absolute;left:6px;top:50%;transform:translateY(-50%) scaleX(-1);height:44px;width:auto;will-change:left;filter:drop-shadow(1px 2px 5px rgba(0,0,0,.7));transition:none}
.horse-rider.gallop{animation:gallop .18s ease-in-out infinite alternate}
@keyframes gallop{from{transform:translateY(-53%) scaleX(-1.04) rotate(-2deg)}to{transform:translateY(-46%) scaleX(-.98) rotate(1.5deg)}}
.horse-rider.stumble{animation:stumble .4s ease-out}
@keyframes stumble{0%{transform:translateY(-50%) scaleX(-1) rotate(0)}25%{transform:translateY(-38%) scaleX(-1) rotate(-12deg)}60%{transform:translateY(-58%) scaleX(-1) rotate(8deg)}100%{transform:translateY(-50%) scaleX(-1) rotate(0)}}
.horse-rider.burst-glow{filter:drop-shadow(0 0 10px rgba(255,220,50,.9)) drop-shadow(1px 2px 5px rgba(0,0,0,.5));animation:gallop .11s ease-in-out infinite alternate}
.horse-rider.photo-finish{filter:drop-shadow(0 0 12px rgba(200,245,66,.9)) drop-shadow(1px 2px 5px rgba(0,0,0,.5))}

.lane-num{position:absolute;left:5px;top:50%;transform:translateY(-50%);width:21px;height:21px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:10px;font-weight:700;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.22);color:#fff;z-index:6;transition:opacity .3s}
.lane-num.hide{opacity:0}
.ev-label{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:700;letter-spacing:.4px;white-space:nowrap;padding:2px 7px;border-radius:6px;z-index:9;pointer-events:none;background:rgba(0,0,0,.8);border:1px solid rgba(255,255,255,.15);opacity:0;transition:opacity .25s}
.ev-label.show{opacity:1}
.ev-label.burst{color:#ffd700;border-color:rgba(255,215,0,.5);text-shadow:0 0 8px rgba(255,215,0,.6)}
.ev-label.stumble{color:#ff6b6b;border-color:rgba(255,107,107,.4)}
.ev-label.overtake{color:#22c55e;border-color:rgba(34,197,94,.4)}
.ev-label.comeback{color:var(--orange);border-color:rgba(249,115,22,.45)}
.rank-badge{position:absolute;right:5px;top:50%;transform:translateY(-50%);font-size:18px;line-height:1;opacity:0;z-index:6;transition:opacity .4s;filter:drop-shadow(0 1px 4px rgba(0,0,0,.5))}
.rank-badge.show{opacity:1}

/* ── 해설 ── */
.commentary{
  background:var(--panel);border:1px solid rgba(245,158,11,.2);
  border-radius:var(--radius);padding:8px 12px;
  font-size:.75rem;color:var(--text2);line-height:1.5;min-height:30px;
  border-left:3px solid var(--gold);
}
.commentary.hl{color:var(--text);border-color:rgba(245,158,11,.5);background:rgba(245,158,11,.06)}

/* ── 섹션 타이틀 ── */
.sec-title{
  padding:4px 0 2px;font-family:'Black Han Sans',sans-serif;font-size:.85rem;
  letter-spacing:1.2px;color:var(--text);display:flex;align-items:center;gap:6px;
}
.sec-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}

/* ── 말 카드 ── */
.horse-list{display:flex;flex-direction:column;gap:5px}
.hcard{
  display:flex;align-items:center;
  border:1.5px solid rgba(255,255,255,.09);border-radius:12px;
  background:linear-gradient(90deg,rgba(10,22,12,.97),rgba(8,18,10,.9));
  overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:border-color .15s,background .15s;position:relative;
}
.hcard.selected{border-color:rgba(245,200,66,.72);background:linear-gradient(90deg,rgba(26,42,16,.99),rgba(16,30,12,.96));box-shadow:0 0 0 1px rgba(245,200,66,.14),0 3px 16px rgba(245,200,66,.07)}
.hcard:active{transform:scale(.99)}
.hcard-stripe{width:5px;align-self:stretch;flex-shrink:0;border-radius:12px 0 0 12px}
.hcard-thumb{width:62px;height:46px;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:2px;transform:scaleX(-1)}
.hcard-thumb img{height:42px;width:auto;filter:drop-shadow(1px 2px 4px rgba(0,0,0,.55))}
.hcard-info{flex:1;padding:6px 4px 6px 2px;min-width:0}
.hcard-top{display:flex;align-items:center;gap:5px;margin-bottom:2px}
.hcard-num{font-family:'DM Mono',monospace;font-size:10px;font-weight:700;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.14);border-radius:4px;padding:1px 5px;color:var(--text);flex-shrink:0}
.hcard-name{font-size:13px;font-weight:900;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hcard-type{font-size:8.5px;color:var(--text3);background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.09);border-radius:999px;padding:1px 5px;white-space:nowrap;flex-shrink:0}
.hcard-sub{font-size:8.5px;color:#3a5e3f;margin-bottom:3px}
.hcard-stats{display:flex;gap:7px;align-items:center;flex-wrap:nowrap}
.stat-col{display:flex;flex-direction:column;gap:2px}
.stat-lbl{font-size:7.5px;color:#3a5e3f;letter-spacing:.3px}
.stat-bar{height:4px;width:48px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden}
.stat-fill{height:100%;border-radius:3px}
.sf-speed{background:linear-gradient(90deg,#22c55e,#86efac)}
.sf-cond{background:linear-gradient(90deg,#3b82f6,#93c5fd)}
.sf-stam{background:linear-gradient(90deg,#a855f7,#d8b4fe)}
.sf-winp{background:linear-gradient(90deg,#f59e0b,#fcd34d)}
.hcard-winpct{font-size:8.5px;color:var(--text3);white-space:nowrap;align-self:flex-end}
.hcard-odds{flex-shrink:0;padding:0 11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.odds-val{font-family:'Black Han Sans',sans-serif;font-size:20px;letter-spacing:1px;background:linear-gradient(135deg,#f5c842,#ffe082,#e8a800);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 6px rgba(245,200,66,.3));line-height:1}
.odds-unit{font-size:8.5px;color:var(--text3);letter-spacing:.4px}
.hcard-check{position:absolute;top:6px;right:9px;width:16px;height:16px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:9px;color:#000;font-weight:900;opacity:0;transition:opacity .2s;box-shadow:0 0 8px rgba(245,200,66,.5)}
.hcard.selected .hcard-check{opacity:1}
.trend-hot{position:absolute;top:5px;left:66px;font-size:8.5px;padding:1px 5px;border-radius:4px;font-weight:700;background:rgba(239,68,68,.2);border:1px solid rgba(239,68,68,.35);color:#ff8888}
.trend-cold{position:absolute;top:5px;left:66px;font-size:8.5px;padding:1px 5px;border-radius:4px;font-weight:700;background:rgba(59,130,246,.2);border:1px solid rgba(59,130,246,.35);color:#93c5fd}

/* ── 베팅 ── */
.bet-panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.preset-row{display:flex;gap:5px;flex-wrap:wrap}
.preset-btn{
  padding:7px 11px;border-radius:18px;
  border:1.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.04);
  color:var(--text);font-size:.72rem;font-weight:700;font-family:'DM Mono',monospace;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:border-color .15s,background .15s;white-space:nowrap;
}
.preset-btn.active{border-color:var(--gold);background:rgba(245,200,66,.14);color:var(--gold);box-shadow:0 0 10px rgba(245,200,66,.18)}
.preset-btn.pct{border-color:rgba(200,245,66,.28);color:#c8f542}
.preset-btn.pct.active{border-color:#c8f542;background:rgba(200,245,66,.12);box-shadow:0 0 10px rgba(200,245,66,.18)}
.preset-btn:active{transform:scale(.95)}
.bet-input-row{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:9px 12px}
.max-btn{flex-shrink:0;padding:8px 14px;background:rgba(245,200,66,.15);border:1px solid rgba(245,200,66,.4);border-radius:8px;color:var(--gold);font-size:13px;font-weight:800;cursor:pointer;transition:all .15s}
.max-btn:active{transform:scale(.95);background:rgba(245,200,66,.3)}
.bet-input{flex:1;background:none;border:none;outline:none;font-family:'DM Mono',monospace;font-size:1.1rem;font-weight:500;color:var(--text);text-align:right}



/* ── START 버튼 ── */
.start-btn{
  width:100%;padding:15px;border-radius:14px;
  background:linear-gradient(135deg,rgba(34,197,94,.24),rgba(34,197,94,.14));
  border:1.5px solid rgba(34,197,94,.5);
  color:var(--green2);font-family:'Black Han Sans',sans-serif;font-size:1.1rem;letter-spacing:3px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:transform .1s,box-shadow .2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 4px 20px rgba(34,197,94,.1),inset 0 1px 0 rgba(255,255,255,.07);
}
.start-btn:active{transform:scale(.98)}
.start-btn:disabled{opacity:.28;cursor:not-allowed}
.start-btn.racing{background:linear-gradient(135deg,rgba(239,68,68,.2),rgba(239,68,68,.1));border-color:rgba(239,68,68,.45);color:#ef7070;animation:btn-pulse .7s ease-in-out infinite}
@keyframes btn-pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* ── 액션 버튼 ── */
.action-row{display:flex;gap:6px}
.act-btn{flex:1;padding:9px;border-radius:10px;border:1.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:var(--text2);font-size:.72rem;font-weight:700;letter-spacing:.4px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.act-btn.danger{border-color:rgba(239,68,68,.25);color:rgba(239,68,68,.65)}
.act-btn:active{transform:scale(.97)}

/* ── 스탯 바 ── */
.stats-bar{
  display:flex;align-items:stretch;
  border:1px solid var(--border);border-radius:var(--radius);
  background:var(--panel);overflow:hidden;
}
.stat-item{flex:1;padding:7px 4px;text-align:center;border-right:1px solid rgba(255,255,255,.07)}
.stat-item:last-child{border-right:none}
.sv{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--text)}
.sv.pos{color:var(--green2)}.sv.neg{color:#ff7070}.sv.gold{color:var(--gold)}
.sl{font-size:.5rem;color:#3a5e3f;letter-spacing:.4px;margin-top:2px}

/* ── 결과 오버레이 ── */
.result-ov{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .3s}
.result-ov.show{opacity:1;pointer-events:auto}
.result-card{width:min(88vw,310px);background:linear-gradient(180deg,rgba(10,24,12,.99),rgba(7,16,9,.98));border:1.5px solid rgba(245,200,66,.3);border-radius:22px;padding:22px 18px 18px;text-align:center;box-shadow:0 28px 70px rgba(0,0,0,.65);transform:translateY(16px) scale(.96);transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.result-ov.show .result-card{transform:translateY(0) scale(1)}
.res-horse-img{height:82px;width:auto;margin:0 auto 6px;display:block;filter:drop-shadow(0 5px 14px rgba(0,0,0,.5))}
.res-icon{font-size:46px;line-height:1;margin-bottom:5px}
.res-title{font-family:'Black Han Sans',sans-serif;font-size:26px;letter-spacing:2px;margin-bottom:4px}
.res-title.win{background:linear-gradient(135deg,#f5c842,#ffe082,#f5c842);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 16px rgba(245,200,66,.5))}
.res-title.lose{color:#ff7070}
.res-amount{font-family:'DM Mono',monospace;font-size:30px;font-weight:500;margin-bottom:5px}
.res-amount.win{color:var(--gold);text-shadow:0 0 14px rgba(245,200,66,.4)}
.res-amount.lose{color:#ff7070}
.res-desc{font-size:.72rem;color:var(--text2);line-height:1.55;margin-bottom:9px}
.res-podium{display:flex;justify-content:center;gap:8px;margin-bottom:12px;font-size:.72rem;color:var(--text2);flex-wrap:wrap}

.countdown-num.pop{animation:cdPop .7s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes cdPop{0%{opacity:0;transform:scale(1.8)}30%{opacity:1;transform:scale(1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.6)}}

/* ── 승리 폭죽 캔버스 ── */
#fireworkCanvas{position:fixed;inset:0;z-index:997;pointer-events:none;display:none}

/* ── 연승 배너 ── */
.streak-banner{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-80px);z-index:600;background:linear-gradient(135deg,rgba(245,200,66,.95),rgba(255,160,30,.95));border-radius:14px;padding:10px 22px;font-family:'Black Han Sans',sans-serif;font-size:1rem;letter-spacing:2px;color:#1a0a00;box-shadow:0 8px 32px rgba(245,200,66,.5);transition:transform .4s cubic-bezier(.34,1.56,.64,1),opacity .4s;opacity:0;white-space:nowrap}
.streak-banner.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ── 뷰 전환 ── */
#viewBet,#viewRace{width:100%}

/* ── 레이스뷰 선택말 요약 ── */
.selected-summary{

}

.odds-change{position:absolute;top:-14px;right:0;font-size:9px;font-weight:700;padding:2px 5px;border-radius:4px;animation:oddsFloat 1.5s ease-out forwards;pointer-events:none}

<script>
/* ── topBar 단축표기 ── */
function fmtTopBar(n){n=Math.floor(n||0);return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(0)+'K':n.toLocaleString('ko-KR');}
// ══════════════════════════════════════════════════
//  ★ slot.html 동일 구조: BAL_KEY, DEFAULT_BAL, init
// ══════════════════════════════════════════════════
const BAL_KEY     = 'MG_BAL_HORSE';   // ← index.html BAL_KEYS['horse']와 동일
const AI_KEY      = 'MG_AI_PROFILE';
const STATS_KEY   = 'GP3_STATS';
const DEFAULT_BAL = 0;                 // 충전 전까지 0 (슬롯 동일)

let balance      = DEFAULT_BAL;
let pointBalance = parseInt(localStorage.getItem('MG_POINTS')||'0')||0;
let aiProfile    = {tier:'EASY', mood:'RELAXED', threat:'NONE', atmosphereScore:100};

// ── 이미지 데이터 ──
const HORSE_IMGS = ["", "", "", "", "", "", "", "", "", "", "", ""];
const TRACK_B64  = "";

// ★ HUE_FILTERS 전역 상수 (4곳 중복 제거)
const HUE_FILTERS = [
  'sepia(1) saturate(3) hue-rotate(0deg)',
  'sepia(1) saturate(4) hue-rotate(200deg)',
  'sepia(1) saturate(4) hue-rotate(90deg)',
  'sepia(1) saturate(5) hue-rotate(300deg)',
  'sepia(1) saturate(5) hue-rotate(320deg)',
  'sepia(1) saturate(4) hue-rotate(150deg)',
  'sepia(1) saturate(5) hue-rotate(30deg)',
  'sepia(1) saturate(3) hue-rotate(60deg)',
  'sepia(1) saturate(5) hue-rotate(260deg)',
  'sepia(1) saturate(4) hue-rotate(340deg)',
  'brightness(2) sepia(1) saturate(2) hue-rotate(180deg)',
  'brightness(0.7) sepia(1) saturate(2) hue-rotate(0deg)',
];

// ── 말 풀 ──
const HORSE_POOL = [
  {name:"번개 바람",  type:"선두형",  sub:"초반 폭발력 최강",       stamina:.70,burst:.90,late:.55},
  {name:"황금 왕관",  type:"균형형",  sub:"꾸준한 페이스 유지",     stamina:.85,burst:.72,late:.80},
  {name:"어둠의 기사",type:"후반형",  sub:"후반 강력한 뒷심",       stamina:.92,burst:.58,late:.95},
  {name:"붉은 태양",  type:"폭발형",  sub:"변동폭 큰 도박형",       stamina:.60,burst:.95,late:.50},
  {name:"초원의 별",  type:"안정형",  sub:"안정적이나 느린 편",     stamina:.95,burst:.65,late:.75},
  {name:"폭풍 전야",  type:"복병형",  sub:"예측 불가 다크호스",     stamina:.75,burst:.78,late:.82},
  {name:"청풍 명월",  type:"지구형",  sub:"체력 우수 후반 강세",    stamina:.98,burst:.60,late:.90},
  {name:"흑룡",       type:"가속형",  sub:"중반부터 폭발적 가속",   stamina:.80,burst:.68,late:.88},
  {name:"백마 왕자",  type:"균형형",  sub:"전 구간 안정적 질주",    stamina:.88,burst:.74,late:.78},
  {name:"화염 질풍",  type:"선두형",  sub:"스타트 최강 클래스",     stamina:.65,burst:.98,late:.52},
  {name:"은빛 달빛",  type:"후반형",  sub:"조용히 치고 나오는 타입",stamina:.90,burst:.55,late:.97},
  {name:"천리마",     type:"지구형",  sub:"장거리 1000m 이상 강세", stamina:1.0,burst:.62,late:.92},
];
const COLORS=['#00c8ff','#ffd700','#00e87a','#ff4444','#22dd22','#ff8800','#aa44ff','#0055ff','#ff0080','#ffaa00','#44ffcc','#ff6622'];

// ── 헬퍼 ──
const $   = id => document.getElementById(id);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const rnd =(a,b)=>a+Math.random()*(b-a);
const irnd=(a,b)=>Math.floor(rnd(a,b+1));
const fmt = n=>Math.round(n).toLocaleString('ko-KR');
const lerp= (a,b,t)=>a+(b-a)*t;

// ── 세션 스탯 ──
let sessRaces=0,sessWins=0,sessBets=0,sessNetPnL=0,streak=0,roundNum=1;
function loadSessionStats(){
  try{const s=localStorage.getItem(STATS_KEY);if(s){const p=JSON.parse(s);sessRaces=p.r||0;sessWins=p.w||0;sessBets=p.b||0;sessNetPnL=p.n||0;streak=p.st||0;roundNum=(p.rn||0)+1;}}catch(e){}
}
function saveSessionStats(){
  try{localStorage.setItem(STATS_KEY,JSON.stringify({r:sessRaces,w:sessWins,b:sessBets,n:sessNetPnL,st:streak,rn:roundNum}));}catch(e){}
}

// ── 잔고 저장/읽기 (slot.html 동일) ──
function saveBalance(){
  localStorage.setItem(BAL_KEY, Math.max(0,Math.round(balance)));
}
function loadBalance(){
  const stored = localStorage.getItem(BAL_KEY);
  balance = stored !== null ? (parseInt(stored)||0) : DEFAULT_BAL;
}

// ── 부모 메시지 송신 ──
const ALLOWED_ORIGINS = [window.location.origin, 'null'];
function isTrustedOrigin(o){ return ALLOWED_ORIGINS.includes(o) || o === window.location.origin; }
function sendToParent(msg){
  /* iframe 제거 — postMessage 비활성화 */
}
// ── 뷰 전환 ──
function showView(view){
  $('viewBet').style.display  = view==='bet'  ? 'flex' : 'none';
  $('viewRace').style.display = view==='race' ? 'flex' : 'none';
  if(view==='race'){
    // iframe 내부 스크롤 최상단
    document.documentElement.scrollTop=0;
    document.body.scrollTop=0;
    window.scrollTo({top:0,left:0,behavior:'instant'});
  }
}
function updateSelectedSummary(bet){
  const h=horses[selected];
  if(!h) return;
  const ssThumb=h.img
    ?`<img src="data:image/png;base64,${h.img}" style="height:36px;width:auto;filter:drop-shadow(1px 2px 4px rgba(0,0,0,.5));transform:scaleX(-1)">`
    :`<span style="font-size:28px;filter:${HUE_FILTERS[h.pi%12]}">🐎</span>`;
  $('selectedSummary').innerHTML=`
    <div class="ss-horse">${ssThumb}</div>
    <div class="ss-info">
      <div class="ss-name">${h.lane}번 ${h.name} <span style="font-size:.7rem;color:var(--text3)">${h.type} · ${h.grade}급</span></div>
      <div class="ss-sub">배당률 ${h.odds.toFixed(1)}배 · 우승확률 ${(h.dispP*100).toFixed(1)}%</div>
    </div>
    <div class="ss-bet">베팅 ${fmt(bet)}원</div>`;
}

function goHome(){ sessionStorage.setItem('ORACLE_ENTRY',Date.now()); window.location.href='mini_center.html'; }

function requestCharge(){ sessionStorage.setItem('ORACLE_ENTRY',Date.now()); window.location.href='mini_center.html?charge=horse'; }
function postAtmosDelta(delta){ /* 인게임 분위기 변동 제거 (미니센터에서 처리) */ }

// ── UI 업데이트 ──
function updateBalUI(){
  const tb = document.getElementById('topBarBalNum');
  const tp = document.getElementById('topBarPointNum');
  if(tb) tb.textContent = fmtTopBar(balance);
  if(tp) tp.textContent = fmtTopBar(pointBalance);
}
function updateStats(){
  const wr=sessRaces>0?Math.round(sessWins/sessRaces*100)+'%':'—';
  $('sWinRate').textContent=wr;
  $('sBetTotal').textContent=fmt(sessBets);
  const pEl=$('sPnL');pEl.textContent=(sessNetPnL>=0?'+':'')+fmt(sessNetPnL);
  pEl.className='sv '+(sessNetPnL>0?'pos':sessNetPnL<0?'neg':'');
  const stEl=$('sStreak');
  if(streak>0){stEl.textContent='+'+streak+'연승';stEl.className='sv pos';}
  else if(streak<0){stEl.textContent=Math.abs(streak)+'연패';stEl.className='sv neg';}
  else{stEl.textContent='—';stEl.className='sv';}
}
function updatePayout(){
  const bet=Math.floor(+$('betInput').value||0);
  const h=horses[selected];
  // 레이스 중이면 항상 비활성, 아닐 때만 베팅 조건으로 판단
  const ready = !isRacing && horses.length>0 && bet>=1000;
  $('startBtn').disabled = !ready;
  $('startBtn').style.opacity = ready ? '1' : '0.35';
}
function setCommentary(msg,hl=false){
  const el=$('commentary');
  el.innerHTML=`<span>🎙️</span> ${msg}`;
  el.className='commentary'+(hl?' hl':'');
}

// 토스트
let toastT=0;
function showToast(msg,type=''){
  const el=$('toast');el.textContent=msg;
  el.className='show'+(type?' t'+type:'');
  clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2200);
}

// 트랙 이벤트 메시지
let trackEvT=0;
function showTrackEv(msg,cls='',dur=1600){
  const el=$('trackEvMsg');el.textContent=msg;el.className='track-ev-msg show'+(cls?' '+cls:'');
  clearTimeout(trackEvT);trackEvT=setTimeout(()=>el.classList.remove('show'),dur);
}

// ── 파티클 ──
let particles=[];let pcCtx=null;
function initParticles(){
  const c=$('particleCanvas'),ts=$('trackSection');
  c.width=ts.clientWidth;c.height=ts.clientHeight;pcCtx=c.getContext('2d');
}
function spawnParticles(x,y,color,count=12){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2,sp=rnd(1.5,5);
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,decay:rnd(.025,.055),r:rnd(2,6),color});
  }
}
function updateParticles(){
  if(!pcCtx)return;
  const c=$('particleCanvas');pcCtx.clearRect(0,0,c.width,c.height);
  particles=particles.filter(p=>p.life>0);
  for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.life-=p.decay;pcCtx.globalAlpha=Math.max(0,p.life);pcCtx.fillStyle=p.color;pcCtx.beginPath();pcCtx.arc(p.x,p.y,p.r,0,Math.PI*2);pcCtx.fill();}
  pcCtx.globalAlpha=1;
}

// ── 스파클 ──
function launchSparkles(){
  const wrap=$('sparkleWrap');wrap.innerHTML='';
  const ems=['🎉','⭐','✨','🏆','💰','🎊','🌟'];
  for(let i=0;i<24;i++){
    const s=document.createElement('div');s.className='sparkle';
    s.textContent=ems[Math.floor(Math.random()*ems.length)];
    s.style.cssText=`left:${rnd(5,95)}%;top:-40px;animation-duration:${rnd(1.2,2.4)}s;animation-delay:${rnd(0,.8)}s;font-size:${rnd(16,26)}px`;
    wrap.appendChild(s);setTimeout(()=>s.remove(),3000);
  }
}

// ── 트랙 배경 ──
if(TRACK_B64){
  $('trackBg').style.backgroundImage=`url(data:image/jpeg;base64,${TRACK_B64})`;
}else{
  $('trackBg').style.background='linear-gradient(180deg,#071a09 0%,#0a2410 35%,#081d0b 65%,#050e06 100%)';
  $('trackBg').style.opacity='1';
  // 잔디 줄무늬 효과
  $('trackBg').style.backgroundSize='100% 54px';
}

// ── 레이스 상태 ──
let horses=[],selected=0,isRacing=false;
let positions=[],velocities=[];
let raf=0;
let raceEvents=[],firedEvents=new Set();

// ── 말 생성 ──
function pickSix(){
  const idx=[...Array(12).keys()];
  for(let i=idx.length-1;i>0;i--){const j=irnd(0,i);[idx[i],idx[j]]=[idx[j],idx[i]];}
  return idx.slice(0,6);
}
function genRace(){
  const bait=clamp(+(aiProfile.bait||.05),0,1);
  const mood=aiProfile.mood||'RELAXED';
  const pickedIdx=pickSix();const base=[];
  for(let lane=0;lane<6;lane++){
    const pi=pickedIdx[lane];const pool=HORSE_POOL[pi];
    const speedBase=irnd(70,98);
    const cond=rnd(.75,1.25)+(mood==='RELAXED'?.04:mood==='HOSTILE'?-.04:0);
    const stamina=pool.stamina*rnd(.9,1.1);
    const burstPow=pool.burst*rnd(.9,1.1);
    const latePow=pool.late*rnd(.9,1.1);
    const luck=rnd(.88,1.14);
    const w=speedBase*cond*stamina*luck;
    const form=Array.from({length:5},()=>Math.random()>.4?1:0);
    base.push({lane,pi,pool,speedBase,cond,stamina,burstPow,latePow,luck,w,form});
  }
  const sum=base.reduce((a,x)=>a+x.w,0);
  horses=base.map(h=>{
    const p=h.w/sum;
    const dispP=clamp(p+rnd(-.02,.02),.02,.58);
    let odds=(1/p)*rnd(.82,1.20)*(1+bait*.14)/2;
    odds=clamp(odds,2.25,6.75);
    const grade=p>.23?'S':p>.17?'A':p>.11?'B':p>.07?'C':'D';
    const fs=h.form.reduce((a,x)=>a+x,0);
    const trend=fs>=4?'hot':fs<=1?'cold':'none';
    return{lane:h.lane+1,pi:h.pi,name:h.pool.name,type:h.pool.type,sub:h.pool.sub,
      img:HORSE_IMGS[h.pi],color:COLORS[h.pi],speedBase:h.speedBase,cond:h.cond,
      stamina:h.stamina,burstPow:h.burstPow,latePow:h.latePow,winP:p,dispP,odds,grade,trend};
  });
  selected=0;renderTrack();renderHorseList();updatePayout();
  setCommentary(`R${roundNum} · 출전마 편성 완료. 말을 선택하고 베팅하세요!`);
}

// ── 이벤트 스케줄 ──
function scheduleEvents(winner){
  raceEvents=[];firedEvents=new Set();
  const others=horses.map((_,i)=>i).filter(i=>i!==winner);
  const numStumble=irnd(0,2);
  const sc=[...others];
  for(let k=0;k<numStumble;k++){
    if(sc.length===0)break;
    const t=rnd(.22,.65);const idx=sc.splice(irnd(0,sc.length-1),1)[0];
    if(idx!==undefined)raceEvents.push({type:'stumble',at:t,idx});
  }
  const bc=[...horses.map((_,i)=>i)];const numBurst=irnd(1,2);
  for(let k=0;k<numBurst;k++){
    if(bc.length===0)break;
    const t=rnd(.18,.55);const idx=bc.splice(irnd(0,bc.length-1),1)[0];
    if(idx!==undefined)raceEvents.push({type:'burst',at:t,idx});
  }
  const wh=horses[winner];
  if(wh.type==='후반형'||wh.type==='지구형')raceEvents.push({type:'comeback',at:rnd(.62,.78),idx:winner});
  for(let k=0;k<irnd(1,3);k++)raceEvents.push({type:'overtake',at:rnd(.30,.75),idx:irnd(0,5)});
  if(Math.random()<.25)raceEvents.push({type:'photo',at:.88,idx:-1});
  raceEvents.sort((a,b)=>a.at-b.at);
}
function fireEvent(ev){
  const key=ev.type+ev.idx+Math.floor(ev.at*100);
  if(firedEvents.has(key))return;firedEvents.add(key);
  if(ev.type==='stumble'&&ev.idx>=0){
    const el=$('hrider-'+ev.idx),lane=$('lane-'+ev.idx),lbl=$('evlbl-'+ev.idx);
    if(el){el.classList.remove('gallop','burst-glow');el.classList.add('stumble');setTimeout(()=>{el.classList.remove('stumble');el.classList.add('gallop');},450);}
    if(lane){lane.classList.add('ev-stumble');setTimeout(()=>lane.classList.remove('ev-stumble'),700);}
    if(lbl){lbl.textContent='⚠️ 발부상!';lbl.className='ev-label stumble show';setTimeout(()=>lbl.classList.remove('show'),1400);}
    velocities[ev.idx]*=.62;
    showTrackEv(`⚠️ ${horses[ev.idx].lane}번 발목 부상!`,'red',1800);
    setCommentary(`😨 ${horses[ev.idx].name} 발목 부상 징후! 속도 급감!`,true);
    $('trackSection').classList.remove('shake');void $('trackSection').offsetWidth;$('trackSection').classList.add('shake');
    // 부상 이벤트 진동
    vibrate([150, 50, 150]);
    flashScreen('red');
  }else if(ev.type==='burst'&&ev.idx>=0){
    const el=$('hrider-'+ev.idx),lane=$('lane-'+ev.idx),lbl=$('evlbl-'+ev.idx);
    if(el){el.classList.add('burst-glow');setTimeout(()=>el.classList.remove('burst-glow'),2000);}
    if(lane){lane.classList.add('ev-burst');setTimeout(()=>lane.classList.remove('ev-burst'),700);}
    if(lbl){lbl.textContent='⚡ 폭주!';lbl.className='ev-label burst show';setTimeout(()=>lbl.classList.remove('show'),1200);}
    velocities[ev.idx]*=1.35;showTrackEv(`⚡ ${horses[ev.idx].lane}번 폭주 돌진!`,'',1500);
    setCommentary(`⚡ ${horses[ev.idx].name} 갑작스러운 스퍼트!`,true);
    vibrate([40, 20, 40]);
    flashScreen('white');
  }else if(ev.type==='comeback'&&ev.idx>=0){
    const lbl=$('evlbl-'+ev.idx);
    if(lbl){lbl.textContent='🔥 역전 돌진!';lbl.className='ev-label comeback show';setTimeout(()=>lbl.classList.remove('show'),1600);}
    showTrackEv(`🔥 ${horses[ev.idx].lane}번 막판 역전!`,'orange',2000);
    setCommentary(`🔥 ${horses[ev.idx].name} 저력 발휘! 역전 드라마?!`,true);
    vibrate([60, 30, 60, 30, 60]);
    flashScreen('gold');
  }else if(ev.type==='overtake'){
    const idx=clamp(ev.idx,0,5);const lane=$('lane-'+idx);const lbl=$('evlbl-'+idx);
    if(lane){lane.classList.add('ev-burst');setTimeout(()=>lane.classList.remove('ev-burst'),600);}
    if(lbl){lbl.textContent='💨 추월!';lbl.className='ev-label overtake show';setTimeout(()=>lbl.classList.remove('show'),1000);}
    vibrate([25]);
  }else if(ev.type==='photo'){
    showTrackEv('📸 포토 피니시 예상!','green',2500);
    setCommentary('📸 막판 박빙의 승부! 포토 피니시!',true);
    vibrate([100, 50, 100, 50, 100]);
    for(let i=0;i<6;i++){
      const l=$('lane-'+i);if(l){l.classList.add('ev-photo');setTimeout(()=>l.classList.remove('ev-photo'),2500);}
      const r=$('hrider-'+i);if(r)r.classList.add('photo-finish');
    }
  }
}

// ── 레이스 시작 ──
function startRace(){
  if(isRacing)return;
  const bet=clamp(Math.floor(+$('betInput').value||0),0,999999999);
  if(!bet||bet<1000){showToast('베팅금액을 입력하세요 (최소 1,000원)');return;}
  if(bet>balance){showToast('💸 잔액 부족! 충전이 필요합니다.');requestCharge();return;}

  isRacing=true;$('startBtn').disabled=true;$('startBtn').textContent='🏃 경주 중...';$('startBtn').classList.add('racing');

  // ★ 레이스 화면으로 전환
  updateSelectedSummary(bet);
  showView('race');
  // 뷰 전환 후 레이아웃이 완전히 확정된 뒤 캔버스 크기 재계산 (2프레임 대기)
  requestAnimationFrame(()=>requestAnimationFrame(()=>initParticles()));

  balance-=bet;saveBalance();updateBalUI();
  sessBets+=bet;saveSessionStats();

  // 카운트다운 후 레이스 실행
  runCountdown(3, ()=>{
    // 승자 결정
    const weights=horses.map(h=>h.winP);
    let r=Math.random(),acc=0,winner=horses.length-1;
    for(let i=0;i<weights.length;i++){acc+=weights[i];if(r<=acc){winner=i;break;}}

    const others=horses.map((_,i)=>i).filter(i=>i!==winner);others.sort(()=>rnd(-1,1));
    const finishOrder=[winner,...others];
    scheduleEvents(winner);

    // 물리 파라미터
    const baseV=horses.map((h,i)=>{
      let v=(h.speedBase/98)*h.cond*rnd(.88,1.10);
      if(i===winner)v*=rnd(1.04,1.12);return v;
    });
    const winV=baseV[winner];const normV=baseV.map(v=>v/winV);
    velocities=normV.map(v=>v);
    const trackW=Math.max(200, $('lanesWrap').clientWidth-80);
    const duration=rnd(3400,5000);const startT=performance.now();
    let rankCount=0;const rankAt=new Array(6).fill(null);

    // START 배너 + 진동
    const banner=$('raceBanner');
    banner.textContent='🏁 START!';banner.classList.add('show');
    setTimeout(()=>banner.classList.remove('show'),900);
    vibrate([30,20,30,20,80]);
    flashScreen('white');
    for(let i=0;i<6;i++){
      const el=$('hrider-'+i);if(el)el.classList.add('gallop');
      const nb=$('lnum-'+i);if(nb)nb.classList.add('hide');
    }
    setCommentary('🏁 레이스 스타트! 전 마필이 힘차게 출발합니다!');

    function step(t){
      const elapsed=t-startT;const p=clamp(elapsed/duration,0,1);
      for(const ev of raceEvents){if(p>=ev.at)fireEvent(ev);}
      updateParticles();
      for(let i=0;i<6;i++){
        const h=horses[i];let vel=normV[i];
        if(p<.3)vel*=lerp(1,h.burstPow,p/.3);
        else if(p<.7)vel*=lerp(1,h.stamina,(p-.3)/.4);
        else vel*=lerp(h.stamina,h.latePow,(p-.7)/.3);
        const wobble=Math.sin((t/100)+(i*.95))*.008;
        velocities[i]=lerp(velocities[i],vel+wobble,.08);
        positions[i]=clamp(positions[i]+velocities[i]*.004,0,1.0);
        if(i===winner&&p>.85)positions[i]=Math.max(positions[i],p*.97);
        const el=$('hrider-'+i);if(el)el.style.left=(30+positions[i]*trackW)+'px';
        if(positions[i]>=.98&&rankAt[i]===null){
          rankAt[i]=rankCount++;showRank(i,rankAt[i]+1);
          spawnParticles(trackW+30,24+i*54,COLORS[horses[i].pi],18);
          // 1등 결승 시 진동
          if(rankAt[i]===0) vibrate([60,30,60,30,120]);
        }
      }
      if(p<1)raf=requestAnimationFrame(step);
      else{
        for(let i=0;i<6;i++)if(rankAt[i]===null){rankAt[i]=rankCount++;showRank(i,rankAt[i]+1);}
        endRace(winner,bet,finishOrder);
      }
    }
    raf=requestAnimationFrame(step);
  });
}
function showRank(idx,rank){
  const rb=$('rank-'+idx);if(!rb)return;
  const m=['🥇','🥈','🥉'];rb.textContent=rank<=3?m[rank-1]:rank+'위';rb.className='rank-badge show';
  const el=$('hrider-'+idx);if(el)el.classList.remove('gallop','burst-glow','photo-finish');
}
function endRace(winner,bet,finishOrder){
  cancelAnimationFrame(raf);isRacing=false;
  // startBtn 복구는 resClose(베팅화면 복귀) 시점에 처리
  const won=selected===winner;
  const odds=horses[winner].odds;const payout=Math.round(bet*odds);const net=won?payout-bet:-bet;
  sessRaces++;sessNetPnL+=net;
  if(won){
    sessWins++;streak=streak>0?streak+1:1;
    balance+=payout;saveBalance();updateBalUI();
    // 진동: 짧게 성공 패턴
    vibrate([80,40,80]);
    flashScreen('gold');
    showToast('🏆 적중! +'+fmt(payout)+'원','w');
    setCommentary('🏆 완벽한 선택! 수익 +'+fmt(payout)+'원!',true);
    launchSparkles();
    launchFireworks();
    // 연승 배너
    if(streak>=2) showStreakBanner(streak);
  }else{
    streak=streak<0?streak-1:-1;
    // 패배 시 잔금은 이미 startRace에서 차감됨 — saveBalance로 동기화만
    saveBalance();updateBalUI();
    // 진동: 길게 실패 패턴
    vibrate([200,60,100]);
    flashScreen('red');
    showToast('😔 '+horses[winner].lane+'번 우승. -'+fmt(bet)+'원','l');
    setCommentary('💸 아쉽습니다. -'+fmt(bet)+'원',false);
  }
  updateStats();saveSessionStats();roundNum++;
  // ★ index.html에 GAME_OVER 전송 → 분위기 미션 진행도 업데이트
  try{localStorage.setItem('MG_LAST_RESULT',JSON.stringify({gameId:'horse',won,balance:Math.max(0,Math.round(balance)),ts:Date.now()}));}catch(e){}
  setTimeout(()=>showResult(won,winner,bet,payout,odds,finishOrder),700);
}
function showResult(won,winner,bet,payout,odds,finishOrder){
  const h=horses[winner];
  // 항상 초기화 먼저
  $('resHorseImg').style.display='none';
  $('resHorseImg').src='';
  $('resIcon').innerHTML='';
  if(h.img){
    $('resHorseImg').src='data:image/png;base64,'+h.img;
    $('resHorseImg').style.display='block';
  }else{
    $('resIcon').innerHTML=won?'🏆':`<span style="font-size:46px;filter:${HUE_FILTERS[h.pi%12]}">🐎</span>`;
  }
  $('resTitle').textContent=won?'우승 적중!':'낙마';
  $('resTitle').className='res-title '+(won?'win':'lose');
  $('resAmount').textContent=won?'+'+fmt(payout)+'원':'-'+fmt(bet)+'원';
  $('resAmount').className='res-amount '+(won?'win':'lose');
  $('resDesc').textContent=won
    ?`${h.lane}번 ${h.name} · ${odds.toFixed(1)}배 배당 · 잔고 ${fmt(balance)}원`
    :`우승: ${h.lane}번 ${h.name} (${odds.toFixed(1)}배) · 잔고 ${fmt(balance)}원`;
  const m=['🥇','🥈','🥉'];
  $('resPodium').innerHTML=finishOrder.slice(0,3).map((idx,r)=>`<span>${m[r]} ${horses[idx].lane}번 ${horses[idx].name}</span>`).join(' ');
  $('resultOv').classList.add('show');
}

  genRace();$('betInput').value=0;updatePayout();
  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'));
  showToast('초기화 완료');
});
$('startBtn').addEventListener('click',startRace);
// 충전 버튼 → 부모에 REQUEST_CHARGE
$('chargeBtn')?.addEventListener('click',requestCharge);

// ══════════════════════════════════════════════════
//  ★ postMessage 수신 — slot.html과 완전 동일 구조
// ══════════════════════════════════════════════════
window.addEventListener('message', e => {
  if(!isTrustedOrigin(e.origin)) return;
  const d = e.data || {};
  switch(d.type){

    // ① 게임 최초 로드 시 부모가 보내는 초기값
    case 'INIT':
      balance = parseInt(d.balance ?? localStorage.getItem(BAL_KEY) ?? DEFAULT_BAL);
      if(isNaN(balance)||balance<0) balance = DEFAULT_BAL;
      if(d.points !== undefined) pointBalance = parseInt(d.points)||0;
      if(d.aiProfile) aiProfile = d.aiProfile;
      // saveBalance() 제거: INIT 시 부모에 역전송하면 메시지 순환 발생
      localStorage.setItem(BAL_KEY, Math.max(0, Math.round(balance)));
      // document.body.classList.add('in-iframe'); — iframe 제거됨
      updateBalUI();
      break;

    // ② 포인트/잔금 동기화
    case 'POINT_UPDATE':
      pointBalance = parseInt(d.points||0);
      if(d.balance !== undefined && !isRacing){
        // 레이스 중에는 balance를 외부에서 덮어쓰지 않음 (bet 차감 값 보호)
        balance = Math.max(0, parseInt(d.balance)||0);
        localStorage.setItem(BAL_KEY, balance);
        updateBalUI();
      }
      break;

    // ③ 충전 완료 (부모에서 P→게임머니 전환 후)
    case 'CHARGE': {
      const add = parseInt(d.amount||0);
      if(add>0){
        balance += add;
        saveBalance();updateBalUI();
        showToast('✅ '+fmt(add)+'원 충전 완료!');
      }
      break;
    }

    // ④ 환전 후 잔금 직접 설정
    case 'BALANCE_UPDATE':
      if(!isRacing){ balance = Math.max(0, parseInt(d.balance||0));
      localStorage.setItem(BAL_KEY, balance);
      updateBalUI(); }
      break;

    // ⑤ AI 프로필 업데이트
    case 'AI_PROFILE':
      aiProfile = d.profile || {};
      if(aiProfile.tier) localStorage.setItem(AI_KEY, JSON.stringify(aiProfile));
      break;

    // ⑥ 포인트 정보 응답 (REQUEST_POINT_INFO 응답)
    case 'POINT_INFO':
      if(d.points !== undefined) pointBalance = parseInt(d.points)||0;
      if(d.balance !== undefined && !isRacing){
        balance = Math.max(0, parseInt(d.balance)||0);
        localStorage.setItem(BAL_KEY, balance);
      }
      updateBalUI();
      break;
  }
});

// ══════════════════════════════════════════════════
//  ★ 진동 (Vibration API)
// ══════════════════════════════════════════════════
function vibrate(pattern){
  try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
}

// ══════════════════════════════════════════════════
//  ★ 플래시 오버레이
// ══════════════════════════════════════════════════
function flashScreen(type='white'){
  const el=$('flashOverlay');
  if(!el)return;
  el.className='';
  void el.offsetWidth; // reflow
  el.className='flash-'+type;
}

// ══════════════════════════════════════════════════
//  ★ 카운트다운 (3→2→1→GO!)
// ══════════════════════════════════════════════════
function runCountdown(from, callback){
  const ts=$('trackSection');
  const ov=document.createElement('div');
  ov.className='countdown-overlay';
  const numEl=document.createElement('div');
  numEl.className='countdown-num';
  ov.appendChild(numEl);ts.appendChild(ov);

  let n=from;
  let done=false; // 중복 callback 방지
  function tick(){
    numEl.className='countdown-num';
    void numEl.offsetWidth;
    if(n>0){
      numEl.textContent=n;
      numEl.className='countdown-num pop';
      vibrate([40]);
      n--;
      setTimeout(tick,750);
    }else{
      numEl.textContent='GO!';
      numEl.style.color='#22c55e';
      numEl.className='countdown-num pop';
      vibrate([80]);
      flashScreen('white');
      setTimeout(()=>{
        if(ov.parentNode) ov.remove();
        if(!done){done=true;callback();}
      },700);
    }
  }
  tick();
}

// ══════════════════════════════════════════════════
//  ★ 폭죽 (승리 시)
// ══════════════════════════════════════════════════
let fwCanvas=null,fwCtx=null,fwParticles=[],fwRaf=0;
function launchFireworks(){
  fwCanvas=$('fireworkCanvas');
  if(!fwCanvas)return;
  fwCanvas.width=window.innerWidth;fwCanvas.height=window.innerHeight;
  fwCanvas.style.display='block';
  fwCtx=fwCanvas.getContext('2d');
  fwParticles=[];
  const cols=['#ffd700','#ff6b6b','#4ade80','#60a5fa','#f472b6','#a78bfa','#fb923c'];
  for(let b=0;b<5;b++){
    setTimeout(()=>{
      const cx=rnd(fwCanvas.width*.2,fwCanvas.width*.8);
      const cy=rnd(fwCanvas.height*.1,fwCanvas.height*.45);
      const col=cols[irnd(0,cols.length-1)];
      for(let i=0;i<40;i++){
        const a=Math.random()*Math.PI*2,sp=rnd(3,9);
        fwParticles.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,decay:rnd(.018,.035),r:rnd(2,5),color:col});
      }
    }, b*200);
  }
  cancelAnimationFrame(fwRaf);
  function fwStep(){
    if(!fwCtx)return;
    fwCtx.clearRect(0,0,fwCanvas.width,fwCanvas.height);
    fwParticles=fwParticles.filter(p=>p.life>0);
    for(const p of fwParticles){
      p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.vx*=.97;p.life-=p.decay;
      fwCtx.globalAlpha=Math.max(0,p.life);
      fwCtx.fillStyle=p.color;
      fwCtx.beginPath();fwCtx.arc(p.x,p.y,p.r,0,Math.PI*2);fwCtx.fill();
    }
    fwCtx.globalAlpha=1;
    if(fwParticles.length>0) fwRaf=requestAnimationFrame(fwStep);
    else{ fwCanvas.style.display='none'; }
  }
  fwRaf=requestAnimationFrame(fwStep);
}

// ══════════════════════════════════════════════════

let streakBannerTimer=0;
function showStreakBanner(n){
  const el=$('streakBanner');if(!el)return;
  const msgs={2:'🔥 2연승!',3:'⚡ 3연승!',4:'💫 4연승!',5:'👑 5연승!'};
  el.textContent=msgs[n]||(n+'연승 !!');
  el.classList.add('show');
  clearTimeout(streakBannerTimer);
  streakBannerTimer=setTimeout(()=>el.classList.remove('show'),2500);
}
