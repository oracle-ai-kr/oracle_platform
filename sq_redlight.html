<!DOCTYPE html>
<html lang="ko">
<head><script>
// ── ORACLE 토큰가드 ──
(function(){
  var t=sessionStorage.getItem('ORACLE_ENTRY');
  var ok=t&&(Date.now()-Number(t)<5000);
  if(ok) sessionStorage.removeItem('ORACLE_ENTRY');
  if(ok) return;
  function _show404(){
    document.body.style.cssText='margin:0;padding:0;overflow:hidden';
    Array.from(document.body.children).forEach(function(el){el.style.display='none'});
    var d=document.createElement('div');
    d.id='_oracle404';
    d.innerHTML='<div style="position:fixed;inset:0;z-index:999999;background:#0f1724;color:#e8eaf0;'
      +'font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;display:flex;align-items:center;'
      +'justify-content:center;text-align:center;padding:20px">'
      +'<div style="max-width:360px">'
      +'<div style="width:120px;height:120px;background:#fff;border-radius:50%;margin:0 auto 32px;'
      +'display:flex;align-items:center;justify-content:center">'
      +'<div style="width:72px;height:52px;border:3px solid #333;border-radius:6px;position:relative;'
      +'display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:24px;'
      +'font-weight:700;color:#d32f2f">404</div></div>'
      +'<h1 style="font-size:20px;font-weight:700;margin:0 0 12px">페이지를 찾을 수 없습니다.</h1>'
      +'<p style="font-size:14px;color:#8a91a0;line-height:1.6;margin:0 0 32px">'
      +'존재하지 않는 주소를 입력하셨거나,<br>'
      +'요청하신 페이지의 주소가 변경/삭제되어 찾을 수 없습니다.</p>'
      +'<a href="index.html" style="display:block;width:100%;padding:16px;background:#d32f2f;color:#fff;'
      +'font-size:16px;font-weight:700;border:none;border-radius:8px;cursor:pointer;text-decoration:none;'
      +'text-align:center">홈으로 이동</a>'
      +'</div></div>';
    document.body.appendChild(d);
  }
  if(document.body) _show404();
  else document.addEventListener('DOMContentLoaded', _show404);
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>🌸 무궁화 꽃이 피었습니다</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e8002a;--red2:#ff1a42;--green:#00c853;--green2:#00e676;
  --gold:#ffd600;--blue:#4db8ff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;font-family:'Noto Sans KR',sans-serif;}

/* ── 운동장 배경 ── */
#bg{
  position:fixed;inset:0;z-index:0;
  background:linear-gradient(180deg,
    #87CEEB 0%,#b0e0ff 17%,
    #c8f0a0 17%,#a8d868 21%,
    #d4a855 21%,#c49840 100%);
}
#bg::after{
  content:'🌸 🔫 👁️ 🚦 🌸 🔫 👁️ 🚦 🌸 🔫 👁️ 🚦 🌸 🔫 👁️ 🚦 🌸 🔫 👁️ 🚦 🌸 🔫 👁️ 🚦 🌸 🔫 👁️ 🚦 🌸 🔫 👁️ 🚦';
  position:absolute;inset:0;
  font-size:2.2rem;letter-spacing:1.5rem;line-height:4.5rem;word-spacing:1rem;
  overflow:hidden;white-space:normal;
  opacity:.045;pointer-events:none;
  transform:rotate(-12deg) scale(1.3);
  transform-origin:center center;
}
.cloud{position:absolute;background:rgba(255,255,255,.85);border-radius:50px;pointer-events:none;}
.c1{width:80px;height:26px;top:4%;left:8%;animation:cloudMove 18s linear infinite;}
.c2{width:60px;height:20px;top:7%;left:40%;animation:cloudMove 24s linear infinite;}
.c3{width:100px;height:30px;top:3%;left:70%;animation:cloudMove 20s linear infinite;}
@keyframes cloudMove{0%{transform:translateX(0)}100%{transform:translateX(120vw)}}
.fence{position:absolute;bottom:0;left:0;right:0;height:22px;
  background:repeating-linear-gradient(90deg,#8B4513 0px,#8B4513 14px,transparent 14px,transparent 22px);
  opacity:.6;pointer-events:none;}
.deco{position:absolute;bottom:16%;font-size:3.2rem;opacity:.28;pointer-events:none;}
.dl{left:1%}.dr{right:1%}

/* ── 헤더 ── */
#header{
  position:fixed;top:0;left:0;right:0;z-index:200;height:48px;
  display:flex;align-items:center;gap:8px;padding:0 12px;
  background:rgba(0,0,0,.55);backdrop-filter:blur(8px);
}
#backBtn{width:30px;height:30px;border-radius:8px;border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.1);color:#fff;font-size:.85rem;
  display:flex;align-items:center;justify-content:center;cursor:pointer;}
#backBtn:active{opacity:.7;}
.hd-title{font-family:'Black Han Sans',sans-serif;font-size:.88rem;letter-spacing:.05em;color:#fff;flex:1;}
.hd-timer{font-family:'Black Han Sans',sans-serif;font-size:1.1rem;color:var(--gold);}
.hd-sec{font-size:.62rem;color:rgba(255,255,255,.6);margin-left:1px;}

/* ── 진행바 ── */
#progressBar{position:fixed;top:48px;left:0;right:0;z-index:160;height:3px;background:rgba(255,255,255,.1);}
#progressFill{height:100%;background:linear-gradient(90deg,var(--green),var(--green2));width:0%;transition:width .12s;}

/* ── 술래 존 ── */
#dollZone{
  position:fixed;top:51px;left:0;right:0;z-index:150;height:128px;
  background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,.15));
  border-bottom:2px solid rgba(255,214,0,.2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
}
#dollWrap{position:relative;display:flex;align-items:flex-end;gap:6px;}
#dollImg{font-size:3.6rem;line-height:1;filter:drop-shadow(0 0 14px rgba(232,0,42,.5));transition:filter .15s;}
#dollImg.alert{filter:drop-shadow(0 0 28px rgba(232,0,42,1));animation:dollShake .1s ease 2;}
@keyframes dollShake{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg)}}
#elimNotice{
  position:absolute;top:-26px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.78);border:1px solid rgba(232,0,42,.5);
  border-radius:8px;padding:3px 10px;
  font-size:.63rem;color:var(--red2);font-weight:900;white-space:nowrap;
  opacity:0;transition:opacity .3s;
}
#elimNotice.show{opacity:1;}
#lightBox{
  display:flex;align-items:center;gap:6px;
  background:rgba(0,0,0,.6);border-radius:20px;padding:4px 14px;
  border:1px solid rgba(255,255,255,.12);
}
.light-dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.12);}
.light-dot.ar{background:var(--red2);box-shadow:0 0 8px var(--red2);}
.light-dot.ag{background:var(--green2);box-shadow:0 0 8px var(--green2);}
#lightText{font-family:'Black Han Sans',sans-serif;font-size:.8rem;letter-spacing:.08em;color:#fff;}
#mugunghwa{
  font-family:'Black Han Sans',sans-serif;font-size:.84rem;letter-spacing:.05em;
  color:rgba(255,255,255,.85);min-height:20px;
}
#mugunghwa span{transition:color .08s;}
.mc0{color:#ffb3c1;}.mc1{color:#ff6b6b;}.mc2{color:#ff0055;}
.mc3{color:#fff;}.mc4{color:var(--green2);}.mc5{color:#fff;}
.mc6{color:#fff;}.mc7{color:var(--gold);}.mc8{color:#ffa500;}
.mc9{color:var(--red2);}.mc10{color:#ff69b4;}.mc11{color:var(--red2);font-size:1rem;}

/* ── 필드 ── */
#fieldWrap{position:fixed;top:179px;left:0;right:0;bottom:90px;overflow:hidden;z-index:10;}
#finishLine{
  position:absolute;top:0;left:0;right:0;height:6px;z-index:5;
  background:repeating-linear-gradient(90deg,var(--gold) 0,var(--gold) 12px,transparent 12px,transparent 20px);
  box-shadow:0 0 12px rgba(255,214,0,.5);
}
#finishLabel{
  position:absolute;top:8px;left:50%;transform:translateX(-50%);
  font-family:'Black Han Sans',sans-serif;font-size:.6rem;color:var(--gold);
  white-space:nowrap;z-index:5;text-shadow:0 1px 3px rgba(0,0,0,.7);
}
#startLine{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.2);}

/* ── 캐릭터 공통 ── */
.char{
  position:absolute;display:flex;flex-direction:column;align-items:center;
  z-index:20;transition:left .18s ease;
}
.char-emoji{font-size:1.3rem;line-height:1;display:block;}
/* AI — 청록색(teal) 필터 */
.char.ai-male   .char-emoji{filter:hue-rotate(155deg) saturate(3.5) brightness(.8);}
.char.ai-female .char-emoji{filter:hue-rotate(160deg) saturate(3) brightness(.85);}
/* 플레이어 — 오렌지 */
#player .char-emoji{filter:hue-rotate(20deg) saturate(3) brightness(1.1);}.char-num{
  font-size:.46rem;font-weight:900;color:#fff;
  background:rgba(0,0,0,.65);border-radius:3px;padding:1px 3px;margin-top:1px;
}
.char.dead{opacity:.35;filter:grayscale(1) brightness(.5);}

/* 총알 */
.bullet{
  position:absolute;z-index:40;font-size:.9rem;pointer-events:none;
  animation:bulletFly .28s linear forwards;
}
@keyframes bulletFly{
  0%{opacity:1;transform:translateX(0) scale(1);}
  100%{opacity:0;transform:translateX(-40px) scale(1.5);}
}

/* 플레이어 */
#player{z-index:30;transition:bottom .1s linear,left .15s ease;}
#player .char-num{background:rgba(255,100,0,.9);font-size:.55rem;padding:1px 5px;}
#playerArrow{
  position:absolute;top:-15px;left:50%;transform:translateX(-50%);
  width:0;height:0;
  border-left:6px solid transparent;border-right:6px solid transparent;border-top:10px solid var(--gold);
  filter:drop-shadow(0 0 4px var(--gold));
  animation:arrowBounce .7s ease-in-out infinite;
}
@keyframes arrowBounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-3px)}}

/* ── 컨트롤 ── */
#controlZone{
  position:fixed;bottom:0;left:0;right:0;z-index:200;height:90px;
  background:rgba(0,0,0,.68);backdrop-filter:blur(8px);
  border-top:1px solid rgba(255,255,255,.1);
  display:flex;align-items:center;gap:8px;padding:0 12px;
}
.ctrl-btn{
  height:54px;border:none;border-radius:14px;
  font-family:'Black Han Sans',sans-serif;cursor:pointer;transition:all .12s;
  display:flex;align-items:center;justify-content:center;
}
#leftBtn,#rightBtn{
  width:70px;font-size:1.2rem;
  background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);
}
#leftBtn:active,#rightBtn:active{background:rgba(255,255,255,.22);transform:scale(.94);}
#moveBtn{
  flex:1;font-size:.92rem;letter-spacing:.04em;color:#0a0a0a;
  background:linear-gradient(135deg,var(--green),var(--green2));
  box-shadow:0 3px 14px rgba(0,200,83,.4);
}
#moveBtn.pressing{background:linear-gradient(135deg,#009940,var(--green));box-shadow:none;transform:scale(.98);}
#moveBtn:disabled{background:rgba(255,255,255,.1);color:rgba(255,255,255,.3);box-shadow:none;}

/* ── 위험 플래시 ── */
#dangerFlash{position:fixed;inset:0;z-index:190;pointer-events:none;background:transparent;transition:background .06s;}
#dangerFlash.flash{background:rgba(232,0,42,.42);}

/* ── 오버레이 ── */
.overlay{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.82);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;padding:20px;}
.overlay.hidden{display:none;}
.ov-box{background:#1c1c1c;border-radius:20px;padding:24px 20px;width:100%;max-width:320px;
  text-align:center;animation:popIn .28s ease;border:1px solid rgba(255,255,255,.08);}
@keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.ov-icon{font-size:2.8rem;margin-bottom:8px;display:block;}
.ov-title{font-family:'Black Han Sans',sans-serif;font-size:1.2rem;letter-spacing:.06em;margin-bottom:6px;color:#fff;}
.ov-title.win{color:var(--green2);}.ov-title.lose{color:var(--red2);}
.ov-desc{font-size:.75rem;color:#9a9490;line-height:1.75;margin-bottom:14px;white-space:pre-line;}
.rule-box{background:rgba(255,255,255,.05);border-radius:10px;padding:10px 12px;
  margin-bottom:14px;font-size:.7rem;color:#9a9490;line-height:1.85;text-align:left;}
.rule-box b{color:#fff;}.rule-box .red{color:var(--red2);}.rule-box .grn{color:var(--green2);}
.ov-btn{width:100%;padding:12px;border:none;border-radius:12px;
  font-family:'Black Han Sans',sans-serif;font-size:.88rem;letter-spacing:.04em;
  cursor:pointer;margin-bottom:8px;transition:all .15s;}
.ov-btn:last-child{margin-bottom:0;}
.ov-btn.primary{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;}
.ov-btn.green{background:linear-gradient(135deg,var(--green),var(--green2));color:#0a0a0a;}
.ov-btn.secondary{background:rgba(255,255,255,.07);color:#9a9490;border:1px solid rgba(255,255,255,.09);}
.ov-btn:active{opacity:.8;}

/* ── 카운트다운 ── */
#countdown{position:fixed;inset:0;z-index:350;
  background:rgba(0,0,0,.7);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;}
#countdown.hidden{display:none;}
.cd-num{font-family:'Black Han Sans',sans-serif;font-size:5.5rem;
  color:var(--red2);text-shadow:0 0 40px rgba(232,0,42,.7);animation:cdPop .88s ease infinite;}
@keyframes cdPop{0%{transform:scale(1.3)}80%{transform:scale(.95)}100%{transform:scale(1.3)}}
.cd-sub{font-size:.78rem;color:rgba(255,255,255,.6);letter-spacing:.12em;}

/* ── 탈락 팝 ── */
.elim-pop{position:absolute;z-index:50;font-family:'Black Han Sans',sans-serif;
  font-size:.7rem;color:var(--red2);font-weight:900;pointer-events:none;
  text-shadow:0 0 6px rgba(232,0,42,.8);animation:elimFly .9s ease forwards;}
@keyframes elimFly{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-36px) scale(1.2)}}

/* ── 토스트 ── */
#toast{position:fixed;top:56px;left:50%;transform:translateX(-50%) translateY(-10px);
  background:rgba(0,0,0,.85);border:1px solid rgba(232,0,42,.4);
  border-radius:10px;padding:7px 16px;font-size:.75rem;color:#fff;
  opacity:0;transition:all .3s;pointer-events:none;z-index:500;
  white-space:nowrap;max-width:88vw;text-align:center;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<script src="squid_fx.js"></script>

<div id="bg">
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div class="deco dl">🏗️</div><div class="deco dr">🌳</div>
  <div class="fence"></div>
</div>

<div id="progressBar"><div id="progressFill"></div></div>

<div id="header">
  <button id="backBtn" onclick="quitGame()">←</button>
  <div class="hd-title">🌸 무궁화 꽃이 피었습니다</div>
  <span class="hd-timer" id="timerDisp">60</span>
  <span class="hd-sec">초</span>
</div>

<div id="dangerFlash"></div>

<div id="dollZone">
  <div id="dollWrap">
    <div id="elimNotice">💀 XXX번 탈락!</div>
    <div id="dollImg">👩</div>
  </div>
  <div id="lightBox">
    <div class="light-dot" id="dotRed"></div>
    <div class="light-dot ag" id="dotGreen"></div>
    <div id="lightText">🟢 초록불</div>
  </div>
  <div id="mugunghwa"></div>
</div>

<div id="fieldWrap">
  <div id="finishLine"></div>
  <div id="finishLabel">🏁 결승선</div>
  <div id="startLine"></div>
  <div id="fieldChars"></div>
</div>

<div id="controlZone">
  <div style="display:flex;gap:8px;">
    <button class="ctrl-btn" id="leftBtn"
      ontouchstart="moveLeft(event)">◀</button>
    <button class="ctrl-btn" id="rightBtn"
      ontouchstart="moveRight(event)">▶</button>
  </div>
  <button class="ctrl-btn" id="moveBtn"
    ontouchstart="startMove(event)" ontouchend="stopMove(event)"
   >
    🟢 누르는 동안 전진
  </button>
</div>

<div id="countdown">
  <div class="cd-num" id="cdNum">3</div>
  <div class="cd-sub">준비하세요...</div>
</div>

<div class="overlay" id="startOverlay">
  <div class="ov-box">
    <span class="ov-icon">🌸</span>
    <div class="ov-title">무궁화 꽃이<br>피었습니다</div>
    <div class="rule-box">
      <b>🟢 초록불</b> — 버튼 누르는 동안 <span class="grn">전진</span><br>
      <b>🔴 빨간불</b> — 즉시 손 떼야 함<br>
      움직이면 <span class="red">즉시 탈락!</span><br><br>
      ⏱ 제한시간 <b>60초</b> · 결승선 도달하면 클리어<br>
      ◀ ▶ 좌우 이동으로 다른 참가자 피하기
    </div>
    <button class="ov-btn green" onclick="startCountdown()">🌸 게임 시작!</button>
    <button class="ov-btn secondary" onclick="quitGame()">돌아가기</button>
  </div>
</div>

<div class="overlay hidden" id="resultOverlay">
  <div class="ov-box">
    <span class="ov-icon" id="rIcon">🎉</span>
    <div class="ov-title" id="rTitle">클리어!</div>
    <div class="ov-desc" id="rDesc"></div>
    <button class="ov-btn" id="rBtn" onclick="goResult()">결과 확인</button>
    <button class="ov-btn secondary" onclick="quitGame()">허브로 돌아가기</button>
  </div>
</div>

<div id="toast"></div>

<script>
// ════════════════════════════
// 설정
// ════════════════════════════
const gameInfo = JSON.parse(sessionStorage.getItem('SQ_CURRENT_GAME') || '{"gameId":"sq_redlight","isNew":true}');

const TOTAL_TIME  = 60;
const TOTAL_STEPS = 22;
const AI_COUNT    = 40;   // 좌20 우20
const PLAYER_NUM  = 456;

// 진동
function vibrate(pattern){ try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){} }

// 무궁화꽃이피었습니다 글자
const MCHARS = [
  {ch:'무',c:'mc0'},{ch:'궁',c:'mc1'},{ch:'화',c:'mc2'},
  {ch:' ',c:''},{ch:'꽃',c:'mc4'},{ch:'이',c:'mc5'},
  {ch:' ',c:''},{ch:'피',c:'mc7'},{ch:'었',c:'mc8'},
  {ch:'습',c:'mc9'},{ch:'니',c:'mc10'},{ch:'다',c:'mc11'},
];

// 인형 사이클 [초록ms, 빨간ms]
const CYCLES = [
  [2800,1300],[2000,1000],[2400,800],[1600,1100],
  [1900,700],[1400,900],[2200,600],[1200,800],
  [1700,1000],[1000,700],[1500,500],[1300,1100],
  [900,600],[1100,800],[800,500],
];

// ════════════════════════════
// 상태
// ════════════════════════════
let gameState    = 'intro';
let timeLeft     = TOTAL_TIME;
let isGreenLight = true;
let isMoving     = false;
let isEliminated = false;
let cycleIdx     = 0;
let timerIv      = null;
let aiIv         = null;
let forwardIv    = null;
let dollTo       = null;
let mentIv       = null;
let fieldH = 0, stepH = 0;

let playerStep = 0;
let playerX    = 50;
const PX_MIN = 6, PX_MAX = 94, X_STEP = 7;

let aiChars = [];
let aiNums  = [];

// ════════════════════════════
// 번호 생성
// ════════════════════════════
function makeAINums(){
  const s = new Set();
  while(s.size < AI_COUNT){ const n=Math.floor(Math.random()*454)+1; if(n!==456)s.add(n); }
  return [...s];
}

// ════════════════════════════
// 필드 초기화
// ════════════════════════════
function initField(){
  const fw = document.getElementById('fieldWrap');
  fieldH = fw.clientHeight;
  stepH  = (fieldH - 28) / TOTAL_STEPS;
  // 최초 생성만 (리사이즈 시 위치만 재계산)
  if(aiChars.length === 0){
    aiNums = makeAINums();
    createAI();
  } else {
    // 기존 AI 위치 재계산
    aiChars.forEach(ai => {
      ai.el.style.bottom = (ai.step*stepH)+'px';
    });
  }
  renderPlayer();
}

// ════════════════════════════
// 플레이어
// ════════════════════════════
function renderPlayer(){
  let el = document.getElementById('player');
  if(!el){
    el = document.createElement('div');
    el.className='char'; el.id='player';
    el.innerHTML=`<div id="playerArrow"></div><span class="char-emoji" id="playerEmoji">🧍</span><span class="char-num">456</span>`;
    document.getElementById('fieldChars').appendChild(el);
  }
  el.style.left   = playerX+'%';
  el.style.transform = 'translateX(-50%)';
  el.style.bottom = (playerStep*stepH)+'px';
  document.getElementById('progressFill').style.width = (playerStep/TOTAL_STEPS*100)+'%';
}

// ════════════════════════════
// AI 생성
// ════════════════════════════
const AI_EMOJIS_M = ['🧍','🚶'];
const AI_EMOJIS_F = ['🧍‍♀️','🚶‍♀️'];
function createAI(){
  const container = document.getElementById('fieldChars');
  aiChars = [];
  for(let i=0;i<AI_COUNT;i++){
    const num  = aiNums[i];
    const side = i < 10 ? 'left' : 'right';
    const xBase = side==='left'
      ? 3 + (i%10)*4.2 + Math.random()*1.5
      : 54 + (i%10)*4.2 + Math.random()*1.5;
    const startStep = Math.random()*2.5;
    const isFemale = Math.random() < .5;
    const emojis = isFemale ? AI_EMOJIS_F : AI_EMOJIS_M;
    const emoji = emojis[Math.floor(Math.random()*emojis.length)];
    const genderCls = isFemale ? 'ai-female' : 'ai-male';
    const el = document.createElement('div');
    el.className=`char ${genderCls}`; el.id='ai_'+num;
    el.innerHTML=`<span class="char-emoji">${emoji}</span><span class="char-num">${padNum(num)}</span>`;
    el.style.cssText=`left:${xBase}%;transform:translateX(-50%);bottom:${startStep*stepH}px;transition:bottom .16s linear,left .22s ease;`;
    container.appendChild(el);
    aiChars.push({
      num, el, x:xBase, step:startStep, alive:true,
      speed: .035+Math.random()*.065,
      driftTimer:0, driftInterval: 8+Math.floor(Math.random()*12),
    });
  }
}

// ════════════════════════════
// 카운트다운
// ════════════════════════════
function startCountdown(){
  document.getElementById('startOverlay').classList.add('hidden');
  initField();

  // FX: 카운트다운 전 분위기 조성
  SQ.vignette(true, true);
  //SQ.weather('wind');

  let c=3;
  document.getElementById('cdNum').textContent=c;
  document.getElementById('countdown').classList.remove('hidden');
  SQ.vibrate(100);
  const iv=setInterval(()=>{
    c--;
    if(c<=0){
      clearInterval(iv);
      document.getElementById('countdown').classList.add('hidden');
      SQ.vibrate([80,60,80,60,150]);
      SQ.vignette(false);
      SQ.flash('white', 200);
      startGame();
    } else {
      document.getElementById('cdNum').textContent=c;
      SQ.vibrate(80);
    }
  },900);
}

// ════════════════════════════
// 게임 시작
// ════════════════════════════
function startGame(){
  gameState='playing'; timeLeft=TOTAL_TIME;
  document.getElementById('moveBtn').disabled=false;

  // FX: 게임 시작 연출
  //SQ.weather('sunny');
  SQ.announce('첫 번째 게임', {type:'system', duration:1800});
  setTimeout(()=> SQ.announce('무궁화 꽃이 피었습니다', {type:'guard', duration:2200, typing:true}), 2000);

  timerIv=setInterval(()=>{
    timeLeft--;
    const td=document.getElementById('timerDisp');
    td.textContent=timeLeft;

    // FX: 타이머 긴장감 연출
    SQ.timerUrgent(timeLeft);

    if(timeLeft<=10){
      td.style.color='var(--red2)';
      SQ.vibrate(timeLeft<=5 ? [60,30,60] : 30);
      if(timeLeft===10) SQ.announce('⏱ 서두르세요!', {type:'system', duration:2000});
    }
    if(timeLeft<=30 && timeLeft>10){
      SQ.vignette(true, false);
    }
    if(timeLeft<=0) timeUp();
  },1000);
  aiIv=setInterval(()=>{
    if(gameState!=='playing') return;
    updateAI();
    if(!isGreenLight && Math.random()<.05) triggerAIElim();
  },80);
  scheduleDoll();
}

// ════════════════════════════
// AI 업데이트
// ════════════════════════════
function updateAI(){
  aiChars.forEach(ai=>{
    if(!ai.alive) return;
    if(isGreenLight){
      ai.step=Math.min(ai.step+ai.speed, TOTAL_STEPS);
      ai.driftTimer++;
      if(ai.driftTimer%ai.driftInterval===0){
        ai.x=Math.max(2,Math.min(98, ai.x+(Math.random()-.5)*3));
        ai.el.style.left=ai.x+'%';
      }
    }
    ai.el.style.bottom=(ai.step*stepH)+'px';
  });
}

// AI 평균 진행도 (0~1)
function getAvgProgress(){
  const alive=aiChars.filter(a=>a.alive);
  if(!alive.length) return 0;
  return alive.reduce((s,a)=>s+a.step,0)/(alive.length*TOTAL_STEPS);
}

// AI 탈락 (총알 + 진동)
let elimNoticeTimer=null;
function triggerAIElim(){
  const cands=aiChars.filter(a=>a.alive&&a.step>1.5&&a.step<TOTAL_STEPS-1);
  if(!cands.length) return;
  const ai=cands[Math.floor(Math.random()*cands.length)];
  ai.alive=false; ai.el.classList.add('dead');

  // 총알 애니메이션
  spawnBullet(ai.x, ai.step);

  // FX: AI 탈락 파티클
  const rect = ai.el.getBoundingClientRect();
  SQ.aiElimEffect(rect.left + rect.width/2, rect.top + rect.height/2);

  // 탈락 팝업
  const pop=document.createElement('div');
  pop.className='elim-pop'; pop.textContent='💀 탈락!';
  pop.style.cssText=`left:${ai.x}%;bottom:${(ai.step*stepH+18)}px;`;
  document.getElementById('fieldChars').appendChild(pop);
  setTimeout(()=>pop.remove(),950);

  showElimNotice(ai.num);
  SQ.announce(`💀 ${padNum(ai.num)}번 탈락`, {type:'danger', duration:1200});
  vibrate(60);
}

function spawnBullet(xPct, step){
  const fw=document.getElementById('fieldWrap');
  const b=document.createElement('div');
  b.className='bullet'; b.textContent='💥';
  b.style.cssText=`left:${xPct}%;bottom:${(step*stepH+8)}px;`;
  fw.appendChild(b);
  setTimeout(()=>b.remove(),300);
}

function padNum(n){ return String(n).padStart(3,'0'); }

function showElimNotice(num){
  // 머리위 표시 비활성화 — FX 오른쪽 멘트로 대체
}

// ════════════════════════════
// 인형 사이클
// ════════════════════════════
// 무궁화꽃이 / 피었습니다 두 구간으로 나눔
const PHRASE_A = [{ch:'무',c:'mc0'},{ch:'궁',c:'mc1'},{ch:'화',c:'mc2'},{ch:'꽃',c:'mc4'},{ch:'이',c:'mc5'}]; // 5글자
const PHRASE_B = [{ch:' ',c:''},{ch:'피',c:'mc7'},{ch:'었',c:'mc8'},{ch:'습',c:'mc9'},{ch:'니',c:'mc10'},{ch:'다',c:'mc11'}]; // 6글자

function scheduleDoll(){
  if(gameState!=='playing') return;
  const [greenMs, redMs]=CYCLES[cycleIdx%CYCLES.length];
  cycleIdx++;
  setLight(true);

  // 평균 진행도에 따라 멘트 속도 가속
  const avgProg = getAvgProgress();
  const speedMult = avgProg > 0.5 ? 0.82 : 1.33; // 기본 75% 속도, 절반 넘으면 살짝 가속

  // 구간A(무궁화꽃이): 랜덤 속도, 구간B(피었습니다): 더 빠른 속도
  const baseCharMs = Math.floor((greenMs * 0.72) / (PHRASE_A.length + PHRASE_B.length));
  const charMsA = Math.max(55, Math.floor((baseCharMs + Math.floor(Math.random()*35)) * speedMult * 1.2));
  const charMsB = Math.max(45, Math.floor((baseCharMs * 0.72 + Math.floor(Math.random()*20)) * speedMult * 1.2));

  playMugunghwaSplit(charMsA, charMsB, ()=>{
    if(gameState!=='playing') return;
    setLight(false);
    if(isMoving) setTimeout(()=>eliminate(),55);
    dollTo=setTimeout(()=>{ if(gameState==='playing') scheduleDoll(); }, redMs);
  });
}

function playMugunghwaSplit(charMsA, charMsB, onDone){
  const el=document.getElementById('mugunghwa');
  el.innerHTML='';
  clearTimeout(mentIv);
  let i=0;
  const allChars=[...PHRASE_A, ...PHRASE_B];
  const charMsList=[ // 각 글자별 딜레이
    ...PHRASE_A.map(()=>charMsA),
    ...PHRASE_B.map(()=>charMsB),
  ];
  let elapsed=0;
  function nextChar(){
    if(i>=allChars.length){ onDone(); return; }
    const {ch,c}=allChars[i];
    const s=document.createElement('span');
    s.textContent=ch; if(c) s.className=c;
    el.appendChild(s);
    i++;
    mentIv=setTimeout(nextChar, charMsList[i-1]||charMsB);
  }
  nextChar();
}

// ════════════════════════════
// 신호등
// ════════════════════════════
function setLight(green){
  isGreenLight=green;
  const doll=document.getElementById('dollImg');
  const ltxt=document.getElementById('lightText');
  const dotR=document.getElementById('dotRed');
  const dotG=document.getElementById('dotGreen');
  if(green){
    doll.classList.remove('alert');
    ltxt.textContent='🟢 초록불';
    dotR.className='light-dot'; dotG.className='light-dot ag';
    document.getElementById('moveBtn').style.opacity='1';
    // FX: 초록불 연출
    SQ.greenLightEffect();
    //SQ.weather('sunny');
  } else {
    doll.classList.add('alert');
    ltxt.textContent='🔴 빨간불';
    dotR.className='light-dot ar'; dotG.className='light-dot';
    document.getElementById('moveBtn').style.opacity='.5';
    // FX: 빨간불 연출
    SQ.redLightEffect();
    SQ.announce('멈춰!', {type:'danger', duration:1000});
  }
}
function flashDanger(){
  const f=document.getElementById('dangerFlash');
  f.classList.add('flash'); setTimeout(()=>f.classList.remove('flash'),160);
}

// ════════════════════════════
// 플레이어 이동
// ════════════════════════════
function startMove(e){
  e.preventDefault();
  if(gameState!=='playing'||isEliminated) return;
  isMoving=true;
  document.getElementById('moveBtn').classList.add('pressing');
  document.getElementById('playerEmoji').textContent='🏃';
  if(!isGreenLight){ eliminate(); return; }
  clearInterval(forwardIv);
  forwardIv=setInterval(()=>{
    if(!isGreenLight){ eliminate(); return; }
    playerStep=Math.min(playerStep+.13,TOTAL_STEPS);
    renderPlayer();
    if(playerStep>=TOTAL_STEPS) clearGame();
  },55);
}
function stopMove(e){
  if(e) e.preventDefault();
  isMoving=false;
  clearInterval(forwardIv); forwardIv=null;
  if(gameState==='playing'){
    document.getElementById('moveBtn').classList.remove('pressing');
    document.getElementById('playerEmoji').textContent='🧍';
  }
}
function moveLeft(e){
  if(e) e.preventDefault();
  if(gameState!=='playing'||isEliminated) return;
  const newX=Math.max(PX_MIN,playerX-X_STEP);
  if(!isBlockedByAI(newX, playerStep)) playerX=newX;
  renderPlayer();
}
function moveRight(e){
  if(e) e.preventDefault();
  if(gameState!=='playing'||isEliminated) return;
  const newX=Math.min(PX_MAX,playerX+X_STEP);
  if(!isBlockedByAI(newX, playerStep)) playerX=newX;
  renderPlayer();
}

function isBlockedByAI(x, step){
  return aiChars.some(ai=>{
    if(!ai.alive) return false;
    const dx=Math.abs(ai.x - x);
    const dy=Math.abs(ai.step - step);
    return dx < 5 && dy < 1.5; // X 5% + step 1.5칸 이내면 막힘
  });
}

// ════════════════════════════
// 탈락 / 클리어 / 시간초과
// ════════════════════════════
function eliminate(){
  if(isEliminated||gameState!=='playing') return;
  isEliminated=true;
  stopMove(null); stopAll();
  document.getElementById('playerEmoji').textContent='💀';
  document.getElementById('moveBtn').disabled=true;

  // FX: 탈락 대형 연출
  const playerEl = document.getElementById('player');
  const rect = playerEl.getBoundingClientRect();
  SQ.eliminateEffect({x: rect.left + rect.width/2, y: rect.top + rect.height/2});
  //SQ.weather('none');
  SQ.bigText('탈락!', 1500);

  setTimeout(()=>showResult(false),1800);
}
function timeUp(){
  if(gameState!=='playing') return;
  stopAll();
  SQ.flash('red', 300);
  SQ.shake(500, true);
  SQ.bigText('시간 초과!', 1500);
  SQ.vibrate([100,50,100,50,200]);
  //SQ.weather('none');
  setTimeout(()=>showResult(false), 1800);
}
function clearGame(){
  stopAll();
  document.getElementById('playerEmoji').textContent='🎉';
  document.getElementById('moveBtn').disabled=true;

  // FX: 클리어 대형 연출
  SQ.clearEffect();
  //SQ.weather('sunny');
  SQ.bigText('통과!', 1500);

  setTimeout(()=>showResult(true),2000);
}
function stopAll(){
  if(gameState==='result') return; // 이중호출 방지
  gameState='result';
  clearInterval(timerIv); clearInterval(aiIv);
  clearInterval(forwardIv); clearTimeout(mentIv);
  clearTimeout(dollTo);
  SQ.pulse(null);
}

// ════════════════════════════
// 결과
// ════════════════════════════
function showResult(win){
  const alive=aiChars.filter(a=>a.alive).length;
  const elim=AI_COUNT-alive;
  const isNew = gameInfo.isNew !== false;

  if(win){
    document.getElementById('rIcon').textContent='🎊';
    const t=document.getElementById('rTitle');
    t.textContent=isNew?'첫 클리어!':'클리어!'; t.className='ov-title win';
    document.getElementById('rDesc').textContent=
      `결승선 도달 성공!\n남은 시간: ${timeLeft}초\n참가자 ${elim}명 탈락 · ${alive}명 생존`;
    const b=document.getElementById('rBtn'); b.className='ov-btn green'; b.textContent='결과 확인';
  } else {
    document.getElementById('rIcon').textContent=isEliminated?'💀':'⏰';
    const t=document.getElementById('rTitle');
    t.textContent=isEliminated?'탈락!':'시간 초과!'; t.className='ov-title lose';
    document.getElementById('rDesc').textContent=
      isEliminated
        ?`빨간불에 움직임이 감지되었습니다!\n${padNum(456)}번 참가자 탈락.`
        :`제한시간 ${TOTAL_TIME}초를 초과했습니다!\n더 빠르게 이동하세요.`;
    const b=document.getElementById('rBtn'); b.className='ov-btn primary'; b.textContent='결과 확인';
  }
  sessionStorage.setItem('SQ_GAME_RESULT',JSON.stringify({gameId:gameInfo.gameId,outcome:win?'clear':'fail'}));
  setTimeout(()=>{ SQ.cleanup(); sessionStorage.setItem('ORACLE_ENTRY',Date.now());window.location.href='squid_hub.html'; }, 2000);
}
function goResult(){ SQ.cleanup(); sessionStorage.setItem('ORACLE_ENTRY',Date.now());window.location.href='squid_hub.html'; }
function quitGame(){
  stopAll();
  SQ.cleanup();
  if(gameState!=='result')
    sessionStorage.setItem('SQ_GAME_RESULT',JSON.stringify({gameId:gameInfo.gameId,outcome:'fail'}));
  sessionStorage.setItem('ORACLE_ENTRY',Date.now());window.location.href='squid_hub.html';
}

// ════════════════════════════
// 유틸
// ════════════════════════════
function showToast(msg,dur=2000){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),dur);
}
window.addEventListener('resize',()=>{ if(gameState==='playing'||gameState==='countdown') initField(); });
</script>
