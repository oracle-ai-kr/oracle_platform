<!DOCTYPE html>
<html lang="ko">
<head><script>
// ── ORACLE 토큰가드 ──
(function(){
  var t=sessionStorage.getItem('ORACLE_ENTRY');
  var ok=t&&(Date.now()-Number(t)<5000);
  if(ok) sessionStorage.removeItem('ORACLE_ENTRY');
  if(ok) return;
  function _show404(){
    document.body.style.cssText='margin:0;padding:0;overflow:hidden';
    Array.from(document.body.children).forEach(function(el){el.style.display='none'});
    var d=document.createElement('div');d.id='_oracle404';
    d.innerHTML='<div style="position:fixed;inset:0;z-index:999999;background:#0f1724;color:#e8eaf0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px"><div style="max-width:360px"><div style="width:120px;height:120px;background:#fff;border-radius:50%;margin:0 auto 32px;display:flex;align-items:center;justify-content:center"><div style="width:72px;height:52px;border:3px solid #333;border-radius:6px;position:relative;display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:24px;font-weight:700;color:#d32f2f">404</div></div><h1 style="font-size:20px;font-weight:700;margin:0 0 12px">페이지를 찾을 수 없습니다.</h1><p style="font-size:14px;color:#8a91a0;line-height:1.6;margin:0 0 32px">존재하지 않는 주소를 입력하셨거나,<br>요청하신 페이지의 주소가 변경/삭제되어 찾을 수 없습니다.</p><a href="index.html" style="display:block;width:100%;padding:16px;background:#d32f2f;color:#fff;font-size:16px;font-weight:700;border:none;border-radius:8px;cursor:pointer;text-decoration:none;text-align:center">홈으로 이동</a></div></div>';
    document.body.appendChild(d);
  }
  if(document.body) _show404();
  else document.addEventListener('DOMContentLoaded', _show404);
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ORACLE · Prompt Forge</title>
<!-- internal version: v1 -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#060a10;--surface:#0a1018;--surface2:#0e1520;--surface3:#121c2a;
  --border:#182030;--border2:#1e2a3c;
  --accent:#00d4ff;--accent2:#00b8d4;
  --green:#00e5a0;--red:#ff3355;--yellow:#ffcc00;--orange:#ff8c3a;
  --blue:#3d8eff;--purple:#9966ff;--gold:#ffc844;
  --text:#b8cce0;--text2:#6a8faa;--muted:#384858;
  --mono:'JetBrains Mono',monospace;
}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:13px;display:flex;flex-direction:column;}

/* ── 헤더 ── */
.app-header{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;flex-shrink:0;z-index:10;}
.header-top{display:flex;align-items:center;gap:8px;}
.title-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.title-text{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:1px;color:var(--accent);}
.title-sub{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:2px;margin-left:auto;}

/* ── 탭 ── */
.tab-bar{display:flex;gap:0;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
.tab-btn{flex:1;padding:10px 0;text-align:center;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:1px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);background:rgba(0,212,255,.04);}
.tab-btn:active{opacity:.7;}

/* ── 콘텐츠 ── */
.content{flex:1;overflow-y:auto;padding:12px 14px 100px;-webkit-overflow-scrolling:touch;}
.tab-content{display:none;}
.tab-content.active{display:block;}

/* ── 카드 ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;}
.card-label{font-size:10px;color:var(--muted);letter-spacing:2px;font-family:var(--mono);margin-bottom:10px;text-transform:uppercase;}

/* ── 단계 진행 바 ── */
.step-bar{display:flex;gap:4px;margin-bottom:12px;}
.step-dot{flex:1;height:4px;border-radius:2px;background:var(--border);transition:all .3s;}
.step-dot.done{background:var(--accent);}
.step-dot.current{background:var(--yellow);box-shadow:0 0 6px var(--yellow);}

/* ── 단계 헤더 ── */
.depth-header{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;}
.depth-icon{font-size:20px;}
.depth-info{flex:1;}
.depth-label{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent);letter-spacing:1px;}
.depth-question{font-size:11px;color:var(--text2);margin-top:2px;}
.depth-num{font-family:var(--mono);font-size:10px;color:var(--muted);background:var(--surface3);padding:3px 8px;border-radius:100px;}

/* ── 질문 카드 ── */
.q-list{display:flex;flex-direction:column;gap:6px;}
.q-card{padding:12px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:all .2s;position:relative;}
.q-card:active{transform:scale(.98);}
.q-card.selected{border-color:var(--accent);background:rgba(0,212,255,.06);box-shadow:0 0 12px rgba(0,212,255,.1);}
.q-text{font-size:13px;line-height:1.6;color:var(--text);padding-right:30px;}
.q-meta{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;}
.q-tag{font-family:var(--mono);font-size:8px;padding:2px 6px;border-radius:100px;background:var(--surface3);color:var(--text2);border:1px solid var(--border);}
.q-viz{font-family:var(--mono);font-size:8px;padding:2px 6px;border-radius:100px;color:var(--accent);border:1px solid rgba(0,212,255,.3);background:rgba(0,212,255,.06);}
.q-check{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .2s;}
.q-card.selected .q-check{border-color:var(--accent);background:var(--accent);color:var(--bg);}

/* ── 선택 요약 (빵가루) ── */
.breadcrumb{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
.bc-item{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;font-size:11px;}
.bc-item .bc-depth{font-family:var(--mono);font-size:9px;color:var(--accent);min-width:20px;}
.bc-item .bc-text{flex:1;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bc-item .bc-del{color:var(--red);font-size:14px;cursor:pointer;padding:0 4px;}

/* ── 네비게이션 ── */
.nav-bar{display:flex;gap:8px;margin-top:14px;}
.nav-btn{flex:1;padding:12px;border:none;border-radius:10px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;}
.nav-btn:active{transform:scale(.97);}
.nav-btn.back{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.nav-btn.next{background:var(--accent);color:var(--bg);}
.nav-btn:disabled{opacity:.3;cursor:not-allowed;}

/* ── 프롬프트 결과 ── */
.prompt-box{background:var(--surface2);border:1px solid var(--accent);border-radius:12px;padding:14px;margin-bottom:10px;}
.prompt-label{font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:2px;margin-bottom:8px;}
.prompt-text{font-size:12px;line-height:1.7;color:var(--text);white-space:pre-wrap;word-break:break-word;max-height:400px;overflow-y:auto;padding:10px;background:var(--bg);border-radius:8px;border:1px solid var(--border);}
.copy-btn{width:100%;padding:14px;background:var(--accent);color:var(--bg);border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:6px;}
.copy-btn:active{opacity:.8;}
.reset-btn{width:100%;padding:10px;background:transparent;color:var(--text2);border:1px solid var(--border);border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit;margin-top:6px;}

/* ── 리포트 뷰어 ── */
.upload-zone{border:2px dashed var(--border);border-radius:12px;padding:30px 20px;text-align:center;cursor:pointer;transition:all .2s;}
.upload-zone:active{border-color:var(--accent);}
.upload-zone-icon{font-size:32px;margin-bottom:8px;}
.upload-zone-text{font-size:12px;color:var(--text2);}
.upload-zone-sub{font-size:10px;color:var(--muted);margin-top:4px;}

/* ── 리포트 시각화 블록 ── */
.rpt-block{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;}
.rpt-title{font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:2px;margin-bottom:10px;text-transform:uppercase;}

/* 게이지 */
.rpt-gauge{margin-bottom:12px;}
.rpt-gauge-label{font-size:11px;color:var(--text2);margin-bottom:4px;display:flex;justify-content:space-between;}
.rpt-gauge-track{height:8px;background:var(--surface3);border-radius:4px;overflow:hidden;position:relative;}
.rpt-gauge-fill{height:100%;border-radius:4px;transition:width .6s ease;}
.rpt-gauge-value{font-family:var(--mono);font-size:18px;font-weight:900;margin-top:4px;}
.rpt-gauge-status{display:inline-block;font-family:var(--mono);font-size:9px;padding:2px 8px;border-radius:100px;margin-left:6px;}

/* 막대 */
.rpt-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.rpt-bar-name{font-size:11px;color:var(--text2);min-width:70px;flex-shrink:0;}
.rpt-bar-track{flex:1;height:14px;background:var(--surface3);border-radius:4px;overflow:hidden;position:relative;}
.rpt-bar-fill{height:100%;border-radius:4px;transition:width .6s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:4px;}
.rpt-bar-val{font-family:var(--mono);font-size:9px;font-weight:700;}
.rpt-bar-tag{font-family:var(--mono);font-size:8px;padding:2px 6px;border-radius:100px;min-width:40px;text-align:center;}

/* 플로우 */
.rpt-flow{display:flex;flex-direction:column;gap:2px;}
.rpt-flow-step{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface2);border-radius:8px;border-left:3px solid var(--accent);}
.rpt-flow-arrow{text-align:center;color:var(--muted);font-size:16px;padding:2px 0;}
.rpt-flow-text{font-size:11px;flex:1;}
.rpt-flow-tag{font-family:var(--mono);font-size:8px;padding:2px 6px;border-radius:100px;}

/* 히트맵 */
.rpt-heatmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px;}
.rpt-heat-cell{padding:10px 6px;border-radius:8px;text-align:center;border:1px solid var(--border);}
.rpt-heat-name{font-size:10px;color:var(--text);margin-bottom:4px;}
.rpt-heat-val{font-family:var(--mono);font-size:14px;font-weight:900;}
.rpt-heat-tag{font-family:var(--mono);font-size:8px;margin-top:2px;}

/* 태그/배지 */
.rpt-tags{display:flex;flex-wrap:wrap;gap:6px;}
.rpt-tag-badge{padding:6px 12px;border-radius:100px;font-size:11px;font-weight:700;border:1px solid;}

/* 타임라인 */
.rpt-timeline{position:relative;padding-left:20px;}
.rpt-timeline::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--border);}
.rpt-tl-item{position:relative;margin-bottom:12px;padding:8px 12px;background:var(--surface2);border-radius:8px;border:1px solid var(--border);}
.rpt-tl-item::before{content:'';position:absolute;left:-17px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);}
.rpt-tl-date{font-family:var(--mono);font-size:9px;color:var(--accent);}
.rpt-tl-text{font-size:11px;margin-top:2px;}

/* ── 해설 배지 ── */
.badge-bull{background:rgba(0,229,160,.1);color:var(--green);border-color:rgba(0,229,160,.3);}
.badge-bear{background:rgba(255,51,85,.1);color:var(--red);border-color:rgba(255,51,85,.3);}
.badge-neut{background:rgba(255,204,0,.1);color:var(--yellow);border-color:rgba(255,204,0,.3);}
.badge-info{background:rgba(0,212,255,.1);color:var(--accent);border-color:rgba(0,212,255,.3);}

/* ── 토스트 ── */
.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:100px;font-size:12px;font-family:var(--mono);opacity:0;transition:all .25s;pointer-events:none;z-index:10000;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app-header">
  <div class="header-top">
    <div class="title-dot"></div>
    <div class="title-text">PROMPT FORGE</div>
    <div class="title-sub">MACRO ANALYZER</div>
  </div>
</div>

<div class="tab-bar">
  <div class="tab-btn active" data-tab="builder" onclick="switchTab('builder')">📖 빌더</div>
  <div class="tab-btn" data-tab="viewer" onclick="switchTab('viewer')">📊 리포트</div>
</div>

<div class="content">
  <!-- ═══ 탭1: 프롬프트 빌더 ═══ -->
  <div class="tab-content active" id="tab-builder">

    <!-- 단계 진행 바 -->
    <div class="step-bar" id="stepBar"></div>

    <!-- 선택 요약 (빵가루) -->
    <div class="breadcrumb" id="breadcrumb"></div>

    <!-- 단계 헤더 -->
    <div class="depth-header" id="depthHeader"></div>

    <!-- 질문 리스트 -->
    <div class="q-list" id="qList"></div>

    <!-- 네비게이션 -->
    <div class="nav-bar" id="navBar">
      <button class="nav-btn back" onclick="goBack()" id="backBtn" disabled>← 이전</button>
      <button class="nav-btn next" onclick="goNext()" id="nextBtn" disabled>다음 →</button>
    </div>

    <!-- 완성된 프롬프트 (6단계 완료 시) -->
    <div id="promptResult" style="display:none;">
      <div class="prompt-box">
        <div class="prompt-label">📖 생성된 프롬프트</div>
        <div class="prompt-text" id="promptText"></div>
      </div>
      <button class="copy-btn" onclick="copyPrompt()">📋 전체 복사 — Claude에 붙여넣기</button>
      <button class="reset-btn" onclick="resetBuilder()">🔄 새로운 질문 조합 만들기</button>
    </div>
  </div>

  <!-- ═══ 탭2: 리포트 뷰어 ═══ -->
  <div class="tab-content" id="tab-viewer">
    <div id="uploadSection">
      <div class="card">
        <div class="card-label">JSON 리포트 업로드</div>
        <label class="upload-zone" id="uploadZone">
          <div class="upload-zone-icon">📄</div>
          <div class="upload-zone-text">JSON 파일을 선택하세요</div>
          <div class="upload-zone-sub">Claude가 생성한 분석 리포트 JSON</div>
          <input type="file" id="fileInput" accept=".json" style="display:none" onchange="handleUpload(this)">
        </label>
      </div>
      <div class="card">
        <div class="card-label">또는 JSON 직접 붙여넣기</div>
        <textarea id="jsonPaste" placeholder='{"sections":[...]}' style="width:100%;height:120px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px;font-family:var(--mono);font-size:11px;resize:none;outline:none;"></textarea>
        <button style="width:100%;padding:10px;background:var(--accent);color:var(--bg);border:none;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;margin-top:6px;font-family:inherit;" onclick="parseJsonPaste()">📊 시각화 렌더링</button>
      </div>
    </div>
    <div id="reportArea" style="display:none;"></div>
    <button id="reportResetBtn" style="display:none;width:100%;padding:10px;background:transparent;color:var(--text2);border:1px solid var(--border);border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit;margin-top:6px;" onclick="resetViewer()">🔄 새 리포트 업로드</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ═══ 질문 풀 로드 ═══ -->
<script src="pf_questions.js"></script>

<script>
// ═══════════════════════════════════════════
// 유틸
// ═══════════════════════════════════════════
function vibrate(ms){try{navigator.vibrate&&navigator.vibrate(ms||20);}catch(e){}}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}

// ═══════════════════════════════════════════
// 탭 전환
// ═══════════════════════════════════════════
function switchTab(tab){
  vibrate();
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.toggle('active',c.id==='tab-'+tab));
}

// ═══════════════════════════════════════════
// 빌더 상태
// ═══════════════════════════════════════════
let _currentDepth = 1;
let _selected = {}; // {1: questionObj, 2: questionObj, ...}
let _currentPick = null; // 현재 단계에서 선택한 질문 (아직 확정 안 된 상태)

function initBuilder(){
  _currentDepth = 1;
  _selected = {};
  _currentPick = null;
  document.getElementById('promptResult').style.display='none';
  document.getElementById('navBar').style.display='flex';
  renderStep();
}

// ═══════════════════════════════════════════
// 렌더링
// ═══════════════════════════════════════════
function renderStep(){
  renderStepBar();
  renderBreadcrumb();
  renderDepthHeader();
  renderQuestions();
  updateNav();
}

function renderStepBar(){
  let html='';
  for(let d=1;d<=6;d++){
    const cls = d < _currentDepth ? 'done' : d === _currentDepth ? 'current' : '';
    html+=`<div class="step-dot ${cls}"></div>`;
  }
  document.getElementById('stepBar').innerHTML=html;
}

function renderBreadcrumb(){
  const el=document.getElementById('breadcrumb');
  const depths = Object.keys(_selected).map(Number).sort();
  if(!depths.length){el.innerHTML='';return;}
  el.innerHTML=depths.map(d=>{
    const q=_selected[d];
    return `<div class="bc-item">
      <span class="bc-depth">D${d}</span>
      <span class="bc-text">${q.text}</span>
      <span class="bc-del" onclick="undoFrom(${d})">✕</span>
    </div>`;
  }).join('');
}

function renderDepthHeader(){
  const info = PF_DEPTHS[_currentDepth];
  if(!info) return;
  const candidates = getCandidates();
  document.getElementById('depthHeader').innerHTML=`
    <div class="depth-icon">${info.icon}</div>
    <div class="depth-info">
      <div class="depth-label">D${_currentDepth} · ${info.label}</div>
      <div class="depth-question">${info.question}</div>
    </div>
    <div class="depth-num">${candidates.length}개</div>`;
}

function getCandidates(){
  if(_currentDepth === 1) return getStartQuestions();
  const prev = _selected[_currentDepth - 1];
  if(!prev) return [];
  return getNextQuestions(prev);
}

function renderQuestions(){
  const el=document.getElementById('qList');
  const candidates = getCandidates();
  if(!candidates.length){
    el.innerHTML='<div style="text-align:center;padding:20px;color:var(--muted);">연결된 질문이 없습니다</div>';
    return;
  }
  el.innerHTML=candidates.map(q=>{
    const sel = _currentPick && _currentPick.id === q.id ? 'selected' : '';
    const vizLabel = PF_VIZ_HINTS[q.vizHint]?.label || q.vizHint;
    return `<div class="q-card ${sel}" data-qid="${q.id}" onclick="pickQuestion('${q.id}')">
      <div class="q-text">${q.text}</div>
      <div class="q-meta">
        <span class="q-viz">${vizLabel}</span>
        ${q.situation?`<span class="q-tag">${q.situation}</span>`:''}
      </div>
      <div class="q-check">${sel?'✓':''}</div>
    </div>`;
  }).join('');
}

function pickQuestion(id){
  vibrate();
  const candidates = getCandidates();
  _currentPick = candidates.find(q=>q.id===id) || null;
  renderQuestions();
  updateNav();
}

function updateNav(){
  const backBtn=document.getElementById('backBtn');
  const nextBtn=document.getElementById('nextBtn');
  backBtn.disabled = _currentDepth <= 1;
  nextBtn.disabled = !_currentPick;
  if(_currentDepth === 6 && _currentPick){
    nextBtn.textContent='📖 프롬프트 생성';
  } else {
    nextBtn.textContent='다음 →';
  }
}

// ═══════════════════════════════════════════
// 네비게이션
// ═══════════════════════════════════════════
function goNext(){
  if(!_currentPick) return;
  vibrate(30);
  _selected[_currentDepth] = _currentPick;
  _currentPick = null;

  if(_currentDepth >= 6){
    // 완성!
    generatePrompt();
    return;
  }
  _currentDepth++;
  renderStep();
  // 스크롤 맨 위로
  document.querySelector('.content').scrollTop=0;
}

function goBack(){
  if(_currentDepth <= 1) return;
  vibrate();
  _currentPick = _selected[_currentDepth] || null;
  delete _selected[_currentDepth];
  _currentDepth--;
  _currentPick = _selected[_currentDepth] || null;
  renderStep();
}

function undoFrom(depth){
  vibrate();
  for(let d=depth;d<=6;d++) delete _selected[d];
  _currentDepth = depth;
  _currentPick = null;
  renderStep();
}

function resetBuilder(){
  vibrate(30);
  initBuilder();
}

// ═══════════════════════════════════════════
// 프롬프트 생성
// ═══════════════════════════════════════════
function generatePrompt(){
  const qs = [];
  for(let d=1;d<=6;d++){
    if(_selected[d]) qs.push(_selected[d]);
  }
  if(qs.length < 6){toast('6단계 모두 선택해주세요');return;}

  // vizHints 수집
  const vizTypes = qs.map(q=>PF_VIZ_HINTS[q.vizHint]?.label||q.vizHint);

  let prompt = `아래 6개 질문에 대해 시장/경제 분석 리포트를 작성해줘.\n\n`;
  prompt += `[분석 맥락]\n`;
  qs.forEach((q,i)=>{
    const info = PF_DEPTHS[q.depth];
    prompt += `${info.icon} D${q.depth} ${info.label}: ${q.text}\n`;
  });

  prompt += `\n[출력 규칙]\n`;
  prompt += `- 반드시 JSON 형식으로만 출력 (마크다운/설명 없이 순수 JSON만)\n`;
  prompt += `- 아래 JSON 스키마를 정확히 따를 것\n`;
  prompt += `- 모든 수치는 숫자형, 텍스트는 문자열\n`;
  prompt += `- status 값: "강세"/"약세"/"중립"/"주의"/"위험"/"기회" 중 택1\n`;
  prompt += `- color 값: "green"/"red"/"yellow"/"blue" 중 택1\n\n`;

  prompt += `[JSON 스키마]\n`;
  prompt += `{\n`;
  prompt += `  "title": "리포트 제목",\n`;
  prompt += `  "date": "YYYY-MM-DD",\n`;
  prompt += `  "summary": "3줄 이내 핵심 요약",\n`;
  prompt += `  "sections": [\n`;

  qs.forEach((q,i)=>{
    const hint = q.vizHint;
    const info = PF_DEPTHS[q.depth];
    prompt += `    {\n`;
    prompt += `      "depth": ${q.depth},\n`;
    prompt += `      "label": "${info.label}",\n`;
    prompt += `      "question": "${q.text}",\n`;
    prompt += `      "type": "${hint}",\n`;

    if(hint==='gauge'){
      prompt += `      "data": {\n`;
      prompt += `        "label": "지표명",\n`;
      prompt += `        "value": 0~100 숫자,\n`;
      prompt += `        "status": "상태",\n`;
      prompt += `        "color": "색상",\n`;
      prompt += `        "comment": "한줄 해설"\n`;
      prompt += `      }\n`;
    } else if(hint==='bar'){
      prompt += `      "data": {\n`;
      prompt += `        "items": [\n`;
      prompt += `          {"name": "항목명", "value": 숫자, "maxValue": 100, "status": "상태", "color": "색상"}\n`;
      prompt += `        ],\n`;
      prompt += `        "comment": "한줄 해설"\n`;
      prompt += `      }\n`;
    } else if(hint==='flow'){
      prompt += `      "data": {\n`;
      prompt += `        "steps": [\n`;
      prompt += `          {"text": "단계 설명", "status": "상태", "color": "색상"}\n`;
      prompt += `        ],\n`;
      prompt += `        "comment": "한줄 해설"\n`;
      prompt += `      }\n`;
    } else if(hint==='heatmap'){
      prompt += `      "data": {\n`;
      prompt += `        "items": [\n`;
      prompt += `          {"name": "항목명", "value": -100~100, "status": "상태", "color": "색상"}\n`;
      prompt += `        ],\n`;
      prompt += `        "comment": "한줄 해설"\n`;
      prompt += `      }\n`;
    } else if(hint==='tag'){
      prompt += `      "data": {\n`;
      prompt += `        "tags": [\n`;
      prompt += `          {"text": "키워드", "status": "상태", "color": "색상"}\n`;
      prompt += `        ],\n`;
      prompt += `        "comment": "한줄 해설"\n`;
      prompt += `      }\n`;
    } else if(hint==='timeline'){
      prompt += `      "data": {\n`;
      prompt += `        "events": [\n`;
      prompt += `          {"date": "날짜/시기", "text": "이벤트 설명", "status": "상태", "color": "색상"}\n`;
      prompt += `        ],\n`;
      prompt += `        "comment": "한줄 해설"\n`;
      prompt += `      }\n`;
    }
    prompt += `    }${i<5?',':''}\n`;
  });

  prompt += `  ],\n`;
  prompt += `  "conclusion": {\n`;
  prompt += `    "action": "핵심 행동 권고 (1문장)",\n`;
  prompt += `    "risk_level": "low/medium/high/critical",\n`;
  prompt += `    "tags": ["핵심키워드1","핵심키워드2","핵심키워드3"]\n`;
  prompt += `  }\n`;
  prompt += `}\n\n`;
  prompt += `위 스키마대로 JSON을 생성해줘. JSON 외 다른 텍스트는 포함하지 마.\n`;
  prompt += `그리고 이 JSON을 .json 파일로 만들어서 다운로드할 수 있게 해줘.`;

  document.getElementById('promptText').textContent = prompt;
  document.getElementById('promptResult').style.display='block';
  document.getElementById('navBar').style.display='none';
  document.getElementById('stepBar').innerHTML='';
  // 모든 step-dot done
  let dots='';for(let i=1;i<=6;i++)dots+=`<div class="step-dot done"></div>`;
  document.getElementById('stepBar').innerHTML=dots;
  toast('✅ 프롬프트 생성 완료!');
  document.querySelector('.content').scrollTop=0;
}

function copyPrompt(){
  vibrate(30);
  const text = document.getElementById('promptText').textContent;
  navigator.clipboard.writeText(text).then(()=>toast('📋 프롬프트 복사됨!')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('📋 복사됨');}catch(_){toast('복사 실패');}
    document.body.removeChild(ta);
  });
}

// ═══════════════════════════════════════════
// 리포트 뷰어
// ═══════════════════════════════════════════
function handleUpload(input){
  vibrate();
  const file=input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      renderReport(data);
    }catch(err){
      toast('❌ JSON 파싱 실패: '+err.message);
    }
    input.value='';
  };
  reader.readAsText(file);
}

function parseJsonPaste(){
  vibrate();
  const raw=document.getElementById('jsonPaste').value.trim();
  if(!raw){toast('JSON을 붙여넣어주세요');return;}
  try{
    // ```json ... ``` 래퍼 제거
    const cleaned=raw.replace(/^```json\s*/,'').replace(/```\s*$/,'').trim();
    const data=JSON.parse(cleaned);
    renderReport(data);
  }catch(err){
    toast('❌ JSON 파싱 실패: '+err.message);
  }
}

function renderReport(data){
  const area=document.getElementById('reportArea');
  const upload=document.getElementById('uploadSection');
  const resetBtn=document.getElementById('reportResetBtn');
  upload.style.display='none';
  area.style.display='block';
  resetBtn.style.display='block';

  let html='';

  // 타이틀
  if(data.title){
    html+=`<div class="card" style="text-align:center;border-color:var(--accent);">
      <div style="font-size:16px;font-weight:900;color:var(--accent);margin-bottom:4px;">${esc(data.title)}</div>
      ${data.date?`<div style="font-family:var(--mono);font-size:10px;color:var(--muted);">${esc(data.date)}</div>`:''}
      ${data.summary?`<div style="font-size:12px;color:var(--text);margin-top:8px;line-height:1.6;">${esc(data.summary)}</div>`:''}
    </div>`;
  }

  // 섹션들
  if(data.sections && Array.isArray(data.sections)){
    data.sections.forEach(sec=>{
      html+=renderSection(sec);
    });
  }

  // 결론
  if(data.conclusion){
    const c=data.conclusion;
    const rl=c.risk_level||'medium';
    const rlColor=rl==='low'?'var(--green)':rl==='high'?'var(--orange)':rl==='critical'?'var(--red)':'var(--yellow)';
    html+=`<div class="rpt-block" style="border-color:${rlColor};">
      <div class="rpt-title">🎯 결론</div>
      <div style="font-size:13px;line-height:1.6;color:var(--text);margin-bottom:8px;">${esc(c.action||'')}</div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <span class="rpt-gauge-status" style="background:${rlColor};color:var(--bg);font-size:10px;">리스크: ${rl.toUpperCase()}</span>
        ${(c.tags||[]).map(t=>`<span class="q-tag">${esc(t)}</span>`).join('')}
      </div>
    </div>`;
  }

  area.innerHTML=html;
  // 게이지 애니메이션
  setTimeout(()=>{area.querySelectorAll('.rpt-gauge-fill[data-w]').forEach(el=>{el.style.width=el.dataset.w+'%';});},100);
  setTimeout(()=>{area.querySelectorAll('.rpt-bar-fill[data-w]').forEach(el=>{el.style.width=el.dataset.w+'%';});},150);
}

function renderSection(sec){
  const info = PF_DEPTHS[sec.depth];
  const icon = info ? info.icon : '📋';
  let html=`<div class="rpt-block">
    <div class="rpt-title">${icon} D${sec.depth||'?'} · ${esc(sec.label||'')}</div>
    <div style="font-size:11px;color:var(--text2);margin-bottom:10px;">${esc(sec.question||'')}</div>`;

  const d=sec.data;
  if(!d){html+='</div>';return html;}

  switch(sec.type){
    case 'gauge': html+=renderGauge(d); break;
    case 'bar':   html+=renderBar(d); break;
    case 'flow':  html+=renderFlow(d); break;
    case 'heatmap':html+=renderHeatmap(d); break;
    case 'tag':   html+=renderTags(d); break;
    case 'timeline':html+=renderTimeline(d); break;
    default: html+=`<div style="color:var(--muted);font-size:11px;">알 수 없는 시각화 타입: ${sec.type}</div>`;
  }

  if(d.comment){
    html+=`<div style="margin-top:8px;padding:8px 10px;background:var(--surface2);border-radius:6px;border-left:3px solid var(--accent);font-size:11px;color:var(--text);line-height:1.5;">${esc(d.comment)}</div>`;
  }
  html+='</div>';
  return html;
}

function colorVar(c){
  const map={green:'var(--green)',red:'var(--red)',yellow:'var(--yellow)',blue:'var(--blue)',orange:'var(--orange)',purple:'var(--purple)'};
  return map[c]||'var(--text2)';
}

function badgeCls(status){
  if(!status) return 'badge-neut';
  if(/강세|기회|상승|반등|확장|매수/.test(status)) return 'badge-bull';
  if(/약세|위험|하락|침체|매도|과열/.test(status)) return 'badge-bear';
  if(/중립|보합|횡보|관망/.test(status)) return 'badge-neut';
  return 'badge-info';
}

function renderGauge(d){
  const val=Math.max(0,Math.min(100,d.value||0));
  const c=colorVar(d.color);
  return `<div class="rpt-gauge">
    <div class="rpt-gauge-label"><span>${esc(d.label||'')}</span></div>
    <div class="rpt-gauge-track"><div class="rpt-gauge-fill" data-w="${val}" style="width:0%;background:${c};"></div></div>
    <div style="margin-top:6px;">
      <span class="rpt-gauge-value" style="color:${c};">${val}</span>
      <span class="rpt-gauge-status ${badgeCls(d.status)}">${esc(d.status||'')}</span>
    </div>
  </div>`;
}

function renderBar(d){
  if(!d.items||!d.items.length) return '';
  return d.items.map(item=>{
    const max=item.maxValue||100;
    const pct=Math.max(0,Math.min(100,(item.value/max)*100));
    const c=colorVar(item.color);
    return `<div class="rpt-bar-row">
      <span class="rpt-bar-name">${esc(item.name||'')}</span>
      <div class="rpt-bar-track"><div class="rpt-bar-fill" data-w="${pct}" style="width:0%;background:${c};"><span class="rpt-bar-val" style="color:var(--bg);">${item.value}</span></div></div>
      <span class="rpt-bar-tag ${badgeCls(item.status)}">${esc(item.status||'')}</span>
    </div>`;
  }).join('');
}

function renderFlow(d){
  if(!d.steps||!d.steps.length) return '';
  return '<div class="rpt-flow">'+d.steps.map((s,i)=>{
    const c=colorVar(s.color);
    return (i>0?'<div class="rpt-flow-arrow">↓</div>':'')+
      `<div class="rpt-flow-step" style="border-left-color:${c};">
        <span class="rpt-flow-text">${esc(s.text||'')}</span>
        <span class="rpt-flow-tag ${badgeCls(s.status)}">${esc(s.status||'')}</span>
      </div>`;
  }).join('')+'</div>';
}

function renderHeatmap(d){
  if(!d.items||!d.items.length) return '';
  return '<div class="rpt-heatmap">'+d.items.map(item=>{
    const c=colorVar(item.color);
    const bg=item.color==='green'?'rgba(0,229,160,.08)':item.color==='red'?'rgba(255,51,85,.08)':'rgba(255,204,0,.08)';
    return `<div class="rpt-heat-cell" style="background:${bg};border-color:${c}30;">
      <div class="rpt-heat-name">${esc(item.name||'')}</div>
      <div class="rpt-heat-val" style="color:${c};">${item.value>=0?'+':''}${item.value}</div>
      <div class="rpt-heat-tag" style="color:${c};">${esc(item.status||'')}</div>
    </div>`;
  }).join('')+'</div>';
}

function renderTags(d){
  if(!d.tags||!d.tags.length) return '';
  return '<div class="rpt-tags">'+d.tags.map(t=>{
    return `<span class="rpt-tag-badge ${badgeCls(t.status)}">${esc(t.text||'')}</span>`;
  }).join('')+'</div>';
}

function renderTimeline(d){
  if(!d.events||!d.events.length) return '';
  return '<div class="rpt-timeline">'+d.events.map(ev=>{
    const c=colorVar(ev.color);
    return `<div class="rpt-tl-item" style="border-left-color:${c};">
      <div class="rpt-tl-date" style="color:${c};">${esc(ev.date||'')}</div>
      <div class="rpt-tl-text">${esc(ev.text||'')}</div>
      <span class="rpt-gauge-status ${badgeCls(ev.status)}" style="font-size:8px;margin-top:4px;display:inline-block;">${esc(ev.status||'')}</span>
    </div>`;
  }).join('')+'</div>';
}

function resetViewer(){
  vibrate();
  document.getElementById('uploadSection').style.display='block';
  document.getElementById('reportArea').style.display='none';
  document.getElementById('reportResetBtn').style.display='none';
  document.getElementById('reportArea').innerHTML='';
  document.getElementById('jsonPaste').value='';
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ═══════════════════════════════════════════
// 초기화
// ═══════════════════════════════════════════
initBuilder();
</script>
