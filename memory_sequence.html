<!doctype html>
<html lang="ko">
<head><script>
// ── ORACLE 토큰가드 ──
(function(){
  var t=sessionStorage.getItem('ORACLE_ENTRY');
  var ok=t&&(Date.now()-Number(t)<5000);
  if(ok) sessionStorage.removeItem('ORACLE_ENTRY');
  var pg='ORACLE_PG_'+location.pathname.split('/').pop();
  if(!ok) ok=!!sessionStorage.getItem(pg);
  if(ok){sessionStorage.setItem(pg,'1');return;}
  function _show404(){
    var isLight=localStorage.getItem('ORACLE_LIGHT')!=='0';
    var bg404=isLight?'#f2f3f5':'#0f1724';
    var fg404=isLight?'#1a1a1a':'#e8eaf0';
    var sub404=isLight?'#3a4555':'#9aa1b0';
    document.body.style.cssText='margin:0;padding:0;overflow:hidden';
    Array.from(document.body.children).forEach(function(el){el.style.display='none'});
    var d=document.createElement('div');
    d.id='_oracle404';
    d.innerHTML='<div style="position:fixed;inset:0;z-index:999999;background:'+bg404+';color:'+fg404+';'
      +'font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;display:flex;align-items:center;'
      +'justify-content:center;text-align:center;padding:20px">'
      +'<div style="max-width:360px">'
      +'<div style="width:120px;height:120px;background:#fff;border-radius:50%;margin:0 auto 32px;'
      +'display:flex;align-items:center;justify-content:center">'
      +'<div style="width:72px;height:52px;border:3px solid #333;border-radius:6px;position:relative;'
      +'display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:24px;'
      +'font-weight:700;color:#d32f2f">404</div></div>'
      +'<h1 style="font-size:20px;font-weight:700;margin:0 0 12px">페이지를 찾을 수 없습니다.</h1>'
      +'<p style="font-size:14px;color:'+sub404+';line-height:1.6;margin:0 0 32px">'
      +'존재하지 않는 주소를 입력하셨거나,<br>'
      +'요청하신 페이지의 주소가 변경/삭제되어 찾을 수 없습니다.</p>'
      +'<a href="index.html" style="display:block;width:100%;padding:16px;background:#d32f2f;color:#fff;'
      +'font-size:16px;font-weight:700;border:none;border-radius:8px;cursor:pointer;text-decoration:none;'
      +'text-align:center">홈으로 이동</a>'
      +'</div></div>';
    document.body.appendChild(d);
  }
  if(document.body) _show404();
  else document.addEventListener('DOMContentLoaded', _show404);
})();
</script>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>기억력 테스트</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+KR:wght@400;700;900&family=Teko:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060810;
  --c0:#00f0ff;
  --c1:#ff2d78;
  --c2:#ffe600;
  --c3:#7b2fff;
  --c4:#00ff9d;
  --text:#eef4ff;
  --muted:#5e6e96;
  --panel:rgba(8,10,26,.85);
  --border:rgba(0,240,255,.12);
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100%;background:var(--bg);color:var(--text);
  font-family:'Noto Sans KR',sans-serif;overflow-x:hidden;}

body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(0,240,255,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,240,255,.03) 1px,transparent 1px);
  background-size:40px 40px;
}
body::after{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(0,240,255,.07),transparent 70%);
}
.scanline{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.03) 2px,rgba(0,0,0,.03) 4px);}

/* ── TOP BAR ── */
#topBar{
  position:sticky;top:0;left:0;right:0;z-index:200;
  height:44px;
  background:rgba(7,8,15,.97);
  border-bottom:1px solid rgba(168,85,247,.22);
  display:flex;align-items:center;padding:0 10px;gap:6px;
  backdrop-filter:blur(12px);
}
#topBarHomeBtn{
  width:34px;height:34px;background:rgba(168,85,247,.15);
  border:1px solid rgba(168,85,247,.3);border-radius:9px;
  color:#f1f5f9;font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
#topBarTitle{font-family:'Teko',sans-serif;font-size:18px;letter-spacing:2px;color:#c084fc;line-height:44px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.tb-spacer{flex:1;}
#topBarBal{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.28);border-radius:8px;padding:4px 8px;font-size:12px;color:#f59e0b;font-weight:700;white-space:nowrap;}
#topBarPoint{background:rgba(168,85,247,.15);border:1px solid rgba(168,85,247,.35);border-radius:8px;padding:4px 8px;font-size:12px;color:#c084fc;font-weight:700;white-space:nowrap;}
#topBarCharge{background:linear-gradient(135deg,#7c3aed,#a855f7);border:none;border-radius:8px;color:#fff;font-size:12px;font-weight:700;padding:5px 10px;cursor:pointer;white-space:nowrap;}
#tbCharge{background:linear-gradient(135deg,var(--c3),var(--c0));border:none;border-radius:8px;color:var(--bg);font-size:11px;font-weight:700;padding:5px 10px;cursor:pointer;white-space:nowrap;}

.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:14px 12px 40px;}

/* ── 헤더 ── */
.hdr{padding:14px 0 10px;text-align:center;}
.hdr-title{
  font-family:'Orbitron',monospace;font-size:1.55rem;font-weight:900;letter-spacing:.18em;
  background:linear-gradient(90deg,var(--c0),var(--c3),var(--c1));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 18px rgba(0,240,255,.4));
}
.hdr-sub{font-family:'Orbitron',monospace;font-size:.55rem;letter-spacing:.35em;color:var(--muted);margin-top:3px;}

/* ── 모드 탭 ── */
.mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0;}
.mode-tab{
  padding:10px;border-radius:10px;text-align:center;cursor:pointer;
  font-family:'Orbitron',monospace;font-size:.62rem;font-weight:700;letter-spacing:.08em;
  border:1px solid var(--muted);color:var(--muted);
  transition:all .25s;user-select:none;position:relative;overflow:hidden;
}
.mode-tab::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity .25s;}
.mode-tab.tab-basic.on{border-color:var(--c0);color:var(--c0);box-shadow:0 0 18px rgba(0,240,255,.2),inset 0 0 18px rgba(0,240,255,.06);}
.mode-tab.tab-basic.on::before{background:linear-gradient(135deg,rgba(0,240,255,.08),transparent);opacity:1;}
.mode-tab.tab-enh.on{border-color:var(--c1);color:var(--c1);box-shadow:0 0 18px rgba(255,45,120,.2),inset 0 0 18px rgba(255,45,120,.06);}
.mode-tab.tab-enh.on::before{background:linear-gradient(135deg,rgba(255,45,120,.08),transparent);opacity:1;}

/* ── 상태바 ── */
.statbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px;}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 6px;text-align:center;}
.stat-label{font-family:'Orbitron',monospace;font-size:.42rem;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:4px;}
.stat-val{font-family:'Orbitron',monospace;font-size:.85rem;font-weight:700;color:var(--c0);transition:color .3s;}
.stat-val.danger{color:var(--c1);animation:valPulse .5s ease infinite alternate;}
@keyframes valPulse{from{opacity:.7}to{opacity:1}}

/* ── 스테이지 ── */
.stage{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin-bottom:12px;position:relative;overflow:hidden;min-height:200px;
  transition:border-color .4s,box-shadow .4s;
}
.stage::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--c0),transparent);opacity:.5;}
.stage.mode-enh{border-color:rgba(255,45,120,.2);}
.stage.mode-enh::before{background:linear-gradient(90deg,transparent,var(--c1),transparent);}
.stage.danger-anim{
  border-color:rgba(255,45,120,.6)!important;
  animation:stageDanger .4s ease infinite alternate;
}
@keyframes stageDanger{
  from{box-shadow:0 0 20px rgba(255,45,120,.15),inset 0 0 20px rgba(255,45,120,.04)}
  to{box-shadow:0 0 45px rgba(255,45,120,.4),inset 0 0 30px rgba(255,45,120,.08)}
}

.stage-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;flex-wrap:wrap;}
.stage-phase{
  font-family:'Orbitron',monospace;font-size:.6rem;font-weight:700;
  letter-spacing:.15em;padding:4px 10px;border-radius:6px;
  border:1px solid var(--c0);color:var(--c0);box-shadow:0 0 10px rgba(0,240,255,.2);
  white-space:nowrap;
}
.stage-phase.input-phase{border-color:var(--c2);color:var(--c2);box-shadow:0 0 10px rgba(255,230,0,.2);}
.stage-phase.end-phase{border-color:var(--c4);color:var(--c4);box-shadow:0 0 10px rgba(0,255,157,.2);}
.stage-phase.dual-phase{border-color:var(--c3);color:var(--c3);box-shadow:0 0 10px rgba(123,47,255,.3);animation:dualPulse 1s ease infinite alternate;}
@keyframes dualPulse{from{box-shadow:0 0 6px rgba(123,47,255,.2)}to{box-shadow:0 0 18px rgba(123,47,255,.5)}}

.enh-badges{display:flex;gap:6px;flex-wrap:wrap;}
.ebadge{font-family:'Orbitron',monospace;font-size:.5rem;letter-spacing:.08em;padding:3px 8px;border-radius:5px;font-weight:700;}
.ebadge.round{background:rgba(123,47,255,.15);border:1px solid rgba(123,47,255,.4);color:var(--c3);}
.ebadge.streak{background:rgba(255,230,0,.1);border:1px solid rgba(255,230,0,.35);color:var(--c2);}
.ebadge.noise{background:rgba(255,45,120,.1);border:1px solid rgba(255,45,120,.35);color:var(--c1);}
.ebadge.dual{background:rgba(123,47,255,.15);border:1px solid rgba(123,47,255,.5);color:var(--c3);animation:dualPulse 1s ease infinite alternate;}

.lives{display:flex;gap:5px;align-items:center;}
.heart{font-size:16px;transition:all .3s;display:inline-block;}
.heart.lost{opacity:.15;transform:scale(.6);}

/* ── 타임바 ── */
.timebar-wrap{margin:10px 0 6px;}
.timebar-bg{height:4px;border-radius:2px;background:rgba(255,255,255,.06);overflow:visible;}
.timebar-fill{
  height:100%;border-radius:2px;
  background:linear-gradient(90deg,var(--c0),var(--c3));
  transition:width .1s linear,background .4s;position:relative;
}
.timebar-fill::after{
  content:'';position:absolute;right:-2px;top:50%;transform:translateY(-50%);
  width:8px;height:8px;border-radius:50%;
  background:var(--c0);box-shadow:0 0 8px var(--c0);transition:background .4s,box-shadow .4s;
}
.timebar-fill.danger{background:linear-gradient(90deg,var(--c1),#ff6600);}
.timebar-fill.danger::after{background:var(--c1);box-shadow:0 0 12px var(--c1);}

/* ── 듀얼 시퀀스 레이아웃 ── */
.dual-container{display:flex;flex-direction:column;gap:10px;margin:10px 0;}
.dual-row{
  padding:10px;border-radius:10px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.02);
  transition:border-color .3s,background .3s,box-shadow .3s;
  cursor:default;
}
.dual-row.selectable{cursor:pointer;}
.dual-row.selectable:hover{border-color:rgba(123,47,255,.5);background:rgba(123,47,255,.06);}
.dual-row.chosen{
  border-color:var(--c3);background:rgba(123,47,255,.1);
  box-shadow:0 0 16px rgba(123,47,255,.25);
}
.dual-row.chosen-wrong{
  border-color:var(--c1);background:rgba(255,45,120,.08);
  animation:badFlash .3s ease;
}
.dual-label{
  font-family:'Orbitron',monospace;font-size:.48rem;letter-spacing:.12em;
  color:var(--muted);margin-bottom:6px;
}
.dual-row.chosen .dual-label{color:var(--c3);}

/* ── 시퀀스 칩 ── */
.seq-row{display:flex;gap:7px;flex-wrap:wrap;margin:6px 0;}
.chip{
  width:50px;height:50px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:22px;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);
  opacity:.4;position:relative;overflow:hidden;transition:all .15s ease;
}
.chip.num{font-family:'Orbitron',monospace;font-size:13px;font-weight:700;}
.chip.lit{
  opacity:1;border-color:var(--c2);
  box-shadow:0 0 16px rgba(255,230,0,.35),inset 0 0 12px rgba(255,230,0,.08);
  transform:translateY(-3px) scale(1.06);
}
.chip.lit::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,230,0,.12),transparent);border-radius:inherit;}

/* ── 카드 그리드 ── */
.card-grid{display:grid;gap:8px;margin-top:10px;grid-template-columns:repeat(5,1fr);}
.ccard{
  height:58px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:22px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);
  cursor:pointer;user-select:none;position:relative;overflow:hidden;
  transition:transform .08s ease,border-color .15s,background .15s,box-shadow .15s,opacity .6s ease;
}
.ccard.num{font-family:'Orbitron',monospace;font-size:13px;font-weight:700;}
.ccard::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.06),transparent);opacity:0;transition:opacity .15s;}
.ccard:active{transform:scale(.94);}
.ccard:not(.lock):not(.ok):hover{border-color:rgba(0,240,255,.4);box-shadow:0 0 12px rgba(0,240,255,.15);}
.ccard:not(.lock):not(.ok):hover::before{opacity:1;}
.ccard.ok{border-color:var(--c4);background:rgba(0,255,157,.08);box-shadow:0 0 14px rgba(0,255,157,.2);}
.ccard.ok::after{content:'✓';position:absolute;bottom:2px;right:5px;font-size:9px;color:var(--c4);font-weight:900;}
.ccard.bad{animation:badFlash .25s ease;}
@keyframes badFlash{0%{border-color:var(--c1);background:rgba(255,45,120,.2);box-shadow:0 0 20px rgba(255,45,120,.35)}100%{}}
.ccard.lock{opacity:.3;cursor:not-allowed;}
.ccard.shake{animation:shk .2s ease infinite;}
@keyframes shk{0%,100%{transform:translateX(0)}30%{transform:translateX(-3px)}70%{transform:translateX(3px)}}
/* 페이드아웃 — JS에서 opacity 직접 조작 */
.ccard.fading{transition:opacity 0s !important;}

/* ── 옵션 패널 ── */
.opts{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:12px;}
.opts-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
select{
  background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;
  color:var(--text);padding:7px 10px;
  font-family:'Orbitron',monospace;font-size:.55rem;letter-spacing:.05em;
  outline:none;cursor:pointer;flex:1;min-width:0;
}
select:focus{border-color:var(--c0);}
.tog{
  padding:6px 12px;border-radius:8px;cursor:pointer;
  font-family:'Orbitron',monospace;font-size:.5rem;font-weight:700;letter-spacing:.08em;
  border:1px solid var(--muted);color:var(--muted);background:transparent;
  transition:all .2s;white-space:nowrap;
}
.tog.on{border-color:var(--c2);color:var(--c2);box-shadow:0 0 10px rgba(255,230,0,.2);}
.tog:active{transform:scale(.95);}
.opt-lbl{font-family:'Orbitron',monospace;font-size:.48rem;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;white-space:nowrap;}
.x2-badge{
  font-family:'Orbitron',monospace;font-size:.42rem;letter-spacing:.06em;
  padding:2px 6px;border-radius:4px;
  background:rgba(255,230,0,.1);border:1px solid rgba(255,230,0,.3);color:var(--c2);display:none;
}
.x2-badge.show{display:inline-block;}
.mult-row{display:flex;gap:6px;margin-bottom:10px;}
.mult-btn{
  flex:1;padding:8px 4px;border-radius:9px;text-align:center;cursor:pointer;
  font-family:'Orbitron',monospace;font-size:.55rem;font-weight:700;letter-spacing:.06em;
  border:1px solid var(--muted);color:var(--muted);background:transparent;transition:all .2s;
}
.mult-btn.on{border-color:var(--c1);color:var(--c1);box-shadow:0 0 12px rgba(255,45,120,.2);background:rgba(255,45,120,.08);}
.sep-line{height:1px;background:rgba(255,255,255,.06);margin:10px 0;}

/* ── 시작 버튼 ── */
.btn-start{
  width:100%;padding:15px;border-radius:12px;
  font-family:'Orbitron',monospace;font-size:.85rem;font-weight:900;letter-spacing:.18em;color:var(--bg);
  background:linear-gradient(135deg,var(--c0),var(--c3));border:none;cursor:pointer;
  position:relative;overflow:hidden;transition:all .2s;
  box-shadow:0 4px 28px rgba(0,240,255,.3);
}
.btn-start::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.2),transparent);opacity:0;transition:opacity .2s;}
.btn-start:hover::before{opacity:1;}
.btn-start:active{transform:scale(.98);}
.btn-start.stop{background:linear-gradient(135deg,var(--c1),#b8005a);box-shadow:0 4px 28px rgba(255,45,120,.3);}
.btn-start.enh-mode{background:linear-gradient(135deg,var(--c1),var(--c3));box-shadow:0 4px 28px rgba(255,45,120,.3);}

/* ── 토스트 ── */
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);
  background:rgba(4,5,13,.95);border:1px solid var(--c0);
  padding:9px 18px;border-radius:999px;
  font-family:'Orbitron',monospace;font-size:.62rem;font-weight:700;letter-spacing:.08em;color:var(--c0);
  box-shadow:0 0 20px rgba(0,240,255,.2);opacity:0;pointer-events:none;
  transition:opacity .18s ease,transform .18s ease;white-space:nowrap;z-index:500;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.bad{border-color:var(--c1);color:var(--c1);box-shadow:0 0 20px rgba(255,45,120,.2);}
.toast.good{border-color:var(--c4);color:var(--c4);box-shadow:0 0 20px rgba(0,255,157,.2);}
.toast.warn{border-color:var(--c2);color:var(--c2);box-shadow:0 0 20px rgba(255,230,0,.2);}

/* ── 결과 모달 ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:16px;z-index:400;}
.overlay.show{display:flex;}
.modal{background:rgba(6,8,20,.97);border:1px solid var(--c0);border-radius:18px;padding:20px;width:min(480px,100%);position:relative;overflow:hidden;}
.modal::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--c0),var(--c3),var(--c1),transparent);}
.modal-title{font-family:'Orbitron',monospace;font-size:1rem;font-weight:900;letter-spacing:.12em;color:var(--c0);margin-bottom:14px;text-align:center;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.result-cell{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px;}
.result-cell .rl{font-family:'Orbitron',monospace;font-size:.42rem;letter-spacing:.1em;color:var(--muted);margin-bottom:3px;}
.result-cell .rv{font-family:'Orbitron',monospace;font-size:1rem;font-weight:700;color:var(--text);}
.result-cell.hi{border-color:var(--c0);background:rgba(0,240,255,.05);}
.result-cell.hi .rv{color:var(--c0);}
.modal-reward{text-align:center;padding:14px;border-radius:12px;margin-bottom:14px;background:linear-gradient(135deg,rgba(0,240,255,.08),rgba(123,47,255,.08));border:1px solid rgba(0,240,255,.2);}
.reward-num{
  font-family:'Orbitron',monospace;font-size:2.2rem;font-weight:900;
  background:linear-gradient(90deg,var(--c0),var(--c3));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 12px rgba(0,240,255,.4));
}
.reward-label{font-family:'Orbitron',monospace;font-size:.5rem;letter-spacing:.15em;color:var(--muted);margin-top:2px;}
.modal-btns{display:flex;gap:8px;}
.mbtn{flex:1;padding:11px;border-radius:10px;font-family:'Orbitron',monospace;font-size:.6rem;font-weight:700;letter-spacing:.1em;cursor:pointer;border:none;transition:all .2s;}
.mbtn.primary{background:linear-gradient(135deg,var(--c0),var(--c3));color:var(--bg);box-shadow:0 4px 18px rgba(0,240,255,.25);}
.mbtn.secondary{background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--muted);}
.mbtn:active{transform:scale(.97);}
/* user picks row */
.user-picks-row{display:flex;gap:5px;flex-wrap:wrap;min-height:0;padding:0 2px;margin-bottom:4px;}
.user-picks-row:not(:empty){min-height:32px;padding:6px 8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;}
.up-chip{font-size:20px;transition:transform .2s;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;}
.up-chip.ok{background:rgba(0,255,157,.12);border:1px solid rgba(0,255,157,.3);animation:upPop .3s ease;}
.up-chip.bad{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);text-decoration:line-through;animation:upPop .3s ease;}
@keyframes upPop{from{transform:scale(0);opacity:0;}to{transform:scale(1);opacity:1;}}
.up-result{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;margin-left:auto;}
.up-result.win{background:rgba(0,255,157,.15);color:#00ff9d;border:1px solid rgba(0,255,157,.3);}
.up-result.lose{background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.3);}

/* ══════════════ 라이트모드 ══════════════ */
body.light{--bg:#f0f1f3;--panel:rgba(255,255,255,.95);--text:#1a1a1a;--text2:#3a4555;--border:rgba(0,0,0,.1);}
body.light{background:var(--bg);color:var(--text);}
body.light #topBar{background:rgba(255,255,255,.97);border-color:var(--border);}
body.light #topBarHomeBtn{background:rgba(168,85,247,.08);border-color:rgba(168,85,247,.2);color:var(--text);}
body.light #topBarTitle{color:#7c3aed;}
body.light #topBarBal{background:rgba(245,158,11,.06);border-color:rgba(245,158,11,.2);color:#b45309;}
body.light #topBarPoint{background:rgba(168,85,247,.06);border-color:rgba(168,85,247,.2);color:#7c3aed;}
body.light .card{background:var(--panel);border-color:var(--border);box-shadow:0 2px 6px rgba(0,0,0,.06);}
body.light .card.flipped{border-color:rgba(168,85,247,.3);}
body.light .hud{background:rgba(0,0,0,.04);border-color:var(--border);}
body.light .bet-btn{background:rgba(0,0,0,.05);border-color:rgba(0,0,0,.12);color:var(--text2);}
body.light .bet-btn.active{border-color:#7c3aed;background:rgba(124,58,237,.08);color:#7c3aed;}
body.light .result-overlay{background:rgba(255,255,255,.92);}
body.light .result-box{background:rgba(255,255,255,.98);border-color:var(--border);color:var(--text);}
body.light .modal-bg{background:rgba(0,0,0,.4);}
body.light .modal-box{background:rgba(255,255,255,.98);border-color:var(--border);}
body.light .hint-text{color:var(--text2);}
body.light .scanline{display:none;}
body.light .mode-tab{background:rgba(0,0,0,.03);border-color:rgba(0,0,0,.1);color:var(--text2);}
body.light .mode-tab.tab-basic.on{background:rgba(0,200,230,.06);border-color:rgba(0,200,230,.3);color:#0891b2;}
body.light .mode-tab.tab-enh.on{background:rgba(220,40,100,.06);border-color:rgba(220,40,100,.3);color:#be185d;}
body.light .stage{background:rgba(255,255,255,.95);border-color:rgba(0,0,0,.1);}
body.light .stage-phase{background:rgba(0,0,0,.04);border-color:rgba(0,0,0,.15);color:var(--text);}
body.light .bet-btn{background:rgba(0,0,0,.05);border-color:rgba(0,0,0,.12);color:var(--text2);}
body.light .bet-btn.active{border-color:#7c3aed;background:rgba(124,58,237,.08);color:#7c3aed;}
body.light .wrap{background:var(--bg);}
body.light .round-info{color:var(--text);}
body.light .score-panel{background:rgba(0,0,0,.03);border-color:var(--border);}
.light-toggle{background:none;border:1px solid var(--border);color:var(--text2);font-size:13px;width:28px;height:28px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

</style>
</head>
<body>
<script>if(localStorage.getItem('ORACLE_LIGHT')!=='0')document.body.classList.add('light');</script>
<div id="topBar">
  <button id="topBarHomeBtn" onclick="goHome()">🏠</button>
  <span id="topBarTitle">🧠 기억력</span>
  <button type="button" class="light-toggle" id="lightToggle" onclick="toggleLight()">🌙</button>
  <div class="tb-spacer"></div>
  <div id="topBarBal">💰 <span id="topBarBalNum">0</span></div>
  <div id="topBarPoint">🪙 <span id="topBarPointNum">0</span>P</div>
  <button id="topBarCharge" onclick="requestCharge()">충전</button>
</div>
<div class="scanline"></div>
<div class="wrap">

  <div class="hdr">
    <div class="hdr-title">기억력 테스트</div>
    <div class="hdr-sub">시퀀스 암기 · 순서대로 선택</div>
  </div>

  <div class="mode-tabs">
    <div class="mode-tab tab-basic on" id="tabBasic" onclick="switchMode('basic')">◈ 기본 모드</div>
    <div class="mode-tab tab-enh" id="tabEnh" onclick="switchMode('enhanced')">⚡ 강화 모드</div>
  </div>

  <div class="statbar">
    <div class="stat"><div class="stat-label">남은 시간</div><div class="stat-val" id="timeVal">--</div></div>
    <div class="stat"><div class="stat-label">진행</div><div class="stat-val" id="progVal">0/0</div></div>
    <div class="stat"><div class="stat-label">잔고</div><div class="stat-val" id="balVal" style="font-size:.65rem">--</div></div>
    <div class="stat"><div class="stat-label">포인트</div><div class="stat-val" id="ptVal">--</div></div>
    <div class="stat"><div class="stat-label">입장료</div><div class="stat-val" id="entryCostLabel" style="font-size:.6rem">100,000</div></div>
  </div>

  <div class="stage" id="stage">
    <div class="stage-hdr">
      <span class="stage-phase" id="phaseTag">대기</span>
      <div id="enhBadges" class="enh-badges" style="display:none">
        <span class="ebadge round">라운드 <span id="roundNum">1</span></span>
        <span class="ebadge streak">연속 ×<span id="streakNum">0</span></span>
        <span class="ebadge noise" id="noiseBadge" style="display:none">노이즈</span>
        <span class="ebadge dual" id="dualBadge" style="display:none">듀얼</span>
      </div>
      <div class="lives" id="livesRow" style="display:none">
        <span class="heart" id="h0">❤️</span>
        <span class="heart" id="h1">❤️</span>
        <span class="heart" id="h2">❤️</span>
      </div>
    </div>

    <div class="timebar-wrap">
      <div class="timebar-bg"><div class="timebar-fill" id="timebar" style="width:0%"></div></div>
    </div>

    <!-- 듀얼 모드용 컨테이너 (평소엔 숨김) -->
    <div id="dualContainer" class="dual-container" style="display:none"></div>

    <!-- 일반 시퀀스 + 카드 -->
    <div class="user-picks-row" id="userPicksRow"></div>
    <div class="seq-row" id="seqRow"></div>
    <div class="card-grid" id="cardGrid"></div>
  </div>

  <!-- 옵션 패널 -->
  <div class="opts">
    <!-- 기본모드 -->
    <div id="basicOpts">
      <div class="opts-row" style="margin-bottom:10px;">
        <select id="diffSel">
          <option value="easy">쉬움 · 6개 · 25초</option>
          <option value="normal" selected>보통 · 8개 · 22초</option>
          <option value="hard">어려움 · 10개 · 20초</option>
        </select>
        <select id="cardTypeSel" onchange="setCardType('basic',this.value)">
          <option value="emoji">이모지</option>
          <option value="colornum">색깔+숫자</option>
        </select>
      </div>
      <div class="opts-row">
        <span class="opt-lbl">역순</span>
        <button class="tog" id="togRev" onclick="toggleOpt('rev')">꺼짐</button>
        <span class="x2-badge" id="x2Rev">×2 보상</span>
      </div>
    </div>

    <!-- 강화모드 -->
    <div id="enhOpts" style="display:none">
      <div class="mult-row">
        <div class="mult-btn on" id="m1" onclick="setMult(1)">×1</div>
        <div class="mult-btn" id="m2" onclick="setMult(2)">×2</div>
        <div class="mult-btn" id="m3" onclick="setMult(3)">×3</div>
      </div>
      <div class="opts-row" style="margin-bottom:10px;">
        <select id="diffSelE">
          <option value="easy">쉬움</option>
          <option value="normal" selected>보통</option>
          <option value="hard">어려움</option>
        </select>
        <select id="cardTypeSelE" onchange="setCardType('enh',this.value)">
          <option value="emoji">이모지</option>
          <option value="colornum">색깔+숫자</option>
        </select>
      </div>
      <div class="opts-row">
        <span class="opt-lbl">역순</span>
        <button class="tog" id="togRevE" onclick="toggleOpt('revE')">꺼짐</button>
        <span class="x2-badge" id="x2RevE">×2 보상</span>
      </div>
      <div class="sep-line"></div>
      <!-- 강화 메커닉 토글 -->
      <div class="opts-row" style="gap:6px;">
        <span class="opt-lbl">페이드</span>
        <button class="tog on" id="togFade" onclick="toggleOpt('fade')">켜짐</button>
        <span class="opt-lbl" style="margin-left:4px;">노이즈</span>
        <button class="tog on" id="togNoise" onclick="toggleOpt('noise')">켜짐</button>
        <span class="opt-lbl" style="margin-left:4px;">듀얼</span>
        <button class="tog on" id="togDual" onclick="toggleOpt('dual')">켜짐</button>
      </div>
    </div>
  </div>

  <button class="btn-start" id="btnStart">▶ 시작</button>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-title" id="mTitle">결과</div>
    <div class="result-grid" id="resultGrid"></div>
    <div class="modal-reward">
      <div class="reward-num" id="rewardNum">0P</div>
      <div class="reward-label">포인트 지급</div>
    </div>
    <div class="modal-btns">
      <button class="mbtn primary" id="mOk">확인</button>
      <button class="mbtn secondary" id="mClose">닫기</button>
    </div>
  </div>
</div>

<script>
/* ── topBar 단축표기 ── */
function fmtTopBar(n){n=Math.floor(n||0);return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(0)+'K':n.toLocaleString('ko-KR');}
(() => {
  // ── 통신 ──
  let points=parseInt(localStorage.getItem("MG_POINTS")||"0")||0,balance=parseInt(localStorage.getItem("MG_BAL_MEMORY")||"0")||0,atmosphereScore=60,aiTier="NORMAL";
  let pendingSpend=null;
  const ALLOWED=[window.location.origin,'null'];
  function trusted(o){return ALLOWED.includes(o)||o===window.location.origin;}
  function post(p){ /* iframe 제거 — postMessage 비활성화 */ }

  // tier별 입장료 배율 (index와 동일)
  const TIER_ENTRY_MULT_DISPLAY={RELAXED:0,NORMAL:1,TENSE:1.5,HOSTILE:2};
  function updateTier(){
    const s=atmosphereScore;
    if(s>=80)aiTier="RELAXED";
    else if(s>=60)aiTier="NORMAL";
    else if(s>=20)aiTier="TENSE";
    else aiTier="HOSTILE";
    updateEntryCostUI();
  }
  function updateEntryCostUI(){
    const el=document.getElementById("entryCostLabel");
    if(!el)return;
    const mult=TIER_ENTRY_MULT_DISPLAY[aiTier]??1;
    if(mult===0)       el.textContent="0 (EASY 면제)";
    else if(mult!==1)  el.textContent=`${(ENTRY*mult).toLocaleString('ko-KR')} (×${mult} 패널티)`;
    else               el.textContent=ENTRY.toLocaleString('ko-KR');
  }

  function renderMeta(){
    document.getElementById("ptVal").textContent=points??'--';
    const b=balance??0;
    document.getElementById("balVal").textContent=b>=10000?'₩'+(b/10000).toFixed(0)+'만':'₩'+b.toLocaleString('ko-KR');
    const tb=document.getElementById("topBarBalNum");
    const tp=document.getElementById("topBarPointNum");
    if(tb) tb.textContent=fmtTopBar(b);
    if(tp) tp.textContent=fmtTopBar(points);
  }

  const ENTRY=100000;
  function reqSpend(amt,cb){
    // localStorage 직접 차감 (iframe 제거)
    if(balance >= amt){
      balance -= amt;
      localStorage.setItem("MG_BAL_MEMORY", String(Math.max(0,balance)));
      renderMeta();
      if(cb) cb(true, amt, balance, amt);
    } else {
      if(cb) cb(false, 0, balance, amt);
    }
  }

  window.addEventListener("message",ev=>{
    if(!trusted(ev.origin))return;
    const d=ev.data||{};
    if(d.type==="INIT"){
      points =Number.isFinite(d.points)?d.points:(points||0);
      balance=Number.isFinite(d.balance)?d.balance:(balance||0);
      if(d.aiProfile&&Number.isFinite(d.aiProfile.atmosphereScore))atmosphereScore=d.aiProfile.atmosphereScore;
      else if(Number.isFinite(d.atmosphereScore))atmosphereScore=d.atmosphereScore;
      // document.body.classList.add('in-iframe'); — iframe 제거됨
      updateTier();renderMeta();toast("연동 완료 ✅","good");return;
    }
    if(d.type==="AI_PROFILE"&&d.profile){
      if(Number.isFinite(d.profile.atmosphereScore))atmosphereScore=d.profile.atmosphereScore;
      updateTier();renderMeta();return;
    }
    if(d.type==="CHARGE"){
      if(Number.isFinite(d.amount))balance=Math.max(0,(balance||0)+d.amount);
      renderMeta();return;
    }
    if(d.type==="BALANCE_UPDATE"){
      if(Number.isFinite(d.balance))balance=d.balance;
      renderMeta();return;
    }
    if(d.type==="POINT_UPDATE"){
      if(Number.isFinite(d.points))points=d.points;
      if(Number.isFinite(d.balance))balance=d.balance;
      renderMeta();return;
    }
    if(d.type==="SPEND_RESULT"){
      if(pendingSpend&&d.requestId===pendingSpend.id){
        const cb=pendingSpend.cb;pendingSpend=null;
        const nb=Number.isFinite(d.balance)?d.balance:balance;
        if(typeof cb==="function")cb(!!d.ok,Number(d.spent||0),nb,Number(d.need||0));
      }
      if(Number.isFinite(d.points))points=d.points;
      if(Number.isFinite(d.balance))balance=d.balance;
      renderMeta();return;
    }
  });
  updateTier();renderMeta();

  // ── 토스트 ──
  const toastEl=document.getElementById("toast");
  let toastT=null;
  function toast(msg,type=""){
    toastEl.textContent=msg;
    toastEl.className="toast show"+(type?" "+type:"");
    clearTimeout(toastT);
    toastT=setTimeout(()=>toastEl.className="toast",1700);
  }

  // ── 모달 ──
  function openResult(title,cells,reward,okCharge=false){
    document.getElementById("mTitle").textContent=title;
    document.getElementById("rewardNum").textContent=reward+"P";
    document.getElementById("resultGrid").innerHTML=
      cells.map(([l,v,hi])=>`<div class="result-cell${hi?" hi":""}"><div class="rl">${l}</div><div class="rv">${v}</div></div>`).join("");
    const okBtn=document.getElementById("mOk");
    if(okCharge){
      okBtn.textContent="💳 충전하기";
      okBtn._chargeMode=true;
    } else {
      okBtn.textContent="확인";
      okBtn._chargeMode=false;
    }
    document.getElementById("overlay").classList.add("show");
  }
  function closeModal(){document.getElementById("overlay").classList.remove("show");}
  document.getElementById("mOk").addEventListener("click",()=>{
    const btn=document.getElementById("mOk");
    if(btn._chargeMode){closeModal();requestCharge();}
    else closeModal();
  });
  document.getElementById("mClose").addEventListener("click",closeModal);

  // ── 카드 풀 ──
  const EmojiPool=[
    {id:"tap",emoji:"👆"},{id:"snap",emoji:"🤌"},{id:"wave",emoji:"👋"},
    {id:"ok",emoji:"👌"},{id:"rock",emoji:"✊"},{id:"peace",emoji:"✌️"},
    {id:"clap",emoji:"👏"},{id:"think",emoji:"🤔"},{id:"run",emoji:"🏃"},
    {id:"star",emoji:"⭐"},{id:"heart",emoji:"❤️"},{id:"bolt",emoji:"⚡"},
    {id:"moon",emoji:"🌙"},{id:"sun",emoji:"☀️"},{id:"fire",emoji:"🔥"},
    {id:"gem",emoji:"💎"},{id:"skull",emoji:"💀"},{id:"eye",emoji:"👁️"},
  ];
  const ColorNumPool=[
    {id:"r1",emoji:"🔴",bg:"rgba(239,68,68,.12)"},{id:"r2",emoji:"🔴",bg:"rgba(239,68,68,.12)"},
    {id:"b1",emoji:"🔵",bg:"rgba(59,130,246,.12)"},{id:"b2",emoji:"🔵",bg:"rgba(59,130,246,.12)"},
    {id:"g1",emoji:"🟢",bg:"rgba(34,197,94,.12)"}, {id:"g2",emoji:"🟢",bg:"rgba(34,197,94,.12)"},
    {id:"y1",emoji:"🟡",bg:"rgba(251,191,36,.12)"},{id:"y2",emoji:"🟡",bg:"rgba(251,191,36,.12)"},
    {id:"p1",emoji:"🟣",bg:"rgba(168,85,247,.12)"},{id:"p2",emoji:"🟣",bg:"rgba(168,85,247,.12)"},
    {id:"n1",emoji:"①",isNum:true},{id:"n2",emoji:"②",isNum:true},
    {id:"n3",emoji:"③",isNum:true},{id:"n4",emoji:"④",isNum:true},
    {id:"n5",emoji:"⑤",isNum:true},{id:"n6",emoji:"⑥",isNum:true},
  ];

  // ── 옵션 상태 ──
  let mode="basic",mult=1;
  let revBasic=false,revEnh=false;
  let ctBasic="emoji",ctEnh="emoji";
  let optFade=true,optNoise=true,optDual=true;

  function getPool(){return(mode==="basic"?ctBasic:ctEnh)==="colornum"?ColorNumPool:EmojiPool;}
  function isRev(){return mode==="basic"?revBasic:revEnh;}
  function getDiffSel(){return document.getElementById(mode==="basic"?"diffSel":"diffSelE");}
  function getDiffConfig(){
    const v=getDiffSel().value;
    const randLen=3+Math.floor(Math.random()*3); // 3,4,5 랜덤
    if(v==="easy") return{baseLen:randLen,timeLimit:25,showMs:700};
    if(v==="hard") return{baseLen:randLen,timeLimit:20,showMs:560};
    return               {baseLen:randLen,timeLimit:22,showMs:650};
  }

  function setCardType(m,v){if(m==="basic")ctBasic=v;else ctEnh=v;}
  function setMult(n){
    mult=n;
    [1,2,3].forEach(i=>document.getElementById("m"+i).className="mult-btn"+(i===n?" on":""));
  }
  function toggleOpt(k){
    const map={
      rev:   ["togRev",  ()=>{revBasic=!revBasic;return revBasic;}, "x2Rev"],
      revE:  ["togRevE", ()=>{revEnh=!revEnh;return revEnh;},       "x2RevE"],
      fade:  ["togFade",  ()=>{optFade=!optFade;return optFade;}],
      noise: ["togNoise", ()=>{optNoise=!optNoise;return optNoise;}],
      dual:  ["togDual",  ()=>{optDual=!optDual;return optDual;}],
    };
    const [btnId,toggle,badgeId]=map[k];
    const on=toggle();
    const btn=document.getElementById(btnId);
    btn.textContent=on?"켜짐":"꺼짐";
    btn.className="tog"+(on?" on":"");
    if(badgeId){document.getElementById(badgeId).className="x2-badge"+(on?" show":"");}
  }

  function switchMode(m){
    if(G.running){toast("게임 진행 중","warn");return;}
    mode=m;
    const isE=m==="enhanced";
    document.getElementById("tabBasic").className="mode-tab tab-basic"+(m==="basic"?" on":"");
    document.getElementById("tabEnh").className  ="mode-tab tab-enh"  +(m==="enhanced"?" on":"");
    document.getElementById("basicOpts").style.display=isE?"none":"";
    document.getElementById("enhOpts").style.display  =isE?"":"none";
    document.getElementById("enhBadges").style.display=isE?"":"none";
    document.getElementById("livesRow").style.display =isE?"":"none";
    document.getElementById("stage").className="stage"+(isE?" mode-enh":"");
    document.getElementById("btnStart").className="btn-start"+(isE?" enh-mode":"");
    resetUI();
  }

  // ── DOM ──
  const stageEl =document.getElementById("stage");
  const phaseTag=document.getElementById("phaseTag");
  const timeVal =document.getElementById("timeVal");
  const progVal =document.getElementById("progVal");
  const timebar =document.getElementById("timebar");
  const seqRow  =document.getElementById("seqRow");
  const cardGrid=document.getElementById("cardGrid");
  const btnStart=document.getElementById("btnStart");
  const dualCont=document.getElementById("dualContainer");

  // ── 게임 상태 ──
  const G={
    running:false,phase:"idle",
    length:8,showMs:650,gapMs:120,timeLimit:22,
    t:0,seq:[],answerSeq:[],fullSeq:[],
    orderIndex:0,correct:0,wrong:0,
    timer:null,fadeTimer:null,lock:false,
    round:1,lives:3,streak:0,lastAllClear:false,
    // 이번 라운드 메커닉
    mechFade:false,mechNoise:false,mechDual:false,
    // 듀얼
    dualSeqs:[],dualChosenIdx:-1,
  };

  function setPhase(p){
    G.phase=p;
    const labels={show:"암기 중",input:"선택하세요",end:"완료",idle:"대기",dual:"시퀀스 선택"};
    phaseTag.textContent=labels[p]||"대기";
    phaseTag.className="stage-phase"
      +(p==="input"?" input-phase":p==="end"?" end-phase":p==="dual"?" dual-phase":"");
  }

  function resetUI(){
    seqRow.innerHTML="";cardGrid.innerHTML="";dualCont.innerHTML="";
    clearUserPicks();
    dualCont.style.display="none";seqRow.style.display="";cardGrid.style.display="";
    timebar.style.width="0%";timebar.className="timebar-fill";
    progVal.textContent="0/0";timeVal.textContent="--";timeVal.className="stat-val";
    stageEl.classList.remove("danger-anim");
    clearInterval(G.timer);G.timer=null;
    clearInterval(G.fadeTimer);G.fadeTimer=null;
    setPhase("idle");
    updLives(3);
    document.getElementById("roundNum").textContent="1";
    document.getElementById("streakNum").textContent="0";
    document.getElementById("noiseBadge").style.display="none";
    document.getElementById("dualBadge").style.display="none";
    btnStart.textContent="▶ 시작";
    btnStart.className="btn-start"+(mode==="enhanced"?" enh-mode":"");
  }

  function updLives(n){
    G.lives=n;
    for(let i=0;i<3;i++)document.getElementById("h"+i).className="heart"+(i<n?"":" lost");
  }

  function shuffle(arr){
    const a=arr.slice();
    for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
    return a;
  }

  // ── 시퀀스 칩 빌드 ──
  function buildChips(seq,container){
    const c=container||seqRow;
    c.innerHTML="";
    seq.forEach(it=>{
      const d=document.createElement("div");
      d.className="chip"+(it.isNum?" num":"");
      if(it.bg)d.style.background=it.bg;
      d.textContent=it.emoji;
      c.appendChild(d);
    });
  }

  // ── 시퀀스 플래시 ──
  async function flashSeq(seq,container){
    setPhase("show");
    const chips=Array.from((container||seqRow).querySelectorAll(".chip"));
    for(let i=0;i<seq.length;i++){
      if(!G.running)return;
      chips.forEach(c=>c.classList.remove("lit"));
      chips[i].classList.add("lit");
      timebar.style.width=`${Math.round(((i+1)/seq.length)*100)}%`;
      if(i===seq.length-1)post({type:"MG_ATMO_DELTA",delta:+1,source:"memory",meta:{phase:"show_end"}});
      await new Promise(r=>setTimeout(r,G.showMs));
      chips[i].classList.remove("lit");
      await new Promise(r=>setTimeout(r,G.gapMs));
    }
    timebar.style.width="0%";
  }

  // ══════════════════════════════
  //  ② 페이드아웃 메커닉
  //  선택 단계에서 카드가 시간에 따라 점점 투명해짐
  // ══════════════════════════════
  function startFade(){
    if(!G.mechFade)return;
    // timeLimit의 40% 지점부터 페이드 시작, 80% 지점에서 거의 안 보임
    clearInterval(G.fadeTimer);
    G.fadeTimer=setInterval(()=>{
      if(!G.running||G.phase!=="input"){clearInterval(G.fadeTimer);return;}
      const ratio=G.t/G.timeLimit; // 1→0
      // 0.6이하부터 fade 시작
      if(ratio<0.6){
        const fadeRatio=(ratio/0.6); // 1→0 as time runs out
        const opacity=Math.max(0.08, fadeRatio*fadeRatio); // 제곱으로 급격히
        Array.from(cardGrid.querySelectorAll(".ccard:not(.ok):not(.lock)"))
          .forEach(b=>{b.style.opacity=String(opacity);});
      }
    },100);
  }

  // ══════════════════════════════
  //  ④ 추가 카드 생성
  //  선택 카드 풀을 8개로 채우기 위한 비정답 카드
  // ══════════════════════════════
  function makeExtraCards(seq,pool,count){
    const usedIds=new Set(seq.map(x=>x.id));
    const avail=pool.filter(x=>!usedIds.has(x.id));
    return shuffle(avail).slice(0,count);
  }

  // ══════════════════════════════
  //  카드 그리드 빌드 (정답 + 추가 카드)
  // ══════════════════════════════
  function buildCards(seq,extraCards=[]){
    setPhase("input");
    G.answerSeq=isRev()?seq.slice().reverse():seq.slice();
    G.orderIndex=0;

    // [FIX] 선택 단계에서 시퀀스 칩 내용 숨기기 (정답 힌트 노출 방지)
    Array.from(seqRow.querySelectorAll(".chip")).forEach(c=>{c.textContent="?";});

    const allCards=shuffle([...seq,...extraCards]);
    const cols=Math.min(5,Math.max(3,Math.ceil(allCards.length/2)));
    cardGrid.style.gridTemplateColumns=`repeat(${cols},1fr)`;
    cardGrid.innerHTML="";
    allCards.forEach(it=>{
      const b=document.createElement("div");
      b.className="ccard"+(it.isNum?" num":"");
      if(it.bg)b.style.background=it.bg;
      b.textContent=it.emoji;
      b.dataset.id=it.id;
      b.addEventListener("click",()=>onPick(b,it));
      cardGrid.appendChild(b);
    });
    startFade();
  }

  // ── 선택 처리 ──
  const userPicksRow=document.getElementById("userPicksRow");
  function appendUserPick(item,isOk){
    const chip=document.createElement("span");
    chip.className="up-chip "+(isOk?"ok":"bad");
    chip.textContent=item.em||item.label||"?";
    userPicksRow.appendChild(chip);
  }
  function showPickResult(isWin,text){
    const tag=document.createElement("span");
    tag.className="up-result "+(isWin?"win":"lose");
    tag.textContent=text;
    userPicksRow.appendChild(tag);
  }
  function clearUserPicks(){ userPicksRow.innerHTML=""; }

  function onPick(btn,item){
    if(!G.running||G.phase!=="input"||G.lock)return;

    // ── 순서 무관 모드 (기본모드) ──
    if(G.orderFree){
      const matched=G.answerSeq.find((x,i)=>x.id===item.id&&!G._freeMatched?.has(i));
      if(matched){
        if(!G._freeMatched)G._freeMatched=new Set();
        const idx=G.answerSeq.indexOf(matched);
        G._freeMatched.add(idx);
        btn.style.opacity="1";
        btn.classList.add("ok","lock");
        if(navigator.vibrate)navigator.vibrate(15);
        const chips=seqRow.querySelectorAll(".chip");
        if(chips[idx])chips[idx].textContent=item.emoji;
        appendUserPick(item,true);
        G.correct++;
        progVal.textContent=`${G.correct}/${G.answerSeq.length}`;
        post({type:"MG_ATMO_DELTA",delta:+1,source:"memory",meta:{pick:"ok"}});
        if(G.correct>=G.answerSeq.length){
          clearInterval(G.fadeTimer);
          finish(true);
        }
      } else {
        G.wrong++;G.t=Math.max(0,G.t-1.5);G.lock=true;
        if(navigator.vibrate)navigator.vibrate([40,30,40]);
        appendUserPick(item,false);
        post({type:"MG_ATMO_DELTA",delta:-1,source:"memory",meta:{pick:"bad"}});
        btn.classList.add("bad");
        toast("✗ 틀렸어요","bad");
        if(mode==="enhanced"){
          G.streak=0;document.getElementById("streakNum").textContent="0";
          updLives(G.lives-1);
          if(G.lives<=0){setTimeout(()=>finishEnh(false),300);return;}
        }
        setTimeout(()=>{btn.classList.remove("bad");G.lock=false;},280);
      }
      return;
    }

    // ── 순서 모드 (강화모드) ──
    const exp=G.answerSeq[G.orderIndex];
    if(!exp)return;
    if(item.id===exp.id){
      btn.style.opacity="1";
      btn.classList.add("ok","lock");
      if(navigator.vibrate)navigator.vibrate(15);
      const chips=seqRow.querySelectorAll(".chip");
      const revealIdx=isRev()?(G.answerSeq.length-1-G.orderIndex):G.orderIndex;
      if(chips[revealIdx])chips[revealIdx].textContent=item.emoji;
      appendUserPick(item,true);
      G.correct++;G.orderIndex++;
      progVal.textContent=`${G.orderIndex}/${G.answerSeq.length}`;
      post({type:"MG_ATMO_DELTA",delta:+1,source:"memory",meta:{pick:"ok"}});
      if(G.orderIndex>=G.answerSeq.length){
        clearInterval(G.fadeTimer);
        if(mode==="enhanced")roundClear();else finish(true);
      }
    } else {
      G.wrong++;G.t=Math.max(0,G.t-1.5);G.lock=true;
      if(navigator.vibrate)navigator.vibrate([40,30,40]);
      appendUserPick(item,false);
      post({type:"MG_ATMO_DELTA",delta:-1,source:"memory",meta:{pick:"bad"}});
      btn.classList.add("bad");
      toast("✗ 틀렸어요","bad");
      if(mode==="enhanced"){
        G.streak=0;document.getElementById("streakNum").textContent="0";
        updLives(G.lives-1);
        if(G.lives<=0){setTimeout(()=>finishEnh(false),300);return;}
      }
      setTimeout(()=>{btn.classList.remove("bad");G.lock=false;},280);
    }
  }

  // ── 타이머 ──
  function startTimer(){
    timeVal.className="stat-val";
    timebar.className="timebar-fill";
    stageEl.classList.remove("danger-anim");
    clearInterval(G.timer);
    G.timer=setInterval(()=>{
      if(!G.running||(G.phase!=="input"&&G.phase!=="dual"))return;
      G.t=Math.max(0,G.t-0.05);
      const r=G.t/G.timeLimit;
      timeVal.textContent=G.t.toFixed(1)+"s";
      timebar.style.width=`${Math.round(r*100)}%`;
      if(r<=0.25&&!stageEl.classList.contains("danger-anim")){
        stageEl.classList.add("danger-anim");
        timebar.className="timebar-fill danger";
        timeVal.className="stat-val danger";
        Array.from(cardGrid.querySelectorAll(".ccard:not(.ok):not(.lock)"))
          .forEach(b=>b.classList.add("shake"));
      }
      if(G.t<=0){
        clearInterval(G.timer);G.timer=null;
        clearInterval(G.fadeTimer);G.fadeTimer=null;
        stageEl.classList.remove("danger-anim");
        // dual 단계 타임아웃은 목숨 1 차감 후 처리
        if(G.phase==="dual"){
          if(mode==="enhanced"){
            G.streak=0;document.getElementById("streakNum").textContent="0";
            updLives(G.lives-1);
            if(G.lives<=0){finishEnh(false);}
            else{setTimeout(()=>{if(G.running)runRound();},800);}
          } else { finish(false); }
        } else {
          if(mode==="enhanced")finishEnh(false);else finish(false);
        }
      }
    },50);
  }

  // ══════════════════════════════
  //  ⑤ 듀얼 시퀀스 메커닉
  //  두 시퀀스를 동시에 보여주고, 어느 줄인지 선택 후 맞춤
  // ══════════════════════════════
  async function runDualPhase(pool){
    // 두 시퀀스 생성 (정답 / 정답과 겹치지 않는 카드로 구성한 페이크)
    const len=G.seq.length;
    const correctSeq=G.seq.slice();
    const usedIds=new Set(correctSeq.map(x=>x.id));
    const others=shuffle(pool.filter(x=>!usedIds.has(x.id)));
    // others가 len보다 부족하면 pool 전체에서 보충 (중복 id 허용)
    const fakeSeq=others.length>=len ? others.slice(0,len) : shuffle(pool.slice()).slice(0,len);

    // 어느 쪽이 정답인지 랜덤
    const correctIdx=Math.random()<0.5?0:1;
    G.dualSeqs=correctIdx===0?[correctSeq,fakeSeq]:[fakeSeq,correctSeq];
    G.dualCorrectIdx=correctIdx;
    G.dualChosenIdx=-1;

    // 듀얼 컨테이너 표시
    seqRow.style.display="none";
    cardGrid.style.display="none";
    dualCont.style.display="flex";
    dualCont.innerHTML="";

    // 각 시퀀스 행 렌더
    G.dualSeqs.forEach((seq,idx)=>{
      const row=document.createElement("div");
      row.className="dual-row";
      const lbl=document.createElement("div");
      lbl.className="dual-label";
      lbl.textContent=`시퀀스 ${String.fromCharCode(65+idx)}`;
      row.appendChild(lbl);
      const chips=document.createElement("div");
      chips.className="seq-row";
      buildChips(seq,chips);
      row.appendChild(chips);
      dualCont.appendChild(row);
    });

    setPhase("show");
    timebar.style.width="0%";

    // 두 시퀀스를 교대로 플래시
    const rows=Array.from(dualCont.querySelectorAll(".dual-row"));
    for(let i=0;i<len;i++){
      if(!G.running)return;
      for(let r=0;r<2;r++){
        const chips=Array.from(rows[r].querySelectorAll(".chip"));
        chips.forEach(c=>c.classList.remove("lit"));
        if(i<chips.length)chips[i].classList.add("lit");
      }
      timebar.style.width=`${Math.round(((i+1)/len)*100)}%`;
      await new Promise(r=>setTimeout(r,G.showMs));
      for(let r=0;r<2;r++){
        const chips=Array.from(rows[r].querySelectorAll(".chip"));
        chips.forEach(c=>c.classList.remove("lit"));
      }
      await new Promise(r=>setTimeout(r,G.gapMs));
    }
    timebar.style.width="0%";

    if(!G.running)return;

    // 선택 단계: 어느 시퀀스가 정답인지 고르게
    setPhase("dual");
    rows.forEach((row,idx)=>{
      row.classList.add("selectable");
      row.addEventListener("click",()=>onDualChoose(idx),{once:true});
    });
    // 듀얼도 타임리밋 (짧게)
    G.t=Math.min(G.timeLimit, 8);
    startTimer();
  }

  function onDualChoose(idx){
    if(!G.running||G.phase!=="dual")return;
    clearInterval(G.timer);G.timer=null;
    stageEl.classList.remove("danger-anim");
    G.dualChosenIdx=idx;

    const rows=Array.from(dualCont.querySelectorAll(".dual-row"));
    rows.forEach(r=>r.classList.remove("selectable"));

    if(idx===G.dualCorrectIdx){
      // 정답 시퀀스 선택 — 이제 카드 입력으로
      rows[idx].classList.add("chosen");
      toast("✓ 정답 시퀀스!","good");
      G.seq=G.dualSeqs[idx]; // 선택한 시퀀스로 고정

      setTimeout(()=>{
        if(!G.running)return;
        dualCont.style.display="none";
        seqRow.style.display="";
        cardGrid.style.display="";
        buildChips(G.seq);

        const pool=getPool();
        const noiseCount=G.mechNoise?Math.min(3,Math.floor(G.round/2)+1):0;
        const noiseCards=noiseCount>0?makeExtraCards(G.seq,pool,noiseCount):[];
        const FIXED_CARDS=8;
        const totalNow=G.seq.length+noiseCards.length;
        const fillerCount=Math.max(0,FIXED_CARDS-totalNow);
        if(fillerCount>0){const fillers=makeExtraCards(G.seq,pool.filter(x=>!noiseCards.some(n=>n.id===x.id)),fillerCount);noiseCards.push(...fillers);}
        buildCards(G.seq,noiseCards);
        G.t=G.timeLimit;
        startTimer();
      },700);
    } else {
      // 틀린 시퀀스 선택
      rows[idx].classList.add("chosen-wrong");
      toast("✗ 틀린 시퀀스","bad");
      G.wrong+=G.seq.length; // 전부 틀린 것으로 처리
      post({type:"MG_ATMO_DELTA",delta:-2,source:"memory",meta:{pick:"wrong_dual"}});
      if(mode==="enhanced"){
        G.streak=0;document.getElementById("streakNum").textContent="0";
        updLives(G.lives-1);
        if(G.lives<=0){setTimeout(()=>finishEnh(false),600);return;}
        // 목숨 남아있으면 다음 라운드 계속
        setTimeout(()=>{if(G.running)runRound();},1000);
      } else {
        setTimeout(()=>finish(false),600);
      }
    }
  }

  // ════════════════════
  //  기본 모드
  // ════════════════════
  // 기본: 최대 5P, 역순 완전성공 ×2 (상한 5P 유지)
  function calcBasicReward(){
    if(G.correct<G.seq.length) return 0; // 전부 못 맞추면 0P
    const len=G.seq.length;
    return len<=3?2:len===4?3:4; // 3개=2P, 4개=3P, 5개=4P
  }

  function finish(cleared){
    if(!G.running)return;
    G.running=false;setPhase("end");
    clearInterval(G.timer);G.timer=null;
    clearInterval(G.fadeTimer);G.fadeTimer=null;
    stageEl.classList.remove("danger-anim");
    showPickResult(cleared, cleared ? "\u2713 \uc644\ub8cc!" : "\u2717 \uc2e4\ud328");
    const reward=calcBasicReward();
    const dAtmo=reward>=4?+3:reward>=2?+1:reward===0?-2:0;
    if(dAtmo)post({type:"MG_ATMO_DELTA",delta:dAtmo,source:"memory",meta:{reward}});
    if(reward>0)post({type:"EARN_POINTS",deltaPoints:reward,source:"memory",meta:{correct:G.correct,len:G.seq.length}});
    try{localStorage.setItem("MG_LAST_RESULT",JSON.stringify({gameId:"memory",correct:G.correct,len:G.seq.length,reward,pointDelta:reward,won:reward>0,ts:Date.now()}));}catch(e){}
    openResult(cleared?"클리어":"시간 초과",[
      ["정답",`${G.correct}/${G.seq.length}`,true],
      ["오답",String(G.wrong),false],
      ["남은 시간",G.t.toFixed(1)+"s",false],
      ["역순",(revBasic&&G.correct===G.seq.length)?"×2 보너스":"꺼짐",(revBasic&&G.correct===G.seq.length)],
    ],reward);
    toast(reward?`+${reward}P`:"다시 도전",reward?"good":"");
    btnStart.textContent="▶ 다시 시작";btnStart.className="btn-start";
  }

  async function startBasic(){
    const cfg=getDiffConfig();
    G.length=cfg.baseLen;G.timeLimit=cfg.timeLimit;G.showMs=cfg.showMs;
    G.mechFade=false;G.mechNoise=false;G.mechDual=false;
    G.orderFree=true; // 순서 무관 모드
    resetUI();
    G.running=true;G.correct=0;G.wrong=0;G.lock=false;G.t=G.timeLimit;
    progVal.textContent=`0/${G.length}`;
    const pool=getPool();
    G.seq=shuffle(pool.slice()).slice(0,G.length);
    buildChips(G.seq);
    await flashSeq(G.seq);
    if(!G.running)return;
    const FIXED_CARDS=8;
    const fillerCount=Math.max(0,FIXED_CARDS-G.seq.length);
    const fillers=fillerCount>0?makeExtraCards(G.seq,pool,fillerCount):[];
    buildCards(G.seq,fillers);
    G.t=G.timeLimit;startTimer();
  }

  // ════════════════════
  //  강화 모드
  // ════════════════════
  // 강화: 전부 맞추면 3개=3P, 4개=4P, 5개=5P, 실패=0P
  function calcEnhReward(){
    const cleared=G.round-1;
    if(cleared<=0) return 0;
    const len=G.seq.length;
    return len<=3?3:len===4?4:5;
  }

  // 라운드별 메커닉 결정
  // 라운드3부터 메커닉 등장, 우선순위: dual(보스) > noise > fade
  function decideMechanics(){
    const r=G.round;
    G.mechDual  = optDual  && r>0 && r%5===0;  // 5, 10, 15... 라운드 — 보스
    G.mechNoise = optNoise && !G.mechDual && r>=3 && r%2===0; // 짝수 라운드 (보스 제외)
    G.mechFade  = optFade  && r>=2; // 2라운드부터 항상
  }

  async function runRound(){
    if(!G.running)return;
    clearUserPicks();
    G.orderFree=false; // 강화모드는 순서 필수
    G._freeMatched=null;
    decideMechanics();

    // 배지 업데이트
    document.getElementById("noiseBadge").style.display=G.mechNoise?"":"none";
    document.getElementById("dualBadge").style.display=G.mechDual?"":"none";

    const cfg=getDiffConfig();
    const target=cfg.baseLen; // 3~5 랜덤 고정 (라운드 증가 없음)
    const pool=getPool();

    while(G.fullSeq.length<target){
      const used=new Set(G.fullSeq.map(x=>x.id));
      const avail=pool.filter(x=>!used.has(x.id));
      if(!avail.length)break;
      G.fullSeq.push(shuffle(avail)[0]);
    }
    G.seq=G.fullSeq.slice(0,target);
    G.correct=0;G.wrong=0;G.lock=false;G.orderIndex=0;G.lastAllClear=false;
    G.timeLimit=cfg.timeLimit+Math.floor((G.round-1)*1.5);
    G.showMs=cfg.showMs;
    G.t=G.timeLimit;
    progVal.textContent=`0/${G.seq.length}`;
    document.getElementById("roundNum").textContent=String(G.round);
    document.getElementById("streakNum").textContent=String(G.streak);

    if(G.mechDual){
      // ⑤ 듀얼 라운드
      toast(`⚡ 라운드 ${G.round} · 듀얼 모드`,"warn");
      await new Promise(r=>setTimeout(r,600));
      if(!G.running)return;
      await runDualPhase(pool);
    } else {
      // 일반 라운드
      buildChips(G.seq);
      await flashSeq(G.seq);
      if(!G.running)return;

      // ④ 노이즈 카드
      const noiseCount=G.mechNoise?Math.min(4,Math.floor(G.round/2)+1):0;
      const noiseCards=noiseCount>0?makeExtraCards(G.seq,pool,noiseCount):[];
      if(noiseCount>0)toast(`⚠ 카드 ${noiseCount}개 추가`,"warn");

      const FIXED_CARDS=8;
      const totalNow=G.seq.length+noiseCards.length;
      const fillerCount=Math.max(0,FIXED_CARDS-totalNow);
      if(fillerCount>0){const fillers=makeExtraCards(G.seq,pool.filter(x=>!noiseCards.some(n=>n.id===x.id)),fillerCount);noiseCards.push(...fillers);}
      buildCards(G.seq,noiseCards);
      G.t=G.timeLimit;startTimer();
    }
  }

  function roundClear(){
    clearInterval(G.timer);G.timer=null;
    clearInterval(G.fadeTimer);G.fadeTimer=null;
    stageEl.classList.remove("danger-anim");
    G.lastAllClear=true;G.streak++;
    document.getElementById("streakNum").textContent=String(G.streak);
    const bonus=G.streak%2===0&&G.streak>0;
    toast(bonus?"🔥 연속 보너스!":"✓ 라운드 클리어","good");
    setPhase("idle");
    G.round++;
    setTimeout(()=>{if(G.running)runRound();},1200);
  }

  function finishEnh(cleared){
    if(!G.running)return;
    G.running=false;setPhase("end");
    clearInterval(G.timer);G.timer=null;
    clearInterval(G.fadeTimer);G.fadeTimer=null;
    stageEl.classList.remove("danger-anim");
    showPickResult(cleared, cleared ? "\u2713 \uc644\ub8cc!" : "\u2717 \uc2e4\ud328");
    const reward=calcEnhReward();
    const cr=G.round-1;
    const dAtmo=reward>=7?+3:reward>=4?+1:reward===0?-2:0;
    if(dAtmo)post({type:"MG_ATMO_DELTA",delta:dAtmo,source:"memory",meta:{reward}});
    if(reward>0)post({type:"EARN_POINTS",deltaPoints:reward,source:"memory",meta:{rounds:cr,mult}});
    try{localStorage.setItem("MG_LAST_RESULT",JSON.stringify({gameId:"memory",correct:cr,len:cr,reward,pointDelta:reward,won:reward>0,ts:Date.now()}));}catch(e){}
    openResult("강화 모드 결과",[
      ["클리어 라운드",String(cr),true],
      ["연속 클리어",String(G.streak),false],
      ["남은 목숨",String(G.lives),false],
      ["배율","×"+mult,mult>1],
    ],reward);
    toast(reward?`+${reward}P`:"다시 도전",reward?"good":"");
    btnStart.textContent="▶ 다시 시작";
    btnStart.className="btn-start"+(mode==="enhanced"?" enh-mode":"");
  }

  async function startEnh(){
    resetUI();
    G.running=true;
    G.round=1;updLives(3);G.streak=0;
    G.fullSeq=[];G.lastAllClear=false;
    await runRound();
  }

  // ── 시작 버튼 ──
  btnStart.addEventListener("click",()=>{
    if(G.running){
      G.running=false;
      clearInterval(G.timer);G.timer=null;
      clearInterval(G.fadeTimer);G.fadeTimer=null;
      stageEl.classList.remove("danger-anim");
      resetUI();toast("중단됨","warn");return;
    }
    reqSpend(ENTRY,(ok,spent,newBal)=>{
      if(!ok){
        openResult("잔고 부족",[
          ["필요 금액","₩100,000",true],
          ["현재 잔고","₩"+newBal.toLocaleString('ko-KR'),false],
          ["상태","잔고 부족",false],["안내","충전이 필요해요",false],
        ],0,true);return;
      }
      toast("-₩"+spent.toLocaleString('ko-KR'),"warn");
      btnStart.textContent="■ 중단";btnStart.className="btn-start stop";
      if(navigator.vibrate)navigator.vibrate(40);
      if(mode==="enhanced")startEnh();else startBasic();
    });
  });

  function goHome(){sessionStorage.setItem("ORACLE_ENTRY",Date.now());window.location.href="mini_center.html";}
  function requestCharge(){sessionStorage.setItem("ORACLE_ENTRY",Date.now());window.location.href="mini_center.html?charge=memory";}
  // iframe 즉시 감지
  // if(window.self!==window.top){document.body.classList.add('in-iframe');} — iframe 제거됨

  resetUI();
})();

/* ── 라이트/다크 토글 ── */
function toggleLight(){
  var on=!document.body.classList.contains('light');
  document.body.classList.toggle('light',on);
  localStorage.setItem('ORACLE_LIGHT',on?'1':'0');
  var btn=document.getElementById('lightToggle');
  if(btn) btn.textContent=on?'🌙':'☀️';
}
(function(){var btn=document.getElementById('lightToggle');if(btn)btn.textContent=document.body.classList.contains('light')?'🌙':'☀️';})();

</script>
