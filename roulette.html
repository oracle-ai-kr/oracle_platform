<!DOCTYPE html>
<html lang="ko">
<head><script>
// ── ORACLE 토큰가드 ──
(function(){
  var t=sessionStorage.getItem('ORACLE_ENTRY');
  var ok=t&&(Date.now()-Number(t)<5000);
  if(ok) sessionStorage.removeItem('ORACLE_ENTRY');
  if(ok) return;
  function _show404(){
    document.body.style.cssText='margin:0;padding:0;overflow:hidden';
    Array.from(document.body.children).forEach(function(el){el.style.display='none'});
    var d=document.createElement('div');
    d.id='_oracle404';
    d.innerHTML='<div style="position:fixed;inset:0;z-index:999999;background:#0f1724;color:#e8eaf0;'
      +'font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;display:flex;align-items:center;'
      +'justify-content:center;text-align:center;padding:20px">'
      +'<div style="max-width:360px">'
      +'<div style="width:120px;height:120px;background:#fff;border-radius:50%;margin:0 auto 32px;'
      +'display:flex;align-items:center;justify-content:center">'
      +'<div style="width:72px;height:52px;border:3px solid #333;border-radius:6px;position:relative;'
      +'display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:24px;'
      +'font-weight:700;color:#d32f2f">404</div></div>'
      +'<h1 style="font-size:20px;font-weight:700;margin:0 0 12px">페이지를 찾을 수 없습니다.</h1>'
      +'<p style="font-size:14px;color:#8a91a0;line-height:1.6;margin:0 0 32px">'
      +'존재하지 않는 주소를 입력하셨거나,<br>'
      +'요청하신 페이지의 주소가 변경/삭제되어 찾을 수 없습니다.</p>'
      +'<a href="index.html" style="display:block;width:100%;padding:16px;background:#d32f2f;color:#fff;'
      +'font-size:16px;font-weight:700;border:none;border-radius:8px;cursor:pointer;text-decoration:none;'
      +'text-align:center">홈으로 이동</a>'
      +'</div></div>';
    document.body.appendChild(d);
  }
  if(document.body) _show404();
  else document.addEventListener('DOMContentLoaded', _show404);
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>룰렛</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080f;
  --panel:#0d0f1e;
  --panel2:#111428;
  --accent:#7c3aed;
  --accent2:#a855f7;
  --gold:#f59e0b;
  --gold2:#fbbf24;
  --text:#f1f5f9;
  --text2:#94a3b8;
  --text3:#64748b;
  --red:#ef4444;
  --green:#22c55e;
  --border:rgba(168,85,247,.22);
  --radius:16px;
  --h-bar:54px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  width:100%;min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:'Noto Sans KR',sans-serif;
  overflow-x:hidden;
}

/* ── topBar (단독 실행 시에만 표시) ── */
#topBar{
  position:fixed;top:0;left:0;right:0;
  height:var(--h-bar);z-index:100;
  background:rgba(7,8,15,.97);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 10px;gap:6px;
  backdrop-filter:blur(12px);
}
body.in-iframe #topBar{display:none!important;}
#homeBtn{
  width:36px;height:36px;
  background:rgba(168,85,247,.15);
  border:1px solid var(--border);border-radius:10px;
  color:var(--text);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
#gameTitle{
  font-family:'Bebas Neue',sans-serif;
  font-size:20px;letter-spacing:2px;
  color:var(--accent2);
}
.bar-spacer{flex:1;}
#balBox{
  background:rgba(245,158,11,.1);
  border:1px solid rgba(245,158,11,.28);
  border-radius:8px;padding:4px 8px;
  font-size:12px;color:var(--gold);font-weight:700;white-space:nowrap;
}
#pointBox{
  background:rgba(168,85,247,.15);
  border:1px solid rgba(168,85,247,.35);
  border-radius:8px;padding:4px 8px;
  font-size:12px;color:var(--accent2);font-weight:700;white-space:nowrap;
}
#chargeBtn{
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  border:none;border-radius:8px;color:#fff;
  font-size:12px;font-weight:700;padding:6px 10px;cursor:pointer;
  white-space:nowrap;flex-shrink:0;
}

/* ── 메인 레이아웃 ── */
.main{
  padding-top:calc(var(--h-bar) + 8px);
  padding-bottom:24px;
  width:100%;max-width:480px;margin:0 auto;
  display:flex;flex-direction:column;gap:10px;
  padding-left:10px;padding-right:10px;
}
body.in-iframe .main{padding-top:8px;}

/* ── 휠 섹션 ── */
.wheel-section{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:14px 12px 12px;
  display:flex;flex-direction:column;
  align-items:center;gap:10px;
}

/* 캔버스 — 반응형 */
canvas{
  border-radius:50%;
  box-shadow:
    0 0 0 6px rgba(168,85,247,.25),
    0 0 0 8px rgba(168,85,247,.12),
    0 0 40px rgba(124,58,237,.5),
    0 0 80px rgba(124,58,237,.2);
  display:block;
  width:min(260px, calc(100vw - 80px)) !important;
  height:min(260px, calc(100vw - 80px)) !important;
}

/* 포인터 — 휠 아래쪽 고정 */
.wheel-wrap{
  position:relative;
  display:inline-flex;
  flex-direction:column;
  align-items:center;
}
.pointer{
  font-size:26px;
  line-height:1;
  margin-top:-4px;
  filter:drop-shadow(0 0 8px rgba(168,85,247,.9));
}

/* 결과 영역 */
.result-row{
  width:100%;display:flex;align-items:center;
  gap:12px;padding:10px 14px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.06);
  border-radius:12px;
}
.r-num{
  font-family:'Bebas Neue',sans-serif;
  font-size:52px;line-height:1;
  min-width:52px;text-align:center;
  transition:color .3s;
}
.r-num.r-idle{color:var(--text3);}
.r-num.r-red  {color:#ef4444;text-shadow:0 0 20px rgba(239,68,68,.6);}
.r-num.r-black{color:#e2e8f0;text-shadow:0 0 20px rgba(255,255,255,.2);}
.r-num.r-green{color:#22c55e;text-shadow:0 0 20px rgba(34,197,94,.6);}
.r-detail{flex:1;display:flex;flex-direction:column;gap:3px;}
.r-badge{
  display:inline-block;
  font-size:10px;font-weight:700;letter-spacing:1px;
  padding:2px 8px;border-radius:20px;width:fit-content;
}
.r-badge.red  {background:rgba(239,68,68,.2);color:#f87171;border:1px solid rgba(239,68,68,.3);}
.r-badge.black{background:rgba(255,255,255,.08);color:#cbd5e1;border:1px solid rgba(255,255,255,.12);}
.r-badge.green{background:rgba(34,197,94,.2);color:#4ade80;border:1px solid rgba(34,197,94,.3);}
.r-msg{font-size:15px;font-weight:700;margin-top:2px;}

/* ── 히스토리 섹션 ── */
.history-section{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:12px 14px;
}
.history-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;
}
.history-title{font-size:12px;font-weight:700;color:var(--text2);letter-spacing:.5px;}
.streak-badge{
  font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;
}
.streak-badge.none  {background:rgba(255,255,255,.05);color:var(--text3);}
.streak-badge.red   {background:rgba(239,68,68,.2);color:#f87171;}
.streak-badge.black {background:rgba(255,255,255,.08);color:#94a3b8;}
.streak-badge.green {background:rgba(34,197,94,.2);color:#4ade80;}
.chips-row{
  display:flex;gap:5px;flex-wrap:wrap;min-height:28px;
  align-items:center;margin-bottom:8px;
}
.h-chip{
  width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:700;color:#fff;
  border:2px solid transparent;
}
.h-chip.red  {background:radial-gradient(circle at 35% 35%,#ef4444,#991b1b);border-color:rgba(239,68,68,.4);}
.h-chip.black{background:radial-gradient(circle at 35% 35%,#374151,#111827);border-color:rgba(255,255,255,.1);}
.h-chip.green{background:radial-gradient(circle at 35% 35%,#22c55e,#15803d);border-color:rgba(34,197,94,.4);}
.h-chip.animate{animation:chipIn .3s cubic-bezier(.34,1.56,.64,1) forwards;}
.h-chip.new {box-shadow:0 0 8px rgba(168,85,247,.6);}
@keyframes chipIn{
  from{transform:scale(0) rotate(-90deg);opacity:0;}
  to  {transform:scale(1) rotate(0);opacity:1;}
}
.ratio-row{display:flex;align-items:center;gap:8px;}
.ratio-bar{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.05);overflow:hidden;position:relative;}
.ratio-fill-red  {position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,#991b1b,#ef4444);border-radius:3px;transition:width .5s;}
.ratio-fill-black{position:absolute;right:0;top:0;height:100%;background:linear-gradient(90deg,#374151,#1e293b);border-radius:3px;transition:width .5s;}
.ratio-label{font-size:10px;font-weight:700;white-space:nowrap;}
.ratio-label.red  {color:#f87171;}
.ratio-label.black{color:#94a3b8;}

/* ── 베팅 패널 ── */
.bet-panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:14px;
  display:flex;flex-direction:column;gap:11px;
}
.bet-label{
  font-size:11px;color:var(--text2);
  font-weight:700;letter-spacing:1px;
}
.preset-row{display:flex;gap:6px;}
.preset-btn{
  flex:1;padding:9px 4px;
  background:rgba(124,58,237,.12);
  border:1px solid rgba(168,85,247,.2);
  border-radius:9px;color:var(--text);
  font-size:13px;font-weight:700;cursor:pointer;
  transition:all .15s;
}
.preset-btn:active{background:rgba(124,58,237,.3);transform:scale(.96);}
#betInput{
  width:100%;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  border-radius:10px;color:var(--text);
  font-size:14px;padding:10px 12px;
  outline:none;transition:border .2s;
}
#betInput:focus{border-color:var(--accent2);}
#betInput::placeholder{color:var(--text3);}
.bet-amt-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 12px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.06);
  border-radius:10px;
}
.bet-amt-row .lbl{font-size:12px;color:var(--text3);}
.bet-amt-row .val{font-size:15px;font-weight:700;color:var(--gold2);}
.divider{height:1px;background:rgba(255,255,255,.06);}

/* ── 존 탭 ── */
.zone-tabs{
  display:flex;gap:6px;
  background:rgba(0,0,0,.2);
  border-radius:10px;padding:4px;
}
.zone-tab{
  flex:1;padding:7px;
  background:transparent;border:none;
  border-radius:8px;color:var(--text2);
  font-size:13px;font-weight:700;cursor:pointer;
  transition:all .2s;
}
.zone-tab.active{
  background:rgba(124,58,237,.35);
  color:#fff;
  box-shadow:0 0 10px rgba(124,58,237,.3);
}
.zone-panel{display:none;}
.zone-panel.show{display:block;}
.zone-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.zone-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;}

.zone-btn{
  padding:13px 6px;border-radius:11px;
  border:2px solid transparent;
  color:#fff;font-size:13px;font-weight:700;
  cursor:pointer;transition:all .2s;
  text-align:center;line-height:1.3;
  position:relative;overflow:hidden;
}
.zone-btn::after{
  content:'';position:absolute;inset:0;
  background:rgba(255,255,255,0);transition:background .15s;
}
.zone-btn:active::after{background:rgba(255,255,255,.12);}
.zone-btn.selected{
  border-color:#fff;
  box-shadow:0 0 0 1px rgba(255,255,255,.3), 0 0 16px rgba(255,255,255,.15);
}
.zone-btn.selected::before{
  content:'✓';position:absolute;top:4px;right:6px;
  font-size:10px;opacity:.7;
}
.odds-badge{
  display:block;font-size:10px;
  opacity:.65;margin-top:2px;font-weight:400;
}

/* 존 색상 */
.zone-red  {background:linear-gradient(135deg,#991b1b,#ef4444);}
.zone-black{background:linear-gradient(135deg,#1e293b,#374151);}
.zone-odd  {background:linear-gradient(135deg,#4c1d95,#7c3aed);}
.zone-even {background:linear-gradient(135deg,#065f46,#059669);}
.zone-low  {background:linear-gradient(135deg,#92400e,#d97706);}
.zone-high {background:linear-gradient(135deg,#1e3a8a,#2563eb);}
.zone-d1   {background:linear-gradient(135deg,#7c3aed,#a855f7);}
.zone-d2   {background:linear-gradient(135deg,#0369a1,#0ea5e9);}
.zone-d3   {background:linear-gradient(135deg,#be185d,#ec4899);}
.zone-c1   {background:linear-gradient(135deg,#854d0e,#ca8a04);}
.zone-c2   {background:linear-gradient(135deg,#065f46,#16a34a);}
.zone-c3   {background:linear-gradient(135deg,#7f1d1d,#dc2626);}

/* ── 멀티 베팅 칩 트레이 ── */
.bet-tray{display:flex;flex-wrap:wrap;gap:6px;min-height:0;transition:min-height .2s;}
.bet-tray:not(:empty){min-height:36px;padding:8px 0 2px;}
.bet-chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:5px 10px;border-radius:20px;
  font-size:11px;font-weight:700;color:#fff;
  animation:chipIn .3s cubic-bezier(.34,1.56,.64,1) forwards;
  cursor:pointer;position:relative;
}
.bet-chip::after{content:'✕';margin-left:3px;font-size:9px;opacity:.6;}
.bet-chip:active{transform:scale(.92);}
.bet-chip.c-red  {background:linear-gradient(135deg,#991b1b,#ef4444);}
.bet-chip.c-black{background:linear-gradient(135deg,#1e293b,#475569);}
.bet-chip.c-odd  {background:linear-gradient(135deg,#4c1d95,#7c3aed);}
.bet-chip.c-even {background:linear-gradient(135deg,#065f46,#059669);}
.bet-chip.c-low  {background:linear-gradient(135deg,#92400e,#d97706);}
.bet-chip.c-high {background:linear-gradient(135deg,#1e3a8a,#2563eb);}
.bet-chip.c-d1   {background:linear-gradient(135deg,#7c3aed,#a855f7);}
.bet-chip.c-d2   {background:linear-gradient(135deg,#0369a1,#0ea5e9);}
.bet-chip.c-d3   {background:linear-gradient(135deg,#be185d,#ec4899);}
.bet-chip.c-c1   {background:linear-gradient(135deg,#854d0e,#ca8a04);}
.bet-chip.c-c2   {background:linear-gradient(135deg,#065f46,#16a34a);}
.bet-chip.c-c3   {background:linear-gradient(135deg,#7f1d1d,#dc2626);}
.total-bet-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:6px 12px;background:rgba(245,158,11,.06);
  border:1px solid rgba(245,158,11,.15);border-radius:10px;
  font-size:12px;font-weight:700;
}
.total-bet-row .lbl{color:var(--text3);}
.total-bet-row .val{color:var(--gold2);font-size:14px;}
.zone-btn.has-bet{border-color:var(--gold2);box-shadow:0 0 12px rgba(245,158,11,.25);}
.zone-btn.has-bet::before{
  content:attr(data-bet-label);position:absolute;top:3px;right:5px;
  font-size:9px;color:var(--gold2);opacity:.9;
}

/* ── 스핀 버튼 ── */
.spin-btn{
  width:100%;padding:15px;
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  border:none;border-radius:13px;
  color:#fff;font-family:'Bebas Neue',sans-serif;
  font-size:22px;letter-spacing:3px;
  cursor:pointer;transition:all .2s;
  box-shadow:0 4px 20px rgba(124,58,237,.4);
  position:relative;overflow:hidden;
}
.spin-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.15),transparent);
  opacity:0;transition:opacity .2s;
}
.spin-btn:hover::before{opacity:1;}
.spin-btn:active{transform:scale(.98);}
.spin-btn:disabled{
  background:rgba(255,255,255,.07);
  box-shadow:none;color:var(--text3);cursor:not-allowed;
}

/* ── AI 멘트 ── */
.ai-box{
  background:rgba(124,58,237,.08);
  border:1px solid rgba(168,85,247,.2);
  border-radius:var(--radius);
  padding:11px 14px;
  font-size:13px;color:var(--text2);display:none;
}
.ai-box.show{display:block;}

/* ── 토스트 ── */
#toast{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(60px);
  background:rgba(7,8,15,.97);
  border:1px solid rgba(168,85,247,.3);
  border-radius:24px;padding:10px 22px;
  font-size:13px;color:var(--accent2);
  font-weight:700;letter-spacing:.5px;
  z-index:999;opacity:0;transition:.3s;
  pointer-events:none;white-space:nowrap;
  box-shadow:0 8px 30px rgba(0,0,0,.6);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── WIN 이펙트 ── */
#winOverlay{
  position:fixed;inset:0;z-index:400;
  pointer-events:none;opacity:0;
}
#winOverlay.flash{animation:overlayFlash .55s ease forwards;}
@keyframes overlayFlash{
  0%  {opacity:0;background:radial-gradient(ellipse at 50% 40%,rgba(168,85,247,.4),transparent 70%);}
  25% {opacity:1;}
  100%{opacity:0;}
}
.coin-particle{
  position:fixed;font-size:20px;pointer-events:none;z-index:450;
  animation:coinFly var(--dur,1.1s) ease-in var(--delay,0s) forwards;opacity:0;
}
@keyframes coinFly{
  0%  {transform:translate(0,0) rotate(0deg) scale(1.2);opacity:1;}
  60% {opacity:1;}
  100%{transform:translate(var(--tx,0px),var(--ty,280px)) rotate(var(--rot,540deg)) scale(.4);opacity:0;}
}
@keyframes numPop{
  0%  {transform:scale(.4);opacity:0;}
  65% {transform:scale(1.2);}
  100%{transform:scale(1);opacity:1;}
}
.r-num.pop {animation:numPop .35s ease forwards;}
@keyframes megaPop{
  0%  {transform:scale(.2);opacity:0;filter:blur(6px);}
  55% {transform:scale(1.3);filter:blur(0);}
  80% {transform:scale(.95);}
  100%{transform:scale(1);opacity:1;}
}
.r-num.mega{animation:megaPop .5s cubic-bezier(.34,1.56,.64,1) forwards;}
@keyframes spinGlow{
  0%,100%{box-shadow:0 0 0 6px rgba(168,85,247,.25),0 0 0 8px rgba(168,85,247,.12),0 0 40px rgba(124,58,237,.5),0 0 80px rgba(124,58,237,.2);}
  50%    {box-shadow:0 0 0 6px rgba(239,68,68,.6),0 0 0 10px rgba(239,68,68,.2),0 0 40px rgba(239,68,68,.7),0 0 80px rgba(239,68,68,.3);}
}
canvas.spinning{animation:spinGlow .8s ease-in-out infinite;}
@keyframes winPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(168,85,247,0);}
  50%    {box-shadow:0 0 0 6px rgba(168,85,247,.4),0 0 40px rgba(168,85,247,.3);}
}
.wheel-section.win-flash{animation:winPulse .6s ease 2;}
@keyframes slideUp{
  from{transform:translateY(10px);opacity:0;}
  to  {transform:translateY(0);opacity:1;}
}
.win-msg-anim{animation:slideUp .3s ease .15s both;}
</style>
</head>
<body>

<div id="winOverlay"></div>

<div id="topBar">
  <button id="homeBtn" onclick="goHome()">🏠</button>
  <span id="gameTitle">🎡 ROULETTE</span>
  <div class="bar-spacer"></div>
  <div id="balBox">💰 <span id="balNum">0</span></div>
  <div id="pointBox">🪙 <span id="pointNum">0</span>P</div>
  <button id="chargeBtn" onclick="requestCharge()">충전</button>
</div>

<div class="main">

  <!-- 휠 -->
  <div class="wheel-section" id="wheelSection">
    <div class="wheel-wrap">
      <canvas id="wheel" width="280" height="280"></canvas>
      <div class="pointer">▲</div>
    </div>
    <div class="result-row">
      <div class="r-num r-idle" id="resultNum">—</div>
      <div class="r-detail" id="resultDetail">

<script>
/* ── 상수 ── */
const BAL_KEY  = 'MG_BAL_ROULETTE';
const HIST_KEY = 'MG_ROULETTE_HIST';
const WHEEL_NUMS = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
const RED_NUMS   = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
const ALL_ZONES  = ['red','black','odd','even','low','high','d1','d2','d3','c1','c2','c3'];

/* ── 상태 ── */
let balance=0, points=0, betAmount=0, selectedZone='', spinning=false;
let bets=[]; // 멀티 베팅: [{zone, amount}]
let aiProfile={tier:'NORMAL',mood:50,atmosphereScore:100};
let currentAngle=0;
let historyArr=[];

/* ── 캔버스 ── */
const canvas = document.getElementById('wheel');
const ctx    = canvas.getContext('2d');

function getW(){ return canvas.width; }
function getR(){ return canvas.width/2 - 4; }

/* 볼 상태 */
let ballAngle = 0;
let ballRadius = 0;
let showBall = false;
let highlightIdx = -1; // 당첨 슬롯 하이라이트 인덱스

function drawWheel(angle){
  const W = getW(), R = getR();
  ctx.clearRect(0,0,W,W);
  const slice = 2*Math.PI / WHEEL_NUMS.length;
  WHEEL_NUMS.forEach((n,i)=>{
    const a = angle + i*slice;
    ctx.beginPath();
    ctx.moveTo(W/2,W/2);
    ctx.arc(W/2,W/2,R,a,a+slice);
    ctx.closePath();
    if(n===0)              ctx.fillStyle='#16a34a';
    else if(RED_NUMS.has(n)) ctx.fillStyle='#b91c1c';
    else                   ctx.fillStyle='#0f0f1e';
    ctx.fill();

    /* 당첨 슬롯 하이라이트 */
    if(i===highlightIdx){
      ctx.beginPath();
      ctx.moveTo(W/2,W/2);
      ctx.arc(W/2,W/2,R,a,a+slice);
      ctx.closePath();
      ctx.fillStyle='rgba(255,255,255,.45)';
      ctx.fill();
    }

    ctx.strokeStyle='rgba(255,255,255,.12)';
    ctx.lineWidth=1; ctx.stroke();

    ctx.save();
    ctx.translate(W/2,W/2);
    ctx.rotate(a + slice/2);
    ctx.translate(R-20,0);
    ctx.rotate(Math.PI/2);
    ctx.fillStyle='#fff';
    ctx.font='bold 9px sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(n,0,0);
    ctx.restore();
  });

  /* 바깥 트랙 링 */
  ctx.beginPath();
  ctx.arc(W/2,W/2,R+1,0,2*Math.PI);
  ctx.strokeStyle='rgba(168,85,247,.3)';
  ctx.lineWidth=4; ctx.stroke();

  /* 중앙 원 */
  ctx.beginPath();
  ctx.arc(W/2,W/2,16,0,2*Math.PI);
  ctx.fillStyle='#07080f'; ctx.fill();
  ctx.strokeStyle='rgba(168,85,247,.5)';
  ctx.lineWidth=2; ctx.stroke();
  /* 중앙 점 */
  ctx.beginPath();
  ctx.arc(W/2,W/2,5,0,2*Math.PI);
  ctx.fillStyle='#a855f7'; ctx.fill();

  /* 볼 */
  if(showBall){
    const bx = W/2 + Math.cos(ballAngle) * ballRadius;
    const by = W/2 + Math.sin(ballAngle) * ballRadius;
    /* 볼 그림자 */
    ctx.beginPath();
    ctx.arc(bx+1.5, by+1.5, 7, 0, 2*Math.PI);
    ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fill();
    /* 볼 본체 */
    ctx.beginPath();
    ctx.arc(bx, by, 7, 0, 2*Math.PI);
    const grad = ctx.createRadialGradient(bx-2,by-2,1,bx,by,7);
    grad.addColorStop(0,'#ffffff');
    grad.addColorStop(0.4,'#e2e8f0');
    grad.addColorStop(1,'#94a3b8');
    ctx.fillStyle=grad; ctx.fill();
    /* 볼 하이라이트 */
    ctx.beginPath();
    ctx.arc(bx-2, by-2, 2.5, 0, 2*Math.PI);
    ctx.fillStyle='rgba(255,255,255,.8)'; ctx.fill();
  }
}
/* ── 캔버스 반응형 크기 ── */
function resizeCanvas(){
  if(spinning) return;
  const size = Math.min(260, window.innerWidth - 80);
  canvas.width  = size;
  canvas.height = size;
  drawWheel(currentAngle);
}
window.addEventListener('resize', resizeCanvas);

/* ── 히스토리 ── */
function loadHistory(){
  try{ historyArr=JSON.parse(localStorage.getItem(HIST_KEY)||'[]'); }catch(e){ historyArr=[]; }
  renderHistory();
}
function saveHistory(){ localStorage.setItem(HIST_KEY,JSON.stringify(historyArr)); }
function pushHistory(num){
  const ck = num===0?'green':RED_NUMS.has(num)?'red':'black';
  historyArr.unshift({num,ck});
  if(historyArr.length>20) historyArr.pop();
  saveHistory();
  renderHistory(true);
}
function renderHistory(animFirst=false){
  const row   = document.getElementById('chipsRow');
  const badge = document.getElementById('streakBadge');
  if(!historyArr.length){
    row.innerHTML='<span style="color:var(--text3);font-size:11px;">결과 대기 중...</span>';
    badge.className='streak-badge none'; badge.textContent='—';
    updateRatioBar(); return;
  }
  row.innerHTML = historyArr.map((h,i)=>{
    const cls = (i===0&&animFirst)?`h-chip ${h.ck} animate new`:`h-chip ${h.ck}`;
    return `<div class="${cls}">${h.num}</div>`;
  }).join('');
  /* 스트릭 */
  const first=historyArr[0].ck;
  if(first==='green'){
    badge.className='streak-badge green'; badge.textContent='🟢 0 GREEN';
  } else {
    let cnt=0;
    for(const h of historyArr){ if(h.ck===first)cnt++;else break; }
    const em=first==='red'?'🔴':'⚫';
    badge.className=`streak-badge ${first}`;
    badge.textContent=`${em} ${first.toUpperCase()} ${cnt}연속`;
  }
  updateRatioBar();
}
function updateRatioBar(){
  const reds   = historyArr.filter(h=>h.ck==='red').length;
  const blacks = historyArr.filter(h=>h.ck==='black').length;
  const total  = reds+blacks||1;
  document.getElementById('ratioFillRed').style.width   = (reds/total*100)+'%';
  document.getElementById('ratioFillBlack').style.width = (blacks/total*100)+'%';
  document.getElementById('ratioRedLabel').textContent   = 'R '+reds;
  document.getElementById('ratioBlackLabel').textContent = 'B '+blacks;
}

/* ── 탭 ── */
function switchTab(tab){

  ['basic','dozen','column'].forEach(t=>{

/* ── 존 선택 → 멀티 베팅 추가 ── */
const ZONE_LABELS={red:'🔴 레드',black:'⚫ 블랙',odd:'홀수',even:'짝수',low:'1~18',high:'19~36',d1:'1st12',d2:'2nd12',d3:'3rd12',c1:'COL1',c2:'COL2',c3:'COL3'};
function selectZone(z){
  if(spinning) return;
  if(betAmount<1000){ showToast('베팅액을 먼저 입력하세요 (최소 1,000원)'); return; }
  const totalBet=bets.reduce((s,b)=>s+b.amount,0);
  if(totalBet+betAmount>balance){ showToast('잔액 부족! 총 베팅이 잔액을 초과합니다'); return; }
  // 같은 존에 이미 베팅이 있으면 추가 적립
  const exist=bets.find(b=>b.zone===z);
  if(exist){ exist.amount+=betAmount; }
  else{ bets.push({zone:z, amount:betAmount}); }
  renderBetTray();
  updateZoneBtnStates();
  updateSpinBtn();
}
function removeBet(zone){
  if(spinning) return;
  bets=bets.filter(b=>b.zone!==zone);
  renderBetTray();
  updateZoneBtnStates();
  updateSpinBtn();
}
function renderBetTray(){
  const tray=document.getElementById('betTray');
  tray.innerHTML=bets.map(b=>
    `<span class="bet-chip c-${b.zone}" onclick="removeBet('${b.zone}')">${ZONE_LABELS[b.zone]} ₩${b.amount.toLocaleString('ko-KR')}</span>`
  ).join('');
  const totalRow=document.getElementById('totalBetRow');
  const total=bets.reduce((s,b)=>s+b.amount,0);
  if(bets.length>0){
    totalRow.style.display='flex';
    document.getElementById('totalBetDisplay').textContent='₩ '+total.toLocaleString('ko-KR');
  }else{
    totalRow.style.display='none';
  }
}
function updateZoneBtnStates(){
  ALL_ZONES.forEach(id=>{
    const el=document.getElementById('z-'+id);
    if(!el)return;
    const bet=bets.find(b=>b.zone===id);
    if(bet){
      el.classList.add('has-bet');
      el.setAttribute('data-bet-label','₩'+bet.amount.toLocaleString('ko-KR'));
    }else{
      el.classList.remove('has-bet');
      el.removeAttribute('data-bet-label');
    }
    el.classList.remove('selected'); // 선택 하이라이트 제거
  });
}
function clearAllBets(){
  bets=[];
  renderBetTray();
  updateZoneBtnStates();
  updateSpinBtn();
}

/* ── 배당 ── */
function getOdds(zone){ return ['d1','d2','d3','c1','c2','c3'].includes(zone)?2.7:1.9; }

/* ── 베팅 ── */
function setBet(v){
  if(balance<=0){ showToast('잔액이 없습니다. 충전하세요'); return; }
  betAmount=Math.min(Math.max(v,0),balance);
  document.getElementById('betInput').value=betAmount||'';
  updateBetDisplay(); updateSpinBtn();
}
function setBetPct(p){
  const v=Math.floor(balance*p/100);
  if(v<1000){ showToast('잔액이 부족합니다'); return; }
  setBet(v);
}
function onBetInput(){
  betAmount=Math.max(0,Math.min(parseInt(document.getElementById('betInput').value)||0, balance));
  updateBetDisplay(); updateSpinBtn();
}
function updateBetDisplay(){ document.getElementById('betDisplay').textContent='₩ '+(betAmount?betAmount.toLocaleString('ko-KR'):'0'); }
function updateSpinBtn(){
  const totalBet=bets.reduce((s,b)=>s+b.amount,0);
  const ok=bets.length>0&&totalBet<=balance&&!spinning;
  document.getElementById('spinBtn').disabled=!ok;
  document.getElementById('spinBtn').textContent=bets.length>0?`🎡 SPIN (${bets.length}건)`:'🎡 SPIN';
}

/* ── 존 조건 ── */
function checkZone(n,zone){
  if(n===0) return false;
  if(zone==='red')   return RED_NUMS.has(n);
  if(zone==='black') return !RED_NUMS.has(n) && n!==0;
  if(zone==='odd')   return n%2===1;
  if(zone==='even')  return n%2===0 && n!==0;
  if(zone==='low')   return n>=1&&n<=18;
  if(zone==='high')  return n>=19&&n<=36;
  if(zone==='d1')    return n>=1&&n<=12;
  if(zone==='d2')    return n>=13&&n<=24;
  if(zone==='d3')    return n>=25&&n<=36;
  if(zone==='c1')    return n%3===1;
  if(zone==='c2')    return n%3===2;
  if(zone==='c3')    return n%3===0;
  return false;
}

/* ── AI 편향 ── */
function applyBias(idx){
  if(bets.length===0) return idx;
  const bias={EASY:0,NORMAL:0.08,HARD:0.18,EXTREME:0.32}[aiProfile.tier||'NORMAL']||0;
  if(Math.random()<bias){
    // 모든 베팅 존에서 지는 숫자를 찾음
    const losers=WHEEL_NUMS.map((n,i)=>({n,i})).filter(({n})=>!bets.some(b=>checkZone(n,b.zone)));
    if(losers.length) return losers[Math.floor(Math.random()*losers.length)].i;
  }
  return idx;
}

/* ── 스핀 ── */
function doSpin(){
  if(spinning) return;
  const totalBet=bets.reduce((s,b)=>s+b.amount,0);
  if(bets.length===0){ showToast('베팅 존을 선택하세요'); return; }
  if(totalBet>balance){ showToast('잔액이 부족합니다'); return; }
  spinning=true;
  if(navigator.vibrate)navigator.vibrate(30);
  balance-=totalBet; saveBal(); updateBalUI(); updateSpinBtn();

  let resultIdx=Math.floor(Math.random()*WHEEL_NUMS.length);
  resultIdx=applyBias(resultIdx);

  const PI2        = 2*Math.PI;
  const sliceAngle = PI2 / WHEEL_NUMS.length;
  const dur        = 8500 + Math.random()*2000;

  /* currentAngle 누적 오차 제거 — 매 스핀마다 0~2π로 정규화 */
  currentAngle = ((currentAngle % PI2) + PI2) % PI2;

  /*
   * 포인터 ▲ = 6시 방향 = π/2
   * resultIdx 슬롯 중심이 포인터에 오는 finalAngle:
   *   finalAngle + resultIdx*slice + slice/2 ≡ π/2 (mod 2π)
   *   => finalAngle = π/2 - resultIdx*slice - slice/2
   */
  const POINTER    = Math.PI / 2;
  const finalAngle = ((POINTER - resultIdx*sliceAngle - sliceAngle/2) % PI2 + PI2) % PI2;

  /* 현재→최종 시계방향 delta (항상 양수, 최소 한 바퀴 보장) */
  let delta = finalAngle - currentAngle;
  if(delta <= 0) delta += PI2;

  /* 정수 바퀴 + delta → 최종 위치 오차 없음 */
  const totalTurns  = 10 + Math.floor(Math.random()*5);
  const wheelTarget = totalTurns * PI2 + delta;
  const startAngle  = currentAngle;

  /* 볼 */
  const R          = getR();
  const TRACK_R        = R - 2;
  const POCKET_R       = R - 22;
  const ballTurns      = 9 + Math.floor(Math.random()*5);
  const ballStartAngle = Math.PI / 2;
  const ballTarget     = -(ballTurns * PI2);

  showBall   = true;
  ballAngle  = ballStartAngle;
  ballRadius = TRACK_R;
  canvas.classList.add('spinning');

  const startTime = performance.now();
  let lastBounceSign = 1; // 바운스 cos 부호 추적용

  function frame(now){
    const elapsed  = now - startTime;
    const progress = Math.min(elapsed/dur, 1);
    const ease     = 1 - Math.pow(1-progress, 4);

    currentAngle = startAngle + wheelTarget * ease;

    const ballEase = 1 - Math.pow(1-progress, 3);
    ballAngle = ballStartAngle + ballTarget * ballEase;

    if(progress < 0.75){
      ballRadius = TRACK_R;
    } else {
      const drop = (progress - 0.75) / 0.25;
      /* 감쇠 진동: e^(-k*t) * cos(ω*t) 형태로 자연스럽게 튕기며 안착 */
      const k = 6;   // 감쇠 계수 (클수록 빨리 죽음)
      const w = 18;  // 진동 주파수
      const cosVal = Math.cos(w * drop);
      const bounce = Math.exp(-k * drop) * cosVal * (TRACK_R - POCKET_R) * 0.35;
      ballRadius = POCKET_R + (TRACK_R - POCKET_R) * (1 - drop) + bounce;

      /* 틱틱 진동 — cos 부호가 바뀔 때마다 (공이 포켓 벽에 튕김) */
      const curSign = cosVal >= 0 ? 1 : -1;
      if(curSign !== lastBounceSign){
        lastBounceSign = curSign;
        const intensity = Math.exp(-k * drop); // 감쇠에 비례해서 점점 약하게
        if(intensity > 0.05 && navigator.vibrate){
          navigator.vibrate(Math.max(8, Math.round(25 * intensity)));
        }
      }
    }

    drawWheel(currentAngle);

    if(progress < 1){
      requestAnimationFrame(frame);
    } else {
      /* 정확히 고정 */
      currentAngle = finalAngle;
      ballRadius   = POCKET_R;
      ballAngle    = ballStartAngle;
      drawWheel(currentAngle);
      canvas.classList.remove('spinning');
      spinning = false;
      showBall = false;
      if(navigator.vibrate)navigator.vibrate([50,30,80]);
      showResult(WHEEL_NUMS[resultIdx]);
      updateSpinBtn();
    }
  }
  requestAnimationFrame(frame);
}

/* ── WIN 이펙트 ── */
function triggerWinEffects(odds){
  /* 오버레이 플래시 */
  const ov=document.getElementById('winOverlay');
  ov.classList.remove('flash'); void ov.offsetWidth; ov.classList.add('flash');
  /* 섹션 펄스 */
  const ws=document.getElementById('wheelSection');
  ws.classList.remove('win-flash'); void ws.offsetWidth; ws.classList.add('win-flash');
  setTimeout(()=>ws.classList.remove('win-flash'),1300);
  /* 코인 파티클 */
  const count=odds>=2.7?20:13;
  const emojis=['🪙','💜','✨','⭐','🌟'];
  const cx=window.innerWidth/2, cy=window.innerHeight*0.3;
  for(let i=0;i<count;i++){
    const el=document.createElement('div');
    el.className='coin-particle';
    const tx=(Math.random()-.5)*260;
    const ty=160+Math.random()*200;
    const rot=(Math.random()-.5)*800;
    const dur=.85+Math.random()*.7;
    const delay=Math.random()*.35;
    el.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    el.style.cssText=`left:${cx+(Math.random()-.5)*60}px;top:${cy}px;--tx:${tx}px;--ty:${ty}px;--rot:${rot}deg;--dur:${dur}s;--delay:${delay}s;`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),(dur+delay)*1000+100);
  }
}

/* ── 결과 표시 ── */
function showResult(num){
  const isGreen=num===0;
  const isRed=RED_NUMS.has(num);
  const ck=isGreen?'green':isRed?'red':'black';
  const cl=isGreen?'GREEN':isRed?'RED':'BLACK';
  const numEl=document.getElementById('resultNum');
  numEl.textContent=num;

  /* 당첨 슬롯 하이라이트 — 1.2초간 깜빡 (이전 타이머 있으면 먼저 정리) */
  const idx = WHEEL_NUMS.indexOf(num);
  if(idx>=0){
    if(window._blinkTimer){ clearInterval(window._blinkTimer); highlightIdx=-1; }
    let blink=0;
    window._blinkTimer=setInterval(()=>{
      highlightIdx = highlightIdx===idx ? -1 : idx;
      drawWheel(currentAngle);
      if(++blink>=6){
        clearInterval(window._blinkTimer);
        window._blinkTimer=null;
        highlightIdx=-1;
        drawWheel(currentAngle);
      }
    },200);
  }

  /* 멀티 베팅 결산 */
  const totalBet=bets.reduce((s,b)=>s+b.amount,0);
  let totalPayout=0;
  const results=[];
  for(const b of bets){
    const win=checkZone(num,b.zone);
    const odds=getOdds(b.zone);
    const p=win?Math.floor(b.amount*odds):0;
    totalPayout+=p;
    results.push({zone:b.zone, win, payout:p, amount:b.amount, odds});
  }
  const anyWin=totalPayout>0;
  const netProfit=totalPayout-totalBet;

  if(anyWin){
    balance+=totalPayout;
    numEl.className=`r-num r-${ck} mega`;
    setTimeout(()=>numEl.classList.remove('mega'),550);
    // 결과 상세 — 각 베팅별 결과 표시
    let detailHtml=`<span class="r-badge ${ck}">${cl}</span><div style="margin-top:4px;">`;
    for(const r of results){
      if(r.win) detailHtml+=`<div class="r-msg win-msg-anim" style="color:var(--gold2);font-size:13px;">${ZONE_LABELS[r.zone]} 🎉 +₩${r.payout.toLocaleString('ko-KR')} <span style="font-size:10px;opacity:.7;">×${r.odds}</span></div>`;
      else detailHtml+=`<div class="r-msg" style="color:var(--text3);font-size:11px;">${ZONE_LABELS[r.zone]} ✗</div>`;
    }
    if(bets.length>1) detailHtml+=`<div style="margin-top:4px;font-size:14px;font-weight:700;color:${netProfit>=0?'var(--gold2)':'var(--red)'};">합계: ${netProfit>=0?'+':''}₩${netProfit.toLocaleString('ko-KR')}</div>`;
    detailHtml+='</div>';
    document.getElementById('resultDetail').innerHTML=detailHtml;
    triggerWinEffects(Math.max(...results.map(r=>r.odds)));
    if(navigator.vibrate)navigator.vibrate([80,40,80,40,150]);
  } else {
    numEl.className=`r-num r-${ck} pop`;
    setTimeout(()=>numEl.classList.remove('pop'),400);
    let detailHtml=`<span class="r-badge ${ck}">${cl}</span>`;
    detailHtml+=`<div class="r-msg" style="color:var(--text2);">😞 -₩${totalBet.toLocaleString('ko-KR')}</div>`;
    document.getElementById('resultDetail').innerHTML=detailHtml;
    if(navigator.vibrate)navigator.vibrate([30]);
  }

  saveBal(); updateBalUI();
  pushHistory(num);
  try{ window.parent.postMessage({type:'ATMOSPHERE',delta:anyWin?5:-8},window.location.origin); }catch(e){}
  try{ window.parent.postMessage({type:'GAME_OVER',gameId:'roulette',win:anyWin,payout:totalPayout,bet:totalBet},window.location.origin); }catch(e){}
  maybeShowAiMent(anyWin);
  // 베팅 초기화
  clearAllBets();
  betAmount=0;
  document.getElementById('betInput').value='';
  updateBetDisplay();
}

/* ── AI 멘트 ── */
const AI_MENTS={
  win: {EASY:['오, 이기셨네요!'],NORMAL:['잘 하셨네요.'],HARD:['흥, 운이 좋군.'],EXTREME:['...이번만이다.']},
  lose:{EASY:['다음엔 잘 되실 거예요!'],NORMAL:['아쉽군요.'],HARD:['예상된 결과.'],EXTREME:['당연하지.']}
};
function maybeShowAiMent(win){
  if(Math.random()>.55) return;
  const tier=aiProfile.tier||'NORMAL';
  const pool=(win?AI_MENTS.win:AI_MENTS.lose)[tier]||[];
  const box=document.getElementById('aiBox');
  box.textContent='🤖 '+pool[Math.floor(Math.random()*pool.length)];
  box.classList.add('show');
  setTimeout(()=>box.classList.remove('show'),4000);
}

/* ── 잔액 ── */
function loadBal(){
  balance=parseInt(localStorage.getItem(BAL_KEY)||'0')||0;
  updateBalUI();
}
function saveBal(){
  localStorage.setItem(BAL_KEY,balance);
  try{ window.parent.postMessage({type:'SAVE_BALANCE',balance},window.location.origin); }catch(e){}
}
function updateBalUI(){
  document.getElementById('balNum').textContent=balance.toLocaleString('ko-KR');
  document.getElementById('pointNum').textContent=points.toLocaleString('ko-KR');
}
function formatKRW(n){ return Number(n).toLocaleString('ko-KR'); }
function requestCharge(){ try{ window.parent.postMessage({type:'REQUEST_CHARGE'},window.location.origin); }catch(e){} }
function goHome(){ try{ window.parent.postMessage({type:'GO_HOME'},window.location.origin); }catch(e){} }
history.pushState({view:'game'},'');
window.addEventListener('popstate',function(){goHome();});

/* ── 토스트 ── */
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2500);
}

/* ── postMessage ── */
window.addEventListener('message',e=>{
  const d=e.data||{};
  switch(d.type){
    case'INIT':
      balance=parseInt(d.balance!=null?d.balance:localStorage.getItem(BAL_KEY)||0)||0;
      if(d.points!=null) points=parseInt(d.points)||0;
      updateBalUI();
      if(d.aiProfile&&typeof d.aiProfile==='object') aiProfile=d.aiProfile;
      document.body.classList.add('in-iframe');
      break;
    case'CHARGE':{
      const amt=parseInt(d.amount||0);
      if(amt>0){ balance+=amt; saveBal(); updateBalUI(); showToast(`+₩${formatKRW(amt)} 충전 완료!`); }
      break;
    }
    case'AI_PROFILE':
      if(d.profile&&typeof d.profile==='object') aiProfile=d.profile;
      else{ const{type:_,...rest}=d; aiProfile=Object.assign(aiProfile,rest); }
      break;
    case'BALANCE_UPDATE':
      if(!spinning){
        balance=parseInt(d.balance??0)||0;
        updateBalUI();
      }
      break;
    case'POINT_UPDATE':
      if(d.points!=null){ points=parseInt(d.points)||0; updateBalUI(); }
      if(d.balance!=null){ balance=parseInt(d.balance)||0; updateBalUI(); }
      break;
  }
});

/* ── iframe 즉시 감지 ── */
if(window.self !== window.top){
  document.body.classList.add('in-iframe');
}

/* ── 초기화 ── */
resizeCanvas();
loadBal();
loadHistory();
updateSpinBtn();
</script>
