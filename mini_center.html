<!DOCTYPE html>
<html lang="ko">
<head><script>
// ── ORACLE 토큰가드 ──
(function(){
  var t=sessionStorage.getItem('ORACLE_ENTRY');
  var ok=t&&(Date.now()-Number(t)<5000);
  if(ok) sessionStorage.removeItem('ORACLE_ENTRY');
  if(ok) return;
  function _show404(){
    document.body.style.cssText='margin:0;padding:0;overflow:hidden';
    Array.from(document.body.children).forEach(function(el){el.style.display='none'});
    var d=document.createElement('div');
    d.id='_oracle404';
    d.innerHTML='<div style="position:fixed;inset:0;z-index:999999;background:#0f1724;color:#e8eaf0;'
      +'font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;display:flex;align-items:center;'
      +'justify-content:center;text-align:center;padding:20px">'
      +'<div style="max-width:360px">'
      +'<div style="width:120px;height:120px;background:#fff;border-radius:50%;margin:0 auto 32px;'
      +'display:flex;align-items:center;justify-content:center">'
      +'<div style="width:72px;height:52px;border:3px solid #333;border-radius:6px;position:relative;'
      +'display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:24px;'
      +'font-weight:700;color:#d32f2f">404</div></div>'
      +'<h1 style="font-size:20px;font-weight:700;margin:0 0 12px">페이지를 찾을 수 없습니다.</h1>'
      +'<p style="font-size:14px;color:#8a91a0;line-height:1.6;margin:0 0 32px">'
      +'존재하지 않는 주소를 입력하셨거나,<br>'
      +'요청하신 페이지의 주소가 변경/삭제되어 찾을 수 없습니다.</p>'
      +'<a href="index.html" style="display:block;width:100%;padding:16px;background:#d32f2f;color:#fff;'
      +'font-size:16px;font-weight:700;border:none;border-radius:8px;cursor:pointer;text-decoration:none;'
      +'text-align:center">홈으로 이동</a>'
      +'</div></div>';
    document.body.appendChild(d);
  }
  if(document.body) _show404();
  else document.addEventListener('DOMContentLoaded', _show404);
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>🎮 미니게임 센터</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080f;--panel:#0d0f1e;--panel2:#111428;
  --accent:#7c3aed;--accent2:#a855f7;
  --gold:#f59e0b;--gold2:#fbbf24;
  --text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;
  --red:#ef4444;--green:#22c55e;--blue:#3b82f6;--orange:#f97316;
  --border:rgba(168,85,247,.22);--radius:14px;
  --h-bar:54px;--shadow:0 4px 24px rgba(0,0,0,.7);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;overflow-x:hidden;}

/* ── 메인 탭바 ── */
#topBar{
  position:fixed;top:0;left:0;right:0;z-index:200;height:var(--h-bar);
  background:rgba(7,8,15,.97);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 10px;gap:6px;backdrop-filter:blur(12px);
}
#platformBtn{
  width:36px;height:36px;background:rgba(124,58,237,.2);border:1px solid rgba(168,85,247,.4);
  border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;cursor:pointer;transition:all .2s;flex-shrink:0;position:relative;
}
#platformBtn:hover{background:rgba(124,58,237,.35);border-color:var(--accent2);}
#platformBtn:active{transform:scale(.93);}
#homeBtn{
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  color:var(--text2);border-radius:10px;padding:5px 10px;
  font-size:.75rem;cursor:pointer;transition:background .2s;white-space:nowrap;
}
#homeBtn:hover{background:rgba(255,255,255,.14)}
.bar-spacer{flex:1}
#pointsBox{
  display:flex;align-items:center;gap:4px;background:rgba(245,158,11,.1);
  border:1px solid rgba(245,158,11,.28);border-radius:10px;padding:5px 9px;
  font-size:.75rem;color:var(--gold);font-weight:700;white-space:nowrap;
}
#aiBtn{
  border:none;border-radius:10px;padding:5px 9px;font-size:.75rem;font-weight:700;
  cursor:pointer;white-space:nowrap;transition:background .4s,color .4s,box-shadow .4s;
}
#aiBtn.tier-easy{background:rgba(59,130,246,.18);color:#60a5fa;box-shadow:0 0 8px rgba(59,130,246,.25)}
#aiBtn.tier-normal{background:rgba(34,197,94,.18);color:#4ade80;box-shadow:0 0 8px rgba(34,197,94,.25)}
#aiBtn.tier-hard{background:rgba(249,115,22,.18);color:#fb923c;box-shadow:0 0 8px rgba(249,115,22,.3);animation:hardPulse 2s ease infinite}
#aiBtn.tier-extreme{background:rgba(239,68,68,.22);color:#f87171;box-shadow:0 0 12px rgba(239,68,68,.4);animation:extremePulse 1.2s ease infinite}
@keyframes hardPulse{0%,100%{box-shadow:0 0 8px rgba(249,115,22,.3)}50%{box-shadow:0 0 18px rgba(249,115,22,.6)}}
@keyframes extremePulse{0%,100%{box-shadow:0 0 12px rgba(239,68,68,.4)}50%{box-shadow:0 0 24px rgba(239,68,68,.8)}}

/* ── 게임 탭바 (iframe 열릴 때 표시) ── */
#gameBar{
  position:fixed;top:0;left:0;right:0;z-index:200;height:var(--h-bar);
  background:rgba(7,8,15,.97);border-bottom:1px solid var(--border);
  display:none;align-items:center;padding:0 10px;gap:6px;backdrop-filter:blur(12px);
  pointer-events:auto;
}
#gameBar.show{display:flex;}
#gameBarHomeBtn{
  background:rgba(168,85,247,.15);border:1px solid var(--border);border-radius:8px;
  color:var(--text);font-size:18px;width:36px;height:36px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
#gameBarTitle{
  font-size:.85rem;font-weight:700;color:var(--accent2);white-space:nowrap;
}
.game-bar-spacer{flex:1}
#gameBarBalBox{
  background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.28);
  border-radius:8px;padding:4px 8px;font-size:.72rem;color:var(--gold);font-weight:700;white-space:nowrap;
}
#gameBarPointBox{
  background:rgba(168,85,247,.15);border:1px solid rgba(168,85,247,.35);
  border-radius:8px;padding:4px 8px;font-size:.72rem;color:var(--accent2);font-weight:700;white-space:nowrap;
}
#gameBarChargeBtn{
  background:linear-gradient(135deg,#7c3aed,#a855f7);border:none;
  border-radius:8px;color:#fff;font-size:.72rem;font-weight:700;
  padding:6px 10px;cursor:pointer;transition:opacity .2s;white-space:nowrap;
  position:relative;z-index:201;-webkit-tap-highlight-color:rgba(168,85,247,.3);
  touch-action:manipulation;
}
#gameBarChargeBtn:hover{opacity:.85}

#atmOverlay{position:fixed;inset:0;pointer-events:none;z-index:50;transition:background .8s;}
#atmOverlay.atm-easy   {background:rgba(56,189,248,.06);box-shadow:inset 0 0 40px rgba(56,189,248,.08);}
#atmOverlay.atm-normal {background:rgba(74,222,128,.04)}
#atmOverlay.atm-hard1  {background:rgba(239,68,68,.06);box-shadow:inset 0 0 40px rgba(249,115,22,.15);animation:hardBorderPulse 2.5s ease infinite}
#atmOverlay.atm-hard2  {background:rgba(239,68,68,.1);box-shadow:inset 0 0 60px rgba(239,68,68,.25);animation:hardBorderPulse 1.5s ease infinite}
#atmOverlay.atm-extreme{background:rgba(239,68,68,.14);box-shadow:inset 0 0 80px rgba(239,68,68,.4);animation:extremeFlicker 1s ease infinite}
@keyframes hardBorderPulse{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes extremeFlicker{0%,100%{opacity:.8}50%{opacity:1}}
@keyframes quake{0%,100%{transform:translate(0,0)}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-2px,1px)}80%{transform:translate(3px,-1px)}}
body.quake-on{animation:quake .35s ease infinite}
/* ── body tier 테마 ── */
body.tier-easy    {--theme-accent:#38bdf8;}
body.tier-normal  {--theme-accent:#4ade80;}
body.tier-hard    {--theme-accent:#fb923c;}
body.tier-extreme {--theme-accent:#ef4444;}
/* infoBanner tier 색상 */
body.tier-easy    #infoBanner{background:rgba(56,189,248,.08);border-color:rgba(56,189,248,.15);color:#7dd3fc;}
body.tier-normal  #infoBanner{background:rgba(74,222,128,.06);border-color:rgba(74,222,128,.12);color:#86efac;}
body.tier-hard    #infoBanner{background:rgba(251,146,60,.08);border-color:rgba(251,146,60,.15);color:#fdba74;}
body.tier-extreme #infoBanner{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.15);color:#fca5a5;animation:bannerPulse 2s ease infinite;}
#warnBanner{
  position:fixed;top:var(--h-bar);left:0;right:0;z-index:190;
  background:linear-gradient(90deg,rgba(239,68,68,.9),rgba(124,58,237,.9));
  padding:6px 14px;text-align:center;font-size:.75rem;font-weight:700;
  color:#fff;display:none;animation:bannerPulse 1.5s ease infinite;
}
#warnBanner.show{display:block}
@keyframes bannerPulse{0%,100%{opacity:.85}50%{opacity:1}}
#aiPopup{
  position:fixed;top:calc(var(--h-bar)+8px);right:10px;width:210px;
  background:var(--panel2);border:1px solid var(--border);border-radius:14px;
  padding:14px;z-index:210;box-shadow:var(--shadow);display:none;animation:popIn .25s ease;
}
#aiPopup.show{display:block}
@keyframes popIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.popup-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.popup-label{font-size:.7rem;color:var(--text3)}
.ai-badge{font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:6px;transition:all .4s}
.ai-badge.tier-easy{background:rgba(59,130,246,.2);color:#60a5fa}
.ai-badge.tier-normal{background:rgba(34,197,94,.2);color:#4ade80}
.ai-badge.tier-hard{background:rgba(249,115,22,.2);color:#fb923c}
.ai-badge.tier-extreme{background:rgba(239,68,68,.25);color:#f87171}
.popup-val{font-size:.8rem;font-weight:700;color:var(--text)}
.ai-bar-wrap{margin-top:6px}
.ai-bar-label{font-size:.68rem;color:var(--text3);margin-bottom:3px;display:flex;justify-content:space-between}
.ai-bar{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.ai-fill{height:100%;border-radius:3px;transition:width .5s,background .5s}
#infoBanner{background:rgba(245,158,11,.08);border-bottom:1px solid rgba(245,158,11,.15);padding:7px 12px;font-size:.72rem;color:var(--gold2);text-align:center;line-height:1.6;}
/* ── 분위기 바 ── */
#atmoBar{
  position:fixed;top:var(--h-bar);left:0;right:0;z-index:195;
  display:flex;align-items:center;gap:7px;padding:6px 12px;
  background:var(--panel2);border-bottom:1px solid var(--border);
  font-size:.72rem;flex-wrap:nowrap;overflow:hidden;
  transition:background .5s,border-color .5s;
}
#atmoBar.hidden{display:none!important}
#atmoBadge{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;transition:all .4s;flex-shrink:0;}
#atmoBadge.tier-easy   {background:rgba(56,189,248,.2);color:#38bdf8;border:1px solid rgba(56,189,248,.3);}
#atmoBadge.tier-normal {background:rgba(74,222,128,.2);color:#4ade80;border:1px solid rgba(74,222,128,.3);}
#atmoBadge.tier-hard   {background:rgba(251,146,60,.2);color:#fb923c;border:1px solid rgba(251,146,60,.3);animation:hardPulse 2s ease infinite;}
#atmoBadge.tier-extreme{background:linear-gradient(90deg,rgba(239,68,68,.25),rgba(168,85,247,.25));color:#f87171;border:1px solid rgba(239,68,68,.35);animation:extremePulse 1.2s ease infinite;}
#atmoScore{font-weight:700;color:var(--text);white-space:nowrap;flex-shrink:0;}
#atmoEffect{
  font-size:.63rem;color:var(--text2);flex:1;min-width:0;
  overflow:hidden;white-space:nowrap;
}
#atmoEffectInner{
  display:inline-block;
}
@keyframes marqueeScroll{
  0%  {transform:translateX(100vw)}
  100%{transform:translateX(-100%)}
}
#atmoActiveIcons{display:flex;gap:3px;flex-shrink:0;font-size:.9rem;}
#missionBtn{font-size:.62rem;padding:2px 7px;border-radius:6px;border:none;cursor:pointer;font-weight:700;white-space:nowrap;flex-shrink:0;}
#missionBtn.active {background:rgba(251,146,60,.2);color:#fb923c;border:1px solid rgba(251,146,60,.35);}
#missionBtn.inactive{background:rgba(255,255,255,.06);color:var(--text3);cursor:default;border:1px solid transparent;}
#atmoReportBtn{font-size:.68rem;padding:2px 6px;border-radius:6px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:var(--text2);cursor:pointer;flex-shrink:0;}
/* ── 미션 현황 바 ── */
#missionBar{
  position:fixed;top:calc(var(--h-bar) + 36px);left:0;right:0;z-index:194;
  display:none;padding:5px 12px;
  background:rgba(251,146,60,.08);border-bottom:1px solid rgba(251,146,60,.2);
  font-size:.68rem;color:var(--text2);align-items:center;gap:6px;
}
#missionBar.show{display:flex;}
#missionTimer{font-size:.62rem;color:var(--text3);margin-left:auto;white-space:nowrap;}
/* ── tier 전환 팝업 ── */
#tierTransPopup{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.85);
  z-index:500;background:var(--panel2);border-radius:18px;padding:24px 20px;
  text-align:center;min-width:200px;box-shadow:0 8px 40px rgba(0,0,0,.7);
  border:1px solid var(--border);display:none;opacity:0;transition:opacity .3s,transform .3s;
}
#tierTransPopup.show{display:block;opacity:1;transform:translate(-50%,-50%) scale(1);}
#tierTransIcon{font-size:2.4rem;margin-bottom:6px;}
#tierTransTitle{font-family:'Black Han Sans',sans-serif;font-size:.95rem;margin-bottom:4px;}
#tierTransDesc{font-size:.72rem;color:var(--text2);line-height:1.5;}
/* ── 리포트 모달 ── */
#reportModal{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.82);backdrop-filter:blur(6px);display:none;align-items:flex-start;justify-content:center;padding-top:56px;overflow-y:auto;}
#reportModal.show{display:flex;}
#reportBox{background:var(--panel2);border:1px solid var(--border);border-radius:18px;padding:16px 14px;width:min(94vw,360px);box-shadow:var(--shadow);margin-bottom:20px;}
.report-section{margin-bottom:10px;}
.report-title{font-size:.66rem;font-weight:700;color:var(--text3);letter-spacing:.08em;margin-bottom:4px;text-transform:uppercase;}
.report-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:.74rem;}
.report-row:last-child{border:none;}
.report-val-pos{color:#4ade80;font-weight:700;}
.report-val-neg{color:#f87171;font-weight:700;}
.report-val-neu{color:var(--text2);}
.hist-item{font-size:.66rem;color:var(--text2);padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04);display:flex;justify-content:space-between;}
.hist-item:last-child{border:none;}
.hist-pos{color:#4ade80;}.hist-neg{color:#f87171;}
#content{padding:10px 10px 30px}
#gameGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;}
.g-card{background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;min-width:0;}
.card-icon-wrap{height:72px;display:flex;align-items:center;justify-content:center;font-size:2.5rem;flex-shrink:0;transition:transform .2s;}
.g-card:hover .card-icon-wrap{transform:scale(1.12);}
.g-card:hover .card-icon-wrap span{display:inline-block;animation:iconBounce .5s ease infinite alternate;}
@keyframes iconBounce{0%{transform:translateY(0) rotate(-4deg)}100%{transform:translateY(-5px) rotate(4deg)}}
.card-body{padding:7px 10px 5px;flex:1;}
.card-name{font-family:'Black Han Sans',sans-serif;font-size:.88rem;letter-spacing:.03em;margin-bottom:3px;}
.card-desc{font-size:.65rem;color:var(--text3);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-bal-row{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;background:rgba(0,0,0,.2);border-top:1px solid rgba(255,255,255,.05);font-size:.68rem;flex-shrink:0;}
.bal-label{color:var(--text3)}
.bal-val{font-weight:700;color:var(--gold2)}
.card-exchange-row{display:flex;align-items:center;justify-content:flex-end;padding:3px 10px;border-top:1px solid rgba(255,255,255,.04);flex-shrink:0;}
.exchange-badge{background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.22);border-radius:5px;padding:2px 6px;font-size:.6rem;color:var(--accent2);white-space:nowrap;}
.card-btn-row{display:flex;gap:5px;padding:7px 8px 8px;flex-shrink:0;}
.btn-start{flex:1;padding:8px 4px;border:none;border-radius:8px;font-family:'Black Han Sans',sans-serif;font-size:.78rem;letter-spacing:.03em;color:#fff;cursor:pointer;transition:opacity .2s,transform .15s;white-space:nowrap;}
.btn-start:hover{opacity:.85}
.btn-start:active{transform:scale(.96)}
.btn-exchange{
  padding:8px 9px;border:1px solid rgba(168,85,247,.35);border-radius:8px;
  background:rgba(168,85,247,.12);color:var(--accent2);font-size:.72rem;font-weight:700;
  cursor:pointer;transition:all .2s;white-space:nowrap;flex-shrink:0;
}
.btn-exchange:hover{background:rgba(168,85,247,.25)}
#iframeView{
  position:fixed;
  top:var(--h-bar); /* 게임바 아래에서 시작 */
  left:0;right:0;bottom:0;
  z-index:100;background:var(--bg);display:none;flex-direction:column;
}
#iframeView.show{display:flex;}
#gameFrame{flex:1;border:none;width:100%;height:100%;}
.modal-bg{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.82);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;}
.modal-bg.show{display:flex}
.modal-box{background:var(--panel2);border:1px solid var(--border);border-radius:18px;padding:22px 18px;width:min(92vw,340px);box-shadow:var(--shadow);}
.modal-title{font-family:'Black Han Sans',sans-serif;font-size:1.05rem;letter-spacing:.04em;margin-bottom:12px;text-align:center;}
.modal-info{background:rgba(255,255,255,.04);border-radius:10px;padding:10px 12px;font-size:.8rem;color:var(--text2);margin-bottom:12px;line-height:1.7;}
.modal-desc{font-size:.78rem;color:var(--text2);line-height:1.6;margin-bottom:10px;}
.modal-info b{color:var(--gold)}
.modal-row{display:flex;gap:8px;margin-bottom:10px;align-items:center;}
.input-wrap{position:relative;flex:1;}
.modal-input{
  width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  border-radius:9px;padding:9px 11px;color:var(--text);font-size:.85rem;outline:none;
}
.modal-input:focus{border-color:var(--accent2)}
.modal-input::placeholder{color:transparent}
.input-placeholder{
  position:absolute;top:50%;left:11px;transform:translateY(-50%);
  font-size:.78rem;font-weight:700;pointer-events:none;
  transition:opacity .15s;white-space:nowrap;
}
.input-placeholder.hidden{opacity:0}
.calc-display{
  flex:1;position:relative;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
  border-radius:9px;padding:9px 11px;
  min-height:40px;display:flex;align-items:center;
  cursor:text;transition:border-color .2s;
}
.calc-display:focus-within{border-color:var(--accent2);}
.calc-display input[type=number]{
  position:absolute;opacity:0;width:0;height:0;pointer-events:none;
}
.calc-text{
  font-size:.85rem;font-weight:700;white-space:nowrap;overflow:hidden;
  display:flex;align-items:center;gap:3px;
}
.calc-text .pt{color:#fff;}
.calc-text .arrow{color:var(--text2);}
.calc-text .won{color:var(--gold2);}
.calc-cursor{
  display:inline-block;width:1px;height:1em;
  background:var(--text);margin-left:1px;
  animation:blink .9s step-end infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.modal-btn{padding:9px 14px;border:none;border-radius:9px;font-size:.82rem;font-weight:700;cursor:pointer;transition:opacity .2s;white-space:nowrap;}
.modal-btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.modal-btn.secondary{background:rgba(255,255,255,.08);color:var(--text2)}
.modal-btn:hover{opacity:.85}
.modal-btn:disabled{opacity:.35;cursor:not-allowed}
.modal-presets{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}

  const tier = aiProfile.tier;
  if(tier !== 'HARD' && tier !== 'EXTREME') return;
  const pool = tier === 'EXTREME' ? EXTREME_MISSIONS : HARD_MISSIONS;
  const m = pool[Math.floor(Math.random()*pool.length)];
  const durHours = m.dur[Math.floor(Math.random()*m.dur.length)];
  const mission = {
    id:m.id, icon:m.icon, name:m.name, desc:m.desc,
    reward:m.reward, tier,
    expiresAt: Date.now() + durHours*3600000,
    durLabel: durHours>=48?(durHours/24)+'일':durHours+'시간',
    progress:{}, done:false,
  };
  saveHardMission(mission);
  updateMissionBar(); updateAtmoBar();
  showToast(`🎯 미션 발급: ${m.icon} ${m.name} (${mission.durLabel} 유효)`);
}

function checkHardMissionExpiry(){
  const m = getHardMission();
  if(!m || m.done) return;
  if(Date.now() > m.expiresAt){
    clearHardMission();
    updateMissionBar(); updateAtmoBar();
    showToast('⏰ 미션이 만료됐습니다. 다시 받을 수 있습니다.');
  }
}

function progressHardMission(gameId, won=false, extra={}){
  const m = getHardMission();
  if(!m || m.done) return;
  if(Date.now() > m.expiresAt){ clearHardMission(); updateMissionBar(); updateAtmoBar(); return; }
  const p = m.progress || {};
  p.total = (p.total||0)+1;
  if(won) p.streak = (p.streak||0)+1;
  else    p.streak = 0;
  if(gameId) p[gameId] = (p[gameId]||0)+1;
  if(gameId==='dart'||gameId==='archery') p.dart = (p.dart||0)+1;
  if(gameId==='psychology'){
    if(won){ p.psych_win=(p.psych_win||0)+1; p.psych_streak=(p.psych_streak||0)+1; }
    else p.psych_streak=0;
  }
  if(won&&gameId==='gomoku'){ p.gomoku_win=(p.gomoku_win||0)+1; if(extra.hard) p.gomoku_hard_win=(p.gomoku_hard_win||0)+1; }
  if(extra.blue_finish)  p.blue_finish =(p.blue_finish||0)+1;
  if(extra.blue_tickets) p.blue_tickets=(p.blue_tickets||0)+(extra.blue_tickets||0);
  if(extra.boost_used)   p.boost_used  =(p.boost_used||0)+1;
  m.progress = p;
  const def = [...HARD_MISSIONS,...EXTREME_MISSIONS].find(x=>x.id===m.id);
  if(def && def.check(p)){
    m.done = true; saveHardMission(m);
    applyAtmosphereDelta(m.reward, `미션 완료: ${m.name}`);
    showToast(`✅ 미션 완료! +${m.reward}점 분위기 회복!`);
    updateMissionBar(); updateAtmoBar(); return;
  }
  saveHardMission(m); updateMissionBar();
}

function getMissionProgressText(m){
  const p = m.progress||{};
  if(m.id.includes('any3c')||m.id.includes('any5c')) return `연속 ${p.streak||0}판`;
  if(m.id.includes('mine'))   return `${(p.mole||0)+(p.memory||0)}판`;
  if(m.id.includes('bet'))    return `${(p.slot||0)+(p.roulette||0)+(p.ladder||0)+(p.horse||0)}판`;
  if(m.id.includes('any'))    return `${p.total||0}판`;
  if(m.id.includes('psych'))  return `${p.psych_win||0}승/연속${p.psych_streak||0}`;
  if(m.id.includes('gomoku')) return `${p.gomoku_win||0}승`;
  if(m.id.includes('horse'))  return `${p.horse||0}판`;
  if(m.id.includes('dart'))   return `${p.dart||0}판`;
  if(m.id.includes('blue'))   return `완주${p.blue_finish||0}/이벤트권${p.blue_tickets||0}`;
  return '진행 중';
}

const TIER_EFFECT_TEXT = {
  EASY:   '입장료 면제 / 보상 ×1.5 / 환전 +10%',
  NORMAL: '입장료 ×1 / 보상 ×1.0 / 환전 0%',
  HARD:   '입장료 ×1.5 / 보상 ×0.8 / 환전 -10%',
  EXTREME:'입장료 ×2 / 보상 ×0.6 / 환전 -20%',
};
const TIER_ICONS = {EASY:'😊',NORMAL:'🤔',HARD:'😤',EXTREME:'😈'};
const TIER_BAR_BG = {
  EASY:   'rgba(56,189,248,.12)',
  NORMAL: 'rgba(74,222,128,.08)',
  HARD:   'rgba(251,146,60,.1)',
  EXTREME:'rgba(239,68,68,.12)',
};

function updateAtmoBar(){
  const bar = document.getElementById('atmoBar'); if(!bar) return;
  const tier = aiProfile.tier || 'EASY';
  const score = aiProfile.atmosphereScore;
  bar.style.background = TIER_BAR_BG[tier] || TIER_BAR_BG.NORMAL;
  const badge = document.getElementById('atmoBadge');
  if(badge){ badge.textContent = (TIER_ICONS[tier]||'🤖')+' '+tier; badge.className = 'tier-'+tier.toLowerCase(); }
  const scoreEl = document.getElementById('atmoScore'); if(scoreEl) scoreEl.textContent = score+'점';
  const effEl = document.getElementById('atmoEffectInner');
  if(effEl){
    effEl.textContent = TIER_EFFECT_TEXT[tier]||'';
    // 텍스트가 영역 초과할 때만 마퀴 적용
    const wrapper = document.getElementById('atmoEffect');
    if(wrapper){
      effEl.style.animation = 'none';
      requestAnimationFrame(()=>{
        if(effEl.scrollWidth > wrapper.clientWidth){
          effEl.style.animation = 'marqueeScroll 14s linear infinite';
        }
      });
    }
  }
  // 장착 이벤트권 아이콘 (분위기 바 내)
  const aiEl = document.getElementById('atmoActiveIcons');
  if(aiEl){
    const active = getActiveEffects();
    const icons = [];
    if(active.waive)  icons.push('🎟');
    if(active.double) icons.push('⚡');
    if(active.shield) icons.push('🛡');
    aiEl.textContent = icons.join(' ');
  }
  // 미션 버튼
  const mBtn = document.getElementById('missionBtn');
  if(mBtn){
    const canIssue = (tier==='HARD'||tier==='EXTREME');
    if(!canIssue){
      mBtn.className='inactive'; mBtn.textContent='🎯 미션없음';
    } else {
      const m = getHardMission();
      const hasActive = m && !m.done && Date.now() <= m.expiresAt;
      const isDone = m && m.done;
      if(hasActive)    { mBtn.className='inactive'; mBtn.textContent='🎯 진행중'; }
      else if(isDone)  { mBtn.className='active';   mBtn.textContent='🎯 새미션'; }
      else             { mBtn.className='active';   mBtn.textContent='🎯 미션받기'; }
    }
  }
  updateMissionBarTop();
}

function updateMissionBar(){
  const bar = document.getElementById('missionBar');
  const textEl = document.getElementById('missionBarText');
  const timerEl = document.getElementById('missionTimer');
  if(!bar) return;
  const m = getHardMission();
  if(!m || m.done || Date.now() > m.expiresAt){
    bar.classList.remove('show');
    updateMissionBarTop(); return;
  }
  bar.classList.add('show');
  const prog = getMissionProgressText(m);
  if(textEl) textEl.textContent = `${m.icon} ${m.name} — ${prog} (+${m.reward}점)`;
  const remain = m.expiresAt - Date.now();
  const h = Math.floor(remain/3600000);
  const min = Math.floor((remain%3600000)/60000);
  if(timerEl) timerEl.textContent = h>=24 ? `⏰ ${Math.floor(h/24)}일 ${h%24}시간` : `⏰ ${h}시간 ${min}분`;
  // 포기 횟수 표시
  const abandonBtn = document.getElementById('missionAbandonBtn');
  if(abandonBtn){
    const today = new Date().toDateString();
    const rec = loadJSON('MG_MISSION_ABANDON', {date:'', count:0});
    const used = rec.date === today ? rec.count : 0;
    const left = 3 - used;
    abandonBtn.textContent = `포기 (${left}/3)`;
    abandonBtn.disabled = left <= 0;
    abandonBtn.style.opacity = left <= 0 ? '.4' : '1';
  }
  updateMissionBarTop();
}

function updateMissionBarTop(){
  // 분위기 바 높이에 따라 미션 바 top 위치 조정
  const atmoBar = document.getElementById('atmoBar');
  const mBar = document.getElementById('missionBar');
  if(atmoBar && mBar){
    const atmoH = atmoBar.classList.contains('hidden') ? 0 : atmoBar.offsetHeight;
    mBar.style.top = (54 + atmoH) + 'px';
  }
  updateContentPadding();
}

function updateContentPadding(){
  const content = document.getElementById('content'); if(!content) return;
  const atmoBar = document.getElementById('atmoBar');
  const mBar = document.getElementById('missionBar');
  const atmoH = (atmoBar && !atmoBar.classList.contains('hidden')) ? atmoBar.offsetHeight : 0;
  const mH = (mBar && mBar.classList.contains('show')) ? mBar.offsetHeight : 0;
  content.style.paddingTop = (54 + atmoH + mH + 10) + 'px';
}

function abandonMission(){
  const m = getHardMission();
  if(!m || m.done) return;
  // 하루 3회 제한 체크
  const KEY_ABANDON = 'MG_MISSION_ABANDON';
  const today = new Date().toDateString();
  const rec = loadJSON(KEY_ABANDON, {date:'', count:0});
  const count = rec.date === today ? rec.count : 0;
  if(count >= 3){
    showToast('⚠️ 오늘 포기 횟수를 모두 사용했습니다. (3/3)');
    return;
  }
  if(!confirm(`미션을 포기할까요?\n오늘 포기 가능 횟수: ${3-count-1}회 남음`)) return;
  saveJSON(KEY_ABANDON, {date:today, count:count+1});
  clearHardMission();
  updateMissionBar(); updateAtmoBar();
  showToast(`미션 포기 (오늘 ${count+1}/3회 사용)`);
}

function clickMissionBtn(){
  const tier = aiProfile.tier;
  if(tier !== 'HARD' && tier !== 'EXTREME') return;
  const m = getHardMission();
  if(m && !m.done && Date.now() <= m.expiresAt){ showToast('🎯 미션 진행 중입니다.'); return; }
  issueHardMission();
}

let _tierT = null;
function showTierTransition(fromTier, toTier){
  const popup = document.getElementById('tierTransPopup'); if(!popup) return;
  const order = ['EASY','NORMAL','HARD','EXTREME'];
  const isUp = order.indexOf(toTier) < order.indexOf(fromTier);
  const colors = {EASY:'#38bdf8',NORMAL:'#4ade80',HARD:'#fb923c',EXTREME:'#ef4444'};
  document.getElementById('tierTransIcon').textContent = isUp ? '🎉' : '⚠️';
  document.getElementById('tierTransTitle').textContent = isUp
    ? `${fromTier} → ${toTier} 탈출 성공!` : `${fromTier} → ${toTier} 하락`;
  document.getElementById('tierTransDesc').textContent = TIER_EFFECT_TEXT[toTier]||'';
  popup.style.borderColor = colors[toTier]||'var(--border)';
  popup.classList.add('show');
  clearTimeout(_tierT);
  _tierT = setTimeout(()=>popup.classList.remove('show'), 3500);
}

}

    <div class="report-row"><span>환전 수수료</span><span class="${tier==='EASY'?vp:tier!=='NORMAL'?vn:vnu}">${{EASY:'-10% 보너스',NORMAL:'0%',HARD:'+10%',EXTREME:'+20%'}[tier]}</span></div>
    <div class="report-row"><span>오목/다트/양궁 입장료</span><span class="${tier==='EASY'?vp:tier!=='NORMAL'?vn:vnu}">${{EASY:'면제',NORMAL:'×1',HARD:'×1.5',EXTREME:'×2'}[tier]}</span></div>`;

    <div class="report-row"><span>심리전 환급(3승)</span><span class="${vp}">+2</span></div>

function getInventory(){
  const inv = loadJSON(KEY_INV, {});
  return (inv && typeof inv === 'object') ? inv : {};
}
function setInventory(inv){ saveJSON(KEY_INV, inv); updateInvButton(); renderInv(); }
function getActiveEffects(){
  const a = loadJSON(KEY_ACTIVE, {});
  return (a && typeof a === 'object') ? a : {};
}
function setActiveEffects(a){ saveJSON(KEY_ACTIVE, a); updateInvButton(); renderInv(); updateAtmoBar(); }

function getInventoryCount(){
  const inv = getInventory();
  return Object.values(inv).reduce((s,n)=>s+(Number(n)||0),0);
}

function toggleInvModal(force){
  const el = document.getElementById('invModal');
  const show = (typeof force === 'boolean') ? force : !el.classList.contains('show');
  if(show){
    renderInv();
    el.classList.add('show');
  } else el.classList.remove('show');
}
function updateActiveIcons(){
  const row = document.getElementById('activeIconRow');
  if(!row) return;
  const active = getActiveEffects();
  const icons = [];
  if(active.waive)  icons.push('🎟');
  if(active.double) icons.push('⚡');
  if(active.shield) icons.push('🛡');
  row.innerHTML = icons.map(ic =>
    `<span style="font-size:1rem;line-height:1">${ic}</span>`
  ).join('');
}

function updateInvButton(){
  const btn = document.getElementById('invBtn');
  if(!btn) return;
  const n = getInventoryCount();
  btn.childNodes[0].textContent = '🎒';
  const badge = document.getElementById('invBadge');
  if(badge){
    if(n > 0){ badge.textContent = n > 99 ? '99+' : n; badge.classList.add('show'); }
    else      { badge.classList.remove('show'); }
  }
  updateActiveIcons();
}

function addItem(type, qty=1){
  if(!ITEM_DEFS[type]) return;
  const inv = getInventory();
  inv[type] = (Number(inv[type])||0) + Math.max(1, Math.round(qty));
  setInventory(inv);
  showToast(`${ITEM_DEFS[type].icon} ${ITEM_DEFS[type].name} +${qty}`);
}

function armItem(type){
  const inv = getInventory();
  if((Number(inv[type])||0) <= 0) return showToast('없음');
  const active = getActiveEffects();

  if(type === 'ATMO_BOOST'){
    inv[type] = (Number(inv[type])||0) - 1;
    if(inv[type] <= 0) delete inv[type];
    setInventory(inv);
    applyAtmosphereDelta(+20, '분위기 부스트 사용');
    progressHardMission(currentGameId||'', false, {boost_used:1});
    showToast('🌟 분위기 부스트 +20!');
    return;
  }

  if(type === 'BONUS_P1'){
    inv[type] = (Number(inv[type])||0) - 1;
    if(inv[type] <= 0) delete inv[type];
    setInventory(inv);
    points = Math.max(0, points + 5);
    saveJSON(KEY_POINTS, points);
    updateUI(); broadcastPointUpdate();
    showToast('🎁 보너스 +5P 지급!');
    return;
  }

  const slotMap = {WAIVE_FEE:'waive', DOUBLE:'double', SHIELD:'shield'};
  const slot = slotMap[type];
  if(!slot) return;
  if(active[slot]) return showToast('이미 장착됨');
  active[slot] = type;

  inv[type] = (Number(inv[type])||0) - 1;
  if(inv[type] <= 0) delete inv[type];

  setInventory(inv);
  setActiveEffects(active);
  showToast(`${ITEM_DEFS[type].icon} 장착`);
}

function consumeActive(slot){
  const active = getActiveEffects();
  if(active[slot]){
    delete active[slot];
    setActiveEffects(active);
  }
}

function renderInv(){
  const list = document.getElementById('invList');
  const badges = document.getElementById('invActiveBadges');
  if(!list || !badges) return;

  const inv = getInventory();
  const active = getActiveEffects();

  const badgeParts = [];
  if(active.double) badgeParts.push('⚡ 더블');
  if(active.waive)  badgeParts.push('🎟 면제');
  if(active.shield) badgeParts.push('🛡 방어');
  badges.innerHTML = badgeParts.length
    ? badgeParts.map(t=>`<div class="inv-badge">${t}</div>`).join('')
    : `<div class="inv-badge" style="opacity:.7">활성 이벤트권 없음</div>`;

  const types = ['WAIVE_FEE','DOUBLE','BONUS_P1','SHIELD','ATMO_BOOST'];
  const rows = [];
  for(const t of types){
    const qty = Number(inv[t]||0);
    const def = ITEM_DEFS[t]; if(!def) continue;
    const emptyStyle = qty <= 0 ? 'opacity:.38;filter:grayscale(.8)' : '';
    rows.push(`
      <div class="inv-item" style="${emptyStyle}">
        <div class="inv-left">
          <div class="inv-ico">${def.icon}</div>
          <div>
            <div class="inv-name">${def.name} <span style="opacity:.75;font-weight:900">×${qty}</span>${qty<=0?'<span style="font-size:.65rem;color:#ef4444;margin-left:4px">없음</span>':''}</div>
            <div class="inv-desc">${def.desc}</div>
          </div>
        </div>
        <div class="inv-actions">
          <button class="primary" ${qty<=0?'disabled':''} onclick="armItem('${t}')">${t==='ATMO_BOOST'||t==='BONUS_P1'?'사용':'장착'}</button>
        </div>
      </div>
    `);
  }
  list.innerHTML = rows.join('');
}

  if(confirm('이벤트권 인벤토리를 모두 비울까요?')){
    saveJSON(KEY_INV, {});
    saveJSON(KEY_ACTIVE, {});
    updateInvButton();
    renderInv();
    showToast('인벤토리 초기화');
  }
}

let quakeTimer     = null;
let exchTargetGame = null;
let exchTab        = 'toGame';
let egVal = 0;
let epVal = 0;

function init(){
  /* ★ 최초 접속 시 포인트 100P 지급 */
  const stored = localStorage.getItem(KEY_POINTS);
  if(stored === null){
    points = 100;
    saveJSON(KEY_POINTS, points);
  } else {
    points = parseInt(stored) || 0;
  }
  try{
    const r = localStorage.getItem(KEY_AI);
    if(r){
      const loaded = JSON.parse(r);
      // 구버전 저장값에 누락 필드가 있어도 기본값으로 보완 (atmosphereScore 없으면 tier 기반으로 추정)
      const tierToScore = {EASY:100, NORMAL:80, HARD:40, EXTREME:10};
      aiProfile = Object.assign({
        tier:'EASY', mood:'RELAXED', threat:'NONE',
        atmosphereScore: tierToScore[loaded.tier] ?? 100
      }, loaded);
      if(typeof aiProfile.atmosphereScore !== 'number' || isNaN(aiProfile.atmosphereScore)){
        aiProfile.atmosphereScore = tierToScore[aiProfile.tier] ?? 100;
      }
    }
  }catch(e){}
  buildGrid();
  updateUI();
  updateInvButton();
  updateAtmoBar();
  checkHardMissionExpiry();
  updateMissionBar();
  setInterval(()=>{ checkHardMissionExpiry(); updateMissionBar(); }, 60000);
}

function buildGrid(){
  const grid = document.getElementById('gameGrid');
  grid.innerHTML = '';
  GAMES.forEach(g => {
    const bal    = getGameBal(g.id);
    const balStr = bal > 0 ? '₩' + bal.toLocaleString('ko-KR') : '0원';

    const card   = document.createElement('div');
    card.className = 'g-card';

    const exchangeRow = `
      <div class="card-exchange-row">
        <span class="exchange-badge">1P ↔ ₩100,000</span>
      </div>`;

    const exchangeBtn = `
        <button class="btn-exchange" onclick="event.stopPropagation(); openExchangeModal('${g.id}')">💱 환전</button>`;

    card.innerHTML = `
      <div class="card-icon-wrap" style="background:linear-gradient(135deg,${g.color}28,${g.color}08)">
        <span>${g.icon}</span>
      </div>
      <div class="card-body">
        <div class="card-name" style="color:${g.color}">${g.name}</div>
        <div class="card-desc">${g.desc}</div>
      </div>
      <div class="card-bal-row">
        <span class="bal-label">💰 잔금</span>
        <span class="bal-val" id="bal_${g.id}">${balStr}</span>
      </div>
      ${exchangeRow}
      <div class="card-btn-row">
        <button class="btn-start"
          style="background:linear-gradient(135deg,${g.color}cc,${g.color}77)"
          onclick="openGame('${g.id}')">🎮 게임 시작</button>
        ${exchangeBtn}
      </div>`;
    grid.appendChild(card);
  });
  // 카드 생성 후 tier 테마 즉시 적용
  updateCardTheme(aiProfile.tier || 'EASY');
}

/* ── 게임 탭바 전환 ── */
function showGameBar(gameId){
  const g = GAMES.find(x => x.id === gameId);
  document.getElementById('topBar').style.display = 'none';
  document.getElementById('gameBar').classList.add('show');
  document.getElementById('gameBarTitle').textContent = g ? g.icon + ' ' + g.name : '🎮 게임';
  updateGameBar(gameId);
}
function hideGameBar(){
  document.getElementById('topBar').style.display = 'flex';
  document.getElementById('homeBtn').style.display = 'none';
  document.getElementById('platformBtn').style.display = '';
  document.getElementById('gameBar').classList.remove('show');
}
function updateGameBar(gameId){
  const id = gameId || currentGameId;
  if(!id) return;
  const bal = getGameBal(id);
  document.getElementById('gameBarBal').textContent  = '₩' + bal.toLocaleString('ko-KR');
  document.getElementById('gameBarPoint').textContent = points;
}
function openExchangeModalFromBar(){
  if(!currentGameId){ showToast('게임 실행 중에만 충전 가능합니다.'); return; }
  try{
    openExchangeModal(currentGameId);
  }catch(err){
    showToast('⚠️ 충전 오류: ' + err.message);
  }
}

function openGame(gameId){
  if(btnLock) return;
  btnLock = true; setTimeout(() => btnLock = false, 800);
  const g = GAMES.find(x => x.id === gameId);
  if(!g) return;
  currentGameId = gameId;
  const frame = document.getElementById('gameFrame');
  frame.onload = null;        // 이전 onload 제거 — 빠른 전환 시 ghost INIT 방지
  sessionStorage.setItem('ORACLE_ENTRY', Date.now());
  frame.src = g.file;
  // 클로저로 gameId 캡처 → onload 시점에 currentGameId가 바뀌어도 올바른 잔액 전송
  const capturedId = gameId;
  frame.onload = () => {
    if(currentGameId !== capturedId) return;
    try{
      const initActive = getActiveEffects();
      let initBal = getGameBal(capturedId);
      // DOUBLE 장착 시 잔금 2배 전송 + 소모
      if(initActive.double){
        initBal = initBal * 2;
        consumeActive('double');
        showToast('⚡ 게임머니 2배권 적용!');
      }
      frame.contentWindow.postMessage({
        type:'INIT', balance: initBal, points, aiProfile,
        atmo: aiProfile?.atmosphereScore, tier: aiProfile?.tier,
        invActive: getActiveEffects(), invCount: getInventoryCount()
      }, window.location.origin);
    }catch(e){}
  };
  document.getElementById('iframeView').classList.add('show');
  history.pushState({view:'game'}, '');
  document.getElementById('aiPopup').classList.remove('show');
  const _ab = document.getElementById('atmoBar');
  const _mb = document.getElementById('missionBar');
  if(_ab) _ab.classList.add('hidden');
  if(_mb) _mb.classList.remove('show');
  document.getElementById('content').style.paddingTop = '64px';
  showGameBar(gameId);
}

function showHome(){
  btnLock = false;
  document.getElementById('iframeView').classList.remove('show');
  const frame = document.getElementById('gameFrame');
  frame.onload = null;
  frame.src = 'about:blank';
  currentGameId = null;
  hideGameBar();
  const _ab = document.getElementById('atmoBar');
  if(_ab) _ab.classList.remove('hidden');
  buildGrid(); updateUI();
  updateAtmoBar();
}

window.addEventListener('message', e => {
  // origin 검증: 같은 출처(iframe)만 허용
  if(e.origin !== window.location.origin && e.origin !== 'null') return;
  const d = e.data;
  if(!d || !d.type) return;
  switch(d.type){
    case 'SAVE_BALANCE':
      if(currentGameId && d.balance !== undefined && BAL_KEYS[currentGameId]){
        if(!d._hubSync){
          const v = Math.max(0, Math.round(d.balance));
          saveJSON(BAL_KEYS[currentGameId], v);
        }
        const dispBal = Math.max(0, Math.round(d.balance));
        const el = document.getElementById('bal_' + currentGameId);
        if(el) el.textContent = dispBal > 0 ? '₩' + dispBal.toLocaleString('ko-KR') : '0원';
        updateGameBar(currentGameId);
      }
      break;
    case 'SAVE_POINTS':
      // 브루마블 등 게임이 포인트를 직접 변경 후 index에 동기화 요청
      if(d.points !== undefined){
        const sp = Math.max(0, Math.round(Number(d.points)||0));
        points = sp;
        saveJSON(KEY_POINTS, points);
        updateUI();
        broadcastPointUpdate();
      }
      break;
    case 'REQUEST_SPEND_BALANCE': {
      // 두더지/기억력 게임 — 게임머니(잔고) 직접 차감
      const reqId = d.requestId || (Date.now() + '_' + Math.random().toString(16).slice(2));
      const frame = document.getElementById('gameFrame');
      const gameId = d.gameId || currentGameId;
      if(gameId !== 'mole' && gameId !== 'memory'){
        try{ frame?.contentWindow?.postMessage({type:'SPEND_RESULT', requestId:reqId, ok:false, spent:0, points}, window.location.origin); }catch(e){}
        break;
      }
      const amt = Math.max(0, Math.round(Number(d.amount || 0)));
      const balKey = BAL_KEYS[gameId] || BAL_KEYS['mole'];
      let bal = Math.max(0, Math.round(Number(loadJSON(balKey, 0))));
      if(amt <= 0){
        try{ frame?.contentWindow?.postMessage({type:'SPEND_RESULT', requestId:reqId, ok:true, spent:0, points, balance:bal}, window.location.origin); }catch(e){}
        break;
      }
      // 이벤트권: 입장료 면제권 우선 체크
      const balActive = getActiveEffects();
      if(balActive.waive){
        consumeActive('waive');
        showToast('🎟 입장료 면제권 사용! (게임머니 면제)');
        try{ frame?.contentWindow?.postMessage({type:'SPEND_RESULT', requestId:reqId, ok:true, spent:0, points, balance:bal}, window.location.origin); }catch(e){}
        break;
      }
      // AI 분위기 tier 입장료 배율 적용
      const balEntryTier = aiProfile.tier || 'NORMAL';
      const balEntryMult = TIER_ENTRY_MULT[balEntryTier] ?? 1;
      let finalBalAmt;
      if(balEntryMult === 0){
        // EASY: 입장료 면제
        showToast('😊 EASY 모드 — 입장료 면제!');
        try{ frame?.contentWindow?.postMessage({type:'SPEND_RESULT', requestId:reqId, ok:true, spent:0, points, balance:bal}, window.location.origin); }catch(e){}
        break;
      } else {
        finalBalAmt = Math.round(amt * balEntryMult);
        if(balEntryMult > 1) showToast(`😈 ${balEntryTier} 패널티 — 입장료 ×${balEntryMult} (₩${finalBalAmt.toLocaleString('ko-KR')})`);
      }
      if(bal >= finalBalAmt){
        bal -= finalBalAmt;
        saveJSON(balKey, bal);
        updateGameBar(gameId);
        if(balEntryMult === 1) showToast(`게임머니 -₩${finalBalAmt.toLocaleString('ko-KR')}`);
        try{ frame?.contentWindow?.postMessage({type:'SPEND_RESULT', requestId:reqId, ok:true, spent:finalBalAmt, points, balance:bal}, window.location.origin); }catch(e){}
      } else {
        showToast('⚠️ 게임머니 부족! 충전하세요.');
        try{ frame?.contentWindow?.postMessage({type:'SPEND_RESULT', requestId:reqId, ok:false, spent:0, points, balance:bal, need:finalBalAmt}, window.location.origin); }catch(e){}
        setTimeout(() => openExchangeModal(gameId), 600);
      }
      break;
    }
    case 'REQUEST_CHARGE': {
      const chargeTarget = d.gameId || currentGameId;
      if(chargeTarget) openExchangeModal(chargeTarget);
      break;
    }
    case 'REQUEST_POINT_INFO':
      broadcastPointUpdate();
      break;
    case 'REQUEST_SPEND_POINTS':
    case 'SPEND_POINTS': {
      const amt = Math.max(0, Math.round(Number(d.amount ?? d.deltaPoints ?? d.points ?? d.payload?.amount ?? 0) || 0));
      const reqId = d.requestId || d.payload?.requestId || (Date.now() + '_' + Math.random().toString(16).slice(2));
      const frame = document.getElementById('gameFrame');
      if(amt <= 0){
        try{ frame?.contentWindow?.postMessage({type:'SPEND_RESULT', gameId:d.gameId, requestId:reqId, ok:true, spent:0, points}, window.location.origin); }catch(e){}
        break;
      }
      // 이벤트권: 입장료 면제(1회) — tier 배율보다 우선
      const active = getActiveEffects();
      const hasWaive = !!active.waive;
      if(hasWaive){
        consumeActive('waive');
        showToast('🎟 입장료 면제권 사용! (-' + amt + 'P → 0P)');
        try{ frame?.contentWindow?.postMessage({type:'SPEND_RESULT', gameId:d.gameId, requestId:reqId, ok:true, spent:0, points}, window.location.origin); }catch(e){}
        break;
      }
      // AI 분위기 tier 입장료 배율 적용
      const tier = aiProfile.tier || 'NORMAL';
      const entryMult = TIER_ENTRY_MULT[tier] ?? 1;
      let finalAmt;
      if(entryMult === 0){
        // EASY: 입장료 면제
        showToast('😊 EASY 모드 — 입장료 면제!');
        try{ frame?.contentWindow?.postMessage({type:'SPEND_RESULT', gameId:d.gameId, requestId:reqId, ok:true, spent:0, points}, window.location.origin); }catch(e){}
        break;
      } else {
        finalAmt = Math.round(amt * entryMult);
        if(entryMult > 1) showToast(`😈 ${tier} 패널티 — 입장료 ×${entryMult} (${finalAmt}P)`);
      }

      if(points >= finalAmt){
        points -= finalAmt;
        saveJSON(KEY_POINTS, points);
        updateUI(); broadcastPointUpdate();
        if(entryMult === 1) showToast(`포인트 -${finalAmt}P`);
        try{ frame?.contentWindow?.postMessage({type:'SPEND_RESULT', gameId:d.gameId, requestId:reqId, ok:true, spent:finalAmt, points}, window.location.origin); }catch(e){}
      } else {
        try{ frame?.contentWindow?.postMessage({type:'SPEND_RESULT', gameId:d.gameId, requestId:reqId, ok:false, spent:0, points, need:finalAmt}, window.location.origin); }catch(e){}
        showToast('⚠️ 포인트 부족! 게임머니를 환전하세요.');
        if(currentGameId){
          setTimeout(() => openExchangeModal(currentGameId), 600);
        }
      }
      break;
    }

    case 'ITEM_GRANT': {
      const grantType = d.item || d.itemType || d.payload?.item;
      if(grantType && typeof grantType === 'string'){
        addItem(grantType, 1);
      }
      break;
    }
    case 'MG_ITEM_ADD': {
      const raw = d.itemType || d.typeId || d.item || d.payload?.itemType || d.payload?.item;
      const type = (typeof raw === 'string') ? raw : (raw && typeof raw === 'object' ? (raw.id || raw.type || raw.itemType) : null);
      const qty = Number(d.qty ?? d.count ?? (raw && typeof raw === 'object' ? raw.count : undefined) ?? d.payload?.qty ?? 1) || 1;
      if(type && typeof type === 'string' && type.length > 0){
        addItem(type, qty);
      }
      break;
    }

    case 'GO_HOME':
      showHome();
      break;
    case 'GAME_OVER': {
      // 게임 결과 수신 — 게임바 잔액 즉시 갱신
      if(d.gameId && BAL_KEYS[d.gameId]){
        updateGameBar(d.gameId);
      }
      // 게임 플레이 완료 시 분위기 -1 (심리전 제외 — 심리전은 자체 ATMOSPHERE 전송)
      if(d.gameId && d.gameId !== 'psychology'){
        const gName = GAMES.find(x=>x.id===d.gameId)?.name || d.gameId;
        applyAtmosphereDelta(-1, `게임 플레이: ${gName}`);
      }
      // 미션 진행도 — 심리전(playerWins) + 경마/기타(won) 둘 다 처리
      const isWin = (d.won === true) || (d.playerWins >= 3);
      progressHardMission(d.gameId || currentGameId, isWin,
        d.gameId==='blue' ? {blue_finish:d.blue_finish?1:0, blue_tickets:d.blue_tickets||0} :
        d.gameId==='gomoku' ? {hard:d.difficulty==='hard'||d.difficulty==='extreme'} : {});
      break;
    }
    case 'POINT_DELTA':
    case 'ADD_POINTS':
    case 'EARN_POINTS': {
      const dp = (d.deltaPoints !== undefined ? d.deltaPoints :
                 (d.delta !== undefined ? d.delta :
                 (d.points !== undefined ? d.points :
                 (d.payload?.deltaPoints ?? d.payload?.points ?? 0))));
      let add = Math.round(Number(dp) || 0);

      // 이벤트권 적용(공용 인벤토리)
      const active = getActiveEffects();
      // 두더지·기억력만 포인트 보상 게임
      const isMining = ['mole','memory'].includes(currentGameId);

      // 패널티 방어: 음수 포인트를 0으로 막음(1회)
      if(add < 0 && active.shield){
        add = 0;
        consumeActive('shield');
        showToast('🧯 패널티 방어 적용');
      }

      // 두더지/기억력만 tier 배율 + 이벤트권 적용
      if(add > 0 && isMining){
        // AI 분위기 tier 배율
        const tier = aiProfile.tier || 'NORMAL';
        const mult = TIER_REWARD_MULT[tier] ?? 1.0;
        if(mult !== 1.0){
          const before = add;
          add = Math.round(add * mult);
          if(mult > 1) showToast(`😊 EASY 보너스 ×${mult} (+${add-before}P 추가)`);
          else         showToast(`😈 ${tier} 패널티 ×${mult} (${add-before}P 감소)`);
        }
        // 이벤트권: 더블/보너스
        if(active.double){
          add = add * 2;
          consumeActive('double');
          showToast('⚡ 더블 적용');
        }
      }

      if(add !== 0){
        points = Math.max(0, points + add);
        saveJSON(KEY_POINTS, points);
        updateUI(); broadcastPointUpdate();
        showToast(`포인트 ${add>0?'+':''}${add}P`);
      } else {
        updateUI(); broadcastPointUpdate();
      }

      // HARD/EXTREME 미션 진행도 업데이트
      if(add > 0) progressHardMission(currentGameId, true);
      break;
    }
    case 'AI_PROFILE': {
      // 심리전 등 게임에서 tier/atmosphereScore 직접 변경 시 수신
      const prof = d.profile || d;
      if(prof.tier) aiProfile.tier = prof.tier;
      if(typeof prof.atmosphereScore === 'number') aiProfile.atmosphereScore = prof.atmosphereScore;
      if(prof.mood) aiProfile.mood = prof.mood;
      if(prof.threat) aiProfile.threat = prof.threat;
      saveAiProfile(); updateUI(); updateAtmoBar(); updateMissionBar();
      const reason = `게임 내 AI 진화 → ${aiProfile.tier}`;
      addAtmoHistory(0, reason);
      break;
    }
    case 'ATMOSPHERE':
    case 'MG_ATMO_DELTA': {
      const delta = Number(d.delta !== undefined ? d.delta : (d.payload?.delta || 0));
      if(!isNaN(delta) && delta !== 0) applyAtmosphereDelta(delta);
      break;
    }
  }
});

function broadcastPointUpdate(){
  const frame = document.getElementById('gameFrame');
  if(!currentGameId) return;
  try{
    frame.contentWindow.postMessage({type:'POINT_UPDATE', points, balance: getGameBal(currentGameId)}, window.location.origin);
  }catch(e){}
}

function applyAtmosphereDelta(delta, reason=''){
  const prevTier = aiProfile.tier;
  aiProfile.atmosphereScore = Math.round(Math.max(0, Math.min(100, aiProfile.atmosphereScore + delta)));
  updateAiTier(); saveAiProfile(); updateUI(); broadcastAiProfile();
  addAtmoHistory(delta, reason||(delta>0?'분위기 상승':'분위기 하락'));
  if(Math.abs(delta) >= 5)
    showToast(`분위기 ${delta>0?'+':''}${delta} → ${aiProfile.atmosphereScore}점`);
  if(prevTier !== aiProfile.tier) showTierTransition(prevTier, aiProfile.tier);
  // HARD/EXTREME 새로 진입 시 미션 안내
  if((aiProfile.tier==='HARD'||aiProfile.tier==='EXTREME') && prevTier!==aiProfile.tier){
    const existing = getHardMission();
    if(!existing || existing.done || Date.now() > existing.expiresAt)
      setTimeout(()=>showToast(`😤 ${aiProfile.tier} 진입 — 미션받기로 회복하세요!`), 1500);
  }
  checkHardMissionExpiry();
  updateAtmoBar(); updateMissionBar();
}
function updateAiTier(){
  const s = aiProfile.atmosphereScore;
  if(s>=80)     {aiProfile.tier='EASY';    aiProfile.mood='RELAXED'; aiProfile.threat='NONE';}
  else if(s>=60){aiProfile.tier='NORMAL';  aiProfile.mood='NEUTRAL';  aiProfile.threat='LOW';}
  else if(s>=20){aiProfile.tier='HARD';    aiProfile.mood='NERVOUS';  aiProfile.threat='HIGH';}
  else          {aiProfile.tier='EXTREME'; aiProfile.mood='HOSTILE';  aiProfile.threat='CRITICAL';}
}
function saveAiProfile(){ saveJSON(KEY_AI, aiProfile); }
function broadcastAiProfile(){
  const frame = document.getElementById('gameFrame');
  if(!currentGameId) return;
  try{ frame.contentWindow.postMessage({type:'AI_PROFILE', profile:aiProfile}, window.location.origin); }catch(e){}
}

function updateUI(){
  document.getElementById('pointsVal').textContent = points;
  const tier  = aiProfile.tier || 'EASY';
  const s     = aiProfile.atmosphereScore;
  const icons = {EASY:'😊', NORMAL:'🤔', HARD:'😤', EXTREME:'😈'};
  const aiBtn = document.getElementById('aiBtn');
  aiBtn.className   = 'tier-' + tier.toLowerCase();
  aiBtn.textContent = (icons[tier]||'🤖') + ' ' + s;
  document.getElementById('aiBadge').textContent  = tier;
  document.getElementById('aiBadge').className    = 'ai-badge tier-' + tier.toLowerCase();
  document.getElementById('aiMood').textContent   = aiProfile.mood   || '-';
  document.getElementById('aiThreat').textContent = aiProfile.threat || '-';
  document.getElementById('aiAtmNum').textContent = s;
  document.getElementById('aiFill').style.width   = s + '%';
  document.getElementById('aiFill').style.background =
    s>=80 ? 'linear-gradient(90deg,#38bdf8,#0ea5e9)':
    s>=60 ? 'linear-gradient(90deg,#4ade80,#22c55e)':
    s>=20 ? 'linear-gradient(90deg,#f97316,#ef4444)':
            'linear-gradient(90deg,#ef4444,#a855f7)';

  // body tier 클래스 — 전체 화면 테마
  document.body.className = document.body.className
    .replace(/\btier-\w+\b/g, '').trim();
  document.body.classList.add('tier-' + tier.toLowerCase());

  // atmOverlay
  const ov = document.getElementById('atmOverlay');
  ov.className = s>=80?'atm-easy':s>=60?'atm-normal':s>=40?'atm-hard1':s>=20?'atm-hard2':'atm-extreme';

  // 경고 배너
  const banner = document.getElementById('warnBanner');
  if(s<=0){
    banner.textContent='😈 AI가 완전히 지배했습니다 — 분위기 0점';
    banner.classList.add('show');
    document.body.classList.add('quake-on');
    clearTimeout(quakeTimer);
    quakeTimer = setTimeout(()=>document.body.classList.remove('quake-on'),1000+Math.random()*1000);
  }else if(s<20){
    banner.textContent='⚠️ AI가 분위기를 장악했다. 위험 수위 초과!';
    banner.classList.add('show');
    document.body.classList.remove('quake-on');
  }else{
    banner.classList.remove('show');
    document.body.classList.remove('quake-on');
  }
  /* ★ 게임바 포인트도 업데이트 */
  document.getElementById('gameBarPoint').textContent = points;
  // 게임 카드 테두리 tier 색상
  updateCardTheme(tier);
}

function updateCardTheme(tier){
  const colors = {
    EASY:   'rgba(56,189,248,.25)',
    NORMAL: 'rgba(74,222,128,.15)',
    HARD:   'rgba(251,146,60,.3)',
    EXTREME:'rgba(239,68,68,.35)',
  };
  const glows = {
    EASY:   '0 0 8px rgba(56,189,248,.15)',
    NORMAL: 'none',
    HARD:   '0 0 10px rgba(251,146,60,.2)',
    EXTREME:'0 0 14px rgba(239,68,68,.25)',
  };
  const borderColor = colors[tier] || colors.NORMAL;
  const glow = glows[tier] || 'none';
  document.querySelectorAll('.g-card').forEach(card=>{
    card.style.borderColor = borderColor;
    card.style.boxShadow   = glow;
  });
}

function toggleAiPopup(){ document.getElementById('aiPopup').classList.toggle('show'); }
document.addEventListener('click', e => {
  const p=document.getElementById('aiPopup'), btn=document.getElementById('aiBtn');
  if(!p.contains(e.target) && !btn.contains(e.target)) p.classList.remove('show');

  // invModal 외부 클릭 닫기
  const inv=document.getElementById('invModal'), invBtn=document.getElementById('invBtn');
  if(inv.classList.contains('show') && !inv.querySelector('.modal-box').contains(e.target) && !invBtn.contains(e.target)){
    toggleInvModal(false);
  }

  // exchangeModal 외부 클릭 닫기
  const exch=document.getElementById('exchangeModal');
  if(exch.classList.contains('show') && !exch.querySelector('.modal-box').contains(e.target)){
    closeExchangeModal();
  }
});

/* ════════════════════════════════
   커스텀 디스플레이 렌더
   ════════════════════════════════ */
function renderEgDisplay(){
  const textEl   = document.getElementById('egText');
  const cursorEl = document.getElementById('egCursor');
  if(egVal <= 0){
    textEl.innerHTML = '';
    textEl.appendChild(cursorEl);
  } else {
    const won = egVal * P_TO_WON;
    textEl.innerHTML =
      `<span class="pt">${egVal}P</span>` +
      `<span class="arrow"> → </span>` +
      `<span class="won">₩${won.toLocaleString('ko-KR')}</span>`;
    textEl.appendChild(cursorEl);
  }
}
function renderEpDisplay(){
  const textEl   = document.getElementById('epText');
  const cursorEl = document.getElementById('epCursor');
  if(epVal <= 0){
    textEl.innerHTML = '';
    textEl.appendChild(cursorEl);
  } else {
    const p = Math.floor(epVal / P_TO_WON);
    textEl.innerHTML =
      `<span class="won">₩${epVal.toLocaleString('ko-KR')}</span>` +
      `<span class="arrow"> → </span>` +
      `<span class="pt">+${p}P</span>`;
    textEl.appendChild(cursorEl);
  }
}
function focusEgInput(){ document.getElementById('egInput').focus(); }
function focusEpInput(){ document.getElementById('epInput').focus(); }

/* ════════════════════════════════
   통합 환전 모달
   ════════════════════════════════ */
function openExchangeModal(gameId){
  try{
  exchTargetGame = gameId || currentGameId;
  if(!exchTargetGame){ console.warn('[충전] exchTargetGame이 null'); return; }
  const g   = GAMES.find(x => x.id === exchTargetGame);
  const bal = getGameBal(exchTargetGame);
  document.getElementById('exchModalTitle').textContent = g ? `💱 ${g.name} 환전` : '💱 환전';

  // AI 분위기 수수료/보너스 안내
  const tier = aiProfile.tier || 'NORMAL';
  const feeRate = TIER_EXCH_FEE[tier] ?? 0;
  const feeColors = {EASY:'#00e5a0', NORMAL:'', HARD:'#ffaa33', EXTREME:'#ff4444'};
  const egNotice = document.getElementById('egFeeNotice');
  const epNotice = document.getElementById('epFeeNotice');
  if(egNotice){
    if(feeRate < 0)       egNotice.textContent = `😊 보너스 ${Math.round(-feeRate*100)}%`;
    else if(feeRate > 0)  egNotice.textContent = `😈 수수료 ${Math.round(feeRate*100)}%`;
    else                  egNotice.textContent = '';
    egNotice.style.color = feeColors[tier] || '';
  }
  if(epNotice){
    if(feeRate < 0)       epNotice.textContent = `😊 보너스 ${Math.round(-feeRate*100)}%`;
    else if(feeRate > 0)  epNotice.textContent = `😈 수수료 ${Math.round(feeRate*100)}%`;
    else                  epNotice.textContent = '';
    epNotice.style.color = feeColors[tier] || '';
  }

  egVal = 0;
  document.getElementById('eg_points').textContent = points;
  document.getElementById('eg_bal').textContent    = bal.toLocaleString('ko-KR');
  document.getElementById('egInput').value         = '';
  document.getElementById('egDoBtn').disabled      = true;
  renderEgDisplay();

  epVal = 0;
  document.getElementById('ep_bal').textContent    = bal.toLocaleString('ko-KR');
  document.getElementById('ep_points').textContent = points;
  document.getElementById('epInput').value         = '';
  document.getElementById('epDoBtn').disabled      = true;
  renderEpDisplay();

  switchExchTab('toGame');
  document.getElementById('iframeView').style.visibility = 'hidden';
  document.getElementById('exchangeModal').classList.add('show');
  }catch(err){ console.error('[충전 모달 오류]', err); showToast('⚠️ 충전 모달 열기 실패: ' + err.message); }
}
function closeExchangeModal(){
  egVal = 0; epVal = 0;
  renderEgDisplay(); renderEpDisplay();
  document.getElementById('egInput').value  = '';
  document.getElementById('epInput').value  = '';
  document.getElementById('egDoBtn').disabled = true;
  document.getElementById('epDoBtn').disabled = true;
  document.getElementById('exchangeModal').classList.remove('show');
  document.getElementById('iframeView').style.visibility = '';
}
function switchExchTab(tab){
  exchTab = tab;
  document.getElementById('tabToGame').classList.toggle('active', tab==='toGame');
  document.getElementById('tabToPoint').classList.toggle('active', tab==='toPoint');
  document.getElementById('secToGame').classList.toggle('show', tab==='toGame');
  document.getElementById('secToPoint').classList.toggle('show', tab==='toPoint');
}

/* 탭1: P → 게임머니 */
function addEgPt(p){
  egVal = Math.min((egVal || 0) + p, points);
  document.getElementById('egInput').value = egVal;
  refreshEg();
}
function setEg50(){
  egVal = Math.floor(points * 0.5);
  document.getElementById('egInput').value = egVal;
  refreshEg();
}
function onEgInput(){
  egVal = Math.min(Math.max(0, parseInt(document.getElementById('egInput').value) || 0), points);
  refreshEg();
}
function onEgKey(e){
  if(e.key === 'Backspace'){
    const str = String(egVal);
    egVal = str.length > 1 ? parseInt(str.slice(0,-1)) : 0;
    document.getElementById('egInput').value = egVal || '';
    refreshEg();
    e.preventDefault();
  }
}
function refreshEg(){
  renderEgDisplay();
  document.getElementById('egDoBtn').disabled = egVal < 1 || egVal > points;
}
function doEg(){
  if(egVal < 1){ showToast('⚠️ 포인트를 입력해주세요'); return; }
  if(egVal > points){ showToast(`⚠️ 포인트 부족! 현재: ${points}P`); return; }
  const balKey = BAL_KEYS[exchTargetGame];
  if(!balKey){ showToast('⚠️ 환전 불가 게임'); return; }
  // AI 분위기 환전 수수료/보너스
  const tier = aiProfile.tier || 'NORMAL';
  const feeRate = TIER_EXCH_FEE[tier] ?? 0;
  const baseWon = egVal * P_TO_WON;
  const won = Math.round(baseWon * (1 - feeRate)); // 수수료 차감 or 보너스 추가
  points -= egVal;
  saveJSON(KEY_POINTS, points);
  const newBal = getGameBal(exchTargetGame) + won;
  saveJSON(balKey, newBal);
  if(currentGameId === exchTargetGame){
    try{
      document.getElementById('gameFrame').contentWindow
        .postMessage({type:'CHARGE', amount:won}, window.location.origin);
    }catch(e){}
  }
  broadcastPointUpdate();
  let egToast = `✅ ${egVal}P → ₩${won.toLocaleString('ko-KR')} 충전 완료!`;
  if(feeRate > 0)  egToast += ` (😈 수수료 ${Math.round(feeRate*100)}%)`;
  if(feeRate < 0)  egToast += ` (😊 보너스 ${Math.round(-feeRate*100)}%)`;
  closeExchangeModal();
  updateUI(); buildGrid();
  updateGameBar(exchTargetGame);
  showToast(egToast);
}

/* 탭2: 게임머니 → P */
function addEpAmount(won){
  const bal = getGameBal(exchTargetGame);
  epVal = Math.min((epVal || 0) + won, bal);
  document.getElementById('epInput').value = epVal;
  refreshEp();
}
function setEp50(){
  const bal  = getGameBal(exchTargetGame);
  const half = Math.floor(bal * 0.5);
  epVal = Math.floor(half / P_TO_WON) * P_TO_WON;
  document.getElementById('epInput').value = epVal;
  refreshEp();
}
function onEpInput(){
  const bal = getGameBal(exchTargetGame);
  epVal = Math.max(0, Math.min(parseInt(document.getElementById('epInput').value) || 0, bal));
  refreshEp();
}
function onEpKey(e){
  if(e.key === 'Backspace'){
    const str = String(epVal);
    epVal = str.length > 1 ? parseInt(str.slice(0,-1)) : 0;
    document.getElementById('epInput').value = epVal || '';
    refreshEp();
    e.preventDefault();
  }
}
function refreshEp(){
  renderEpDisplay();
  const bal     = getGameBal(exchTargetGame);
  const isValid = epVal >= P_TO_WON && epVal <= bal && epVal % P_TO_WON === 0;
  document.getElementById('epDoBtn').disabled = !isValid;
}
function doEp(){
  if(epVal < P_TO_WON){ showToast('⚠️ 최소 100,000원부터 환전 가능합니다'); return; }
  if(epVal % P_TO_WON !== 0){ showToast('⚠️ 10만원 단위로만 환전 가능합니다'); return; }
  const balKey = BAL_KEYS[exchTargetGame];
  if(!balKey){ showToast('⚠️ 환전 불가 게임'); return; }
  const bal = getGameBal(exchTargetGame);
  if(epVal > bal){ showToast(`⚠️ 잔금 부족! 현재: ₩${bal.toLocaleString('ko-KR')}`); return; }
  // AI 분위기 환전 수수료/보너스 (게임머니→포인트 방향도 동일 적용)
  const tier = aiProfile.tier || 'NORMAL';
  const feeRate = TIER_EXCH_FEE[tier] ?? 0;
  const basePts = Math.floor(epVal / P_TO_WON);
  // 수수료: 포인트 수령량을 줄임 / 보너스: 늘림
  const pToAdd = Math.max(1, Math.round(basePts * (1 - feeRate)));
  const newBal = bal - epVal;
  saveJSON(balKey, newBal);
  points += pToAdd;
  saveJSON(KEY_POINTS, points);
  if(currentGameId === exchTargetGame){
    try{
      document.getElementById('gameFrame').contentWindow
        .postMessage({type:'BALANCE_UPDATE', balance:newBal}, window.location.origin);
    }catch(e){}
  }
  broadcastPointUpdate();
  let epToast = `✅ ₩${epVal.toLocaleString('ko-KR')} → +${pToAdd}P 환전 완료!`;
  if(feeRate > 0)  epToast += ` (😈 수수료 ${Math.round(feeRate*100)}%)`;
  if(feeRate < 0)  epToast += ` (😊 보너스 ${Math.round(-feeRate*100)}%)`;
  closeExchangeModal();
  updateUI(); buildGrid();
  updateGameBar(exchTargetGame);
  showToast(epToast);
}

function getGameBal(gameId){
  const key = BAL_KEYS[gameId];
  if(!key) return 0; // 등록되지 않은 게임 ID 방어
  return parseInt(localStorage.getItem(key) || '0') || 0;
}
function showToast(msg, dur=2600){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('show'), dur);
}

// 뒤로가기 처리
window.addEventListener('popstate', function(){
  if(currentGameId){
    showHome();
  } else {
    sessionStorage.setItem('ORACLE_ENTRY', Date.now());
    window.location.href = 'index.html';
  }
});

init();
</script>
