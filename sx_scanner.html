function buildLabData(rows,ticker,isCoin){
  // Signal Lab의 Ind 객체 사용
  const tf='1d';
  const n=rows.length,c=rows.map(r=>r.c),price=c[n-1];
  const mp={short:5,mid:20,long:60,xlong:120};
  const prev1=c[n-2]??price,prev5=c[Math.max(0,n-6)]??price;
  const prev20=c[Math.max(0,n-21)]??price,prev60=c[Math.max(0,n-61)]??price;
  const sma=p=>n>=p?c.slice(-p).reduce((a,b)=>a+b)/p:null;
  const ma5=sma(mp.short)??price,ma10=sma(Math.round((mp.short+mp.mid)/2))??price,ma20=sma(mp.mid)??price;
  const ma60=sma(mp.long),ma120=sma(mp.xlong);
  const ema9=Ind.ema(c,9),ema21=Ind.ema(c,21);
  const rsiArr=Ind.rsi(c),rsiNow=rsiArr[n-1]??50;
  const macdO=Ind.macd(c),macdL={line:macdO.line[n-1],sig:macdO.sig[n-1],hist:macdO.hist[n-1],prevHist:macdO.hist[n-2]};
  const bbArr=Ind.bb(c),bbL=bbArr[n-1];
  const stO=Ind.stoch(rows),stN={k:stO.k[n-1]??50,d:stO.d[n-1]??50};
  const cciArr=Ind.cci(rows),cciN=cciArr[n-1]??0;
  const adxO=Ind.adx(rows),adxN={adx:adxO.adx[n-1]??0,pdi:adxO.pdi[n-1]??0,mdi:adxO.mdi[n-1]??0};
  const atrArr=Ind.atr(rows),atrN=atrArr[n-1]??0;
  const obvArr=Ind.obv(rows);
  const vwapArr=Ind.vwap(rows,20),vwapNow=vwapArr[n-1];
  const volProfile=Ind.volumeProfile(rows.slice(-60),20);
  const high60=Math.max(...c.slice(-60)),low60=Math.min(...c.slice(-60));
  const pos60=(high60>low60)?(price-low60)/(high60-low60):0.5;
  const w52=rows.slice(-260),high52=Math.max(...w52.map(r=>r.h)),low52=Math.min(...w52.map(r=>r.l));
  const pos52=(high52>low52)?(price-low52)/(high52-low52):0.5;
  const trend20=((c[n-1]-c[Math.max(0,n-21)])/c[Math.max(0,n-21)])*100;
  const vol20avg=rows.slice(-21,-1).reduce((a,b)=>a+b.v,0)/20||1;
  const _tfMs={'1d':864e5};
  const _lastT=rows[n-1].t;
  const _lastMs=typeof _lastT==='number'?_lastT:new Date(_lastT).getTime();
  const isIncomplete=(_lastMs+864e5)>Date.now();
  const _volConfirmed=isIncomplete&&n>=2?rows[n-2]:rows[n-1];
  const volRatio=_volConfirmed.v/vol20avg*100;
  const confirmedVol=isIncomplete?{date:new Date(_volConfirmed.t).toISOString().slice(0,10),volume:Math.round(_volConfirmed.v),ratio_pct:+(_volConfirmed.v/vol20avg*100).toFixed(1)}:null;
  const maAlign=ma60?(price>ma5&&ma5>ma20&&ma20>ma60?'정배열':price<ma5&&ma5<ma20&&ma20<ma60?'역배열':'혼재'):(price>ma5&&ma5>ma20?'정배열':price<ma5&&ma5<ma20?'역배열':'혼재');
  const rsiDiv=Ind.rsiDiv(c,rsiArr);
  const macdDiv=Ind.macdDiv(c,macdO);
  const bbPctB=bbL?(price-bbL.lower)/(bbL.upper-bbL.lower)*100:null;
  const patterns=detectPatterns(rows.slice(-5));
  const change1d=((price-prev1)/prev1)*100;
  const change5d=((price-prev5)/prev5)*100;
  const change20d=((price-prev20)/prev20)*100;
  const change60d=((price-prev60)/prev60)*100;

  // 피보나치
  const fibBasis=(()=>{
    const rng=high60-low60;if(rng<=0)return null;
    const dp2=price>100?2:4;
    const r60=rows.slice(-Math.min(60,n));
    let hiDate=null,loDate=null;
    r60.forEach(r=>{if(r.h>=high60)hiDate=new Date(r.t).toISOString().slice(0,10);if(r.l<=low60)loDate=new Date(r.t).toISOString().slice(0,10);});
    return{swing_high:{price:+high60.toFixed(dp2),date:hiDate},swing_low:{price:+low60.toFixed(dp2),date:loDate},
    levels:{fib_236:+(high60-rng*0.236).toFixed(dp2),fib_382:+(high60-rng*0.382).toFixed(dp2),fib_500:+(high60-rng*0.5).toFixed(dp2),fib_618:+(high60-rng*0.618).toFixed(dp2),fib_786:+(high60-rng*0.786).toFixed(dp2)}};
  })();

  // 지지/저항 간이 계산
  const srLevels={resistance:[],support:[]};
  if(bbL&&bbL.upper>price)srLevels.resistance.push({level:+bbL.upper.toFixed(2),label:'BB상단',dist_pct:+((bbL.upper-price)/price*100).toFixed(1)});
  if(ma60&&ma60>price)srLevels.resistance.push({level:+ma60.toFixed(2),label:`MA${mp.long}`,dist_pct:+((ma60-price)/price*100).toFixed(1)});
  if(ma60&&ma60<price)srLevels.support.push({level:+ma60.toFixed(2),label:`MA${mp.long}`,dist_pct:+((ma60-price)/price*100).toFixed(1)});
  if(ma20<price)srLevels.support.push({level:+ma20.toFixed(2),label:`MA${mp.mid}`,dist_pct:+((ma20-price)/price*100).toFixed(1)});
  if(bbL&&bbL.lower<price)srLevels.support.push({level:+bbL.lower.toFixed(2),label:'BB하단',dist_pct:+((bbL.lower-price)/price*100).toFixed(1)});

  // MACD 히스토그램 추세
  const _hArr=macdO.hist,_hn=_hArr.length;
  const macdHistTrend=(()=>{
    if(_hn<3)return null;
    const r5=_hArr.slice(-5).map(v=>v!=null?+v.toFixed(2):null);
    const valid=r5.filter(v=>v!=null);if(valid.length<3)return null;

const Ind={
  ema(arr,p){const k=2/(p+1);let s=arr[0];return arr.map((v,i)=>i===0?s:(s=v*k+s*(1-k)));},
  sma(arr,p){return arr.map((_,i)=>i<p-1?null:arr.slice(i-p+1,i+1).reduce((a,b)=>a+b)/p);},
  rsi(c,p=14){let g=0,l=0;for(let i=1;i<=p;i++){const d=c[i]-c[i-1];if(d>=0)g+=d;else l-=d;}g/=p;l/=p;const out=new Array(c.length).fill(null);out[p]=l===0?100:100-100/(1+g/l);for(let i=p+1;i<c.length;i++){const d=c[i]-c[i-1];g=(g*(p-1)+Math.max(d,0))/p;l=(l*(p-1)+Math.max(-d,0))/p;out[i]=l===0?100:100-100/(1+g/l);}return out;},
  macd(c){const ef=this.ema(c,12),es=this.ema(c,26);const line=ef.map((v,i)=>v-es[i]);const sig=this.ema(line,9);return{line,sig,hist:line.map((v,i)=>v-sig[i])};},
  bb(c,p=20,m=2){return c.map((_,i)=>{if(i<p-1)return null;const sl=c.slice(i-p+1,i+1),mid=sl.reduce((a,b)=>a+b)/p;const std=Math.sqrt(sl.reduce((a,b)=>a+(b-mid)**2)/p);return{upper:mid+m*std,mid,lower:mid-m*std};});},
  stoch(rows,kp=14,dp=3){const kArr=[];for(let i=0;i<rows.length;i++){if(i<kp-1){kArr.push(null);continue;}const sl=rows.slice(i-kp+1,i+1);const hh=Math.max(...sl.map(r=>r.h)),ll=Math.min(...sl.map(r=>r.l));kArr.push(hh===ll?50:((rows[i].c-ll)/(hh-ll))*100);}const dArr=kArr.map((_,i)=>{if(i<kp+dp-2)return null;const sl=kArr.slice(i-dp+1,i+1).filter(v=>v!=null);return sl.length===dp?sl.reduce((a,b)=>a+b)/dp:null;});return{k:kArr,d:dArr};},
  cci(rows,p=20){return rows.map((_,i)=>{if(i<p-1)return null;const sl=rows.slice(i-p+1,i+1);const tp=sl.map(r=>(r.h+r.l+r.c)/3),mean=tp.reduce((a,b)=>a+b)/p;const md=tp.reduce((a,b)=>a+Math.abs(b-mean),0)/p;return md===0?0:(tp[p-1]-mean)/(0.015*md);});},
  adx(rows,p=14){const tr=[],pdm=[],mdm=[];for(let i=1;i<rows.length;i++){const c=rows[i],pr=rows[i-1];tr.push(Math.max(c.h-c.l,Math.abs(c.h-pr.c),Math.abs(c.l-pr.c)));const up=c.h-pr.h,dn=pr.l-c.l;pdm.push(up>dn&&up>0?up:0);mdm.push(dn>up&&dn>0?dn:0);}const sTR=this.ema(tr,p),sPDM=this.ema(pdm,p),sMDM=this.ema(mdm,p);const adxOut=new Array(rows.length).fill(null),pdiOut=new Array(rows.length).fill(null),mdiOut=new Array(rows.length).fill(null);const dxArr=[];for(let i=0;i<sTR.length;i++){const st=sTR[i];if(!st){dxArr.push(null);continue;}const pdi=(sPDM[i]/st)*100,mdi=(sMDM[i]/st)*100,sum=pdi+mdi;dxArr.push(sum?Math.abs(pdi-mdi)/sum*100:0);pdiOut[i+1]=pdi;mdiOut[i+1]=mdi;}const sma14=this.sma(dxArr.filter(v=>v!=null),p);let si=0;for(let i=1;i<rows.length;i++){adxOut[i]=sma14[si]??null;si++;}return{adx:adxOut,pdi:pdiOut,mdi:mdiOut};},
  atr(rows,p=14){const tr=[];for(let i=1;i<rows.length;i++){const c=rows[i],pr=rows[i-1];tr.push(Math.max(c.h-c.l,Math.abs(c.h-pr.c),Math.abs(c.l-pr.c)));}const out=new Array(rows.length).fill(null);for(let i=p;i<rows.length;i++)out[i]=tr.slice(i-p,i).reduce((a,b)=>a+b)/p;return out.map((v,i)=>v&&rows[i].c?v/rows[i].c*100:null);},
  obv(rows){const out=[0];for(let i=1;i<rows.length;i++){const d=rows[i].c-rows[i-1].c;out.push(out[i-1]+(d>0?rows[i].v:d<0?-rows[i].v:0));}return out;},
  vwap(rows,period=20){const n=rows.length,out=new Array(n).fill(null);for(let i=Math.max(0,n-period);i<n;i++){let cumTPV=0,cumV=0;for(let j=Math.max(0,n-period);j<=i;j++){const tp=(rows[j].h+rows[j].l+rows[j].c)/3;cumTPV+=tp*rows[j].v;cumV+=rows[j].v;}out[i]=cumV>0?cumTPV/cumV:null;}return out;},
  volumeProfile(rows,bins=20){const lo=Math.min(...rows.map(r=>r.l)),hi=Math.max(...rows.map(r=>r.h));if(hi<=lo)return{bins:[],poc:null,vahigh:null,valow:null};const step=(hi-lo)/bins,buckets=new Array(bins).fill(0);rows.forEach(r=>{const mid=(r.h+r.l)/2,idx=Math.min(bins-1,Math.floor((mid-lo)/step));buckets[idx]+=r.v;});const totalV=buckets.reduce((a,b)=>a+b,0);const maxIdx=buckets.indexOf(Math.max(...buckets));const poc=lo+(maxIdx+0.5)*step;let vaVol=buckets[maxIdx],loIdx=maxIdx,hiIdx=maxIdx;while(vaVol<totalV*0.7&&(loIdx>0||hiIdx<bins-1)){const addLo=loIdx>0?buckets[loIdx-1]:0;const addHi=hiIdx<bins-1?buckets[hiIdx+1]:0;if(addLo>=addHi&&loIdx>0){loIdx--;vaVol+=buckets[loIdx];}else if(hiIdx<bins-1){hiIdx++;vaVol+=buckets[hiIdx];}else if(loIdx>0){loIdx--;vaVol+=buckets[loIdx];}else break;}return{bins:buckets.map((v,i)=>({price:+(lo+(i+0.5)*step).toFixed(2),volume:v})),poc:+poc.toFixed(2),vahigh:+(lo+(hiIdx+1)*step).toFixed(2),valow:+(lo+loIdx*step).toFixed(2)};},
  rsiDiv(c,rsiArr,lb=20){const n=c.length;if(n<lb+2)return'none';const rN=rsiArr[n-1],rO=rsiArr[n-1-lb],pN=c[n-1],pO=c[n-1-lb];if(rN==null||rO==null)return'none';if(pN>pO&&rN<rO&&rN>55)return'bearish';if(pN<pO&&rN>rO&&rN<45)return'bullish';return'none';},
  macdDiv(c,macdO){const n=c.length;if(n<30)return'none';const hists=macdO.hist.slice(-20).filter(v=>v!=null),cls=c.slice(-20);if(hists.length<10)return'none';const hNow=hists[hists.length-1],hOld=hists[0],pNow=cls[cls.length-1],pOld=cls[0];if(pNow>pOld&&hNow<hOld&&hNow>0)return'bearish';if(pNow<pOld&&hNow>hOld&&hNow<0)return'bullish';return'none';},
};
function detectPatterns(rows){

    const suffix=cursor<scanEnd?` [${n-cursor}봉전]`:'';
    if(range>0){
      if(body/range<0.1)pats.push('도지'+suffix);
      else if(last.c>last.o&&body/range>0.7)pats.push('장대양봉 — 강한 매수세'+suffix);
      else if(last.c<last.o&&body/range>0.7)pats.push('장대음봉 — 강한 매도세'+suffix);
    }
    if(cursor>=2){
      const prev2=rows[cursor-2];
      if(prev.c<prev.o&&last.c>last.o&&last.c>prev.o&&last.o<prev.c)pats.push('불리시 인걸핑'+suffix);
      if(prev.c>prev.o&&last.c<last.o&&last.c<prev.o&&last.o>prev.c)pats.push('베어리시 인걸핑'+suffix);
    }
  }
  return pats.length?pats:['뚜렷한 패턴 없음'];
}
