<!doctype html>
<html lang="ko">
<head><script>
// ── ORACLE 토큰가드 ──
(function(){
  var t=sessionStorage.getItem('ORACLE_ENTRY');
  var ok=t&&(Date.now()-Number(t)<5000);
  if(ok) sessionStorage.removeItem('ORACLE_ENTRY');
  if(ok) return;
  function _show404(){
    document.body.style.cssText='margin:0;padding:0;overflow:hidden';
    Array.from(document.body.children).forEach(function(el){el.style.display='none'});
    var d=document.createElement('div');
    d.id='_oracle404';
    d.innerHTML='<div style="position:fixed;inset:0;z-index:999999;background:#0f1724;color:#e8eaf0;'
      +'font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;display:flex;align-items:center;'
      +'justify-content:center;text-align:center;padding:20px">'
      +'<div style="max-width:360px">'
      +'<div style="width:120px;height:120px;background:#fff;border-radius:50%;margin:0 auto 32px;'
      +'display:flex;align-items:center;justify-content:center">'
      +'<div style="width:72px;height:52px;border:3px solid #333;border-radius:6px;position:relative;'
      +'display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:24px;'
      +'font-weight:700;color:#d32f2f">404</div></div>'
      +'<h1 style="font-size:20px;font-weight:700;margin:0 0 12px">페이지를 찾을 수 없습니다.</h1>'
      +'<p style="font-size:14px;color:#8a91a0;line-height:1.6;margin:0 0 32px">'
      +'존재하지 않는 주소를 입력하셨거나,<br>'
      +'요청하신 페이지의 주소가 변경/삭제되어 찾을 수 없습니다.</p>'
      +'<a href="index.html" style="display:block;width:100%;padding:16px;background:#d32f2f;color:#fff;'
      +'font-size:16px;font-weight:700;border:none;border-radius:8px;cursor:pointer;text-decoration:none;'
      +'text-align:center">홈으로 이동</a>'
      +'</div></div>';
    document.body.appendChild(d);
  }
  if(document.body) _show404();
  else document.addEventListener('DOMContentLoaded', _show404);
})();
</script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
<title>🐹 두더지 러시</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080f; --panel:#0d0f1e; --panel2:#111428;
  --accent:#a855f7; --accent2:#7c3aed;
  --gold:#fbbf24; --gold2:#f59e0b;
  --red:#ef4444; --green:#22c55e; --blue:#3b82f6;
  --orange:#f97316; --text:#f1f5f9; --muted:#94a3b8;
  --border:rgba(168,85,247,.2);
  --radius:16px;
  --shadow:0 8px 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0; padding:0;
  font-family:'Noto Sans KR',system-ui,sans-serif;
  background:
    radial-gradient(ellipse 900px 600px at 10% -10%, rgba(168,85,247,.18), transparent 55%),
    radial-gradient(ellipse 700px 500px at 90% 30%, rgba(59,130,246,.12), transparent 50%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

/* ── 단독 실행 topBar ── */
#topBar{
  position:sticky;top:0;left:0;right:0;z-index:300;
  height:44px;
  background:rgba(7,8,15,.97);
  border-bottom:1px solid rgba(168,85,247,.22);
  display:flex;align-items:center;padding:0 10px;gap:6px;
  backdrop-filter:blur(12px);
}
body.in-iframe #topBar{display:none!important;}
#tbHomeBtn{
  width:34px;height:34px;background:rgba(168,85,247,.15);
  border:1px solid rgba(168,85,247,.3);border-radius:9px;
  color:#f1f5f9;font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  appearance:none;box-shadow:none;padding:0;
}
#tbHomeBtn:hover{opacity:.85;box-shadow:none}
#tbTitle{
  font-family:'Black Han Sans',sans-serif;font-size:16px;
  color:#c084fc;letter-spacing:.05em;
}
.tb-sp{flex:1;}
#tbBal{
  background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.28);
  border-radius:8px;padding:4px 8px;
  font-size:12px;color:#fbbf24;font-weight:700;white-space:nowrap;
}
#tbPoint{
  background:rgba(168,85,247,.15);border:1px solid rgba(168,85,247,.35);
  border-radius:8px;padding:4px 8px;
  font-size:12px;color:#c084fc;font-weight:700;white-space:nowrap;
}
#tbCharge{
  background:linear-gradient(135deg,#7c3aed,#a855f7);border:none;
  border-radius:8px;color:#fff;font-size:12px;font-weight:700;
  padding:5px 10px;cursor:pointer;white-space:nowrap;box-shadow:none;
}
#tbCharge:hover{opacity:.85;box-shadow:none}

/* ── 레이아웃 ── */
.wrap{max-width:980px;margin:0 auto;padding:12px 10px 28px}

/* ── HUD 상단 ── */
.hud{
  background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(255,255,255,.01));
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:14px 16px;
  box-shadow:var(--shadow);
  margin-bottom:12px;
}
.hud-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.game-title{
  font-family:'Black Han Sans',sans-serif;
  font-size:1.25rem;
  letter-spacing:.05em;
  color:var(--text);
  display:flex;align-items:center;gap:8px;
}
.game-title span{
  font-size:.7rem;font-family:'Noto Sans KR',sans-serif;
  color:var(--muted);font-weight:700;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  border-radius:999px;padding:2px 9px;
}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{
  appearance:none;border:0;cursor:pointer;
  border-radius:10px;padding:9px 14px;
  font-family:'Noto Sans KR',sans-serif;
  font-weight:900;font-size:.82rem;
  color:var(--text);
  background:linear-gradient(135deg,rgba(168,85,247,.95),rgba(124,58,237,.92));
  box-shadow:0 4px 14px rgba(168,85,247,.25);
  transition:transform .1s,opacity .15s,box-shadow .15s;
}
button:hover{opacity:.88;box-shadow:0 6px 20px rgba(168,85,247,.38)}
button:active{transform:translateY(1px);opacity:.75}
button.secondary{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:none;
}
button.secondary:hover{background:rgba(255,255,255,.1);box-shadow:none}
button:disabled{opacity:.35;cursor:not-allowed;transform:none}

/* ── 스탯 바 ── */
.stat-bar{
  display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;
}
.pill{
  display:inline-flex;align-items:center;gap:7px;
  padding:7px 12px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.09);
  background:rgba(15,18,36,.6);
  backdrop-filter:blur(6px);
  color:var(--text);font-weight:700;font-size:.82rem;
  transition:border-color .3s;
}
.pill small{color:var(--muted);font-weight:800;font-size:.68rem;letter-spacing:.05em}
.pill.highlight{border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.07)}
.pill.active-event{border-color:rgba(168,85,247,.55);animation:pillPulse 1.4s ease infinite}
@keyframes pillPulse{0%,100%{box-shadow:none}50%{box-shadow:0 0 12px rgba(168,85,247,.4)}}

/* ── 타이머 바 ── */
.timer-bar-wrap{margin-top:10px;height:5px;background:rgba(255,255,255,.07);border-radius:999px;overflow:hidden}
.timer-bar-fill{
  height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--accent),var(--blue));
  transition:width .05s linear,background .5s;
}
.timer-bar-fill.warn{background:linear-gradient(90deg,var(--red),var(--orange))}

/* ── 게임 본체 ── */
.game-body{
  display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;
}

/* ── 보드 ── */
.board-card{
  flex:1;min-width:260px;
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));
  border:1px solid rgba(255,255,255,.08);
  border-radius:var(--radius);
  padding:14px;
  box-shadow:var(--shadow);
  position:relative;overflow:hidden;
}
/* 보드 배경 글로우 */
.board-card::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 40% at 50% 100%,rgba(168,85,247,.08),transparent 70%);
}

.grid{display:grid;gap:10px;position:relative;z-index:1}
.hole{
  position:relative;
  border-radius:14px;
  background:
    radial-gradient(28px 22px at 28% 28%, rgba(255,255,255,.10), transparent 60%),
    rgba(0,0,0,.28);
  border:1px solid rgba(255,255,255,.07);
  height:72px;
  overflow:hidden;
  cursor:pointer;
  transition:border-color .15s;
}
.hole:hover{border-color:rgba(168,85,247,.35)}
.hole:active .mole{filter:brightness(1.25)}
.hole::after{
  content:"";
  position:absolute;inset:auto 8px 7px 8px;height:9px;
  border-radius:999px;
  background:rgba(0,0,0,.32);
  filter:blur(1px);
}

/* ── 두더지 ── */
.mole{
  position:absolute;left:50%;bottom:-4px;
  transform:translate(-50%, 108%);
  width:62px;height:62px;
  border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  font-size:33px;
  transition:transform 130ms cubic-bezier(.2,.8,.4,1);
  will-change:transform;
  z-index:2;
}
.mole.show{transform:translate(-50%, 8%)}
.mole.run{transition:transform 85ms ease-in;transform:translate(-50%,125%)}

.mole.normal {background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.13)}
.mole.gold   {background:linear-gradient(180deg,rgba(251,191,36,.28),rgba(251,191,36,.10));border:1px solid rgba(251,191,36,.50);box-shadow:0 0 14px rgba(251,191,36,.2)}
.mole.bomb   {background:linear-gradient(180deg,rgba(239,68,68,.28),rgba(239,68,68,.10));border:1px solid rgba(239,68,68,.50);box-shadow:0 0 14px rgba(239,68,68,.15)}
.mole.time   {background:linear-gradient(180deg,rgba(59,130,246,.28),rgba(59,130,246,.10));border:1px solid rgba(59,130,246,.50);box-shadow:0 0 12px rgba(59,130,246,.15)}
.mole.light  {background:linear-gradient(180deg,rgba(34,197,94,.25),rgba(34,197,94,.10));border:1px solid rgba(34,197,94,.50);box-shadow:0 0 12px rgba(34,197,94,.15)}
.mole.trap   {background:linear-gradient(180deg,rgba(148,163,184,.18),rgba(148,163,184,.07));border:1px solid rgba(148,163,184,.38)}
.mole.split  {background:linear-gradient(180deg,rgba(168,85,247,.28),rgba(168,85,247,.10));border:1px solid rgba(168,85,247,.50);box-shadow:0 0 12px rgba(168,85,247,.2)}
.mole.run-type{background:linear-gradient(180deg,rgba(249,115,22,.26),rgba(249,115,22,.10));border:1px solid rgba(249,115,22,.48);box-shadow:0 0 12px rgba(249,115,22,.15)}
.mole.bonus  {background:linear-gradient(180deg,rgba(251,191,36,.14),rgba(59,130,246,.14));border:1px solid rgba(255,255,255,.2)}
.mole.runny  {background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.22)}

.mole .tag{
  position:absolute;top:5px;right:6px;
  font-size:10px;font-weight:900;
  padding:1px 5px;border-radius:999px;
  background:rgba(0,0,0,.42);
  border:1px solid rgba(255,255,255,.15);
  color:var(--text);letter-spacing:.03em;
}

/* gold 등장 시 box-shadow는 CSS에서 직접 정의 (.mole.gold) */

/* 히트 이펙트 */
.hit-fx{
  position:absolute;pointer-events:none;z-index:10;
  font-size:22px;font-weight:900;
  left:50%;top:30%;transform:translateX(-50%);
  opacity:1;
  animation:hitPop .55s ease forwards;
}
@keyframes hitPop{
  0%{transform:translateX(-50%) scale(.6);opacity:1}
  60%{transform:translateX(-50%) translateY(-22px) scale(1.15);opacity:1}
  100%{transform:translateX(-50%) translateY(-36px) scale(.9);opacity:0}
}

/* ── 사이드 패널 ── */
.side{
  width:min(320px,100%);
  display:flex;flex-direction:column;gap:10px;
}

/* KPI */
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.k{
  padding:10px 12px;border-radius:14px;
  border:1px solid rgba(255,255,255,.09);
  background:rgba(255,255,255,.03);
  transition:border-color .3s,background .3s;
}
.k:hover{background:rgba(255,255,255,.05)}
.k .l{font-size:11px;color:var(--muted);font-weight:900;letter-spacing:.15px;text-transform:uppercase}
.k .v{font-size:19px;font-weight:900;margin-top:5px;letter-spacing:-.02em}
.k .v.gold-val{color:var(--gold)}
.k .v.purple-val{color:var(--accent)}

/* 이벤트 박스 */
.eventBox{
  padding:11px 13px;border-radius:14px;
  border:1px dashed rgba(251,191,36,.35);
  background:rgba(251,191,36,.04);
  min-height:64px;
  transition:border-color .4s,background .4s;
}
.eventBox.active{
  border-color:rgba(168,85,247,.55);
  background:rgba(168,85,247,.07);
  animation:eventPulse 1.6s ease infinite;
}
@keyframes eventPulse{0%,100%{box-shadow:none}50%{box-shadow:0 0 20px rgba(168,85,247,.18)}}
.eventBox .l{font-size:11px;color:rgba(251,191,36,.9);font-weight:900;letter-spacing:.1px;text-transform:uppercase}
.eventBox.active .l{color:rgba(168,85,247,.9)}
.eventBox .v{margin-top:5px;font-weight:900;font-size:.88rem}
.eventBox .et{font-size:11px;color:var(--muted);font-weight:900;margin-top:3px}

/* 난이도 셀렉터 */
.diff-wrap label{font-size:11px;color:var(--muted);font-weight:900;letter-spacing:.1px;text-transform:uppercase;display:block;margin-bottom:6px}
select{
  width:100%;padding:10px 12px;border-radius:11px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.05);
  color:var(--text);font-weight:900;font-size:.82rem;
  font-family:'Noto Sans KR',sans-serif;
  outline:none;
  transition:border-color .2s,background .2s;
  cursor:pointer;
}
select:hover{border-color:rgba(168,85,247,.45);background:rgba(168,85,247,.06)}
select:focus{border-color:rgba(168,85,247,.6)}

/* 보상 안내 */
.reward-info{
  padding:10px 13px;border-radius:13px;
  background:rgba(255,255,255,.025);
  border:1px solid rgba(255,255,255,.07);
  font-size:12px;color:var(--muted);line-height:1.6;font-weight:700;
}
.reward-info b{color:var(--text)}

/* 힌트 */
.hint{
  font-size:.7rem;color:var(--muted);line-height:1.5;
  padding:9px 12px;border-radius:11px;
  background:rgba(255,255,255,.025);
  border:1px solid rgba(255,255,255,.06);
  margin-top:4px;
}
.hint b{color:rgba(255,255,255,.7)}

/* ── 토스트 ── */
.toast{
  position:fixed;left:50%;bottom:22px;
  transform:translateX(-50%) translateY(8px);
  background:rgba(10,12,24,.94);
  border:1px solid rgba(255,255,255,.13);
  padding:9px 16px;border-radius:999px;
  color:var(--text);font-weight:900;font-size:.82rem;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
  opacity:0;pointer-events:none;
  transition:opacity .16s ease,transform .16s ease;
  white-space:nowrap;z-index:999;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── 오버레이 / 모달 ── */
.overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;
  padding:16px;z-index:500;
}
.overlay.show{display:flex}
.modal{
  width:min(500px,100%);
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:20px;
  padding:22px 20px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
  animation:modalIn .22s cubic-bezier(.2,.9,.4,1);
}
@keyframes modalIn{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.modal h2{
  font-family:'Black Han Sans',sans-serif;
  font-size:1.1rem;letter-spacing:.05em;
  margin:0 0 10px 0;
}
.modal p{
  margin:6px 0;color:var(--muted);
  font-weight:700;line-height:1.55;
  font-size:.85rem;white-space:pre-line;
}
.modal .row{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.sep{height:1px;background:rgba(255,255,255,.09);margin:12px 0}

/* 결과 모달 전용 */
.result-score{
  text-align:center;padding:14px 0 8px;
}
.result-score .big{
  font-family:'Black Han Sans',sans-serif;
  font-size:3rem;letter-spacing:.02em;
  background:linear-gradient(135deg,var(--gold),var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  line-height:1;
}
.result-score .sub{font-size:.82rem;color:var(--muted);font-weight:700;margin-top:6px}
.reward-badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 16px;border-radius:999px;
  background:linear-gradient(135deg,rgba(251,191,36,.2),rgba(168,85,247,.2));
  border:1px solid rgba(251,191,36,.35);
  font-weight:900;font-size:.9rem;color:var(--gold);
  margin-top:8px;
}

/* ── 화면 흔들기 (폭탄) ── */
@keyframes bombShake{
  0%,100%{transform:translate(0,0)}
  20%{transform:translate(-5px,3px)}
  40%{transform:translate(5px,-3px)}
  60%{transform:translate(-3px,2px)}
  80%{transform:translate(4px,-2px)}
}
body.bomb-shake{animation:bombShake .3s ease}

/* ── 콤보 팝업 ── */
.combo-pop{
  position:fixed;left:50%;top:30%;transform:translateX(-50%);
  font-family:'Black Han Sans',sans-serif;
  font-size:2rem;letter-spacing:.05em;
  color:var(--gold);
  text-shadow:0 0 20px rgba(251,191,36,.6);
  pointer-events:none;z-index:600;
  opacity:0;
}
.combo-pop.show{animation:comboPop .7s ease forwards}
@keyframes comboPop{
  0%{opacity:0;transform:translateX(-50%) scale(.5)}
  30%{opacity:1;transform:translateX(-50%) scale(1.2)}
  60%{opacity:1;transform:translateX(-50%) scale(1)}
  100%{opacity:0;transform:translateX(-50%) translateY(-20px)}
}

/* ── 반응형 ── */
@media(max-width:600px){
  .side{width:100%}
  .kpi{grid-template-columns:repeat(4,1fr)}
  .k .v{font-size:15px}
  .hole{height:64px}
  .mole{width:54px;height:54px;font-size:28px}
}
/* fever */
body.fever-mode .grid{animation:feverGlow .5s ease infinite alternate;}
@keyframes feverGlow{from{box-shadow:0 0 20px rgba(255,208,74,.3);}to{box-shadow:0 0 50px rgba(255,208,74,.7);}}
body.fever-mode .hole{border-color:rgba(255,208,74,.6)!important;}
.fever-banner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:32px;font-weight:900;color:#FFD04A;text-shadow:0 0 20px rgba(255,208,74,.8);z-index:300;pointer-events:none;animation:feverPop .8s ease forwards;letter-spacing:3px;}
@keyframes feverPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3);}50%{opacity:1;transform:translate(-50%,-50%) scale(1.15);}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3) translateY(-40px);}}
/* boss */
.mole.boss .tag{background:#dc2626!important;}
.mole.boss span{font-size:2.2em!important;filter:drop-shadow(0 0 8px rgba(220,38,38,.6));}
.boss-hp{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);display:flex;gap:2px;z-index:5;}
.boss-hp-dot{width:10px;height:10px;background:#ef4444;border:1.5px solid #fff;border-radius:50%;}
.boss-hp-dot.gone{background:#555;opacity:.4;}
/* preview */
.hole.preview{animation:holeShake .12s ease 3;}
@keyframes holeShake{0%,100%{transform:translateX(0);}33%{transform:translateX(-3px);}66%{transform:translateX(3px);}}

</style>
</head>
<body>
<!-- 단독 실행 시 topBar (iframe 연동 시 자동 숨김) -->
<div id="topBar">
  <button id="tbHomeBtn" onclick="goHome()">🏠</button>
  <span id="tbTitle">🐹 두더지 러시</span>
  <div class="tb-sp"></div>

          6점↑1P · 12점↑2P · 18점↑3P · 24점↑4P · 30점↑5P

          <b>⭐황금 +3P</b> · <b>⏱️시간 +2s</b> · <b>⚡연쇄</b> · <b>🌀분열</b> · <b>💨도망 +2</b><br>
          <b>💣폭탄</b>은 점수 -2 · 콤보 초기화 | <b>🕳️트랩</b>은 0.9초 마비

<div class="toast" id="toast"></div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">안내</h2>
    <div id="modalResultArea"></div>
    <p id="modalBody"></p>
    <div class="sep"></div>
    <div class="row">
      <button id="modalOk">확인</button>
      <button class="secondary" id="modalClose">닫기</button>
    </div>
  </div>
</div>

<script>
(() => {
  // ════════════════════════════════════════════
  //  부모 연동 (postMessage)
  // ════════════════════════════════════════════
  let points = parseInt(localStorage.getItem("MG_POINTS")||"0")||0;
  let balance = parseInt(localStorage.getItem("MG_BAL_MOLE")||"0")||0;
  let atmosphereScore = 60;
  let aiTier = "NORMAL";
  let pendingSpend = null; // {id, cb}

  const ALLOWED_ORIGINS = [window.location.origin, 'null'];
  function isTrustedOrigin(o){ return ALLOWED_ORIGINS.includes(o) || o === window.location.origin; }
  function postToParent(payload){
    // iframe 제거 — postMessage 비활성화
  }

  function updateTier(){
    const s = atmosphereScore;
    if(s >= 80)      aiTier = "RELAXED";
    else if(s >= 60) aiTier = "NORMAL";
    else if(s >= 20) aiTier = "TENSE";
    else             aiTier = "HOSTILE";
    updateEntryCostUI(); // tier 바뀌면 입장료 UI 즉시 갱신
  }

  function renderMeta(){
    document.getElementById("points").textContent  = points ?? "-";
    document.getElementById("balance").textContent = balance != null ? balance.toLocaleString('ko-KR') : "-";
    document.getElementById("atmo").textContent    = atmosphereScore ?? "-";
    document.getElementById("tier").textContent    = aiTier ?? "-";
    /* 단독 실행 topBar 동기화 */
    const tb = document.getElementById("tbBalNum");
    const tp = document.getElementById("tbPointNum");
    if(tb) tb.textContent = balance != null ? Math.floor(balance).toLocaleString('ko-KR') : "0";
    if(tp) tp.textContent = points != null ? Math.floor(points).toLocaleString('ko-KR') : "0";
  }

  // 입장료 UI
  const entryCostLabel = document.getElementById("entryCostLabel");
  const diffSel = document.getElementById("difficulty");
  const ENTRY_COST_WON = 100000; // ₩100,000 고정 (난이도 무관)

  const TIER_ENTRY_MULT_DISPLAY = {RELAXED:0, NORMAL:1, TENSE:1.5, HOSTILE:2};
  function getEntryCost(){ return ENTRY_COST_WON; }
  function updateEntryCostUI(){
    if(!entryCostLabel) return;
    const base = ENTRY_COST_WON;
    const mult = TIER_ENTRY_MULT_DISPLAY[aiTier] ?? 1;
    if(mult === 0)      entryCostLabel.textContent = "0 (EASY 면제)";
    else if(mult !== 1) entryCostLabel.textContent = `${(base * mult).toLocaleString('ko-KR')} (×${mult} 패널티)`;
    else                entryCostLabel.textContent = base.toLocaleString('ko-KR');
  }
  // ✅ BUG FIX: change 이벤트 2개 → 1개로 통합 (아래 applyDifficulty 리스너와 합침)
  updateEntryCostUI();

  function requestSpendBalance(amount, cb){
    const amt = Math.max(0, Math.round(Number(amount) || 0));
    const id = "sb_" + Date.now() + "_" + Math.random().toString(16).slice(2);
    pendingSpend = {id, cb};
    /* REQUEST_SPEND_BALANCE 제거 - 게임 자체에서 localStorage 직접 처리 */
    // 안전 타임아웃
    setTimeout(()=>{
      if(pendingSpend && pendingSpend.id === id){
        const _cb = pendingSpend.cb; pendingSpend = null;
        _cb && _cb(false, 0, points, amt);
      }
    }, 1800);
  }

  window.addEventListener("message", (ev) => {
    if(!isTrustedOrigin(ev.origin)) return;
    const d = ev.data || {};

    if(d.type === "INIT"){
      points = Number.isFinite(d.points)  ? d.points  : (points  || 0);
      balance= Number.isFinite(d.balance) ? d.balance : (balance || 0);
      if(d.aiProfile && Number.isFinite(d.aiProfile.atmosphereScore)){
        atmosphereScore = d.aiProfile.atmosphereScore;
      } else if(Number.isFinite(d.atmosphereScore)){
        atmosphereScore = d.atmosphereScore;
      }
      // document.body.classList.add("in-iframe"); — iframe 제거됨
      updateTier(); renderMeta();
      showToast("연동 완료 ✅");
      return;
    }

    if(d.type === "AI_PROFILE" && d.profile){
      if(Number.isFinite(d.profile.atmosphereScore)){
        atmosphereScore = d.profile.atmosphereScore;
        updateTier(); renderMeta();
      }
      return;
    }

    if(d.type === "POINT_UPDATE"){
      if(Number.isFinite(d.points))  points  = d.points;
      if(Number.isFinite(d.balance)) balance = d.balance;
      renderMeta();
      return;
    }

    if(d.type === "CHARGE"){
      if(Number.isFinite(d.amount)) balance = (balance || 0) + d.amount;
      renderMeta();
      return;
    }

    if(d.type === "BALANCE_UPDATE"){
      if(!Game.running && Number.isFinite(d.balance)) balance = d.balance;
      renderMeta();
      return;
    }

    if(d.type === "SPEND_RESULT"){
      if(pendingSpend && d.requestId === pendingSpend.id){
        const cb = pendingSpend.cb;
        pendingSpend = null;
        if(typeof cb === "function") cb(!!d.ok, Number(d.spent||0), Number(d.points ?? points), Number(d.need||0));
      }
      if(Number.isFinite(d.points))  { points  = d.points;  renderMeta(); }
      if(Number.isFinite(d.balance)) { balance = d.balance; renderMeta(); } // balance 갱신 추가
      return;
    }
  });

  updateTier(); renderMeta();

  /* 단독 실행 버튼 함수 */
  function goHome(){ sessionStorage.setItem("ORACLE_ENTRY",Date.now()); window.location.href="mini_center.html"; }
  function requestCharge(){ sessionStorage.setItem("ORACLE_ENTRY",Date.now()); window.location.href="mini_center.html?charge=mole"; }
  window.goHome = goHome;
  window.requestCharge = requestCharge;

  /* iframe 즉시 감지 */
  // if(window.self !== window.top){ document.body.classList.add("in-iframe"); } — iframe 제거됨

  // ════════════════════════════════════════════
  //  UI 헬퍼
  // ════════════════════════════════════════════
  const toastEl = document.getElementById("toast");
  let toastTimer = null;
  function showToast(msg, dur=1500){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), dur);
  }

  const comboPop = document.getElementById("comboPop");
  function showComboPop(label){
    comboPop.textContent = label;
    comboPop.classList.remove("show");
    void comboPop.offsetWidth; // reflow
    comboPop.classList.add("show");
  }

  const overlay     = document.getElementById("overlay");
  const modalTitle  = document.getElementById("modalTitle");
  const modalBody   = document.getElementById("modalBody");
  const modalResultArea = document.getElementById("modalResultArea");

  function openModal(title, body, resultHTML="", okLabel="확인", okCallback=null){
    modalTitle.textContent = title;
    modalBody.textContent  = body;
    modalResultArea.innerHTML = resultHTML;
    const okBtn = document.getElementById("modalOk");
    okBtn.textContent = okLabel;
    okBtn._customCb = okCallback;
    overlay.classList.add("show");
  }
  function closeModal(){ overlay.classList.remove("show"); }
  document.getElementById("modalOk").addEventListener("click", function(){
    if(this._customCb){ this._customCb(); this._customCb = null; }
    closeModal();
  });
  document.getElementById("modalClose").addEventListener("click", closeModal);

  document.getElementById("btnHow").addEventListener("click", () => {
    openModal(
      "🎮 게임 규칙",
      "30초 동안 두더지를 눌러 최대한 점수를 올리세요!\n\n" +
      "⭐ 황금  +3점 | ⏱️ 시간  +1점 +2초\n" +
      "⚡ 번개  연쇄타격 | 🌀 분열  새 두더지 소환\n" +
      "💨 도망  +2점 (빠르게!) | 🎁 보너스  랜덤 효과\n" +
      "💣 폭탄  -2점, 콤보 초기화 | 🕳️ 트랩  0.9초 마비\n\n" +
      "콤보 5연속 +1점 보너스 · 10연속 +2점 보너스\n" +
      "게임 도중 패턴(동시 등장)·이벤트가 발생합니다."
    );
  });

  // ════════════════════════════════════════════
  //  게임 상태
  // ════════════════════════════════════════════
  const gridEl       = document.getElementById("grid");
  const timeEl       = document.getElementById("timeLeft");
  const scoreEl      = document.getElementById("score");
  const comboEl      = document.getElementById("combo");
  const diffLabel    = document.getElementById("diffLabel");
  const eventTextEl  = document.getElementById("eventText");
  const eventTimerEl = document.getElementById("eventTimer");
  const eventBoxEl   = document.getElementById("eventBox");
  const timerBar     = document.getElementById("timerBar");
  const btnStart     = document.getElementById("btnStart");
  const btnPause = document.createElement("button"); // removed

  // ✅ BUG FIX: diffSel 중복 선언 제거 (위에서 이미 선언)

  const GAME_TIME = 30.0;

  const Game = {
    running:       false,
    paused:        false,
    t:             GAME_TIME,
    score:         0,
    combo:         0,
    lastHitAt:     0,
    boardSize:     4,
    spawnIntervalMs: 650,
    showMs:        520,
    bombRate:      0.10,
    eventRate:     0.20,
    patternRate:   0.22,
    maxActive:     1,
    tickTimer:     null,
    spawnTimer:    null,
    activeMoles:   new Map(),
    event:         null,
    freezeUntil:   0,
    moleIdSeq:     1,
    slowActive:    false,
    maxCombo:      0,
    pausedAt:      0,       // ✅ 일시정지 시작 시각 (performance.now)
    moleTimers:    new Map(),// ✅ idx → timeoutId (재개 시 재설정용)
    feverUntil:0,feverTriggered:false,bossPhase:0,bossKills:0,bossIdx:-1,bossId:0,
  };

  // ════════════════════════════════════════════
  //  두더지 타입 정의
  //  ✅ BUG FIX: runny 타입 추가 (CSS는 있었지만 MoleTypes에 없었음)
  // ════════════════════════════════════════════
  const MoleTypes = {
    normal: {emoji:"🐹",  score:+1, tag:""},
    gold:   {emoji:"⭐",  score:+3, tag:"GOLD"},
    bomb:   {emoji:"💣",  score:-2, tag:"BOMB"},          // 밸런스: -1 → -2
    time:   {emoji:"⏱️", score:+1, tag:"+2s", timeBonus:2.0},
    light:  {emoji:"⚡",  score:+1, tag:"CHAIN", chain:true},
    trap:   {emoji:"🕳️", score:0,  tag:"TRAP",  trap:true},
    split:  {emoji:"🌀",  score:+1, tag:"SPLIT", split:true},
    run:    {emoji:"💨",  score:+2, tag:"RUN",   run:true},
    bonus:  {emoji:"🎁",  score:+1, tag:"RAND",  bonus:true},
    runny:  {emoji:"🐭",  score:+2, tag:"FAST",  runny:true}, // ✅ runny 구현
    boss:   {emoji:"👹",  score:0, tag:"BOSS", boss:true},
  };

  // ════════════════════════════════════════════
  //  난이도 적용
  // ════════════════════════════════════════════
  function applyDifficulty(){
    const v = diffSel.value;
    if(v === "easy"){
      Game.boardSize=3; Game.spawnIntervalMs=900; Game.showMs=670;
      Game.bombRate=0.06; Game.eventRate=0.12; Game.patternRate=0.15; Game.maxActive=1;
      diffLabel.textContent="EASY";
    } else if(v === "hard"){
      Game.boardSize=5; Game.spawnIntervalMs=440; Game.showMs=400;
      Game.bombRate=0.13; Game.eventRate=0.28; Game.patternRate=0.28; Game.maxActive=2;
      diffLabel.textContent="HARD";
    } else {
      Game.boardSize=4; Game.spawnIntervalMs=650; Game.showMs=520;
      Game.bombRate=0.10; Game.eventRate=0.20; Game.patternRate=0.22; Game.maxActive=1;
      diffLabel.textContent="NORMAL";
    }
    buildBoard();
    // updateEntryCostUI는 change 리스너에서 호출하므로 여기선 제거
  }

  diffSel.addEventListener("change", () => {
    updateEntryCostUI(); // ✅ BUG FIX: 두 개였던 change 리스너를 하나로 통합
    if(Game.running) showToast("난이도는 다음 판부터 적용됩니다");
    else applyDifficulty();
  });

  // ════════════════════════════════════════════
  //  보드 생성
  // ════════════════════════════════════════════
  function buildBoard(){
    gridEl.innerHTML = "";
    gridEl.style.gridTemplateColumns = `repeat(${Game.boardSize}, 1fr)`;
    const n = Game.boardSize * Game.boardSize;
    for(let i = 0; i < n; i++){
      const hole = document.createElement("div");
      hole.className = "hole";
      hole.dataset.idx = String(i);

      const mole = document.createElement("div");
      mole.className = "mole normal";
      mole.innerHTML = "<span> </span>";
      hole.appendChild(mole);

      hole.addEventListener("click",       () => onHit(i));
      hole.addEventListener("touchstart",  (e) => { e.preventDefault(); onHit(i); }, {passive:false});
      gridEl.appendChild(hole);
    }
  }

  // ════════════════════════════════════════════
  //  이벤트 시스템
  // ════════════════════════════════════════════
  function setEvent(name, seconds, modifiers={}){
    Game.event = {name, until: performance.now() + seconds*1000, modifiers};
    eventTextEl.textContent = name;
    eventTimerEl.textContent = `${seconds.toFixed(0)}s 남음`;
    eventBoxEl.classList.add("active");
    document.getElementById("pillDiff").classList.add("active-event");
    // ✅ BUG FIX: slow 이벤트 실제 반영
    Game.slowActive = !!modifiers.slow;
  }

  function clearEvent(){
    Game.event = null;
    eventTextEl.textContent = "대기 중…";
    eventTimerEl.textContent = "";
    eventBoxEl.classList.remove("active");
    document.getElementById("pillDiff").classList.remove("active-event");
    Game.slowActive = false;
  }

  function updateEventUI(){
    if(!Game.event) return;
    const left = Math.max(0, Game.event.until - performance.now());
    eventTimerEl.textContent = `${(left/1000).toFixed(1)}s 남음`;
    if(left <= 0) clearEvent();
  }

  function triggerEventMaybe(){
    if(Game.event) return;
    if(Math.random() > Game.eventRate) return;
    const options = [
      {name:"황금 러시 ⭐",    sec:5, mod:{moreGold:true}},
      {name:"폭탄 폭주 💣",    sec:4, mod:{forceBomb:true}},
      {name:"슬로우 타임 ❄️",  sec:5, mod:{slow:true}},       // ✅ slow 구현
      {name:"러시 타임 ⚡",    sec:4, mod:{rush:true}},
      {name:"콤보 부스트 🔥",  sec:6, mod:{comboBoost:true}},
      {name:"타임 드롭 ⏱️",   sec:6, mod:{moreTime:true}},
      {name:"스플릿 피버 🌀",  sec:6, mod:{moreSplit:true}},
      {name:"트랩 페이즈 🕳️", sec:5, mod:{moreTrap:true}},
      {name:"보너스 파티 🎁",  sec:6, mod:{moreBonus:true}},
      {name:"도망자 러시 💨",  sec:5, mod:{moreRun:true}},
      {name:"패턴 러시 📐",    sec:6, mod:{patternBoost:true}},
    ];
    const ev = randomChoice(options);
    setEvent(ev.name, ev.sec, ev.mod);
    showToast(`🎉 이벤트: ${ev.name}`);
    postToParent({type:"MG_ATMO_DELTA", delta:+1, source:"mole", meta:{event:ev.name}});
  }

  // ════════════════════════════════════════════
  //  두더지 타입 선택
  // ════════════════════════════════════════════
  function randomChoice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  function chooseMoleType(){
    const mods = Game.event?.modifiers || {}; // ✅ 명확성: ev → mods로 변경
    if(mods.forceGold)  return "gold";
    if(mods.forceBomb)  return "bomb";

    const w = {
      gold:   0.10,
      time:   0.08,
      light:  0.08,
      split:  0.06,
      run:    0.06,
      trap:   0.05,
      bonus:  0.09,
      runny:  0.05,
      normal: 1.0
    };

    if(mods.moreGold)   w.gold   += 0.12;
    if(mods.moreTime)   w.time   += 0.10;
    if(mods.moreSplit)  w.split  += 0.12;
    if(mods.moreTrap)   w.trap   += 0.12;
    if(mods.moreBonus)  w.bonus  += 0.12;
    if(mods.moreRun)    w.run    += 0.10;
    if(mods.slow)       w.gold   += 0.06;

    const r0 = Math.random();
    if(r0 < Game.bombRate) return "bomb";

    const entries = Object.entries(w).filter(([k]) => k !== "normal");
    let sum = entries.reduce((a,[,v])=>a+v, 0);
    const normalW = Math.max(0.20, 1.0 - Math.min(0.80, sum));
    sum += normalW;

    let r = Math.random() * sum;
    for(const [k, v] of entries){
      r -= v;
      if(r <= 0) return k;
    }
    return "normal";
  }

  // ════════════════════════════════════════════
  //  패턴 생성
  // ════════════════════════════════════════════
  function getPatternCells(){
    const n = Game.boardSize;
    const total = n * n;
    const clampIdx = (r,c) => Math.max(0,Math.min(n-1,r))*n + Math.max(0,Math.min(n-1,c));
    const kind = Math.random();

    if(kind < 0.20){
      const row = Math.floor(Math.random()*n);
      const len = Math.max(3, Math.min(n, 3+Math.floor(Math.random()*2)));
      const start = Math.floor(Math.random()*(n-len+1));
      return Array.from({length:len}, (_,i) => row*n + start+i);
    }
    if(kind < 0.40){
      const col = Math.floor(Math.random()*n);
      const len = Math.max(3, Math.min(n, 3+Math.floor(Math.random()*2)));
      const start = Math.floor(Math.random()*(n-len+1));
      return Array.from({length:len}, (_,i) => (start+i)*n + col);
    }
    if(kind < 0.55){
      if(n < 3) return [Math.floor(Math.random()*total)];
      const r = 1+Math.floor(Math.random()*(n-2));
      const c = 1+Math.floor(Math.random()*(n-2));
      return [r*n+c, (r-1)*n+c, (r+1)*n+c, r*n+(c-1), r*n+(c+1)];
    }
    if(kind < 0.68){
      if(n < 2) return [Math.floor(Math.random()*total)];
      const r = Math.floor(Math.random()*(n-1));
      const c = Math.floor(Math.random()*(n-1));
      return [r*n+c, r*n+(c+1), (r+1)*n+c, (r+1)*n+(c+1)];
    }
    if(kind < 0.80){
      if(n < 3) return [Math.floor(Math.random()*total)];
      const len = Math.max(3, Math.min(n, 3+Math.floor(Math.random()*2)));
      const dir = Math.random() < 0.5 ? 1 : -1;
      const r0 = Math.floor(Math.random()*(n-len+1));
      const c0 = dir===1 ? Math.floor(Math.random()*(n-len+1)) : Math.floor(Math.random()*(n-len+1))+(len-1);
      return Array.from({length:len}, (_,k) => (r0+k)*n + (c0+dir*k));
    }
    if(kind < 0.90){
      if(n < 3) return [Math.floor(Math.random()*total)];
      const r = 1+Math.floor(Math.random()*(n-2));
      const c = 1+Math.floor(Math.random()*(n-2));
      const cells = [];
      for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
        if(dr===0&&dc===0) continue;
        cells.push(clampIdx(r+dr,c+dc));
      }
      return [...new Set(cells)];
    }
    if(n < 3) return [Math.floor(Math.random()*total)];
    const r = 1+Math.floor(Math.random()*(n-2));
    const c = 1+Math.floor(Math.random()*(n-2));
    return [r*n+c, r*n+(c-1), (r-1)*n+(c-1), (r-1)*n+c, (r-2>=0?r-2:r+1)*n+c].slice(0,Math.min(5,total));
  }

  // ════════════════════════════════════════════
  //  두더지 스폰 / 히든
  // ════════════════════════════════════════════
  function spawnMoleAt(idx, forcedType=null){
    const hole = gridEl.querySelector(`.hole[data-idx="${idx}"]`);
    if(!hole) return false;
    const existing = Game.activeMoles.get(idx);
    if(existing && existing.until > performance.now()) return false;

    const moleEl = hole.querySelector(".mole");
    const type   = forcedType || chooseMoleType();
    const meta   = MoleTypes[type];
    if(!meta) return false;

    // ✅ BUG FIX: run 타입 CSS 클래스 이름 충돌 → run-type 클래스 사용
    const cssClass = type === "run" ? "run-type" : type;
    moleEl.className = `mole ${cssClass}`;
    moleEl.innerHTML = `<span>${meta.emoji}</span>`;
    if(meta.tag){
      const tagEl = document.createElement("div");
      tagEl.className = "tag";
      tagEl.textContent = meta.tag;
      moleEl.appendChild(tagEl);
    }

    // ✅ BUG FIX: slow 이벤트 실제 반영 — showMs 증가
    let showMs = meta.runny
      ? Math.max(180, Game.showMs * 0.55)   // runny: 매우 빠름
      : meta.run
        ? Math.max(240, Game.showMs * 0.65)  // run: 빠름
        : Game.showMs;
    if(Game.slowActive) showMs = Math.min(1200, showMs * 1.7); // slow 이벤트

    const now   = performance.now();
    const until = now + showMs;

    requestAnimationFrame(() => moleEl.classList.add("show"));

    const id = Game.moleIdSeq++;
    Game.activeMoles.set(idx, {id, type, until});

    // ✅ BUG FIX: 일시정지 대응 — 타이머를 moleTimers에 등록해 재개 시 재설정 가능하게
    function scheduleMoleHide(remainMs){
      const tid = setTimeout(() => {
        const st = Game.activeMoles.get(idx);
        if(!st || st.id !== id) return;
        hideMole(idx);
        Game.moleTimers.delete(idx);
      }, remainMs);
      Game.moleTimers.set(idx, {tid, id, hideAt: performance.now() + remainMs});
    }
    scheduleMoleHide(showMs);

    return true;
  }

  function hideMole(idx){
    const hole = gridEl.querySelector(`.hole[data-idx="${idx}"]`);
    if(!hole) return;
    const moleEl = hole.querySelector(".mole");
    moleEl.classList.remove("show");
    moleEl.classList.add("run");
    // ✅ 숨김 처리 시 moleTimers도 정리
    const timerEntry = Game.moleTimers.get(idx);
    if(timerEntry){ clearTimeout(timerEntry.tid); Game.moleTimers.delete(idx); }
    setTimeout(() => {
      const st = Game.activeMoles.get(idx);
      if(!st || st.until > performance.now()) return;
      moleEl.className = "mole normal";
      moleEl.innerHTML = "<span> </span>";
      Game.activeMoles.delete(idx);
    }, 100);
  }

  // ════════════════════════════════════════════
  //  스폰 틱
  // ════════════════════════════════════════════
  function spawnTick(){
    if(!Game.running || Game.paused) return;
    const now = performance.now();
    if(now < Game.freezeUntil) return;

    updateEventUI();
    triggerEventMaybe();
    previewNextSpawn(); trySpawnBoss();

    const mods = Game.event?.modifiers || {};
    let spawnCount = Game.maxActive;
    if(mods.rush) spawnCount += 1;

    const pr = Game.patternRate + (mods.patternBoost ? 0.35 : 0);
    const doPattern = Math.random() < Math.min(0.90, pr);
    const n = Game.boardSize * Game.boardSize;

    if(doPattern){
      const cells = getPatternCells();
      for(const c of cells){
        const forced = mods.forceBomb ? "bomb" : (mods.forceGold ? "gold" : null);
        spawnMoleAt(c, forced);
      }
    } else {
      let tries = 0;
      while(spawnCount > 0 && tries < 12){
        tries++;
        const idx = Math.floor(Math.random() * n);
        if(spawnMoleAt(idx)) spawnCount--;
      }
    }
  }

  // ════════════════════════════════════════════
  //  히트 처리
  // ════════════════════════════════════════════
  function spawnHitFx(hole, text){
    const fx = document.createElement("div");
    fx.className = "hit-fx";
    fx.textContent = text;
    hole.appendChild(fx);
    setTimeout(()=>fx.remove(), 600);
  }

  function onHit(idx){
    if(!Game.running || Game.paused) return;
    const now = performance.now();
    if(now < Game.freezeUntil) return;

    const st = Game.activeMoles.get(idx);
    if(!st) return;

    const type = st.type;
    const meta = MoleTypes[type];
    if(!meta) return;

    const hole = gridEl.querySelector(`.hole[data-idx="${idx}"]`);
    if(!hole) return; // ✅ BUG FIX: hole null이면 조기 리턴

    // boss hit handling (1타 잡기, 3마리 전부 잡으면 +10 보너스)
    if(type==="boss"){
      hideMole(idx);
      Game.bossIdx=-1;
      Game.bossKills++;
      Game.score+=3;
      if(navigator.vibrate)navigator.vibrate([50,30,80]);
      spawnHitFx(hole,"+3 BOSS!");
      if(Game.bossKills>=3){
        Game.score+=10;
        spawnHitFx(hole,"+10 BONUS!");
        if(navigator.vibrate)navigator.vibrate([100,50,100,50,200]);
        showToast("\U0001f479 BOSS 3\ub9c8\ub9ac \uc644\ud30c! +10 \ubcf4\ub108\uc2a4!");
      } else {
        showToast("\U0001f479 BOSS "+Game.bossKills+"/3 \ucc98\uce58!");
      }
      scoreEl.textContent=String(Math.max(0,Game.score));
      return;
    }
    hideMole(idx);

    // 콤보
    const within = (now - Game.lastHitAt) <= 850;
    if(meta.score > 0){
      if(within) Game.combo += 1;
      else Game.combo = 1;
      Game.lastHitAt = now;
      if(Game.combo > Game.maxCombo) Game.maxCombo = Game.combo; // ✅ BUG FIX: 최고 콤보 추적
    }

    Game.score += meta.score;

    // 콤보 보너스
    if(meta.score > 0){
      let bonus = 0;
      if(Game.combo >= 10)      bonus = 2;
      else if(Game.combo >= 5)  bonus = 1;
      if(getModifiers().comboBoost) bonus += 1;
      if(bonus){
        Game.score += bonus;
        spawnHitFx(hole, `콤보 +${bonus}`);
      }
      // 콤보 팝업
      if(Game.combo >= 5 && Game.combo % 5 === 0){
        showComboPop(`${Game.combo} COMBO! 🔥`);
      }
    }

    // 폭탄
    if(meta.score < 0){
      Game.combo = 0;
      if(navigator.vibrate)navigator.vibrate([80,40,120]);
      spawnHitFx(hole, "💣");
      document.body.classList.add("bomb-shake");
      setTimeout(()=>document.body.classList.remove("bomb-shake"), 320);
      postToParent({type:"MG_ATMO_DELTA", delta:-2, source:"mole", meta:{hit:"bomb"}});
      showToast("💣 폭탄! 콤보 리셋");
    } else if(meta.score > 0){
      // ✅ BUG FIX: score===0(trap)일 때 "✓" 히트FX 표시하지 않도록 조건 수정
      if(navigator.vibrate)navigator.vibrate(15);
      spawnHitFx(hole, meta.score > 1 ? `+${meta.score}` : "✓");
    }

    // 시간 보너스
    if(meta.timeBonus){
      Game.t = Math.min(GAME_TIME + 15, Game.t + meta.timeBonus);
      showToast(`⏱️ +${meta.timeBonus}s`);
    }

    // 연쇄 (번개)
    if(meta.chain){
      let gained = 0;
      for(const [k, v] of Array.from(Game.activeMoles.entries())){
        if(k === idx) continue;
        if(gained >= 3) break;
        if(v.until <= performance.now()) continue;
        hideMole(k);
        Game.score += 1;
        gained++;
        // ✅ BUG FIX: 연쇄 타격도 콤보에 반영
        Game.combo += 1;
        Game.lastHitAt = performance.now();
        if(Game.combo > Game.maxCombo) Game.maxCombo = Game.combo;
      }
      if(gained){ if(navigator.vibrate)navigator.vibrate([20,10,20,10,30]); showToast(`⚡ 연쇄 +${gained}`); }
    }

    // 트랩
    if(meta.trap){
      Game.freezeUntil = now + 900;
      if(navigator.vibrate)navigator.vibrate([40,30,40]);
      showToast("🕳️ TRAP…");
      postToParent({type:"MG_ATMO_DELTA", delta:-1, source:"mole", meta:{hit:"trap"}});
    }

    // 분열
    if(meta.split){
      const n = Game.boardSize * Game.boardSize;
      let s = 0; let tries = 0;
      while(s < 2 && tries < 16){
        tries++;
        const j = Math.floor(Math.random()*n);
        if(j === idx) continue;
        if(spawnMoleAt(j)) s++;
      }
      if(s) showToast("🌀 분열!");
    }

    // 도망
    if(meta.run){
      postToParent({type:"MG_ATMO_DELTA", delta:+1, source:"mole", meta:{hit:"run"}});
    }

    // runny: 잡으면 추가 포인트 + 다음 두더지 빠르게
    if(meta.runny){
      showToast("🐭 FAST +2!");
      postToParent({type:"MG_ATMO_DELTA", delta:+1, source:"mole", meta:{hit:"runny"}});
    }

    // 보너스 박스
    if(meta.bonus){
      if(navigator.vibrate)navigator.vibrate([25,15,25]);
      const roll = Math.random();
      if(roll < 0.33){
        Game.score += 2; showToast("🎁 +2점!");
      } else if(roll < 0.66){
        Game.t = Math.min(GAME_TIME + 15, Game.t + 1.5); showToast("🎁 +1.5s!");
      } else {
        if(Game.event){ clearEvent(); showToast("🎁 이벤트 종료!"); }
        else { Game.score += 1; showToast("🎁 +1점!"); }
      }
      postToParent({type:"MG_ATMO_DELTA", delta:+1, source:"mole", meta:{hit:"bonus"}});
    }

    scoreEl.textContent = String(Math.max(0, Game.score));
    // fever bonus
    const fb=getFeverBonus();
    if(fb>0 && meta.score>0){Game.score+=fb; spawnHitFx(hole,"FEVER +"+fb);}
    checkFever();
    comboEl.textContent = String(Game.combo);
  }

  function getModifiers(){ return Game.event?.modifiers || {}; }

  // ════════════════════════════════════════════
  //  게임 리셋 / 시작 / 종료
  // ════════════════════════════════════════════
  function resetGame(){
    Game.running     = false;
    Game.paused      = false;
    Game.t           = GAME_TIME;
    Game.score       = 0;
    Game.combo       = 0;
    Game.lastHitAt   = 0;
    Game.freezeUntil = 0;
    Game.slowActive  = false;
    Game.moleIdSeq   = 1;
    Game.maxCombo    = 0;
    Game.pausedAt    = 0;
    Game.feverUntil=0;Game.feverTriggered=false;
    Game.bossPhase=0;Game.bossKills=0;Game.bossIdx=-1;Game.bossId=0;
    document.body.classList.remove("fever-mode");
    // ✅ 리셋 시 잔류 타이머 전부 취소
    for(const {tid} of Game.moleTimers.values()) clearTimeout(tid);
    Game.moleTimers.clear();
    Game.activeMoles.clear();
    clearEvent();

    scoreEl.textContent  = "0";
    comboEl.textContent  = "0";
    timeEl.textContent   = GAME_TIME.toFixed(1);
    timerBar.style.width = "100%";
    timerBar.classList.remove("warn");
    document.getElementById("pillTime").classList.remove("highlight");

    btnPause.disabled    = true;
    btnPause.textContent = "일시정지";

    gridEl.querySelectorAll(".hole").forEach(h => {
      const m = h.querySelector(".mole");
      m.className = "mole normal";
      m.innerHTML = "<span> </span>";
    });
  }

  function computeReward(score){
    const s = Math.max(0, score);
    if(s >= 30) return 5;
    if(s >= 24) return 4;
    if(s >= 18) return 3;
    if(s >= 12) return 2;
    if(s >= 6)  return 1;
    return 0;
  }


  // ======== FEVER TIME ========
  function checkFever(){
    const now=performance.now();
    if(Game.combo>=5 && !Game.feverTriggered && now>Game.feverUntil){
      Game.feverTriggered=true;
      Game.feverUntil=now+3000;
      document.body.classList.add("fever-mode");
      if(navigator.vibrate)navigator.vibrate([30,20,30,20,30,20,60]);
      const b=document.createElement("div");b.className="fever-banner";b.textContent="FEVER TIME!";
      document.body.appendChild(b);setTimeout(()=>b.remove(),900);
      showToast("\U0001f525 FEVER! 3\ucd08\uac04 +2\uc810!");
    }
    if(now>Game.feverUntil && document.body.classList.contains("fever-mode")){
      document.body.classList.remove("fever-mode");
      Game.feverTriggered=false;
    }
  }
  function getFeverBonus(){ return performance.now()<Game.feverUntil ? 2 : 0; }

  // ======== BOSS MOLE (3회 출현) ========
  const BOSS_TIMES=[25,15,7]; // 게임시간 남은초 기준
  function trySpawnBoss(){
    if(Game.bossPhase>=3) return;
    if(Game.bossIdx>=0) return; // 현재 보스 존재
    const threshold=BOSS_TIMES[Game.bossPhase];
    if(Game.t > threshold) return;
    Game.bossPhase++;
    const n=Game.boardSize*Game.boardSize;
    let idx=Math.floor(Math.random()*n);
    let tries=0; while(Game.activeMoles.has(idx)&&tries<20){idx=Math.floor(Math.random()*n);tries++;}
    Game.bossIdx=idx; Game.bossId=Game.moleIdSeq++;
    const hole=gridEl.querySelector(`.hole[data-idx="${idx}"]`);
    if(!hole) return;
    const moleEl=hole.querySelector(".mole");
    moleEl.className="mole boss";
    moleEl.innerHTML=`<span>\U0001f479</span><div class="tag">BOSS ${Game.bossPhase}/3</div>`;
    requestAnimationFrame(()=>moleEl.classList.add("show"));
    Game.activeMoles.set(idx,{id:Game.bossId,type:"boss",until:performance.now()+5000});
    const bid=Game.bossId;
    const tid=setTimeout(()=>{
      if(Game.bossIdx===idx){hideMole(idx);Game.bossIdx=-1;}
    },5000);
    Game.moleTimers.set(idx,{tid,id:bid,hideAt:performance.now()+5000});
    if(navigator.vibrate)navigator.vibrate([60,40,60,40,100]);
    showToast("\U0001f479 BOSS "+Game.bossPhase+"/3 \ucd9c\ud604!");
  }

  // ======== PREVIEW (\ub450\ub354\uc9c0 \uc608\uace0) ========
  function previewNextSpawn(){
    if(!Game.running||Game.paused) return;
    const n=Game.boardSize*Game.boardSize;
    let idx=Math.floor(Math.random()*n);
    let tries=0; while(Game.activeMoles.has(idx)&&tries<12){idx=Math.floor(Math.random()*n);tries++;}
    const hole=gridEl.querySelector(`.hole[data-idx="${idx}"]`);
    if(hole){hole.classList.add("preview");setTimeout(()=>hole.classList.remove("preview"),400);}
  }

  function endGame(){
    Game.running = false;
    stopTimers();
    btnPause.disabled = true;

    const reward    = computeReward(Game.score);
    const deltaAtmo = reward >= 4 ? +3 : reward >= 2 ? +1 : reward === 0 ? -1 : 0;
    if(deltaAtmo) postToParent({type:"MG_ATMO_DELTA", delta:deltaAtmo, source:"mole", meta:{reward}});

    // EARN_POINTS 단일 전송 (index tier 배율 적용됨)
    if(reward > 0){
      postToParent({type:"EARN_POINTS", deltaPoints:reward, source:"mole", meta:{score:Game.score}});
    }
    // 게임 종료 알림 (index 미션 진행도용)
    try{localStorage.setItem("MG_LAST_RESULT",JSON.stringify({gameId:"mole",score:Game.score,reward,pointDelta:reward,won:reward>0,ts:Date.now()}));}catch(e){}

    const resultHTML = reward > 0
      ? `<div class="result-score">
           <div class="big">${Math.max(0,Game.score)}점</div>
           <div class="sub">최고 콤보: ${Game.maxCombo}</div>
           <div class="reward-badge">🏆 +${reward}P 지급!</div>
         </div>`
      : `<div class="result-score">
           <div class="big" style="font-size:2rem;color:var(--muted)">${Math.max(0,Game.score)}점</div>
           <div class="sub">6점 이상이면 포인트가 지급됩니다</div>
         </div>`;

    openModal(
      "🐹 게임 결과",
      reward ? "포인트가 지급됐어요! 다음 판도 화이팅 💪" : "아쉽지만 다음 판에서 더 노려봐요!",
      resultHTML
    );
    btnStart.textContent = "다시 시작";
    showToast(reward ? `🎉 +${reward}P 지급!` : "다시 도전!", 2000);
  }

  function tick(){
    if(!Game.running || Game.paused) return;
    Game.t -= 0.05;
    if(Game.t <= 0){
      Game.t = 0;
      timeEl.textContent   = "0.0";
      timerBar.style.width = "0%";
      endGame();
      return;
    }
    timeEl.textContent = Game.t.toFixed(1);
    const pct = Math.min(100, (Game.t / GAME_TIME) * 100);
    timerBar.style.width = pct + "%";
    if(pct <= 30){
      timerBar.classList.add("warn");
      document.getElementById("pillTime").classList.add("highlight");
    } else {
      // ✅ BUG FIX: 시간 보너스로 30% 초과 회복 시 warn 해제
      timerBar.classList.remove("warn");
      document.getElementById("pillTime").classList.remove("highlight");
    }
    updateEventUI();
    checkFever();
  }

  function startGame(){
    resetGame();
    Game.running     = true;
    // ✅ BUG FIX: applyDifficulty() 제거 — startGame 안에서 호출하면
    // buildBoard()가 다시 실행되어 DOM이 재생성되고 activeMoles와 불일치 발생,
    // 이벤트 리스너도 중복 등록됨. 난이도는 btnStart 클릭 시점에 이미 적용되어 있음.
    btnPause.disabled    = false;
    btnStart.textContent = "재시작";
    Game.tickTimer  = setInterval(tick, 50);
    Game.spawnTimer = setInterval(spawnTick, Game.spawnIntervalMs);
    showToast("🐹 START!");
    if(navigator.vibrate)navigator.vibrate(40);
  }

  function stopTimers(){
    clearInterval(Game.tickTimer);
    clearInterval(Game.spawnTimer);
    Game.tickTimer  = null;
    Game.spawnTimer = null;
  }

  // ════════════════════════════════════════════
  //  버튼 이벤트
  // ════════════════════════════════════════════
  btnStart.addEventListener("click", () => {
    if(Game.running){ showToast("게임 진행 중! 종료 후 재시작하세요."); return; }
    stopTimers();
    const cost = getEntryCost();
    requestSpendBalance(cost, (ok, spent, newPts, need) => {
      if(!ok){
        openModal(
          "게임머니 부족",
          `입장료 ₩${cost.toLocaleString('ko-KR')}이 필요합니다.\n게임머니를 충전해주세요.`,
          "",
          "💳 충전하기",
          () => requestCharge()
        );
        return;
      }
      showToast(`입장료 -₩${spent.toLocaleString('ko-KR')}`);
      startGame();
    });
  });

  window.addEventListener("beforeunload", stopTimers);
})();
</script>
