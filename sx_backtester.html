async function runBasic(){
  if(!_buyItems.length){toast('BUY 리스트 비어있음');return;}
  const stock=_buyItems[_selectedIdx];
  if(!stock){toast('종목 선택 필요');return;}

  const btn=document.getElementById('btnBasic');
  const prog=document.getElementById('basicProg');
  const progFill=document.getElementById('basicProgFill');
  const progText=document.getElementById('basicProgText');
  const result=document.getElementById('basicResult');
  btn.disabled=true;prog.style.display='block';progText.style.display='block';
  progFill.style.width='20%';progText.textContent='캔들 데이터 수집 중...';
  result.style.display='none';

  try{
    const count=_buyTf==='W'||_buyTf==='M'?400:300;
    const rows=await fetchCandles(stock.code,!!stock.isCoin,_buyTf,count);
    progFill.style.width='50%';progText.textContent='백테스트 실행 중...';
    await sleep(50);

    const params=getBtParams();
    const opts=getBtOpts();
    const r=_runBtEngine(rows,_buyTf,params,opts);

    progFill.style.width='100%';progText.textContent='완료';
    await sleep(200);

    if(r.error){
      result.style.display='block';
      result.innerHTML=`<div class="result-card"><div class="result-title">❌ ${r.error}</div></div>`;
    }else{
      renderBasicResult(stock,r);
      // SX_BT_RESULT 자동 저장 (Bridge 연동용)
      _saveBtResult(stock,r);
    }
  }catch(e){
    result.style.display='block';
    result.innerHTML=`<div class="result-card"><div class="result-title">❌ 오류: ${e.message}</div></div>`;
  }

  btn.disabled=false;prog.style.display='none';progText.style.display='none';
}

function renderBasicResult(stock,r){
  const result=document.getElementById('basicResult');
  result.style.display='block';
  const tfLabel={'D':'일봉','W':'주봉','M':'월봉'}[_buyTf]||_buyTf;
  const winColor=r.winRate>=50?'var(--green)':'var(--red)';
  const pnlColor=r.totalPnl>=0?'var(--green)':'var(--red)';
  const pfColor=r.profitFactor>=1.5?'var(--green)':r.profitFactor>=1.0?'var(--yellow)':'var(--red)';

  let html=`<div class="result-card">
    <div class="result-title">📊 ${stock.name||stock.code} (${stock.code}) · ${tfLabel}</div>
    <div class="stat-grid">
      <div class="stat-item"><div class="stat-num" style="color:${winColor}">${r.winRate}%</div><div class="stat-label">승률</div></div>
      <div class="stat-item"><div class="stat-num" style="color:${pfColor}">${r.profitFactor}</div><div class="stat-label">손익비(PF)</div></div>
      <div class="stat-item"><div class="stat-num" style="color:${pnlColor}">${r.totalPnl>=0?'+':''}${r.totalPnl}%</div><div class="stat-label">총수익률</div></div>
      <div class="stat-item"><div class="stat-num">${r.totalTrades}</div><div class="stat-label">총매매수</div></div>
      <div class="stat-item"><div class="stat-num" style="color:var(--green)">+${r.avgWin}%</div><div class="stat-label">평균이익</div></div>
      <div class="stat-item"><div class="stat-num" style="color:var(--red)">-${r.avgLoss}%</div><div class="stat-label">평균손실</div></div>
      <div class="stat-item"><div class="stat-num" style="color:var(--red)">${r.mdd}%</div><div class="stat-label">MDD</div></div>
      <div class="stat-item"><div class="stat-num" style="color:var(--red)">${r.maxConsecLoss||0}</div><div class="stat-label">최대연속손실</div></div>
    </div>
  </div>`;

  // 점수 분포 히스토그램
  if(r.scores&&r.scores.length){
    const bins=Array(10).fill(0);
    r.scores.forEach(s=>{const idx=Math.min(Math.floor(s/10),9);bins[idx]++;});
    const maxBin=Math.max(...bins,1);
    const params=getBtParams();
    const buyBin=Math.min(Math.floor(params.buyTh/10),9);
    html+=`<div class="result-card"><div class="result-title">📊 점수 분포 히스토그램</div>`;
    html+=`<div style="font-family:var(--mono);font-size:10px;color:var(--text3);margin-bottom:6px;">봉 ${r.scores.length} · 중앙값 ${r.scores.sort((a,b)=>a-b)[Math.floor(r.scores.length/2)]} · 최고 ${Math.max(...r.scores)} · 최저 ${Math.min(...r.scores)}</div>`;
    html+=`<div style="display:flex;flex-direction:column;gap:2px;">`;
    for(let i=9;i>=0;i--){
      const pct=(bins[i]/maxBin*100).toFixed(0);
      const label=`${i*10}-${i*10+9}`;
      const isBuy=i>=buyBin;
      const barColor=isBuy?'var(--green)':'var(--text3)';
      const buyLine=i===buyBin?`border-left:2px solid var(--cyan);`:'';
      const cnt=bins[i];
      const actionLabel=i===buyBin?` <span style="color:var(--cyan);font-weight:700;">← BUY(${params.buyTh})</span>`:'';
      const sellInfo=i===Math.min(Math.floor(params.sellTh/10),9)?` <span style="color:var(--red);font-weight:700;">← SELL(${params.sellTh})</span>`:'';
      html+=`<div style="display:flex;align-items:center;gap:4px;height:16px;">
        <span style="font-family:var(--mono);font-size:9px;color:var(--text3);width:36px;text-align:right;">${label}</span>
        <div style="flex:1;height:12px;background:var(--surf2);border-radius:2px;overflow:hidden;${buyLine}">
          <div style="width:${pct}%;height:100%;background:${barColor};border-radius:2px;"></div>
        </div>
        <span style="font-family:var(--mono);font-size:9px;color:var(--text2);width:28px;">${cnt}</span>${actionLabel}${sellInfo}
      </div>`;
    }
    html+=`</div>`;
    html+=`<div style="font-family:var(--mono);font-size:9px;color:var(--text3);margin-top:4px;">buyTh(${params.buyTh}) 이상: ${r.scores.filter(s=>s>=params.buyTh).length}봉 → 필터 차단 → 최종 BUY ${r.totalTrades}</div>`;
    html+=`</div>`;
  }

  // 매매 목록
  if(r.trades&&r.trades.length){
    html+=`<div class="result-card"><div class="result-title">📋 매매 목록 (${r.trades.length}건)</div><div class="trade-list">`;
    const maxShow=Math.min(r.trades.length,50);
    for(let i=0;i<maxShow;i++){
      const t=r.trades[i];
      const pnlC=t.pnl>=0?'var(--green)':'var(--red)';
      html+=`<div class="trade-item">
        <span class="trade-type ${t.type}">${t.type}</span>
        <span style="flex:1;color:var(--text2)">${t.entry?.toFixed(0)||'-'} → ${t.exit?.toFixed(0)||'-'}</span>
        <span class="trade-pnl" style="color:${pnlC}">${t.pnl>=0?'+':''}${t.pnl}%</span>
        <span class="trade-bars">${t.bars}봉</span>
      </div>`;
    }
    if(r.trades.length>maxShow)html+=`<div class="trade-item" style="justify-content:center;color:var(--text3)">... +${r.trades.length-maxShow}건 더</div>`;
    html+=`</div></div>`;
  }

  result.innerHTML=html;
}

// ══════════════ 탭 1: 교차검증 ══════════════
async function runCross(){
  if(!_buyItems.length){toast('BUY 리스트 비어있음');return;}
  const items=_buyItems;
  const btn=document.getElementById('btnCross');
  const prog=document.getElementById('crossProg');
  const progFill=document.getElementById('crossProgFill');
  const progText=document.getElementById('crossProgText');
  const result=document.getElementById('crossResult');
  btn.disabled=true;prog.style.display='block';progText.style.display='block';
  result.style.display='none';

  const params=getBtParams();
  const opts=getBtOpts();
  const results=[];
  const count=_buyTf==='W'||_buyTf==='M'?400:300;

  for(let i=0;i<items.length;i++){
    const s=items[i];
    progFill.style.width=`${Math.round((i/items.length)*100)}%`;
    progText.textContent=`${i+1}/${items.length} — ${s.name||s.code}`;
    try{
      const rows=await fetchCandles(s.code,!!s.isCoin,_buyTf,count);
      const r=_runBtEngine(rows,_buyTf,params,opts);
      results.push({name:s.name||s.code,code:s.code,...r});
    }catch(e){
      results.push({name:s.name||s.code,code:s.code,error:e.message,winRate:0,profitFactor:0,totalPnl:0,mdd:0,totalTrades:0,avgWin:0,avgLoss:0});

  progFill.style.width='100%';progText.textContent='완료';

  btn.disabled=false;prog.style.display='none';progText.style.display='none';

  renderCrossResult(results);
  // SX_BT_CROSS 자동 저장 (Bridge 연동용)
  _saveBtCross(results);
}

function renderCrossResult(results){
  const result=document.getElementById('crossResult');
  result.style.display='block';

  const valid=results.filter(r=>r.totalTrades>0);
  const avgWinRate=valid.length?+(valid.reduce((s,r)=>s+r.winRate,0)/valid.length).toFixed(1):0;
  const avgPnl=valid.length?+(valid.reduce((s,r)=>s+r.totalPnl,0)/valid.length).toFixed(2):0;
  const stdPnl=valid.length>1?+Math.sqrt(valid.reduce((s,r)=>s+(r.totalPnl-avgPnl)**2,0)/(valid.length-1)).toFixed(2):0;
  const consistency=stdPnl<10?'안정':'불안정';
  const consistColor=stdPnl<10?'var(--green)':'var(--red)';

  let html=`<div class="result-card">
    <div class="result-title">📊 교차검증 결과 (${valid.length}/${results.length}개)</div>
    <div class="stat-grid">
      <div class="stat-item"><div class="stat-num">${avgWinRate}%</div><div class="stat-label">평균 승률</div></div>
      <div class="stat-item"><div class="stat-num" style="color:${avgPnl>=0?'var(--green)':'var(--red)'}">${avgPnl>=0?'+':''}${avgPnl}%</div><div class="stat-label">평균 수익률</div></div>
      <div class="stat-item"><div class="stat-num" style="color:${consistColor}">${consistency}</div><div class="stat-label">일관성 (σ${stdPnl})</div></div>
    </div>
  </div>`;

  html+=`<div class="result-card"><div class="result-title">📋 종목별 상세</div>
    <div style="overflow-x:auto;"><table class="cross-table">
    <thead><tr><th>종목</th><th>승률</th><th>PF</th><th>수익률</th><th>MDD</th><th>매매</th></tr></thead><tbody>`;
  for(const r of results){
    const wc=r.winRate>=50?'var(--green)':'var(--red)';
    const pc=r.totalPnl>=0?'var(--green)':'var(--red)';
    html+=`<tr>
      <td style="text-align:left;font-weight:600;">${r.name}</td>
      <td style="color:${wc}">${r.winRate}%</td>
      <td>${r.profitFactor}</td>
      <td style="color:${pc}">${r.totalPnl>=0?'+':''}${r.totalPnl}%</td>
      <td style="color:var(--red)">${r.mdd}%</td>
      <td>${r.totalTrades}${r.error?' ❌':''}</td>
    </tr>`;
  }
  html+=`</tbody></table></div></div>`;

  result.innerHTML=html;
  // 교차검증 결과 저장 (대시보드용)
  _lastCrossResults=results;
}

async function runWf(){
  if(!_buyItems.length){toast('BUY 리스트 비어있음');return;}
  const stock=_buyItems[_selectedIdx];
  if(!stock){toast('종목 선택 필요');return;}
  const ratio=parseInt(document.getElementById('wfRatio').value)/100;

  const btn=document.getElementById('btnWf');
  const prog=document.getElementById('wfProg');
  const progFill=document.getElementById('wfProgFill');
  const progText=document.getElementById('wfProgText');
  const result=document.getElementById('wfResult');
  btn.disabled=true;prog.style.display='block';progText.style.display='block';
  result.style.display='none';

  try{
    const count=_buyTf==='W'||_buyTf==='M'?400:300;
    const rows=await fetchCandles(stock.code,!!stock.isCoin,_buyTf,count);
    progFill.style.width='30%';progText.textContent='학습 구간 백테스트...';
    await sleep(50);

    const splitIdx=Math.floor(rows.length*ratio);
    const trainRows=rows.slice(0,splitIdx);
    const testRows=rows.slice(splitIdx);

    if(trainRows.length<120||testRows.length<30){
      toast(`데이터 부족 — 학습 ${trainRows.length}봉/검증 ${testRows.length}봉`);
      btn.disabled=false;prog.style.display='none';progText.style.display='none';
      return;
    }

    const params=getBtParams();
    const opts=getBtOpts();
    const trainR=_runBtEngine(trainRows,_buyTf,params,opts);

    progFill.style.width='70%';progText.textContent='검증 구간 백테스트...';
    await sleep(50);

    const testR=_runBtEngine(testRows,_buyTf,params,opts);

    progFill.style.width='100%';progText.textContent='완료';
    await sleep(200);

    renderWfResult(stock,trainR,testR,ratio);
    _lastWfResult={train:trainR,test:testR};
  }catch(e){
    result.style.display='block';
    result.innerHTML=`<div class="result-card"><div class="result-title">❌ 오류: ${e.message}</div></div>`;
  }

  btn.disabled=false;prog.style.display='none';progText.style.display='none';
}

function renderWfResult(stock,train,test,ratio){

async function runDashboard(){
  const btn=document.getElementById('btnDash');
  const prog=document.getElementById('dashProg');
  const progFill=document.getElementById('dashProgFill');
  const progText=document.getElementById('dashProgText');
  const result=document.getElementById('dashResult');

  if(!_buyItems.length){toast('BUY 리스트 비어있음');return;}
  btn.disabled=true;prog.style.display='block';progText.style.display='block';
  result.style.display='none';

  // 1) 교차검증
  progFill.style.width='10%';progText.textContent='교차검증 실행 중...';
  const items=_buyItems;
  const params=getBtParams();
  const opts=getBtOpts();
  const crossResults=[];
  const count=_buyTf==='W'||_buyTf==='M'?400:300;

  for(let i=0;i<items.length;i++){
    const s=items[i];
    progFill.style.width=`${10+Math.round((i/items.length)*40)}%`;
    progText.textContent=`교차 ${i+1}/${items.length} — ${s.name||s.code}`;
    try{
      const rows=await fetchCandles(s.code,!!s.isCoin,_buyTf,count);
      crossResults.push({name:s.name,..._runBtEngine(rows,_buyTf,params,opts)});
    }catch(e){
      crossResults.push({name:s.name,error:e.message,winRate:0,profitFactor:0,totalPnl:0,mdd:0,totalTrades:0});
    }
    await sleep(100);
  }

  // 2) 워크포워드 (첫 번째 종목)
  progFill.style.width='60%';progText.textContent='워크포워드 실행 중...';
  let wfTrain=null,wfTest=null;
  try{
    const stock=_buyItems[0];
    const rows=await fetchCandles(stock.code,!!stock.isCoin,_buyTf,count);
    const splitIdx=Math.floor(rows.length*0.7);
    const trainRows=rows.slice(0,splitIdx);
    const testRows=rows.slice(splitIdx);
    if(trainRows.length>=120&&testRows.length>=30){
      wfTrain=_runBtEngine(trainRows,_buyTf,params,opts);
      wfTest=_runBtEngine(testRows,_buyTf,params,opts);
    }
  }catch(_){}

  progFill.style.width='100%';progText.textContent='등급 산출 중...';
  await sleep(200);

  // 등급 계산
  const valid=crossResults.filter(r=>r.totalTrades>0);
  const avgWR=valid.length?valid.reduce((s,r)=>s+r.winRate,0)/valid.length:0;
  const avgPnl=valid.length?valid.reduce((s,r)=>s+r.totalPnl,0)/valid.length:0;
  const avgPF=valid.length?valid.reduce((s,r)=>s+r.profitFactor,0)/valid.length:0;
  const wfPenalty=(wfTrain&&wfTest)?(wfTrain.winRate-wfTest.winRate>15||wfTrain.totalPnl-wfTest.totalPnl>20?-1:0):0;

  let gradeScore=0;
  if(avgWR>=55)gradeScore+=2;else if(avgWR>=45)gradeScore+=1;
  if(avgPnl>0)gradeScore+=2;else if(avgPnl>-5)gradeScore+=1;
  if(avgPF>=1.5)gradeScore+=2;else if(avgPF>=1.0)gradeScore+=1;
  gradeScore+=wfPenalty;

  const grade=gradeScore>=5?'A':gradeScore>=3?'B':gradeScore>=1?'C':'F';

  renderDashResult(grade,gradeScore,crossResults,wfTrain,wfTest,avgWR,avgPnl,avgPF);

  btn.disabled=false;prog.style.display='none';progText.style.display='none';
}

        name:r.name,code:r.code||'',winRate:r.winRate,

async function recordPaper(signal){
  if(!_buyItems.length){toast('BUY 리스트 비어있음');return;}
  const stock=_buyItems[_selectedIdx];
  if(!stock){toast('종목 선택 필요');return;}

  vibrate();
  try{
    // 현재가 가져오기
    const rows=await fetchCandles(stock.code,!!stock.isCoin,_buyTf,5);
    const price=rows[rows.length-1]?.c||0;
    const scan=quickScore(rows,_buyTf);

    const entry={
      code:stock.code, name:stock.name||stock.code,
      signal, score:scan.score, price,
      date:isoNow(), tf:_buyTf,
      result:null, exitPrice:null, exitDate:null,
    };
    const list=_loadPaper();
    list.unshift(entry);
    _savePaper(list);
    toast(`${signal==='BUY'?'📗':'📕'} ${stock.name} ${signal} 기록 (${price.toLocaleString('ko-KR')}원, 점수 ${scan.score})`);
    renderPaper();
  }catch(e){
    toast('오류: '+e.message);
  }
}

async function updatePaperResults(){
  vibrate();
  const list=_loadPaper();
  const pending=list.filter(t=>!t.result);
  if(!pending.length){toast('업데이트할 대기 건 없음');return;}

  let updated=0;
  for(const t of pending){
    try{
      const isCoin=isCoinTicker(t.code)||(t.code&&!t.code.includes('.'));
      const rows=await fetchCandles(t.code,isCoin,t.tf||'D',5);
      const currentPrice=rows[rows.length-1]?.c||0;
      if(currentPrice<=0)continue;

      const pnl=((currentPrice-t.price)/t.price)*100;
      // BUY 신호: 가격 상승이면 WIN, 하락이면 LOSS
      // SELL 신호: 가격 하락이면 WIN, 상승이면 LOSS
      if(t.signal==='BUY'){
        if(pnl>=5){t.result='WIN';t.exitPrice=currentPrice;t.exitDate=isoNow();updated++;}
        else if(pnl<=-3){t.result='LOSS';t.exitPrice=currentPrice;t.exitDate=isoNow();updated++;}
      }else{
        if(pnl<=-5){t.result='WIN';t.exitPrice=currentPrice;t.exitDate=isoNow();updated++;}
        else if(pnl>=3){t.result='LOSS';t.exitPrice=currentPrice;t.exitDate=isoNow();updated++;}
      }
    }catch(_){}
    await sleep(300);
  }

  _savePaper(list);
  renderPaper();
  toast(`🔄 ${updated}건 업데이트 (대기 ${pending.length-updated}건)`);
}

function clearPaper(){
  vibrate();
  const list=_loadPaper();

  if(!confirm(`페이퍼 ${list.length}건을 모두 삭제할까요?`))return;
  _savePaper([]);
  renderPaper();
  toast('🗑 전체 삭제');
}

function renderPaper(){
  const list=_loadPaper();
  const statsEl=document.getElementById('paperStats');
  const listEl=document.getElementById('paperList');

  if(!list.length){
    statsEl.innerHTML='';
    listEl.innerHTML='<div class="empty-state">📋 BUY/SELL 신호를 기록하세요<br><br>현재 선택된 BUY 종목의<br>실시간 가격과 점수가 기록됩니다</div>';
    return;
  }

  const wins=list.filter(t=>t.result==='WIN').length;
  const losses=list.filter(t=>t.result==='LOSS').length;
  const open=list.filter(t=>!t.result).length;
  const total=wins+losses;
  const hitRate=total?+(wins/total*100).toFixed(1):0;

  statsEl.innerHTML=`<div class="result-card">
    <div class="stat-grid" style="grid-template-columns:repeat(4,1fr);">
      <div class="stat-item"><div class="stat-num" style="color:var(--green)">${wins}</div><div class="stat-label">WIN</div></div>
      <div class="stat-item"><div class="stat-num" style="color:var(--red)">${losses}</div><div class="stat-label">LOSS</div></div>
      <div class="stat-item"><div class="stat-num" style="color:var(--yellow)">${open}</div><div class="stat-label">대기</div></div>
      <div class="stat-item"><div class="stat-num">${hitRate}%</div><div class="stat-label">적중률</div></div>
    </div>
  </div>`;

  listEl.innerHTML=list.slice(0,30).map(t=>{
    const pnl=t.exitPrice?((t.exitPrice-t.price)/t.price*100).toFixed(1):'—';
    const resultHtml=t.result
      ?`<span class="paper-result" style="background:${t.result==='WIN'?'rgba(0,229,160,.15);color:var(--green)':'rgba(255,51,85,.15);color:var(--red)'}">${t.result}</span>`
      :`<span class="paper-result" style="background:rgba(255,204,0,.1);color:var(--yellow)">대기</span>`;
    return `<div class="paper-card">
      <span class="paper-signal ${t.signal}">${t.signal}</span>
      <div class="paper-info">
        <div style="font-weight:600;">${t.name||t.code}</div>
        <div style="font-size:9px;color:var(--text3);">${(t.date||'').slice(0,16)} · ${t.price?.toLocaleString('ko-KR')||'—'}원</div>
      </div>
      <span class="paper-score">${t.score||'—'}</span>
      ${resultHtml}
    </div>`;
  }).join('');
}

  const on=!document.body.classList.contains('light');
  document.body.classList.toggle('light',on);
  localStorage.setItem('ORACLE_LIGHT',on?'1':'0');
  const b=document.getElementById('lightToggle');
  if(b)b.textContent=on?'🌙':'☀️';
}
