<!DOCTYPE html>
<html lang="ko">
<head><script>
// ── ORACLE 토큰가드 ──
(function(){
  var t=sessionStorage.getItem('ORACLE_ENTRY');
  var ok=t&&(Date.now()-Number(t)<5000);
  if(ok) sessionStorage.removeItem('ORACLE_ENTRY');
  var pg='ORACLE_PG_'+location.pathname.split('/').pop();
  if(!ok) ok=!!sessionStorage.getItem(pg);
  if(ok){sessionStorage.setItem(pg,'1');return;}
  function _show404(){
    var isLight=localStorage.getItem('ORACLE_LIGHT')!=='0';
    var bg404=isLight?'#f2f3f5':'#0f1724';
    var fg404=isLight?'#1a1a1a':'#e8eaf0';
    var sub404=isLight?'#3a4555':'#9aa1b0';
    document.body.style.cssText='margin:0;padding:0;overflow:hidden';
    Array.from(document.body.children).forEach(function(el){el.style.display='none'});
    var d=document.createElement('div');
    d.id='_oracle404';
    d.innerHTML='<div style="position:fixed;inset:0;z-index:999999;background:'+bg404+';color:'+fg404+';'
      +'font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;display:flex;align-items:center;'
      +'justify-content:center;text-align:center;padding:20px">'
      +'<div style="max-width:360px">'
      +'<div style="width:120px;height:120px;background:#fff;border-radius:50%;margin:0 auto 32px;'
      +'display:flex;align-items:center;justify-content:center">'
      +'<div style="width:72px;height:52px;border:3px solid #333;border-radius:6px;position:relative;'
      +'display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:24px;'
      +'font-weight:700;color:#d32f2f">404</div></div>'
      +'<h1 style="font-size:20px;font-weight:700;margin:0 0 12px">페이지를 찾을 수 없습니다.</h1>'
      +'<p style="font-size:14px;color:'+sub404+';line-height:1.6;margin:0 0 32px">'
      +'존재하지 않는 주소를 입력하셨거나,<br>'
      +'요청하신 페이지의 주소가 변경/삭제되어 찾을 수 없습니다.</p>'
      +'<a href="index.html" style="display:block;width:100%;padding:16px;background:#d32f2f;color:#fff;'
      +'font-size:16px;font-weight:700;border:none;border-radius:8px;cursor:pointer;text-decoration:none;'
      +'text-align:center">홈으로 이동</a>'
      +'</div></div>';
    document.body.appendChild(d);
  }
  if(document.body) _show404();
  else document.addEventListener('DOMContentLoaded', _show404);
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#050810">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SIGNAL X — Backtester</title><!-- internal version: v1.0 -->
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050810;--bg2:#070b14;--surf:#0c1424;--surf2:#0f1a2c;--surf3:#111e32;--bdr:#1a2636;--bdr2:#203248;--green:#00e5a0;--red:#ff3355;--yellow:#ffcc00;--blue:#3d8eff;--cyan:#00d4ff;--orange:#ff8c3a;--purple:#9966ff;--gold:#ffc844;--text:#e8eaf0;--text2:#a0a0a8;--text3:#6a6a72;--mono:'JetBrains Mono',monospace;--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;-webkit-text-size-adjust:100%;}
body{height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:13px;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased;padding-top:var(--safe-top);}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.025) 2px,rgba(0,0,0,.025) 4px);pointer-events:none;z-index:9999;}
.hdr{background:var(--surf);border-bottom:1px solid var(--bdr);padding:10px 14px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;position:relative;}
.hdr::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),var(--purple),transparent);opacity:.35;}
.logo{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:3px;color:var(--cyan);display:flex;align-items:center;gap:7px;}
.logo-dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}
.logo-sub{font-family:var(--mono);font-size:8px;color:var(--text3);letter-spacing:2px;}
.tabs{display:flex;border-bottom:1px solid var(--bdr);flex-shrink:0;background:var(--surf);overflow-x:auto;}
.tab{flex:1;text-align:center;padding:9px 4px;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;min-height:38px;touch-action:manipulation;white-space:nowrap;}
.tab:active{opacity:.7;}.tab.on{color:var(--cyan);border-bottom-color:var(--cyan);}
.page{display:none;flex:1;flex-direction:column;overflow:hidden;}.page.on{display:flex;}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px;}

/* ── BUY 종목 선택 드롭다운 ── */
.stock-bar{background:var(--surf2);border-bottom:1px solid var(--bdr);padding:8px 10px;flex-shrink:0;}
.stock-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--surf3);border:1px solid var(--bdr);border-radius:8px;cursor:pointer;transition:all .15s;touch-action:manipulation;}
.stock-header:active{opacity:.7;}
.stock-header-left{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--text);}
.stock-header-name{font-weight:700;color:var(--cyan);}
.stock-header-score{font-size:10px;color:var(--text2);}
.stock-header-arrow{font-size:12px;color:var(--text3);transition:transform .2s;}
.stock-header-arrow.open{transform:rotate(180deg);}
.stock-dropdown{max-height:0;overflow:hidden;transition:max-height .25s ease;margin-top:0;}
.stock-dropdown.open{max-height:60vh;overflow-y:auto;margin-top:6px;}
.stock-list{display:flex;flex-direction:column;gap:2px;}
.stock-row{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:6px;cursor:pointer;transition:all .12s;font-family:var(--mono);font-size:11px;touch-action:manipulation;}
.stock-row:active{opacity:.7;}
.stock-row:hover{background:rgba(0,212,255,.06);}
.stock-row.on{background:rgba(0,212,255,.10);border:1px solid rgba(0,212,255,.25);}
.stock-row:not(.on){background:transparent;border:1px solid transparent;}
.stock-row-name{color:var(--text);font-weight:600;}
.stock-row-score{color:var(--text2);font-size:10px;}
.stock-info{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:6px;}

/* ── 결과 카드 ── */
.result-card{background:var(--surf2);border:1px solid var(--bdr);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
.result-title{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--cyan);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.stat-item{text-align:center;padding:6px 4px;background:var(--surf3);border-radius:6px;}
.stat-num{font-family:var(--mono);font-size:15px;font-weight:700;}
.stat-label{font-family:var(--mono);font-size:9px;color:var(--text3);margin-top:2px;}

/* ── 매매 목록 ── */
.trade-list{margin-top:8px;}
.trade-item{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--bdr);font-family:var(--mono);font-size:10px;}
.trade-type{font-weight:700;min-width:32px;text-align:center;padding:2px 4px;border-radius:3px;}
.trade-type.WIN{color:var(--green);background:rgba(0,229,160,.1);}
.trade-type.LOSS{color:var(--red);background:rgba(255,51,85,.1);}
.trade-type.OPEN{color:var(--yellow);background:rgba(255,204,0,.1);}
.trade-pnl{font-weight:700;min-width:50px;text-align:right;}
.trade-bars{color:var(--text3);min-width:32px;text-align:right;}

/* ── 교차검증 테이블 ── */
.cross-table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:10px;margin-top:6px;}
.cross-table th{background:var(--surf3);color:var(--text2);padding:6px 4px;text-align:center;font-weight:600;border-bottom:1px solid var(--bdr);}
.cross-table td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--bdr);}

/* ── WF 비교 ── */
.wf-compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.wf-col{background:var(--surf3);border-radius:8px;padding:10px;}
.wf-col-title{font-family:var(--mono);font-size:10px;font-weight:700;text-align:center;margin-bottom:8px;padding:4px;border-radius:4px;}

/* ── 대시보드 등급 ── */
.grade-badge{font-family:var(--mono);font-size:48px;font-weight:700;text-align:center;padding:20px;margin:10px 0;}
.grade-badge.A{color:var(--green);}
.grade-badge.B{color:var(--cyan);}
.grade-badge.C{color:var(--yellow);}
.grade-badge.F{color:var(--red);}

/* ── 페이퍼 트레이딩 ── */
.paper-card{background:var(--surf2);border:1px solid var(--bdr);border-radius:8px;padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:8px;}
.paper-signal{font-family:var(--mono);font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;}
.paper-signal.BUY{background:rgba(0,229,160,.15);color:var(--green);}
.paper-signal.SELL{background:rgba(255,51,85,.15);color:var(--red);}
.paper-info{flex:1;font-family:var(--mono);font-size:11px;}
.paper-score{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--text2);}
.paper-result{font-family:var(--mono);font-size:10px;font-weight:700;min-width:32px;text-align:center;padding:2px 4px;border-radius:3px;}

/* ── 버튼 ── */
.btn{font-family:var(--mono);font-size:11px;font-weight:700;padding:10px 0;border-radius:8px;cursor:pointer;border:1px solid var(--bdr2);background:var(--surf2);color:var(--text);width:100%;touch-action:manipulation;min-height:40px;}
.btn:active{filter:brightness(.85);}
.btn:disabled{opacity:.4;cursor:default;}
.btn.primary{background:linear-gradient(135deg,#00d4ff,#9966ff);border:none;color:#fff;}
.btn-row{display:flex;gap:6px;margin-top:8px;}
.btn-row .btn{flex:1;}

/* ── 슬라이더 ── */
.slider-row{display:flex;align-items:center;gap:8px;margin:6px 0;}
.slider-row label{font-family:var(--mono);font-size:10px;color:var(--text2);min-width:60px;}
.slider-row input[type=range]{flex:1;accent-color:var(--cyan);}
.slider-row .slider-val{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--cyan);min-width:35px;text-align:right;}

/* ── 옵션 ── */
.opt-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-family:var(--mono);font-size:10px;color:var(--text2);}
.opt-row input[type=checkbox]{accent-color:var(--cyan);}

/* ── 프로그레스 ── */
.prog-bar{height:4px;background:var(--bdr);border-radius:2px;overflow:hidden;margin:8px 0;}
.prog-fill{height:100%;background:var(--cyan);width:0%;transition:width .2s;}
.prog-text{font-family:var(--mono);font-size:10px;color:var(--text2);text-align:center;}

/* ── 공통 ── */
.toast{position:fixed;bottom:max(80px,calc(60px + var(--safe-bot)));left:50%;transform:translateX(-50%) translateY(16px);background:var(--surf2);border:1px solid var(--bdr2);color:var(--text);padding:10px 20px;border-radius:100px;font-size:12px;font-family:var(--mono);opacity:0;transition:all .25s;pointer-events:none;z-index:10000;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.empty-state{padding:40px 16px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--text3);line-height:2;}
.section-title{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:1px;margin:12px 0 6px;font-weight:700;}

/* ── 라이트모드 ── */
body.light{--bg:#f0f1f3;--bg2:#e8eaee;--surf:#ffffff;--surf2:#f5f6f8;--surf3:#ebedf0;--bdr:#c8ccd2;--bdr2:#b8bcc4;--text:#1a1a1a;--text2:#3a4555;--text3:#5a6a7a;}
body.light{background:var(--bg);}
body.light::before{display:none;}
body.light .hdr{box-shadow:0 1px 4px rgba(0,0,0,.06);}
body.light .hdr::after{opacity:.15;}
body.light .btn.primary{color:#fff;background:linear-gradient(135deg,#00a8d6,#7744dd);}
.light-toggle{background:none;border:1px solid var(--bdr);color:var(--text2);font-size:14px;width:28px;height:28px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.light-toggle:active{filter:brightness(.85);}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:2px;}
</style>
</head>
<body>
<script>if(localStorage.getItem('ORACLE_LIGHT')!=='0')document.body.classList.add('light');</script>

<header class="hdr">
  <div><div class="logo"><div class="logo-dot"></div>SX BACKTESTER</div><div class="logo-sub">SIGNAL X · BUY 검증 엔진 v1.0</div></div>

<!-- ══════════════ 탭 0: 기본 백테스트 ══════════════ -->
<div class="page on" id="page-0">
  <div class="content">
    <div class="section-title">▸ 옵션</div>
    <div class="slider-row">
      <label>슬리피지</label>

<div class="page" id="page-1">

  </div>
</div>

<!-- ══════════════ 탭 2: 워크포워드 ══════════════ -->
<div class="page" id="page-2">
  <div class="content">
    <div class="section-title">▸ 학습/검증 구간 분할</div>
    <div class="slider-row">
      <label>학습비율</label>
      <input type="range" min="50" max="90" step="5" value="70" id="wfRatio" oninput="document.getElementById('wfRatioVal').textContent=this.value+'%'">
      <span class="slider-val" id="wfRatioVal">70%</span>
    </div>
    <button class="btn primary" id="btnWf" onclick="runWf()" style="margin-top:8px;">▶ 워크포워드 실행</button>
    <div class="prog-bar" id="wfProg" style="display:none;"><div class="prog-fill" id="wfProgFill"></div></div>
    <div class="prog-text" id="wfProgText" style="display:none;"></div>
    <div id="wfResult" style="display:none;"></div>
  </div>
</div>

<!-- ══════════════ 탭 3: 대시보드 ══════════════ -->
<div class="page" id="page-3">
  <div class="content">
    <div class="section-title">▸ 종합 등급 (교차검증 + 워크포워드)</div>
    <button class="btn primary" id="btnDash" onclick="runDashboard()">▶ 종합 대시보드 실행</button>
    <div class="prog-bar" id="dashProg" style="display:none;"><div class="prog-fill" id="dashProgFill"></div></div>
    <div class="prog-text" id="dashProgText" style="display:none;"></div>
    <div id="dashResult" style="display:none;"></div>
  </div>
</div>

<!-- ══════════════ 탭 4: 페이퍼 트레이딩 ══════════════ -->
<div class="page" id="page-4">
  <div class="content">
    <div class="section-title">▸ BUY/SELL 신호 기록</div>
    <div class="btn-row">
      <button class="btn" onclick="recordPaper('BUY')" style="border-color:var(--green);color:var(--green);">📗 BUY 기록</button>

    <div id="paperList" style="margin-top:8px;"></div>
    <div class="btn-row" style="margin-top:12px;">
      <button class="btn" onclick="updatePaperResults()">🔄 결과 업데이트</button>
      <button class="btn" onclick="clearPaper()" style="border-color:var(--red);color:var(--red);">🗑 전체 삭제</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
</body>

<!-- SCRIPT: 엔진 코드 (sx_scanner 동일) -->
<!-- ═══════════════════════════════════════════════════════ -->
<script>
'use strict';
// ── localStorage 안전 래퍼 ──
const _memStore={};
let _lsOk=false;
try{localStorage.setItem('__t__','1');localStorage.removeItem('__t__');_lsOk=true;}catch(_){}
const Store={
  get(k){if(_lsOk)try{const v=localStorage.getItem(k);if(v!==null)return v;}catch(_){}return _memStore[k]??null;},
  set(k,v){_memStore[k]=v;if(_lsOk)try{localStorage.setItem(k,v);}catch(_){}},
  remove(k){delete _memStore[k];if(_lsOk)try{localStorage.removeItem(k);}catch(_){}},
};
// ── 유틸 ──
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fmt=(n,d=0)=>!isFinite(n)?'-':Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtPct=n=>!isFinite(n)?'-':(n>=0?'+':'')+n.toFixed(1)+'%';
function vibrate(p=30){try{navigator.vibrate&&navigator.vibrate(p)}catch(_){}}
