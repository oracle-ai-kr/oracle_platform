<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a1008;--panel:#2a1a08;--panel2:#1e1408;
  --red:#e8002a;--red2:#ff1a42;--green:#00c853;--green2:#00e676;
  --gold:#ffd600;--gold2:#ffec6e;--orange:#ff8c00;
  --text:#f5e8c0;--text2:#b8a070;--text3:#6a5030;
  --dalgona:#d4852a;--dalgona2:#e8a040;--dalgona3:#f0c060;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;overflow:hidden;touch-action:none;}

/* ── 배경 ── */
#bg{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(210,130,40,.12) 0%, transparent 60%),
    linear-gradient(180deg,#1a1008 0%,#120c04 100%);
}
#bg::before{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(45deg,rgba(210,130,40,.02) 0px,rgba(210,130,40,.02) 1px,transparent 1px,transparent 28px);
}

/* ── 헤더 ── */
#header{
  position:fixed;top:0;left:0;right:0;z-index:200;height:50px;
  display:flex;align-items:center;gap:8px;padding:0 12px;
  background:rgba(20,12,4,.95);border-bottom:1px solid rgba(210,130,40,.2);
  backdrop-filter:blur(10px);
}
#backBtn{
  width:32px;height:32px;border-radius:8px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  color:var(--text2);font-size:.9rem;display:flex;align-items:center;justify-content:center;cursor:pointer;
}
#backBtn:active{opacity:.7;}
.hd-title{font-family:'Black Han Sans',sans-serif;font-size:.88rem;letter-spacing:.05em;color:var(--gold);flex:1;}
.hd-timer{font-family:'Black Han Sans',sans-serif;font-size:1.05rem;color:var(--gold);}
.hd-sec{font-size:.6rem;color:var(--text3);margin-left:1px;}

/* ── 메인 ── */
#main{
  position:fixed;top:50px;left:0;right:0;bottom:0;
  display:flex;flex-direction:column;align-items:center;
  z-index:1;overflow:hidden;
}

/* ── 달고나 판 ── */
#dalgonaWrap{
  flex:1;display:flex;align-items:center;justify-content:center;
  width:100%;position:relative;
}

/* 달고나 배경판 */
#dalgonaBoard{
  position:relative;
  width:min(80vw,320px);
  height:min(80vw,320px);
}

/* 달고나 캔버스 */
#bgCanvas{position:absolute;inset:0;border-radius:50%;}
#traceCanvas{position:absolute;inset:0;}
#guideCanvas{position:absolute;inset:0;}

/* 달고나 테두리 효과 */
#dalgonaBoard::before{
  content:'';position:absolute;inset:-4px;border-radius:50%;
  background:linear-gradient(135deg,var(--dalgona3),var(--dalgona));
  z-index:-1;box-shadow:0 8px 32px rgba(210,130,40,.4);
}

/* ── 상단 정보바 ── */
#infoBar{
  width:100%;max-width:360px;padding:10px 16px 0;
  display:flex;align-items:center;gap:10px;
}
.shape-label{
  font-family:'Black Han Sans',sans-serif;font-size:.88rem;letter-spacing:.04em;
  color:var(--gold2);
}
.diff-badge{
  font-size:.62rem;font-weight:900;padding:3px 8px;border-radius:20px;
  background:rgba(255,214,0,.12);color:var(--gold);border:1px solid rgba(255,214,0,.25);
}
.tolerance-bar-wrap{margin-left:auto;display:flex;align-items:center;gap:6px;}
.tol-label{font-size:.6rem;color:var(--text3);}
.tol-bar{width:60px;height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;}
.tol-fill{height:100%;border-radius:3px;transition:width .15s,background .15s;background:var(--green2);}

/* ── 진행 표시 ── */
#progressWrap{
  width:100%;max-width:360px;padding:8px 16px 0;
}
.prog-row{display:flex;justify-content:space-between;margin-bottom:4px;}
.prog-label{font-size:.62rem;color:var(--text3);}
.prog-pct{font-size:.68rem;font-weight:900;color:var(--gold2);}
.prog-bg{height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:3px;transition:width .1s;}

/* ── 바늘 안내 ── */

}

/* ── 오버레이 ── */
.overlay{

}

.ov-box{

}
@keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.ov-icon{font-size:2.8rem;margin-bottom:8px;display:block;}
.ov-title{font-family:'Black Han Sans',sans-serif;font-size:1.2rem;letter-spacing:.06em;margin-bottom:6px;}
.ov-title.win{color:var(--green2);}
.ov-title.lose{color:var(--red2);}
.ov-desc{font-size:.76rem;color:var(--text2);line-height:1.75;margin-bottom:16px;white-space:pre-line;}

}
.rule-box b{color:var(--text);}
.rule-box .red{color:var(--red2);}
.rule-box .grn{color:var(--green2);}
.rule-box .gold{color:var(--gold);}
.ov-btn{
  width:100%;padding:12px;border:none;border-radius:12px;
  font-family:'Black Han Sans',sans-serif;font-size:.9rem;letter-spacing:.04em;
  cursor:pointer;margin-bottom:8px;transition:all .15s;
}
.ov-btn:last-child{margin-bottom:0;}
.ov-btn.primary{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;}
.ov-btn.gold{background:linear-gradient(135deg,#b8840a,var(--gold));color:#1a0800;}
.ov-btn.green{background:linear-gradient(135deg,var(--green),var(--green2));color:#0a1a0a;}
.ov-btn.secondary{background:rgba(255,255,255,.07);color:var(--text2);border:1px solid rgba(255,255,255,.09);}
.ov-btn:active{opacity:.8;}

/* 모양 선택 버튼 */
.shape-select{display:flex;gap:8px;margin-bottom:16px;}
.shape-btn{
  flex:1;padding:10px 4px;border-radius:10px;border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.05);cursor:pointer;transition:all .18s;
  display:flex;flex-direction:column;align-items:center;gap:4px;
}
.shape-btn:active{transform:scale(.96);}
.shape-btn.selected{background:rgba(255,214,0,.12);border-color:rgba(255,214,0,.4);}
.shape-btn-icon{font-size:1.4rem;}
.shape-btn-name{font-size:.6rem;color:var(--text2);font-weight:700;}
.shape-btn-diff{font-size:.55rem;color:var(--text3);}

/* ── 카운트다운 ── */
#countdown{
  position:fixed;inset:0;z-index:350;
  background:rgba(0,0,0,.75);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;
}
#countdown.hidden{display:none;}
.cd-num{
  font-family:'Black Han Sans',sans-serif;font-size:5rem;
  color:var(--gold);text-shadow:0 0 40px rgba(255,214,0,.7);
  animation:cdPop .88s ease infinite;
}
@keyframes cdPop{0%{transform:scale(1.3)}80%{transform:scale(.95)}100%{transform:scale(1.3)}}
.cd-sub{font-size:.75rem;color:rgba(255,255,255,.6);letter-spacing:.1em;}

/* ── 토스트 ── */
#toast{
  position:fixed;top:58px;left:50%;transform:translateX(-50%) translateY(-10px);
  background:rgba(20,12,4,.95);border:1px solid rgba(210,130,40,.3);
  border-radius:10px;padding:7px 16px;font-size:.76rem;color:var(--text);
  opacity:0;transition:all .3s;pointer-events:none;z-index:500;
  white-space:nowrap;max-width:88vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── 균열 이펙트 → squid_fx.js로 대체 ── */
</style>

<script>
// ════════════════════════════
// 게임 정보
// ════════════════════════════
const gameInfo = JSON.parse(sessionStorage.getItem('SQ_CURRENT_GAME') || '{"gameId":"sq_dalgona","isNew":true}');

// ════════════════════════════
// 모양 설정 (별/우산 민감도 완화)
// ════════════════════════════
const SHAPES = {
  circle:   { name:'원',     icon:'⭕', diff:'★★☆☆☆', tolerance:14, time:30 },
  triangle: { name:'삼각형', icon:'🔺', diff:'★★★☆☆', tolerance:14, time:40 },
  square:   { name:'네모',   icon:'⬛', diff:'★★☆☆☆', tolerance:14, time:30 },
  star:     { name:'별',     icon:'⭐', diff:'★★★★☆', tolerance:18, time:60 },
  heart:    { name:'하트',   icon:'❤️', diff:'★★★☆☆', tolerance:15, time:50 },
  cross:    { name:'십자',   icon:'✚',  diff:'★★★☆☆', tolerance:16, time:45 },
};
const SHAPE_KEYS = ['circle','triangle','square','star','heart','cross'];

// 진동 유틸
function vibrate(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }

let selectedShape = SHAPE_KEYS[Math.floor(Math.random()*SHAPE_KEYS.length)];

// ════════════════════════════
// 상태
// ════════════════════════════
let gameState    = 'intro';
let timeLeft     = 60;
let timerIv      = null;
let isTracking   = false;
let pathPoints   = [];    // 모양 외곽선 포인트들
let tracedPct    = 0;     // 진행률 0~1
let startIdx     = 0;     // 시작 포인트 인덱스
let tolerance    = 18;    // 허용 픽셀
let cracks       = 0;     // 균열 횟수
const MAX_CRACKS = 5;     // 이 이상이면 탈락
let firstTouch   = false; // 첫 터치 여부
let closestIdx   = 0;     // 현재 가장 가까운 경로 포인트
let crackCooldown = 0;    // 균열 쿨다운 (ms 타임스탬프)

// 캔버스
let bgCtx, traceCtx, guideCtx;
let W = 0, H = 0;
let CX = 0, CY = 0, R = 0; // 중심, 반지름

// ════════════════════════════
// 모양 선택
// ════════════════════════════
function selectShape(shape){
  selectedShape = shape;
  document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('btn_'+shape).classList.add('selected');
}

// ════════════════════════════
// 캔버스 초기화
// ════════════════════════════
function initCanvas(){
  const board = document.getElementById('dalgonaBoard');
  W = board.clientWidth;
  H = board.clientHeight;
  CX = W/2; CY = H/2;
  R  = Math.min(W,H)*0.42;

  ['bgCanvas','traceCanvas','guideCanvas'].forEach(id=>{
    const c = document.getElementById(id);
    c.width = W; c.height = H;
  });
  bgCtx    = document.getElementById('bgCanvas').getContext('2d');
  traceCtx = document.getElementById('traceCanvas').getContext('2d');
  guideCtx = document.getElementById('guideCanvas').getContext('2d');

  drawDalgona();
  generatePath();
  drawGuide();
}

// ════════════════════════════
// 달고나 배경 그리기
// ════════════════════════════
function drawDalgona(){
  const ctx = bgCtx;
  ctx.clearRect(0,0,W,H);

  // 달고나 원형 배경
  const grad = ctx.createRadialGradient(CX,CY-R*.1,R*.1,CX,CY,R*1.05);
  grad.addColorStop(0,'#f0c060');
  grad.addColorStop(.5,'#d4852a');
  grad.addColorStop(1,'#a05818');
  ctx.beginPath();
  ctx.arc(CX,CY,R*1.02,0,Math.PI*2);
  ctx.fillStyle = grad;
  ctx.fill();

  // 달고나 표면 텍스처
  ctx.beginPath();
  ctx.arc(CX,CY,R*1.02,0,Math.PI*2);
  ctx.fillStyle = 'rgba(255,220,120,.12)';
  ctx.fill();

  // 테두리 링
  ctx.beginPath();
  ctx.arc(CX,CY,R*1.02,0,Math.PI*2);
  ctx.strokeStyle = '#c07828';
  ctx.lineWidth = 4;
  ctx.stroke();

  // 막대 (하단)
  ctx.fillStyle = '#a05018';
  ctx.fillRect(CX-6, CY+R*.9, 12, R*.4);
  ctx.fillStyle = '#c06820';
  ctx.fillRect(CX-4, CY+R*.9, 8, R*.4);
}

// ════════════════════════════
// 경로 생성
// ════════════════════════════
function generatePath(){
  pathPoints = [];
  const shape = selectedShape;
  const pts   = [];
  const pr    = R * 0.62; // 경로 반지름

  if(shape === 'circle'){
    const N = 120;
    for(let i=0;i<N;i++){
      const a = (i/N)*Math.PI*2 - Math.PI/2;
      pts.push({x: CX+Math.cos(a)*pr, y: CY+Math.sin(a)*pr});
    }
  } else if(shape === 'triangle'){
    const N = 120;
    const corners = [
      {x:CX, y:CY-pr*1.1},
      {x:CX+pr*1.0, y:CY+pr*0.65},
      {x:CX-pr*1.0, y:CY+pr*0.65},
    ];
    for(let i=0;i<N;i++){
      const t = (i/N)*3;
      const seg = Math.floor(t);
      const frac = t - seg;
      const a = corners[seg], b = corners[(seg+1)%3];
      pts.push({x:a.x+(b.x-a.x)*frac, y:a.y+(b.y-a.y)*frac});
    }
  } else if(shape === 'square'){
    // 네모: 4개 꼭짓점 시계방향
    const s = pr * 0.72; // 한 변 절반 길이
    const corners = [
      {x:CX-s, y:CY-s},
      {x:CX+s, y:CY-s},
      {x:CX+s, y:CY+s},
      {x:CX-s, y:CY+s},
    ];
    const N = 120;
    for(let i=0; i<N; i++){
      const t = (i/N)*4;
      const seg = Math.floor(t);
      const frac = t - seg;
      const a = corners[seg], b = corners[(seg+1)%4];
      pts.push({x: a.x+(b.x-a.x)*frac, y: a.y+(b.y-a.y)*frac});
    }
  } else if(shape === 'star'){
    const N = 150;
    const outerR = pr*1.05, innerR = pr*0.45;
    const points5 = 5;
    for(let i=0;i<N;i++){
      const a = (i/N)*Math.PI*2 - Math.PI/2;
      const sector = (i/N)*points5*2;
      const isOuter = Math.floor(sector)%2===0;
      const frac = sector - Math.floor(sector);
      const r1 = isOuter ? outerR : innerR;
      const r2 = isOuter ? innerR : outerR;
      const r = r1 + (r2-r1)*frac;
      pts.push({x:CX+Math.cos(a)*r, y:CY+Math.sin(a)*r});
    }
  } else if(shape === 'heart'){
    // 하트: 수학 공식 기반 (크기 키움)
    const N = 150;
    for(let i=0; i<N; i++){
      const t = (i/N)*Math.PI*2 - Math.PI/2;
      const r = pr * 0.72; // 크기 키움 0.58 → 0.72
      const x = r * 16 * Math.pow(Math.sin(t),3) / 16;
      const y = -r * (13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t)) / 16;
      pts.push({ x: CX + x, y: CY + y * 0.95 });
    }
  } else if(shape === 'cross'){
    // 십자: 12개 꼭짓점으로 구성
    const a = pr * 0.28; // 팔 너비 절반
    const b = pr * 0.72; // 팔 길이
    const corners = [
      {x:CX-a, y:CY-b}, {x:CX+a, y:CY-b}, // 위 팔 상단
      {x:CX+a, y:CY-a}, {x:CX+b, y:CY-a}, // 오른쪽 팔 상단
      {x:CX+b, y:CY+a}, {x:CX+a, y:CY+a}, // 오른쪽 팔 하단
      {x:CX+a, y:CY+b}, {x:CX-a, y:CY+b}, // 아래 팔 하단
      {x:CX-a, y:CY+a}, {x:CX-b, y:CY+a}, // 왼쪽 팔 하단
      {x:CX-b, y:CY-a}, {x:CX-a, y:CY-a}, // 왼쪽 팔 상단
    ];
    const N = 120;
    for(let i=0; i<N; i++){
      const t = (i/N) * corners.length;
      const seg = Math.floor(t);
      const frac = t - seg;
      const a2 = corners[seg], b2 = corners[(seg+1)%corners.length];
      pts.push({x: a2.x+(b2.x-a2.x)*frac, y: a2.y+(b2.y-a2.y)*frac});
    }
  }

  // 포인트 간 보간으로 촘촘하게
  pathPoints = pts;
  tolerance = SHAPES[shape].tolerance;
}

// ════════════════════════════
// 가이드 라인 그리기
// ════════════════════════════
function drawGuide(){
  const ctx = guideCtx;
  ctx.clearRect(0,0,W,H);
  if(pathPoints.length < 2) return;
  const isOpen = false;

  // 허용 범위 영역
  ctx.beginPath();
  pathPoints.forEach((p,i)=>{ i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y); });
  if(!isOpen) ctx.closePath();
  ctx.strokeStyle = 'rgba(255,200,50,.35)';
  ctx.lineWidth = tolerance*2;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.stroke();

  // 외곽선
  ctx.beginPath();
  pathPoints.forEach((p,i)=>{ i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y); });
  if(!isOpen) ctx.closePath();
  ctx.strokeStyle = 'rgba(255,230,100,.9)';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // 시작점 표시
  const sp = pathPoints[0];
  ctx.beginPath();
  ctx.arc(sp.x, sp.y, 8, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,230,118,.85)';
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 8px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('START', sp.x, sp.y-14);
}

// ════════════════════════════
// 진행 그리기
// ════════════════════════════
function drawTrace(upToIdx){
  const ctx = traceCtx;
  ctx.clearRect(0,0,W,H);
  if(upToIdx < 1) return;

  // 완료된 경로
  ctx.beginPath();
  for(let i=0;i<=Math.min(upToIdx,pathPoints.length-1);i++){
    const p = pathPoints[i];
    i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y);
  }
  ctx.strokeStyle = 'rgba(0,230,118,.8)';
  ctx.lineWidth = 4;
  ctx.lineJoin = 'round';
  ctx.lineCap  = 'round';
  ctx.stroke();

  // 현재 위치 dot
  const cp = pathPoints[Math.min(upToIdx, pathPoints.length-1)];
  ctx.beginPath();
  ctx.arc(cp.x, cp.y, 6, 0, Math.PI*2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cp.x, cp.y, 4, 0, Math.PI*2);
  ctx.fillStyle = '#00e676';
  ctx.fill();
}

// ════════════════════════════
// 카운트다운
// ════════════════════════════
function startCountdown(){
  document.getElementById('startOverlay').classList.add('hidden');

  // 랜덤 모양 확정
  selectedShape = SHAPE_KEYS[Math.floor(Math.random()*SHAPE_KEYS.length)];
  const shape = SHAPES[selectedShape];
  timeLeft  = shape.time;
  tolerance = shape.tolerance;
  document.getElementById('timerDisp').textContent = timeLeft;
  document.getElementById('shapeLabel').textContent = shape.icon+' '+shape.name;
  document.getElementById('diffBadge').textContent  = shape.diff;

  initCanvas();

  // FX: 카운트다운 비네팅
  SQ.vignette(true, true);

  let c = 3;
  document.getElementById('cdNum').textContent = c;
  document.getElementById('countdown').classList.remove('hidden');
  SQ.vibrate(100);
  const iv = setInterval(()=>{
    c--;
    if(c<=0){
      clearInterval(iv);
      document.getElementById('countdown').classList.add('hidden');
      SQ.vignette(false);
      SQ.flash('white', 120);
      SQ.vibrate([80,60,80,60,150]);
      startGame();
    } else {
      document.getElementById('cdNum').textContent = c;
      SQ.vibrate(80);
    }
  }, 900);
}

// ════════════════════════════
// 게임 시작
// ════════════════════════════
function startGame(){
  gameState  = 'playing';
  cracks     = 0;
  tracedPct  = 0;
  firstTouch = false;
  closestIdx = 0;
  crackCooldown = 0;
  updateTolBar();

  // FX: 게임 시작 멘트
  SQ.announce('두 번째 게임', {type:'system', duration:1800});
  setTimeout(()=>{
    const shape = SHAPES[selectedShape];
    SQ.announce(`🍭 달고나 뽑기 — ${shape.icon} ${shape.name}`, {type:'guard', duration:2500, typing:true});
  }, 2000);

  // FX: 10초 알림 플래그
  let warned10 = false;

  timerIv = setInterval(()=>{
    timeLeft--;
    document.getElementById('timerDisp').textContent = timeLeft;

    // FX: 타이머 30초 이하 비네팅
    if(timeLeft === 30) SQ.vignette(true, false);

    // FX: 타이머 10초 멘트 (1회)
    if(timeLeft === 10 && !warned10){
      warned10 = true;
      SQ.announce('⏱ 서두르세요!', {type:'system', duration:2000});
    }

    // FX: 타이머 10초 이하 긴급
    if(timeLeft <= 10){
      SQ.timerUrgent(timeLeft);
      document.getElementById('timerDisp').style.color='var(--red2)';
      SQ.vibrate(timeLeft<=5 ? [60,30,60] : 30);
    }

    if(timeLeft<=0) timeUp();
  },1000);

  // 터치 이벤트
  const board = document.getElementById('dalgonaBoard');
  board.addEventListener('touchstart', onTouchStart, {passive:false});
  board.addEventListener('touchmove',  onTouchMove,  {passive:false});
  board.addEventListener('touchend',   onTouchEnd,   {passive:false});
  board.addEventListener('mousedown',  onMouseDown);
  board.addEventListener('mousemove',  onMouseMove);
  board.addEventListener('mouseup',    onMouseUp);
}

// ════════════════════════════
// 터치/마우스 이벤트
// ════════════════════════════
function getPos(e){
  const board = document.getElementById('dalgonaBoard');
  const rect  = board.getBoundingClientRect();
  const src   = e.touches ? e.touches[0] : e;
  return {x: src.clientX - rect.left, y: src.clientY - rect.top};
}

function onTouchStart(e){ e.preventDefault(); handleStart(getPos(e)); }
function onTouchMove(e) { e.preventDefault(); handleMove(getPos(e));  }
function onTouchEnd(e)  { e.preventDefault(); handleEnd();             }
function onMouseDown(e) { handleStart(getPos(e)); }
function onMouseMove(e) { if(isTracking) handleMove(getPos(e)); }
function onMouseUp(e)   { handleEnd(); }

function handleStart(pos){
  if(gameState !== 'playing') return;
  // 시작점 근처에서만 시작 가능
  if(!firstTouch){
    const sp = pathPoints[0];
    const dist = Math.hypot(pos.x-sp.x, pos.y-sp.y);
    if(dist > tolerance*2.5){
      showToast('🟡 초록 점(START)에서 시작하세요!');
      return;
    }
    firstTouch = true;
  }
  isTracking = true;
  closestIdx = findClosest(pos);
}

function handleMove(pos){
  if(!isTracking || gameState !== 'playing') return;
  const nearest = findClosest(pos);
  const nearPt  = pathPoints[nearest];
  const dist    = Math.hypot(pos.x-nearPt.x, pos.y-nearPt.y);

  // 진행 방향만 허용 (역방향 방지, 순환 도형 대응)
  const totalPts = pathPoints.length;
  if(nearest >= closestIdx || (closestIdx > totalPts * 0.9 && nearest < totalPts * 0.1)){
    closestIdx = nearest;
  }

  // 허용 범위 벗어남 (쿨다운 300ms)
  const now = Date.now();
  if(dist > tolerance && now - crackCooldown > 300){
    crackCooldown = now;
    cracks++;
    updateTolBar();
    crackEffect();
    if(cracks >= MAX_CRACKS){
      isTracking = false;
      setTimeout(()=>showResult(false,'crack'), 200);
      return;
    }
    showToast(`⚠️ 균열! (${cracks}/${MAX_CRACKS})`);
    if(cracks >= 4) SQ.announce(`⚠️ 마지막 기회! 균열 ${cracks}/${MAX_CRACKS}`, {type:'danger', duration:1500});
  }

  // 진행률 계산
  const pct = closestIdx / (pathPoints.length-1);
  const prevPct = tracedPct;
  tracedPct = Math.max(tracedPct, pct);
  drawTrace(closestIdx);
  updateProgress(tracedPct);

  // 진행률 이정표
  if(prevPct < 0.5 && tracedPct >= 0.5){ showToast('🔥 절반 통과! 계속!'); SQ.flash('gold', 100); }
  else if(prevPct < 0.8 && tracedPct >= 0.8){ showToast('💪 거의 다 왔다!'); SQ.flash('green', 100); }

  // 완주 체크
  if(tracedPct >= 0.97){
    isTracking = false;
    setTimeout(()=>showResult(true), 300);
  }
}

function handleEnd(){
  isTracking = false;
}

// 가장 가까운 경로 포인트 찾기
function findClosest(pos){
  let minD = Infinity, minI = 0;
  // 탐색 범위를 넓혀서 빠른 움직임도 감지
  const start = Math.max(0, closestIdx-10);
  const end   = Math.min(pathPoints.length-1, closestIdx+40);
  for(let i=start;i<=end;i++){
    const d = Math.hypot(pos.x-pathPoints[i].x, pos.y-pathPoints[i].y);
    if(d<minD){ minD=d; minI=i; }
  }
  return minI;
}

// ════════════════════════════
// UI 업데이트
// ════════════════════════════
function updateProgress(pct){
  const p = Math.round(pct*100);
  document.getElementById('progFill').style.width = p+'%';
  document.getElementById('progPct').textContent  = p+'%';
}

function updateTolBar(){
  const pct = Math.max(0,(MAX_CRACKS-cracks)/MAX_CRACKS*100);
  const fill = document.getElementById('tolFill');
  fill.style.width = pct+'%';
  if(cracks===0)      fill.style.background = 'var(--green2)';
  else if(cracks<=1)  fill.style.background = 'var(--green)';
  else if(cracks<=2)  fill.style.background = 'var(--gold)';
  else if(cracks<=3)  fill.style.background = 'var(--orange)';
  else                fill.style.background = 'var(--red2)';
}

function crackEffect(){
  SQ.flash('red', 150);
  SQ.shake(300, false);
  SQ.vibrate([60,30,60]);
  // FX: 내구도 위험 (균열 3회 이상) → pulse warning
  if(cracks >= 3) SQ.pulse('warning');
}

// ════════════════════════════
// 탈락 / 클리어 / 시간초과
// ════════════════════════════
function timeUp(){
  if(gameState!=='playing') return;
  showResult(false,'timeout');
}

function stopAll(){
  if(gameState === 'result') return;
  gameState = 'result';
  clearInterval(timerIv);
  SQ.pulse(null);
  SQ.vignette(false);
  const board = document.getElementById('dalgonaBoard');
  board.removeEventListener('touchstart', onTouchStart);
  board.removeEventListener('touchmove',  onTouchMove);
  board.removeEventListener('touchend',   onTouchEnd);
  board.removeEventListener('mousedown',  onMouseDown);
  board.removeEventListener('mousemove',  onMouseMove);
  board.removeEventListener('mouseup',    onMouseUp);
}

// ════════════════════════════
// 결과
// ════════════════════════════
function showResult(win, reason=''){
  stopAll();
  const shape = SHAPES[selectedShape];
  const isNew = gameInfo.isNew !== false;
  const reward = win ? (isNew ? 600000 : 180000) : 0;
  const fee    = isNew ? 300000 : 100000;

  if(win){
    // FX: 클리어 연출
    SQ.clearEffect();
    SQ.bigText('통과!', 1500);

    document.getElementById('rIcon').textContent = '🍭';
    const t = document.getElementById('rTitle');
    t.textContent='클리어!'; t.className='ov-title win';
    document.getElementById('rDesc').textContent =
      `달고나 뽑기 성공!\n모양: ${shape.icon} ${shape.name}\n균열: ${cracks}회 · 남은 시간: ${timeLeft}초\n\n+${reward.toLocaleString('ko-KR')}원 획득!`;
    const b = document.getElementById('rBtn');
    b.className='ov-btn green'; b.textContent='결과 확인';
  } else {
    if(reason === 'crack'){
      // FX: 달고나 파손 연출
      const board = document.getElementById('dalgonaBoard');
      const rect = board.getBoundingClientRect();
      SQ.eliminateEffect({x: rect.left + rect.width/2, y: rect.top + rect.height/2});
      SQ.bigText('달고나 파손!', 1500);
    } else {
      // FX: 시간 초과 연출
      SQ.flash('red', 200);
      SQ.shake(500, true);
      SQ.bigText('시간 초과!', 1500);
    }

    const msgs = {
      crack:   `달고나가 깨져버렸습니다!\n균열 ${MAX_CRACKS}회 초과로 탈락.`,
      timeout: `제한시간 ${shape.time}초를 초과했습니다!\n진행률: ${Math.round(tracedPct*100)}%`,
    };
    document.getElementById('rIcon').textContent = reason==='crack'?'💔':'⏰';
    const t = document.getElementById('rTitle');
    t.textContent=reason==='crack'?'달고나 파손!':'시간 초과!';
    t.className='ov-title lose';
    document.getElementById('rDesc').textContent =
      `${msgs[reason]||'실패했습니다.'}\n\n-${fee.toLocaleString('ko-KR')}원`;
    const b = document.getElementById('rBtn');
    b.className='ov-btn primary'; b.textContent='결과 확인';
  }
  sessionStorage.setItem('SQ_GAME_RESULT', JSON.stringify({
    gameId: gameInfo.gameId, outcome: win?'clear':'fail'
  }));
  // FX 연출 후 자동으로 허브 이동
  setTimeout(()=>{
    SQ.cleanup(); sessionStorage.setItem('ORACLE_ENTRY',Date.now());window.location.href='squid_hub.html';
  }, 2000);
}

function goResult(){ SQ.cleanup(); sessionStorage.setItem('ORACLE_ENTRY',Date.now());window.location.href='squid_hub.html'; }
function quitGame(){
  const wasPlaying = (gameState !== 'result');
  stopAll();
  SQ.cleanup();
  if(wasPlaying){
    sessionStorage.setItem('SQ_GAME_RESULT',JSON.stringify({gameId:gameInfo.gameId,outcome:'fail'}));
  }
  sessionStorage.setItem('ORACLE_ENTRY',Date.now());window.location.href='squid_hub.html';
}

// ════════════════════════════
// 유틸
// ════════════════════════════
function showToast(msg,dur=1800){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),dur);
}
</script>
