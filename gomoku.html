<!DOCTYPE html>
<html lang="ko">
<head><script>
// ── ORACLE 토큰가드 ──
(function(){
  var t=sessionStorage.getItem('ORACLE_ENTRY');
  var ok=t&&(Date.now()-Number(t)<5000);
  if(ok) sessionStorage.removeItem('ORACLE_ENTRY');
  if(ok) return;
  function _show404(){
    document.body.style.cssText='margin:0;padding:0;overflow:hidden';
    Array.from(document.body.children).forEach(function(el){el.style.display='none'});
    var d=document.createElement('div');
    d.id='_oracle404';
    d.innerHTML='<div style="position:fixed;inset:0;z-index:999999;background:#0f1724;color:#e8eaf0;'
      +'font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;display:flex;align-items:center;'
      +'justify-content:center;text-align:center;padding:20px">'
      +'<div style="max-width:360px">'
      +'<div style="width:120px;height:120px;background:#fff;border-radius:50%;margin:0 auto 32px;'
      +'display:flex;align-items:center;justify-content:center">'
      +'<div style="width:72px;height:52px;border:3px solid #333;border-radius:6px;position:relative;'
      +'display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:24px;'
      +'font-weight:700;color:#d32f2f">404</div></div>'
      +'<h1 style="font-size:20px;font-weight:700;margin:0 0 12px">페이지를 찾을 수 없습니다.</h1>'
      +'<p style="font-size:14px;color:#8a91a0;line-height:1.6;margin:0 0 32px">'
      +'존재하지 않는 주소를 입력하셨거나,<br>'
      +'요청하신 페이지의 주소가 변경/삭제되어 찾을 수 없습니다.</p>'
      +'<a href="index.html" style="display:block;width:100%;padding:16px;background:#d32f2f;color:#fff;'
      +'font-size:16px;font-weight:700;border:none;border-radius:8px;cursor:pointer;text-decoration:none;'
      +'text-align:center">홈으로 이동</a>'
      +'</div></div>';
    document.body.appendChild(d);
  }
  if(document.body) _show404();
  else document.addEventListener('DOMContentLoaded', _show404);
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚫ 오목 — Gomoku</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Teko:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --wood:#C8935A;--wood-dark:#8B5E3C;--wood-light:#E8B87A;
  --gold:#D4A843;--gold-dark:#9A7020;
  --bg:#1a0f05;--panel:#0f0905;
  --red:#E03030;--green:#22CC55;--blue:#4A90E2;
  --beg:#4ade80;--mid:#facc15;--mas:#f87171;
}

/* ★ 스크롤 허용 */
html,body{
  background:var(--bg);
  font-family:'Noto Serif KR',serif;
  color:var(--wood-light);
  overflow-x:hidden;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  height:100%;
  width:100%;
}

/* ── 탭바 (공용 탭바 사용 → 숨김) ── */
.tab-bar{display:none!important;}
.tab-btn{flex:1;background:none;border:none;color:#553c1e;font-family:'Teko',sans-serif;font-size:0.9rem;letter-spacing:2px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:5px;border-bottom:2px solid transparent;-webkit-tap-highlight-color:transparent;}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold);}
.tab-content{display:none;position:relative;top:0;}
.tab-content.active{display:block;} #tab-game{display:block!important;}
#tab-game{
  background:radial-gradient(ellipse at 50% 30%,rgba(200,147,90,0.06) 0%,transparent 60%),
             radial-gradient(ellipse at 80% 80%,rgba(139,94,60,0.08) 0%,transparent 50%),
             var(--bg);
  /* ★ 수정: 화면 전체 채우기 */
  min-height:100vh;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}

/* ★ 제거: .header 관련 CSS 삭제 (HTML에 존재하지 않는 dead code) */
/* .header 블록 완전 제거 */

/* ── 모드/난이도 ── */
.mode-row{display:flex;gap:5px;padding:3px 8px 0;flex:1;}
.mode-btn{flex:1;padding:4px 3px;border-radius:6px;border:1px solid #2a1a08;background:transparent;color:#553c1e;font-family:'Teko',sans-serif;font-size:0.75rem;letter-spacing:.5px;cursor:pointer;transition:all 0.2s;text-align:center;-webkit-tap-highlight-color:transparent;}
.mode-btn.active{background:rgba(212,168,67,0.12);border-color:var(--gold-dark);color:var(--gold);}
.diff-row{display:flex;gap:4px;padding:3px 8px 0;flex:1;align-items:center;}
.diff-label{display:none;}
.diff-btn{flex:1;padding:4px 2px;border-radius:6px;border:1px solid #2a1a08;background:transparent;color:#553c1e;font-family:'Teko',sans-serif;font-size:0.82rem;letter-spacing:.5px;cursor:pointer;transition:all 0.2s;text-align:center;-webkit-tap-highlight-color:transparent;line-height:1.1;font-weight:600;}
.diff-btn .dsub{display:none;}
#diffBeg{color:var(--beg);border-color:rgba(74,222,128,0.35);}
#diffMid{color:var(--mid);border-color:rgba(250,204,21,0.35);}
#diffMas{color:var(--mas);border-color:rgba(248,113,113,0.35);}
#diffBeg.active{background:rgba(74,222,128,0.12);border-color:var(--beg);color:var(--beg);}
#diffMid.active{background:rgba(250,204,21,0.12);border-color:var(--mid);color:var(--mid);}
#diffMas.active{background:rgba(248,113,113,0.12);border-color:var(--mas);color:var(--mas);animation:mpulse 2s ease infinite;}
#diffBeg.practice-disabled,#diffMid.practice-disabled,#diffMas.practice-disabled{opacity:0.3;cursor:not-allowed;pointer-events:none;}
@keyframes mpulse{0%,100%{box-shadow:none}50%{box-shadow:0 0 10px rgba(248,113,113,0.35)}}

/* ── API 입력 ── */
.api-box{display:none;margin:2px 14px 6px;background:#0a0400;border:1px solid rgba(248,113,113,0.3);border-radius:10px;padding:10px 12px;animation:fadein 0.3s ease;}
.api-box.show{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.api-head{font-family:'Teko',sans-serif;font-size:0.75rem;letter-spacing:2px;color:rgba(248,113,113,0.9);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.api-badge{font-size:0.6rem;background:rgba(248,113,113,0.15);border:1px solid rgba(248,113,113,0.3);border-radius:4px;padding:1px 6px;}
.api-row{display:flex;gap:6px;}
.api-input{flex:1;height:34px;border-radius:7px;border:1px solid rgba(248,113,113,0.25);background:#060200;color:var(--wood-light);font-size:0.76rem;padding:0 10px;outline:none;font-family:monospace;transition:border-color 0.2s;}
.api-input:focus{border-color:rgba(248,113,113,0.6);}
.api-save{height:34px;padding:0 12px;border-radius:7px;border:none;background:rgba(248,113,113,0.18);color:var(--mas);font-family:'Teko',sans-serif;font-size:0.85rem;cursor:pointer;white-space:nowrap;transition:all 0.2s;}
.api-save:hover{background:rgba(248,113,113,0.3);}
.api-msg{font-size:0.67rem;margin-top:5px;min-height:15px;transition:color 0.3s;}
.api-msg.ok{color:var(--green);}
.api-msg.err{color:var(--red);}
.api-msg.wait{color:var(--mid);}

/* ── 생각 중 바 ── */
.think-bar{height:3px;display:none;background:linear-gradient(90deg,transparent,var(--gold),transparent);background-size:200%;animation:tscroll 1.2s linear infinite;}
.think-bar.show{display:block;}
@keyframes tscroll{0%{background-position:100%}100%{background-position:-100%}}

/* ── 상태바 ── */
.status-bar{display:flex;align-items:center;justify-content:space-between;padding:4px 10px;background:rgba(0,0,0,0.3);gap:6px;}
.turn-ind{display:flex;align-items:center;gap:9px;}
.stone-prev{width:20px;height:20px;border-radius:50%;flex-shrink:0;transition:all 0.3s;}
.stone-prev.black{background:radial-gradient(circle at 35% 35%,#555,#111);box-shadow:0 2px 8px rgba(0,0,0,0.8),inset 0 1px 3px rgba(255,255,255,0.2);}
.stone-prev.white{background:radial-gradient(circle at 35% 35%,#fff,#d0cdc8);box-shadow:0 2px 8px rgba(0,0,0,0.5),inset 0 1px 3px rgba(255,255,255,0.8);}
.turn-txt{font-family:'Teko',sans-serif;font-size:.9rem;letter-spacing:1px;color:var(--wood-light);}
.move-cnt{font-family:'Teko',sans-serif;font-size:0.75rem;color:#a07850;letter-spacing:.5px;}

/* ── 보드 ── */
.board-outer{background:linear-gradient(135deg,#c8935a,#a8733a,#c8935a);border-radius:8px;padding:7px;box-shadow:0 0 30px rgba(200,147,90,0.2),0 8px 32px rgba(0,0,0,0.8);position:relative;}
.board-outer::before{content:'';position:absolute;inset:0;border-radius:8px;background:repeating-linear-gradient(8deg,transparent,transparent 14px,rgba(0,0,0,0.03) 14px,rgba(0,0,0,0.03) 15px),repeating-linear-gradient(172deg,transparent,transparent 20px,rgba(255,255,255,0.02) 20px,rgba(255,255,255,0.02) 21px);pointer-events:none;}
canvas#boardCanvas{display:block;border-radius:4px;cursor:crosshair;touch-action:none;}

/* ── 컨트롤 ── */
.controls{display:flex;gap:8px;padding:4px 14px 8px;}
.ctrl-btn{flex:1;height:40px;border-radius:8px;border:1px solid #333;background:#0f0905;color:var(--wood);font-family:'Teko',sans-serif;font-size:1rem;letter-spacing:2px;cursor:pointer;transition:all 0.2s;-webkit-tap-highlight-color:transparent;}
.ctrl-btn:active{transform:scale(0.96);}
.ctrl-btn.primary{border-color:var(--gold-dark);color:var(--gold);}
.ctrl-btn.danger{border-color:#552020;color:var(--red);}
.ctrl-btn.disabled{opacity:0.35;cursor:not-allowed;pointer-events:none;filter:grayscale(0.5);}

/* ── 오버레이 ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:300;display:none;align-items:center;justify-content:center;}
.overlay.show{display:flex;}
.ov-box{background:linear-gradient(160deg,#1e1005,#120800);border:2px solid var(--gold-dark);border-radius:16px;padding:26px 30px;text-align:center;max-width:290px;width:90%;box-shadow:0 0 40px rgba(212,168,67,0.2);}
.ov-icon{font-size:2.8rem;margin-bottom:8px;}
.ov-badge{display:inline-block;font-family:'Teko',sans-serif;font-size:0.72rem;letter-spacing:2px;padding:3px 10px;border-radius:10px;margin-bottom:8px;}
.ov-title{font-family:'Teko',sans-serif;font-size:1.8rem;letter-spacing:4px;color:var(--gold);margin-bottom:6px;}
.ov-sub{font-size:0.82rem;color:var(--wood);margin-bottom:20px;line-height:1.6;}
.ov-btn{width:100%;height:46px;border-radius:10px;border:none;background:linear-gradient(135deg,#6a3a10,#9a5520,#c8730a,#9a5520,#6a3a10);color:#fff;font-family:'Teko',sans-serif;font-size:1.3rem;letter-spacing:4px;cursor:pointer;}
.ov-btn:active{transform:scale(0.97);}

/* CONFETTI */
.cf{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden;}
.cp{position:absolute;top:-12px;animation:cffall linear forwards;}
@keyframes cffall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:0}}

/* ── 타이머 바 ── */
#timerBar{height:3px;width:100%;background:rgba(255,255,255,.08);overflow:hidden;transition:none;}
#timerFill{height:100%;width:100%;border-radius:2px;transition:width .25s linear,background .5s;}
#timerTxt{font-family:'Teko',sans-serif;font-size:.72rem;letter-spacing:1px;color:var(--gold);min-width:28px;text-align:right;}
.timer-wrap{display:flex;align-items:center;gap:6px;padding:2px 10px 0;}

/* ── 힌트 버튼 ── */
#hintBtn{
  padding:3px 10px;border-radius:6px;
  border:1px solid rgba(74,222,128,.4);
  background:rgba(74,222,128,.08);
  color:#4ade80;font-family:'Teko',sans-serif;font-size:.72rem;
  letter-spacing:.5px;cursor:pointer;white-space:nowrap;
  transition:all .2s;-webkit-tap-highlight-color:transparent;
}
#hintBtn:disabled{opacity:.3;cursor:not-allowed;}
#hintBtn.used1{border-color:rgba(250,204,21,.4);color:#facc15;background:rgba(250,204,21,.08);}
#hintBtn.used2{border-color:rgba(248,113,113,.4);color:#f87171;background:rgba(248,113,113,.08);}
.hint-dot{
  position:absolute;border:2.5px solid #4ade80;border-radius:50%;
  pointer-events:none;z-index:10;
  animation:hint-pulse 1.2s ease-in-out infinite;
}
@keyframes hint-pulse{0%,100%{opacity:1;transform:translate(-50%,-50%) scale(1)}50%{opacity:.5;transform:translate(-50%,-50%) scale(1.15)}}

/* ── 돌 이펙트: 마지막 돌 반짝이기 ── */
@keyframes stone-ring-pulse{
  0%{opacity:1;transform:translate(-50%,-50%) scale(.6)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}
}
.stone-ring{
  position:absolute;border-radius:50%;border:2px solid;
  pointer-events:none;z-index:9;
  animation:stone-ring-pulse .55s ease-out forwards;
}

/* ── 5목 완성 빛 효과 ── */
@keyframes win-beam{
  0%{opacity:0;filter:blur(2px)}
  30%{opacity:1;filter:blur(0)}
  80%{opacity:1}
  100%{opacity:0}
}
.win-beam{
  position:absolute;height:4px;border-radius:2px;
  background:linear-gradient(90deg,transparent,#ffd700,#fff,#ffd700,transparent);
  pointer-events:none;z-index:11;
  animation:win-beam 1.4s ease-out forwards;
  transform-origin:left center;
}

/* ── 핸디캡 배지 ── */
#handicapBadge{
  font-family:'Teko',sans-serif;font-size:.65rem;letter-spacing:.5px;
  padding:1px 6px;border-radius:4px;display:none;
  background:rgba(251,146,60,.15);border:1px solid rgba(251,146,60,.4);color:#fb923c;
}

/* ── 베팅 패널 난이도 테두리 ── */
#betPanel.diff-beg{border-color:rgba(74,222,128,.45);}
#betPanel.diff-mid{border-color:rgba(250,204,21,.45);}
#betPanel.diff-mas{border-color:rgba(248,113,113,.45);}

/* ── sizeCanvas offset 관련 — board-wrap 고정 ── */
.board-wrap{display:flex;justify-content:center;padding:3px 6px 2px;}

/* ── 연습모드 버튼 ── */
#practiceBtn{
  padding:4px 8px;
  border-radius:6px;
  border:1.5px solid rgba(100,180,255,0.45);
  background:transparent;
  color:rgba(100,180,255,0.65);
  font-family:'Teko',sans-serif;
  font-size:0.75rem;
  letter-spacing:.5px;
  cursor:pointer;
  transition:all 0.2s;
  white-space:nowrap;
  -webkit-tap-highlight-color:transparent;
  position:relative;
  z-index:1;
  user-select:none;
}
#practiceBtn.active{
  background:rgba(80,160,255,0.18);
  border:2.5px solid rgba(120,200,255,1);
  color:rgba(160,225,255,1);
  box-shadow:0 0 8px rgba(100,180,255,0.5);
}
/* 잔액 없을 때 전체 비활성화 */
.diff-btn.no-balance{
  opacity:0.28;
  cursor:not-allowed;
  color:#555 !important;
  border-color:#333 !important;
  background:transparent !important;
  pointer-events:none;
}
/* 연습모드일 때 중수/고수 비활성화 */
#diffBeg.practice-disabled,#diffMid.practice-disabled,#diffMas.practice-disabled{
  opacity:0.28;
  cursor:not-allowed;
  color:#555 !important;
  border-color:#333 !important;
  background:transparent !important;
  pointer-events:none;
}





/* ── 카지노 단일 테마 업그레이드 ── */
.bet-panel{background:linear-gradient(180deg,rgba(18,10,5,.94),rgba(10,5,1,.88));border:1px solid rgba(212,168,67,.28);box-shadow:inset 0 1px 0 rgba(255,224,162,.06),0 6px 18px rgba(0,0,0,.18);}
.bet-amount-lbl,.bet-odds-lbl,.bet-payout-val,.bet-status-txt{color:#e1d0bc;}
.bet-amount-val{color:#44df8a;text-shadow:0 0 8px rgba(68,223,138,.08);}
.bet-odds-val{color:#52e29a;font-weight:700;text-shadow:0 0 10px rgba(82,226,154,.1);}
.turn-txt{color:#fff4e6;font-weight:700;text-shadow:0 0 8px rgba(255,244,230,.08);}
.move-cnt{color:#f0dcc0;font-weight:700;}
.mode-btn{color:#e4cfae;border-color:rgba(212,168,67,.22);background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(0,0,0,.04));}
.mode-btn.active{background:linear-gradient(180deg,rgba(212,168,67,.18),rgba(212,168,67,.08));border-color:rgba(212,168,67,.5);color:#ffd978;box-shadow:inset 0 1px 0 rgba(255,230,180,.08),0 4px 12px rgba(0,0,0,.16);}
.diff-btn{border-color:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.02);}
.diff-btn.no-balance,#diffBeg.practice-disabled,#diffMid.practice-disabled,#diffMas.practice-disabled{opacity:.56;color:#a7acb3 !important;border-color:rgba(167,172,179,.22) !important;}
.status-bar{background:linear-gradient(90deg,rgba(19,10,5,.9),rgba(33,19,10,.72));border-top:1px solid rgba(255,221,170,.05);border-bottom:1px solid rgba(212,168,67,.1);}
.timer-wrap{background:linear-gradient(180deg,rgba(255,255,255,.015),rgba(0,0,0,.02));}
.board-outer{background:linear-gradient(135deg,#d2a26b,#b57a42,#d6a168);box-shadow:0 0 26px rgba(212,168,67,.14),0 10px 34px rgba(0,0,0,.72);}
.ctrl-btn{background:linear-gradient(180deg,#110904,#090401);border-color:rgba(212,168,67,.16);color:#deb07b;box-shadow:inset 0 1px 0 rgba(255,228,180,.04);}
.ctrl-btn.primary{border-color:rgba(212,168,67,.42);color:#ffd978;box-shadow:inset 0 1px 0 rgba(255,228,180,.06),0 0 0 1px rgba(212,168,67,.05);}
#hintBtn,#practiceBtn{font-weight:700;}
#gmToast{background:rgba(10,4,0,.96);border-color:rgba(212,168,67,.3);color:#f6dfb7;}

/* ── 가독성/2인전 배너 개선 ── */
.bet-amount-lbl,.bet-odds-lbl{color:#f6e7cf !important;font-weight:700;text-shadow:0 0 8px rgba(255,235,200,.10);}
.bet-payout-val{color:#d8c2a2 !important;}
.bet-amount-val,.bet-odds-val{filter:drop-shadow(0 0 6px rgba(255,255,255,.05));}
.mode-divider{width:1px;height:20px;background:rgba(255,255,255,.1);flex-shrink:0;}
#pvpTurnBanner{display:none;align-items:center;justify-content:center;min-width:0;flex:1;height:34px;border-radius:10px;border:1px solid rgba(212,168,67,.20);background:linear-gradient(180deg,rgba(255,248,230,.04),rgba(0,0,0,.08));font-family:'Teko',sans-serif;font-size:1rem;letter-spacing:1px;font-weight:700;padding:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:inset 0 1px 0 rgba(255,240,205,.05);}
#pvpTurnBanner.show{display:flex;}
#pvpTurnBanner.black-turn{color:#ffd978;border-color:rgba(212,168,67,.42);text-shadow:0 0 10px rgba(255,217,120,.20);}
#pvpTurnBanner.white-turn{color:#eef4ff;border-color:rgba(140,180,255,.38);text-shadow:0 0 10px rgba(190,220,255,.18);}
#pvpTurnBanner.flash{animation:pvpFlash .65s ease 1;}
@keyframes pvpFlash{0%{transform:scale(.98);opacity:.72;box-shadow:0 0 0 rgba(255,255,255,0)}40%{transform:scale(1.01);opacity:1;box-shadow:0 0 14px rgba(255,220,140,.12)}100%{transform:scale(1);opacity:1;box-shadow:none;}}

#spectatorCommentary{display:none;align-items:center;justify-content:center;min-height:28px;margin:0 8px 4px;padding:4px 12px;border-radius:10px;border:1px solid rgba(212,168,67,.16);background:linear-gradient(180deg,rgba(255,248,230,.04),rgba(0,0,0,.08));font-family:'Teko',sans-serif;font-size:.92rem;letter-spacing:.6px;color:#f6e7cf;text-align:center;box-shadow:inset 0 1px 0 rgba(255,240,205,.05);}
#spectatorCommentary.show{display:flex;}
#spectatorCommentary.black-note{color:#ffd978;border-color:rgba(212,168,67,.38);text-shadow:0 0 10px rgba(255,217,120,.16);}
#spectatorCommentary.white-note{color:#eef4ff;border-color:rgba(140,180,255,.34);text-shadow:0 0 10px rgba(190,220,255,.14);}
#spectatorCommentary.note-flash{animation:commentaryFlash .75s ease 1;}
@keyframes commentaryFlash{0%{transform:translateY(-1px);opacity:.7}45%{transform:translateY(0);opacity:1;box-shadow:0 0 14px rgba(255,220,140,.10)}100%{transform:translateY(0);opacity:1;box-shadow:none}}
.bet-panel{padding:4px clamp(8px,2.2vw,14px);}

<script>
// ══════════════════════════════════════════
//  탭 전환
// ══════════════════════════════════════════
function switchTab(tab){}

// ══════════════════════════════════════════════
//  ① 타이머 시스템
// ══════════════════════════════════════════════
const TIMER_SECS = {beg:10, mid:20, mas:30};
let timerInterval = null;
let timerRemain = 0;

function startTimer(){
  stopTimer();
  if(isSpectating()) return;
  if(mode !== 'ai' || gameOver || currentPlayer !== 1) return;
  timerRemain = TIMER_SECS[difficulty] || 10;
  const total = timerRemain;
  updateTimerUI(timerRemain, total);
  timerInterval = setInterval(()=>{
    timerRemain--;
    updateTimerUI(timerRemain, total);
    if(timerRemain <= 0){
      stopTimer();
      autoRandomMove();
    }
  }, 1000);
}

function stopTimer(){
  clearInterval(timerInterval);
  timerInterval = null;
  const fill = document.getElementById('timerFill');
  const txt  = document.getElementById('timerTxt');
  if(fill) fill.style.width = '100%';
  if(txt)  txt.textContent = '—';
}

function updateTimerUI(remain, total){
  const fill = document.getElementById('timerFill');
  const txt  = document.getElementById('timerTxt');
  if(!fill || !txt) return;
  const pct = Math.max(0, remain / total * 100);
  fill.style.width = pct + '%';
  txt.textContent = remain + 's';
  // 색상: 초록→노랑→빨강
  if(pct > 50)      fill.style.background = '#4ade80';
  else if(pct > 25) fill.style.background = '#facc15';
  else              fill.style.background = '#f87171';
  // 5초 이하면 txt 빨갛게
  txt.style.color = remain <= 5 ? '#f87171' : 'var(--gold)';
}

function autoRandomMove(){
  if(isSpectating()) return;
  if(gameOver || currentPlayer !== 1) return;
  // 연습모드: 잔액 차단 없이 진행
  const empties = [];
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    if(board[r][c]===0){
      let near=false;
      for(let dr=-2;dr<=2;dr++) for(let dc=-2;dc<=2;dc++){
        if(!dr&&!dc) continue;
        const nr=r+dr,nc=c+dc;
        if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&board[nr][nc]!==0){near=true;break;}
      }
      if(near) empties.push([r,c]);
    }
  }
  if(!empties.length){ for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(board[r][c]===0) empties.push([r,c]); }
  if(!empties.length) return;
  const [r,c] = empties[Math.floor(Math.random()*empties.length)];
  showToastGm('⏱️ 시간 초과! 자동 착수');
  // [BUG FIX 1] setTimeout(0)으로 래핑된 aiMove 보장 (스크립트 하단에서 재정의된 버전 사용)
  if(placeStone(r,c) && !gameOver && mode==='ai' && currentPlayer===2){
    setTimeout(()=>{ if(!gameOver && currentPlayer===2) aiMove(); }, 0);
  }
}

// ══════════════════════════════════════════════
//  ② 힌트 시스템
// ══════════════════════════════════════════════
let hintUsed = 0;       // 0,1,2
let hintDotEl = null;

function useHint(){
  if(gameOver || currentPlayer !== 1 || mode !== 'ai') return;
  if(hintUsed >= 2){ showToastGm('💡 힌트를 모두 사용했습니다'); return; }
  hintUsed++;
  // 배당률 감소
  hintOddsMultiplier = hintUsed === 1 ? 0.9 : 0.8; // 1회 -10%, 2회 -20%
  updateBetPanel();

  // 힌트 계산 (getMoveBeg 로직 활용)
  const me=1, ai=2;
  // 즉시 이길 수 있는 수 우선
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    if(board[r][c]===0){
      board[r][c]=me; if(checkWin(r,c,me)){board[r][c]=0; showHintDot(r,c); return;} board[r][c]=0;
    }
  }
  // AI 4목 막기
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    if(board[r][c]===0){
      board[r][c]=ai; if(checkWin(r,c,ai)){board[r][c]=0; showHintDot(r,c); return;} board[r][c]=0;
    }
  }
  // 최선 착수 추천
  const cands=[];
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    if(board[r][c]===0){
      let near=false;
      for(let dr=-2;dr<=2;dr++) for(let dc=-2;dc<=2;dc++){
        if(!dr&&!dc) continue;
        const nr=r+dr,nc=c+dc;
        if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&board[nr][nc]!==0){near=true;break;}
      }
      if(near) cands.push({r,c,s:evalPoint(board,r,c,me)*1.1+evalPoint(board,r,c,ai)*0.9});
    }
  }
  if(!cands.length){ cands.push({r:7,c:7,s:0}); }
  cands.sort((a,b)=>b.s-a.s);
  showHintDot(cands[0].r, cands[0].c);

  // 힌트 버튼 업데이트
  const btn = document.getElementById('hintBtn');
  if(btn){
    if(hintUsed===1){ btn.textContent='💡 힌트 1'; btn.className='used1'; }
    else            { btn.textContent='💡 ×'; btn.className='used2'; btn.disabled=true; }
  }
  showToastGm(hintUsed===1 ? '💡 힌트 사용 (배당 -10%)' : '💡 힌트 2회 사용 (배당 -20%)');
}

function showHintDot(r, c){
  removeHintDot();
  const outer = document.querySelector('.board-outer');
  if(!outer) return;
  const x = PAD + c*CELL;
  const y = PAD + r*CELL;
  const dot = document.createElement('div');
  dot.className = 'hint-dot';
  dot.style.cssText = `width:${STONE_R*2.2}px;height:${STONE_R*2.2}px;left:${7+x}px;top:${7+y}px;`;
  outer.appendChild(dot);
  hintDotEl = dot;
  // 3초 후 자동 제거
  setTimeout(removeHintDot, 3000);
}

function removeHintDot(){
  if(hintDotEl){ hintDotEl.remove(); hintDotEl=null; }
}

function resetHint(){
  hintUsed = 0;
  hintOddsMultiplier = 1.0;
  removeHintDot();
  const btn = document.getElementById('hintBtn');
  if(btn){ btn.textContent='💡 힌트 2'; btn.className=''; btn.disabled=false; }
}

// ══════════════════════════════════════════════
//  ④ 핸디캡 (AI 돌 자동 랜덤 1~3개)
// ══════════════════════════════════════════════
function applyHandicap(){
  // 고수(MAS) 난이도에서만 'AI(백) 선배치'로 난이도를 올리는 옵션
  // 관전모드(AI vs AI)나 연습모드에서는 적용하지 않음
  if(mode !== 'ai') return;
  if(isSpectating()) return;
  if(typeof practiceMode !== 'undefined' && practiceMode) return;
  if(difficulty !== 'mas') return;

  const count = Math.floor(Math.random()*3)+1; // 1~3
  const badge = document.getElementById('handicapBadge');
  // 중앙 주변에 AI(백) 돌 랜덤 배치
  const center = 7;
  const placed = [];
  const tries = 30;
  for(let i=0;i<tries && placed.length<count;i++){
    const r = center + Math.floor(Math.random()*7)-3;
    const c = center + Math.floor(Math.random()*7)-3;
    if(r>=2&&r<SIZE-2&&c>=2&&c<SIZE-2&&board[r][c]===0&&!placed.find(p=>p[0]===r&&p[1]===c)){
      board[r][c] = 2; // AI = 백
      moveHistory.push({r,c,player:2,handicap:true});
      placed.push([r,c]);
    }
  }
  if(badge){ badge.textContent='🔰 핸디캡 '+placed.length; badge.style.display='inline'; }
  drawBoard();
  showToastGm('핸디캡 적용 · AI(백) '+placed.length+'개 선배치');
}

function spawnStoneRing(r, c, player){
  const outer = document.querySelector('.board-outer');
  if(!outer) return;
  const x = PAD + c*CELL;
  const y = PAD + r*CELL;
  const ring = document.createElement('div');
  ring.className = 'stone-ring';
  const color = player===1 ? 'rgba(200,200,200,0.8)' : 'rgba(255,220,80,0.8)';
  ring.style.cssText = `width:${STONE_R*2.4}px;height:${STONE_R*2.4}px;left:${7+x}px;top:${7+y}px;border-color:${color};transform:translate(-50%,-50%);`;
  outer.appendChild(ring);
  setTimeout(()=>ring.remove(), 600);
}

function spawnWinBeam(cells){
  const outer = document.querySelector('.board-outer');
  if(!outer||!cells||cells.length<2) return;
  const [r0,c0] = cells[0];
  const [r1,c1] = cells[cells.length-1];
  const x0 = 7 + PAD + c0*CELL;
  const y0 = 7 + PAD + r0*CELL;
  const x1 = 7 + PAD + c1*CELL;
  const y1 = 7 + PAD + r1*CELL;
  const dx = x1-x0, dy = y1-y0;
  const len = Math.sqrt(dx*dx+dy*dy) + STONE_R*2;
  const angle = Math.atan2(dy,dx)*180/Math.PI;
  const beam = document.createElement('div');
  beam.className = 'win-beam';
  beam.style.cssText = `left:${x0-STONE_R}px;top:${y0}px;width:${len}px;transform:rotate(${angle}deg);`;
  outer.appendChild(beam);
  setTimeout(()=>beam.remove(), 1500);
}

// ★ 수정: 상단 헤더 제거 후 오프셋 재계산
// iframe 내부 window.innerHeight = 화면높이 - gameBar(54px)
// 보드 위 UI: 점수칩(~48) + 베팅패널(~88) + 모드행(~48) + 난이도행(~46) + 상태바(~38) + 패딩 = ~280px
// 보드 아래 UI: 컨트롤(~58) + 옵션(~60) = ~120px
// 여유값 포함 총 오프셋: ~210 사용 (기존 240 → 210으로 축소)
function sizeCanvas(){
  woodGrainCache = null; // 크기 변경 시 나무결 재생성
  const wrap=document.querySelector('.board-wrap');
  const topBarH = document.body.classList.contains('in-iframe') ? 0 : 44;
  const avail=Math.min(wrap.clientWidth-20, window.innerHeight-282-topBarH);
  const sz=Math.max(240,Math.min(390,avail));
  canvas.width=sz;canvas.height=sz;
  PAD=sz*0.055;
  CELL=(sz-PAD*2)/(SIZE-1);
  STONE_R=CELL*0.44;
}

// ── AI 생각시간: 자동 가변 템포(A+B 혼합) ──
function randInt(min,max){ return Math.floor(min + Math.random()*(max-min+1)); }
function getMoveCount(){ return Array.isArray(moveHistory) ? moveHistory.length : 0; }
function getBaseDelayRangeSec(diff, moveCount){
  if(moveCount <= 20) return [2,4];
  if(moveCount <= 40) return [3,6];
  if(diff==='mid') return [6,9];
  if(diff==='mas') return [7,10];
  return [5,8];
}
function getStrategicExtraDelayMs(player){
  const empties = [];
  let occupied = 0;
  let denseScore = 0;
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(board[r][c]){
    occupied++;
    let neighbors = 0;
    for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
      if(!dr && !dc) continue;
      const nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&board[nr][nc]) neighbors++;
    }
    denseScore += neighbors;
  }
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(board[r][c]===0){
    let near=false;
    for(let dr=-2;dr<=2 && !near;dr++) for(let dc=-2;dc<=2;dc++){
      if(!dr && !dc) continue;
      const nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&board[nr][nc]){ near=true; break; }
    }
    if(near) empties.push([r,c]);
  }
  let winningThreats = 0;
  let urgentBlocks = 0;
  let openFourish = 0;
  const opponent = player===1 ? 2 : 1;
  const sample = empties.length>18 ? empties.sort(()=>Math.random()-0.5).slice(0,18) : empties;
  for(const [r,c] of sample){
    board[r][c]=player;
    if(checkWin(r,c,player)) winningThreats++;
    if(typeof countOpenFoursAfterMove==='function') openFourish += Math.min(2, countOpenFoursAfterMove(board,r,c,player));
    board[r][c]=opponent;
    if(checkWin(r,c,opponent)) urgentBlocks++;
    if(typeof countOpenFoursAfterMove==='function') openFourish += Math.min(2, countOpenFoursAfterMove(board,r,c,opponent));
    board[r][c]=0;
  }
  const densityFactor = occupied>0 ? Math.min(1, (denseScore/Math.max(1,occupied*8))) : 0;
  let extra = 0;
  extra += Math.min(900, urgentBlocks * 350);
  extra += Math.min(700, winningThreats * 260);
  extra += Math.min(500, openFourish * 80);
  extra += Math.round(250 + densityFactor * 450);
  return Math.min(1600, Math.max(0, extra));
}
function getAIDelayMs(player=currentPlayer){
  const moveCount = getMoveCount();
  const diff = (isSpectating()) ? 'beg' : difficulty;
  const [minSec, maxSec] = getBaseDelayRangeSec(diff, moveCount);
  const baseMs = randInt(minSec*1000, maxSec*1000);
  const extraMs = moveCount >= 18 ? getStrategicExtraDelayMs(player) : 0;
  return baseMs + extraMs;
}

let spectatorMode = false;
// [⑥ REFACTOR] isSpectating() 헬퍼 — 16곳 반복 패턴 통합
function isSpectating(){ return spectatorMode === true; }
let spectatorToken = 0;
let gameSessionId = 0;
let pvpBannerFlashTimer = null;
let spectatorCommentaryFlashTimer = null;
const gameplayTimers = new Set();

function scheduleGameplay(fn, delay){
  const id = setTimeout(()=>{
    gameplayTimers.delete(id);
    fn();
  }, delay);
  gameplayTimers.add(id);
  return id;
}
function clearGameplayTimers(){
  gameplayTimers.forEach(id=>clearTimeout(id));
  gameplayTimers.clear();
}
function beginFreshSession(){
  gameSessionId++;
  clearGameplayTimers();
}

function getLineStrengthAt(r,c,player){
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  let best=1;
  for(const [dr,dc] of dirs){
    let cnt=1;
    for(let i=1;i<5;i++){const nr=r+dr*i,nc=c+dc*i;if(nr<0||nr>=SIZE||nc<0||nc>=SIZE||board[nr][nc]!==player)break;cnt++;}
    for(let i=1;i<5;i++){const nr=r-dr*i,nc=c-dc*i;if(nr<0||nr>=SIZE||nc<0||nc>=SIZE||board[nr][nc]!==player)break;cnt++;}
    if(cnt>best) best=cnt;
  }
  return best;
}
function countNearbyStones(r,c,player,dist=1){
  let cnt=0;
  for(let dr=-dist;dr<=dist;dr++)for(let dc=-dist;dc<=dist;dc++){
    if(!dr&&!dc) continue;
    const nr=r+dr,nc=c+dc;
    if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&board[nr][nc]===player) cnt++;
  }
  return cnt;
}
function getSpectatorCommentary(lastMove){
  if(!lastMove) return '👀 형세를 살피는 중입니다';
  const {r,c,player} = lastMove;
  const who = player===1 ? '흑' : '백';
  const moveNo = moveHistory.length;
  const line = getLineStrengthAt(r,c,player);
  const allies = countNearbyStones(r,c,player,1);
  const foes = countNearbyStones(r,c,player===1?2:1,1);
  const nearCenter = Math.abs(r-7)+Math.abs(c-7) <= 2;
  if(moveNo===1 && r===7 && c===7) return '중앙 장악 시도';
  if(line>=4) return `${who}이 승부수를 던집니다`;
  if(line===3) return `${who}이 연결을 노립니다`;
  if(foes>=3 && allies<=1) return `${who}이 방어를 선택했습니다`;
  if(moveNo<=6 && nearCenter) return '중앙 주도권을 잡으려 합니다';
  if(allies>=3) return `${who}이 세력을 넓혀 갑니다`;
  if(foes>=2) return `${who}이 상대 흐름을 끊어냅니다`;
  return `${who}이 형세를 살피며 신중하게 둡니다`;
}
function syncSpectatorCommentary(lastMove=null, doFlash=false){
  const el = document.getElementById('spectatorCommentary');
  if(!el) return;
  if(mode==='ai' && spectatorMode){
    const move = lastMove || moveHistory[moveHistory.length-1] || null;
    const text = getSpectatorCommentary(move);
    const player = move ? move.player : 1;
    el.textContent = text;
    el.classList.add('show');
    el.classList.toggle('black-note', player===1);
    el.classList.toggle('white-note', player===2);
    if(doFlash){
      el.classList.remove('note-flash');
      void el.offsetWidth;
      el.classList.add('note-flash');
      clearTimeout(spectatorCommentaryFlashTimer);
      spectatorCommentaryFlashTimer = setTimeout(()=>el.classList.remove('note-flash'), 760);
    }
  }else{
    el.className = '';
    el.textContent = '';
  }
}
function syncTopControlState(){
  const is2p = mode === '2p';
  const banner = document.getElementById('pvpTurnBanner');
  const hintBtn = document.getElementById('hintBtn');
  const practiceBtn = document.getElementById('practiceBtn');
  const diffRow = document.getElementById('diffRow');
  const div1 = document.getElementById('dividerAfterMode');
  const div2 = document.getElementById('dividerBeforeTools');
  const modeAI = document.getElementById('modeAI');
  const mode2P = document.getElementById('mode2P');
  if(modeAI) modeAI.classList.toggle('active', mode==='ai');
  if(mode2P) mode2P.classList.toggle('active', mode==='2p');
  if(diffRow) diffRow.style.display = is2p ? 'none' : 'flex';
  if(hintBtn) hintBtn.style.display = is2p ? 'none' : '';
  if(practiceBtn){
    practiceBtn.style.display = is2p ? 'none' : '';
    practiceBtn.classList.toggle('active', !!practiceMode && !is2p);
  }
  if(div1) div1.style.display = '';
  if(div2) div2.style.display = is2p ? 'none' : '';
  if(banner){
    if(is2p){
      banner.classList.add('show');
      syncPvpTurnBanner(true);
    }else{
      banner.classList.remove('show','black-turn','white-turn','flash');
      banner.textContent='';
    }
  }
  syncSpectatorCommentary(null,false);
}

function shouldSpectate(){
  // 잔금이 없고(하수도 불가) 연습모드 OFF일 때만 자동 관전
  return mode==='ai' && !practiceMode && (balance < 100000);
}

function stopSpectator(){
  spectatorMode = false;
  spectatorToken++;
  clearGameplayTimers();
  const hb = document.getElementById('hintBtn');
  if(hb){ hb.disabled = false; hb.style.opacity=''; }
  syncSpectatorCommentary(null,false);
}

function startSpectator(){
  // 재시작 포함: 호출될 때마다 루프 토큰을 갱신해 새 판을 굴린다
  clearGameplayTimers();
  spectatorMode = true;
  spectatorToken++;

  // 관전은 항상 하수 AI끼리
  difficulty = 'beg';
  ['Beg','Mid','Mas'].forEach(x=>{
    const el = document.getElementById('diff'+x);
    if(el) el.classList.toggle('active', x.toLowerCase()==='beg');
  });

  const hb = document.getElementById('hintBtn');
  if(hb){ hb.disabled = true; hb.style.opacity='0.35'; }
  showToastGm('👀 관전모드: AI 하수 vs AI 하수');

  const myToken = spectatorToken;
  // 관전모드: 첫 수는 2초 뒤 흑이 중앙에 둔다
  const mid = Math.floor(SIZE/2);
  syncSpectatorCommentary({r:mid,c:mid,player:1}, false);
  const mySession = gameSessionId;
  scheduleGameplay(()=>{
    if(!spectatorMode || myToken!==spectatorToken || mySession!==gameSessionId) return;
    if(gameOver || mode!=='ai') return;
    // 빈 보드에서만 강제 중앙 첫 수
    if(moveHistory.length===0 && currentPlayer===1 && board[mid][mid]===0){
      placeStone(mid, mid);
    }
    // 이후부터는 진행도/상황 기반 자동 템포로 진행
    spectatorStep(myToken);
  }, 2000);
}

function getMoveForPlayer(p){
  // 기존 엔진은 me=2(백), hu=1(흑) 기준
  if(p===2){
    if(difficulty==='beg') return getMoveBeg();
    if(difficulty==='mid') return getMoveMid(4);
    return getMoveMas();
  }
  // p===1일 때는 보드 색을 잠깐 스왑해서 같은 엔진 재사용
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    if(board[r][c]===1) board[r][c]=2;
    else if(board[r][c]===2) board[r][c]=1;
  }
  let mv;
  if(difficulty==='beg') mv = getMoveBeg();
  else if(difficulty==='mid') mv = getMoveMid(4);
  else mv = getMoveMas();
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    if(board[r][c]===1) board[r][c]=2;
    else if(board[r][c]===2) board[r][c]=1;
  }
  return mv;
}

function spectatorStep(tok){
  if(!spectatorMode || tok!==spectatorToken) return;
  if(gameOver || mode!=='ai') return;

  // 타이머/랜덤 자동착수 방지
  stopTimer();

  const tb = document.getElementById('thinkBar');
  if(tb) tb.classList.add('show');

  const delay = getAIDelayMs(currentPlayer); // 관전모드: 진행도/위협도/밀집도 기반 자동 템포
  const mySession = gameSessionId;
  scheduleGameplay(()=>{
    if(tb) tb.classList.remove('show');
    if(!spectatorMode || tok!==spectatorToken || mySession!==gameSessionId) return;
    if(gameOver || mode!=='ai') return;

    const mv = getMoveForPlayer(currentPlayer);
    if(mv && !gameOver){
      placeStone(mv[0], mv[1]);
    }
    if(!gameOver && spectatorMode && tok===spectatorToken && mySession===gameSessionId){
      // 다음 수 진행(다음 spectatorStep에서 다시 자동 딜레이 적용)
      spectatorStep(tok);
    }
  }, delay);
}

// 나무결 캐시 (sizeCanvas 호출 시 갱신)
let woodGrainCache = null;
let woodGrainSize  = 0;
function buildWoodGrain(sz){
  const offscreen = document.createElement('canvas');
  offscreen.width = sz; offscreen.height = sz;
  const octx = offscreen.getContext('2d');
  octx.fillStyle='#C8935A';
  octx.fillRect(0,0,sz,sz);
  for(let i=0;i<10;i++){
    octx.beginPath();
    const y=(i/9)*sz;
    octx.moveTo(0,y);
    octx.bezierCurveTo(sz*.3,y+(Math.random()*3-1.5),sz*.7,y+(Math.random()*3-1.5),sz,y);
    octx.strokeStyle='rgba(0,0,0,0.035)';octx.lineWidth=1;octx.stroke();
  }
  woodGrainCache = offscreen;
  woodGrainSize  = sz;
}

function drawBoard(){
  const sz=canvas.width;
  // 나무결 캐시 사용 (크기 변경 시만 재생성)
  if(!woodGrainCache || woodGrainSize !== sz) buildWoodGrain(sz);
  ctx.drawImage(woodGrainCache, 0, 0);
  ctx.strokeStyle='#7a4e2d';ctx.lineWidth=0.8;
  for(let i=0;i<SIZE;i++){
    const x=PAD+i*CELL,y=PAD+i*CELL;
    ctx.beginPath();ctx.moveTo(x,PAD);ctx.lineTo(x,PAD+(SIZE-1)*CELL);ctx.stroke();
    ctx.beginPath();ctx.moveTo(PAD,y);ctx.lineTo(PAD+(SIZE-1)*CELL,y);ctx.stroke();
  }
  ctx.strokeStyle='#5a3a1a';ctx.lineWidth=2;
  ctx.strokeRect(PAD,PAD,(SIZE-1)*CELL,(SIZE-1)*CELL);
  [[3,3],[3,11],[11,3],[11,11],[7,7]].forEach(([r,c])=>{
    ctx.beginPath();ctx.arc(PAD+c*CELL,PAD+r*CELL,CELL*0.12,0,Math.PI*2);
    ctx.fillStyle='#5a3a1a';ctx.fill();
  });
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(board[r][c])drawStone(r,c,board[r][c]);
  if(moveHistory.length){
    const last=moveHistory[moveHistory.length-1];
    const x=PAD+last.c*CELL,y=PAD+last.r*CELL;
    ctx.strokeStyle=board[last.r][last.c]===1?'rgba(255,80,80,0.9)':'rgba(60,120,255,0.9)';
    ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(x,y,STONE_R*0.34,0,Math.PI*2);ctx.stroke();
  }
}

function drawStone(r,c,player){
  const x=PAD+c*CELL,y=PAD+r*CELL;
  if(player===1){
    const g=ctx.createRadialGradient(x-STONE_R*.3,y-STONE_R*.3,STONE_R*.05,x,y,STONE_R);
    g.addColorStop(0,'#666');g.addColorStop(.4,'#222');g.addColorStop(1,'#050505');
    ctx.beginPath();ctx.arc(x,y,STONE_R,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=0.5;ctx.stroke();
  }else{
    const g=ctx.createRadialGradient(x-STONE_R*.3,y-STONE_R*.3,STONE_R*.05,x,y,STONE_R);
    g.addColorStop(0,'#fff');g.addColorStop(.5,'#e8e4de');g.addColorStop(1,'#b8b4ae');
    ctx.beginPath();ctx.arc(x,y,STONE_R,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.lineWidth=0.5;ctx.stroke();
  }
}

// ══════════════════════════════════════════
//  게임 로직 (수정 없음)
// ══════════════════════════════════════════
function checkWin(r,c,player){
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(const[dr,dc]of dirs){
    let cnt=1;
    for(let i=1;i<5;i++){const nr=r+dr*i,nc=c+dc*i;if(nr<0||nr>=SIZE||nc<0||nc>=SIZE||board[nr][nc]!==player)break;cnt++;}
    for(let i=1;i<5;i++){const nr=r-dr*i,nc=c-dc*i;if(nr<0||nr>=SIZE||nc<0||nc>=SIZE||board[nr][nc]!==player)break;cnt++;}
    if(cnt>=5)return true;
  }
  return false;
}

function checkWinBoard(b,r,c,player){
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(const[dr,dc]of dirs){
    let cnt=1;
    for(let i=1;i<5;i++){const nr=r+dr*i,nc=c+dc*i;if(nr<0||nr>=SIZE||nc<0||nc>=SIZE||b[nr][nc]!==player)break;cnt++;}
    for(let i=1;i<5;i++){const nr=r-dr*i,nc=c-dc*i;if(nr<0||nr>=SIZE||nc<0||nc>=SIZE||b[nr][nc]!==player)break;cnt++;}
    if(cnt>=5)return true;
  }
  return false;
}

function getWinCells(r,c,player){
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(const[dr,dc]of dirs){
    const cells=[[r,c]];
    for(let i=1;i<5;i++){const nr=r+dr*i,nc=c+dc*i;if(nr<0||nr>=SIZE||nc<0||nc>=SIZE||board[nr][nc]!==player)break;cells.push([nr,nc]);}
    for(let i=1;i<5;i++){const nr=r-dr*i,nc=c-dc*i;if(nr<0||nr>=SIZE||nc<0||nc>=SIZE||board[nr][nc]!==player)break;cells.unshift([nr,nc]);}
    if(cells.length>=5)return cells.slice(0,5);
  }
  return null;
}

function highlightWin(cells){
  ctx.shadowColor='rgba(255,215,0,0.9)';ctx.shadowBlur=14;
  ctx.strokeStyle='rgba(255,215,0,0.95)';ctx.lineWidth=3;
  cells.forEach(([r,c])=>{ctx.beginPath();ctx.arc(PAD+c*CELL,PAD+r*CELL,STONE_R*.58,0,Math.PI*2);ctx.stroke();});
  ctx.shadowBlur=0;
  // ⑦ 빔 효과
  spawnWinBeam(cells);
}

function placeStone(r,c){
  if(gameOver||board[r][c]||aiThinking)return false;
  stopTimer();
  removeHintDot();
  board[r][c]=currentPlayer;
  moveHistory.push({r,c,player:currentPlayer});
  drawBoard();
  spawnStoneRing(r,c,currentPlayer);
  // [UX 1] 모바일 햅틱 피드백 (플레이어 착수: 30ms, AI 착수: 10ms)
  if(navigator.vibrate) navigator.vibrate(currentPlayer===1 ? 30 : 10);
  if(currentPlayer===1){
    const foul=getFoulTypeIfAny(r,c,1);
    if(foul){foulReason=foul;endGame(2);return true;}
  }
  if(checkWin(r,c,currentPlayer)){
    const cells=getWinCells(r,c,currentPlayer);
    if(cells)highlightWin(cells);
    endGame(currentPlayer);
    return true;
  }
  if(moveHistory.length===SIZE*SIZE){endGame(0);return true;}
  currentPlayer=currentPlayer===1?2:1;
  updateStatus();
  if(isSpectating()){
    syncSpectatorCommentary(moveHistory[moveHistory.length-1], true);
  }
  return true;
}

// [UX 2] 무르기 버튼 시각적 비활성화 동기화
function syncUndoBtn(){
  const btn = document.getElementById('undoBtn');
  if(!btn) return;
  // AI 생각 중이거나 관전모드이거나 기보 없으면 비활성
  const disabled = aiThinking || gameOver ||
    (isSpectating()) ||
    !moveHistory || moveHistory.length === 0;
  btn.classList.toggle('disabled', disabled);
}

function updateStatus(msg){
  syncUndoBtn();
  if(msg){
    const text=document.getElementById('turnText');
    text.textContent=msg; text.style.color='#f87171';
    return;
  }
  if(gameOver){
    if(!moveHistory || moveHistory.length === 0){
      const text=document.getElementById('turnText');
      text.textContent='🚀 게임 시작을 눌러주세요'; text.style.color='#a78bfa';
    }
    return;
  }
  const stone=document.getElementById('turnStone');
  const text=document.getElementById('turnText');
  stone.className='stone-prev '+(currentPlayer===1?'black':'white');
  if(mode==='ai'){
    if(isSpectating()){
      stopTimer();
      text.textContent = currentPlayer===1 ? '👀 관전중: AI(흑) 생각 중...' : '👀 관전중: AI(백) 생각 중...';
      text.style.color = 'rgba(160,225,255,0.95)';
      syncSpectatorCommentary(null,false);
    } else
    if(currentPlayer===1){
      text.textContent='내 차례 (흑)';text.style.color='#D4A843';
      startTimer(); // 플레이어 차례에 타이머 시작
    } else {
      stopTimer();  // AI 차례엔 타이머 정지
      const lbl={beg:'하수 생각 중...',mid:'중수 생각 중...',mas:'고수 생각 중...'};
      text.textContent=lbl[difficulty]||'AI 생각 중...';

    syncSpectatorCommentary(null,false);
  }

}

function endGame(winner){
  gameOver=true;
  stopTimer();
  const badge=document.getElementById('ovBadge');
  if(mode==='ai'){
    const bc={beg:'rgba(74,222,128,0.2)',mid:'rgba(250,204,21,0.2)',mas:'rgba(248,113,113,0.2)'};
    const tc={beg:'#4ade80',mid:'#facc15',mas:'#f87171'};
    const lt={beg:'🟢 하수전',mid:'🟡 중수전',mas:'🔴 고수전'};
    badge.textContent=lt[difficulty];badge.style.background=bc[difficulty];badge.style.color=tc[difficulty];badge.style.display='inline-block';
  }else{badge.style.display='none';}
  const icon=document.getElementById('ovIcon'),title=document.getElementById('ovTitle'),sub=document.getElementById('ovSub');
  if(winner===0){
    icon.textContent='🤝';
    title.textContent=(isSpectating())?'관전 종료 · 무승부':'무승부!';
    sub.textContent=(isSpectating())?'끝내기까지 갔지만 누구도 5목을 완성하지 못했습니다':'바둑판이 꽉 찼습니다';
    // [BUG FIX] 무승부 시 베팅금 전액 환불 (관전모드 및 연습모드 제외)
    if(!isSpectating() && betPlaced && mode==='ai'){
      betPlaced = false;
      balance += betAmount;
      saveBalance(); updateBalUI();
      const ovBetEl = document.getElementById('ovBetResult');
      if(ovBetEl){ ovBetEl.textContent='🤝 무승부 — 베팅금 환불'; ovBetEl.style.color='#facc15'; }
      showToastGm('🤝 무승부! ₩' + betAmount.toLocaleString('ko-KR') + ' 환불');
    }
  }
  else if(winner===1){
    if(isSpectating()){
      icon.textContent='👀';
      title.textContent='관전: 흑 AI 승리!';
      sub.textContent='흑돌이 5목을 먼저 완성했습니다. 연습모드 ON 또는 충전/난이도 선택 후 직접 플레이할 수 있어요';
      blackWins++;
    } else {
      icon.textContent='🏆';title.textContent='흑돌 승리!';
    if(typeof practiceMode!=='undefined'&&practiceMode){
      sub.textContent='🏫 연습 성공! 실전에 도전해보세요 💪';
    } else {
      const wm={beg:'하수 AI를 이겼습니다!',mid:'중수 AI를 이겼습니다! 대단해요 🎉',mas:'고수 AI를 이겼습니다!! 최고의 실력자입니다 🔥'};
      sub.textContent=mode==='ai'?(wm[difficulty]||'승리!'):'흑돌이 5목을 완성했습니다';
    }
      blackWins++;launchConfetti(50);settleBet(true);
    }
  }else{
    if(foulReason){
      icon.textContent='🚫';
      title.textContent='반칙패!';
      sub.textContent=`흑 금지수: ${foulReason}`;
      foulReason='';
      if(!(isSpectating())) settleBet(false);
      whiteWins++;
      document.getElementById('whiteWins').textContent=whiteWins;
      scheduleGameplay(()=>document.getElementById('overlay').classList.add('show'),700);
      return;
    }
    if(isSpectating()){
      icon.textContent='👀';
      title.textContent='관전: 백 AI 승리!';
      sub.textContent='백돌이 끝내기에서 5목을 완성했습니다. 연습모드 ON 또는 충전/난이도 선택 후 직접 플레이할 수 있어요';
      whiteWins++;
    } else {
      icon.textContent=mode==='ai'?'🤖':'🏆';
      title.textContent=mode==='ai'?'AI 승리!':'백돌 승리!';
      if(typeof practiceMode!=='undefined'&&practiceMode){
        sub.textContent='🏫 연습 계속! 다시 해보세요 🔄';
      } else {
        const lm={beg:'하수도 못 이겼어요. 한번 더!',mid:'중수 AI가 완성했습니다',mas:'고수 AI의 완벽한 전략이었습니다'};
        sub.textContent=mode==='ai'?(lm[difficulty]||'AI 승리'):'백돌이 5목을 완성했습니다';
      }
      whiteWins++;if(mode!=='ai')launchConfetti(50);if(mode==='ai'){settleBet(false);} 
    }
  }
  document.getElementById('blackWins').textContent=blackWins;
  document.getElementById('whiteWins').textContent=whiteWins;
  scheduleGameplay(()=>document.getElementById('overlay').classList.add('show'),700);

  // 관전모드: 자동으로 다음 판 시작
  if(isSpectating()){
    scheduleGameplay(()=>{ if(spectatorMode) restartGame(); }, 1700);
  }
}

function placeBet(){
  if(mode !== 'ai') return;
  if(betPlaced) return;
  const cfg = getBetCfg();
  if(balance < cfg.amount){
    // 잔액 부족 시 베팅 없이 연습처럼 진행 (토스트/충전 팝업 없음)
    return;
  }
  betAmount  = cfg.amount;
  betOdds    = cfg.odds * (hintOddsMultiplier || 1.0); // 베팅 시점의 배당률 확정
  betPlaced  = true;
  balance   -= betAmount;
  saveBalance();
  updateBalUI();
  showToastGm('🎲 ₩' + betAmount.toLocaleString('ko-KR') + ' 베팅 완료!');
}

function settleBet(playerWon){
  if(!betPlaced || mode !== 'ai') return;
  betPlaced = false;
  // 게임 종료 알림 (index 미션 진행도용)
  sendToParent({type:'GAME_OVER', gameId:'gomoku', difficulty, won: playerWon});
  const resTxt  = document.getElementById('betResultTxt');
  const ovBetEl = document.getElementById('ovBetResult');
  if(playerWon){
    const payout = Math.round(betAmount * betOdds); // betOdds는 placeBet 시점에 hintOddsMultiplier 포함
    balance += payout;
    saveBalance(); updateBalUI();
    const msg = '🏆 +₩' + payout.toLocaleString('ko-KR') + ' 획득!';
    if(resTxt){ resTxt.textContent = '+₩' + payout.toLocaleString('ko-KR') + ' 획득!'; resTxt.className='bet-result-win'; }
    if(ovBetEl){ ovBetEl.textContent = msg; ovBetEl.style.color='#4ade80'; }
    showToastGm('🏆 베팅 적중! +₩' + payout.toLocaleString('ko-KR'));
  } else {
    const msg = '😔 -₩' + betAmount.toLocaleString('ko-KR') + ' 손실';
    if(resTxt){ resTxt.textContent = '-₩' + betAmount.toLocaleString('ko-KR') + ' 손실'; resTxt.className='bet-result-lose'; }

  }
}

function showToastGm(msg){

// postMessage 수신 (수정 없음)
const ALLOWED_ORIGINS = [window.location.origin, 'null'];
function isTrustedOrigin(o){ return ALLOWED_ORIGINS.includes(o) || o === window.location.origin; }

window.addEventListener('message', e => {
  if(!isTrustedOrigin(e.origin)) return;
  const d = e.data || {};
  switch(d.type){
    case 'INIT':
      balance = parseInt(d.balance ?? localStorage.getItem(BAL_KEY) ?? 0);
      if(isNaN(balance)||balance<0) balance=0;
      if(d.points !== undefined) pointBalance = parseInt(d.points)||0;
      if(d.aiProfile) aiProfile = d.aiProfile;
      document.body.classList.add('in-iframe');
      saveBalance();
      updateBalUI();
      break;
    case 'POINT_UPDATE':
      pointBalance = parseInt(d.points||0);
      if(d.balance !== undefined){ balance=parseInt(d.balance); updateBalUI(); }
      break;
    case 'CHARGE': {
      // [BUG FIX 4] switch-case 안 const 선언 → 중괄호 블록으로 스코프 명확화
      const add=parseInt(d.amount||0);
      if(add>0){ balance+=add; saveBalance(); updateBalUI(); showToastGm('✅ '+add.toLocaleString('ko-KR')+'원 충전 완료!'); }
      break;
    }
    case 'BALANCE_UPDATE':
      if(!betPlaced){ balance=parseInt(d.balance||0); updateBalUI(); }
      break;
    case 'AI_PROFILE': {
      const p = d.profile;
      if(p && typeof p === 'object') aiProfile = p;
      else if(d.tier) aiProfile = {...aiProfile, tier: d.tier};
      localStorage.setItem(AI_KEY, JSON.stringify(aiProfile));
      break;
    }
  }
});

let foulReason='';
function isRenjuOn(){const el=document.getElementById('optRenju');return !!(el&&el.checked);}
function isAggroOn(){const el=document.getElementById('optAggro');return !(el&&el.checked===false);}
function countLine(b,r,c,dr,dc,player){let cnt=1;for(let i=1;i<15;i++){const nr=r+dr*i,nc=c+dc*i;if(nr<0||nr>=SIZE||nc<0||nc>=SIZE||b[nr][nc]!==player)break;cnt++;}for(let i=1;i<15;i++){const nr=r-dr*i,nc=c-dc*i;if(nr<0||nr>=SIZE||nc<0||nc>=SIZE||b[nr][nc]!==player)break;cnt++;}return cnt;}
function isOverline(b,r,c,player){const dirs=[[0,1],[1,0],[1,1],[1,-1]];return dirs.some(([dr,dc])=>countLine(b,r,c,dr,dc,player)>5);}
function getLineTokens(b,r,c,dr,dc,player,span=5){const arr=[];for(let k=-span;k<=span;k++){const nr=r+dr*k,nc=c+dc*k;if(nr<0||nr>=SIZE||nc<0||nc>=SIZE)arr.push(2);else{const v=b[nr][nc];if(v===0)arr.push(0);else if(v===player)arr.push(1);else arr.push(2);}}return arr;}
// getLineTokens: k=-span~+span 총 (2*span+1)개 토큰, 착수 위치(r,c)는 인덱스 span에 위치
function countOpenThreesAfterMove(b,r,c,player){
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  let cnt=0;
  for(const[dr,dc]of dirs){
    const span=5;
    const t=getLineTokens(b,r,c,dr,dc,player,span);
    const center=span; // 착수 위치는 항상 인덱스 span
    for(let i=0;i<=t.length-5;i++){
      const w=t.slice(i,i+5).join('');
      // 열린 3: 0-1-1-1-0 패턴이고 착수 위치(center)가 이 창 안에 있어야 함
      if(w==='01110' && center>=i && center<i+5) cnt++;
    }
  }
  return cnt;
}
function countOpenFoursAfterMove(b,r,c,player){
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  let cnt=0;
  for(const[dr,dc]of dirs){
    const span=5;
    const t=getLineTokens(b,r,c,dr,dc,player,span);
    const center=span; // 착수 위치는 항상 인덱스 span
    for(let i=0;i<=t.length-6;i++){
      const w=t.slice(i,i+6).join('');
      // 열린 4: 0-1-1-1-1-0 패턴이고 착수 위치(center)가 이 창 안에 있어야 함
      if(w==='011110' && center>=i && center<i+6) cnt++;
    }
  }
  return cnt;
}
function getFoulTypeIfAny(r,c,player){if(player!==1)return '';if(!isRenjuOn())return '';if(isOverline(board,r,c,player))return '장목(6목 이상)';const th=countOpenThreesAfterMove(board,r,c,player);if(th>=2)return '쌍삼(열린 3이 2개 이상)';const fo=countOpenFoursAfterMove(board,r,c,player);if(fo>=2)return '쌍사(열린 4가 2개 이상)';return '';}

// ══════════════════════════════════════════
//  AI 엔진 (수정 없음)
// ══════════════════════════════════════════
function evalPoint(b,r,c,player){
  if(b[r][c]!==0)return -99999;
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  let score=0;
  b[r][c]=player;
  for(const[dr,dc]of dirs){
    let cnt=1,oL=0,oR=0;
    for(let i=1;i<6;i++){const nr=r+dr*i,nc=c+dc*i;if(nr<0||nr>=SIZE||nc<0||nc>=SIZE)break;if(b[nr][nc]===player)cnt++;else{if(b[nr][nc]===0)oR=1;break;}}
    for(let i=1;i<6;i++){const nr=r-dr*i,nc=c-dc*i;if(nr<0||nr>=SIZE||nc<0||nc>=SIZE)break;if(b[nr][nc]===player)cnt++;else{if(b[nr][nc]===0)oL=1;break;}}
    const op2=oL+oR;
    if(cnt>=5)score+=200000;
    else if(cnt===4&&op2===2)score+=50000;
    else if(cnt===4&&op2===1)score+=10000;
    else if(cnt===3&&op2===2)score+=5000;
    else if(cnt===3&&op2===1)score+=500;
    else if(cnt===2&&op2===2)score+=100;
    else if(cnt===2&&op2===1)score+=20;
    else if(cnt===1&&op2===2)score+=5;
  }
  b[r][c]=0;
  return score;
}

function hasNeighbor(r,c,dist){
  for(let dr=-dist;dr<=dist;dr++)for(let dc=-dist;dc<=dist;dc++){
    if(!dr&&!dc)continue;
    const nr=r+dr,nc=c+dc;
    if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&board[nr][nc]!==0)return true;
  }
  return moveHistory.length===0&&r===7&&c===7;
}

function getCands(dist){
  const cands=[];
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)
    if(board[r][c]===0&&hasNeighbor(r,c,dist))cands.push([r,c]);
  if(!cands.length)cands.push([7,7]);
  return cands;
}

function getMoveBeg(){
  const me=2,hu=1;
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){if(board[r][c]===0){board[r][c]=me;if(checkWin(r,c,me)){board[r][c]=0;return[r,c];}board[r][c]=0;}}
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){if(board[r][c]===0){board[r][c]=hu;if(checkWin(r,c,hu)){board[r][c]=0;return[r,c];}board[r][c]=0;}}
  // 하수: 4목(5000↑) 및 열린3(3000↑) 방어 — 확률 없이 항상 막음
  {let bestDef=null,bestDefScore=0;for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){if(board[r][c]===0){const s=evalPoint(board,r,c,hu);if(s>bestDefScore){bestDefScore=s;bestDef=[r,c];}}}if(bestDef&&bestDefScore>=3000)return bestDef;}
  const cands=getCands(2);
  const scored=cands.map(([r,c])=>({r,c,s:evalPoint(board,r,c,me)*0.55+evalPoint(board,r,c,hu)*0.45+Math.random()*30}));
  scored.sort((a,b)=>b.s-a.s);
  return[scored[0].r,scored[0].c];
}

function boardEval(b,me){
  const hu=me===1?2:1;
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  let score=0;
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    for(const[dr,dc]of dirs){
      let m=0,o=0,blocked=false;
      for(let i=0;i<5;i++){const nr=r+dr*i,nc=c+dc*i;if(nr<0||nr>=SIZE||nc<0||nc>=SIZE){blocked=true;break;}if(b[nr][nc]===me)m++;else if(b[nr][nc]===hu){o++;blocked=true;break;}}
      if(!blocked&&o===0){if(m===5)score+=200000;else if(m===4)score+=9000;else if(m===3)score+=600;else if(m===2)score+=60;else if(m===1)score+=5;}
      let m2=0,o2=0,blocked2=false;
      for(let i=0;i<5;i++){const nr=r+dr*i,nc=c+dc*i;if(nr<0||nr>=SIZE||nc<0||nc>=SIZE){blocked2=true;break;}if(b[nr][nc]===hu)m2++;else if(b[nr][nc]===me){o2++;blocked2=true;break;}}
      if(!blocked2&&o2===0){if(m2===5)score-=195000;else if(m2===4)score-=9500;else if(m2===3)score-=550;else if(m2===2)score-=45;}
    }
  }
  return score;
}

function minimax(b,depth,alpha,beta,isMax,me,hu){
  if(depth===0)return boardEval(b,me);
  const cands=[];
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    if(b[r][c]===0){
      let near=false;
      outer:for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){if(!dr&&!dc)continue;const nr=r+dr,nc=c+dc;if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]!==0){near=true;break outer;}}
      if(near){const p=isMax?me:hu;cands.push({r,c,s:evalPoint(b,r,c,p)});}
    }
  }
  if(!cands.length)return 0;
  cands.sort((a,b2)=>b2.s-a.s);
  const top=cands.slice(0,Math.min(10,cands.length));
  if(isMax){
    let best=-Infinity;
    for(const{r,c}of top){b[r][c]=me;if(checkWinBoard(b,r,c,me)){b[r][c]=0;return 200000+depth*100;}const val=minimax(b,depth-1,alpha,beta,false,me,hu);b[r][c]=0;best=Math.max(best,val);alpha=Math.max(alpha,best);if(beta<=alpha)break;}
    return best;
  }else{
    let best=Infinity;
    for(const{r,c}of top){b[r][c]=hu;if(checkWinBoard(b,r,c,hu)){b[r][c]=0;return -200000-depth*100;}const val=minimax(b,depth-1,alpha,beta,true,me,hu);b[r][c]=0;best=Math.min(best,val);beta=Math.min(beta,best);if(beta<=alpha)break;}
    return best;
  }
}

function getMoveMid(depth){
  // 적응형 depth: 초반(돌<8) depth=3, 중반 depth=4, 후반(돌>30) depth=5
  const stones = moveHistory.length;
  if(depth === 4){
    if(stones < 8)       depth = 3;
    else if(stones > 30) depth = 5;
  }
  const me=2,hu=1;
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){if(board[r][c]===0){board[r][c]=me;if(checkWin(r,c,me)){board[r][c]=0;return[r,c];}board[r][c]=0;}}
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){if(board[r][c]===0){board[r][c]=hu;if(checkWin(r,c,hu)){board[r][c]=0;return[r,c];}board[r][c]=0;}}
  const cands=getCands(2);
  const scored=cands.map(([r,c])=>({r,c,s:evalPoint(board,r,c,me)*1.1+evalPoint(board,r,c,hu)*0.9}));
  scored.sort((a,b)=>b.s-a.s);
  const top=scored.slice(0,Math.min(12,scored.length));
  const bCopy=board.map(row=>[...row]);
  let bestScore=-Infinity,bestMove=[top[0].r,top[0].c];
  for(const{r,c}of top){bCopy[r][c]=me;if(checkWinBoard(bCopy,r,c,me)){bCopy[r][c]=0;return[r,c];}const val=minimax(bCopy,depth-1,-Infinity,Infinity,false,me,hu);bCopy[r][c]=0;if(val>bestScore){bestScore=val;bestMove=[r,c];}}
  return bestMove;
}

function getMoveMas(){return getMovePro(6);}

function getMovePro(depth){
  const me=2,hu=1;
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){if(board[r][c]===0){board[r][c]=me;if(checkWin(r,c,me)){board[r][c]=0;return[r,c];}board[r][c]=0;}}
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){if(board[r][c]===0){board[r][c]=hu;if(checkWin(r,c,hu)){board[r][c]=0;return[r,c];}board[r][c]=0;}}
  const cands=getCands(3);
  const center=(SIZE-1)/2;
  const scored=cands.map(([r,c])=>{
    const atk=evalPoint(board,r,c,me);
    const def=evalPoint(board,r,c,hu);
    const cen=-(Math.abs(r-center)+Math.abs(c-center))*6;
    let bonus=0;
    if(isAggroOn()){
      board[r][c]=me;const my4=countOpenFoursAfterMove(board,r,c,me);const my3=countOpenThreesAfterMove(board,r,c,me);board[r][c]=0;
      board[r][c]=hu;const op4=countOpenFoursAfterMove(board,r,c,hu);const op3=countOpenThreesAfterMove(board,r,c,hu);board[r][c]=0;
      bonus+=my4*9000+my3*1500+op4*7000+op3*900;
    }
    return{r,c,s:atk*1.12+def*1.08+cen+bonus};
  });
  scored.sort((a,b)=>b.s-a.s);
  const top=scored.slice(0,Math.min(16,scored.length));
  const bCopy=board.map(row=>[...row]);
  let bestScore=-Infinity,bestMove=[top[0].r,top[0].c];
  for(const{r,c}of top){bCopy[r][c]=me;if(checkWinBoard(bCopy,r,c,me)){bCopy[r][c]=0;return[r,c];}const val=minimax(bCopy,depth-1,-Infinity,Infinity,false,me,hu);bCopy[r][c]=0;if(val>bestScore){bestScore=val;bestMove=[r,c];}}
  return bestMove;
}

async function aiMove(){
  if(gameOver||currentPlayer!==2||mode!=='ai')return;
  aiThinking=true;updateStatus();syncUndoBtn();
  document.getElementById('thinkBar').classList.add('show');
  await new Promise(res=>setTimeout(res, getAIDelayMs()));
  if(gameOver){aiThinking=false;document.getElementById('thinkBar').classList.remove('show');return;}
  let move;
  if(difficulty==='beg')     move=getMoveBeg();
  else if(difficulty==='mid')move=getMoveMid(4);
  else                        move=getMoveMas();
  document.getElementById('thinkBar').classList.remove('show');
  aiThinking=false;
  syncUndoBtn();
  if(!gameOver&&move)placeStone(move[0],move[1]);
}

function getBoardPos(x,y){
  const r=Math.round((y-PAD)/CELL),c=Math.round((x-PAD)/CELL);
  if(r<0||r>=SIZE||c<0||c>=SIZE)return null;
  if(Math.abs(x-(PAD+c*CELL))>CELL*.5||Math.abs(y-(PAD+r*CELL))>CELL*.5)return null;

}

function undoMove(){
  if(aiThinking)return;
  if(mode==='ai'){
    // [② FIX] 핸디캡 돌(handicap:true)은 무르기 대상에서 제외
    // 일반 착수만 역순으로 최대 2수(플레이어+AI) 제거
    if(!moveHistory.length)return;
    const lastNonHandicap = [...moveHistory].reverse().findIndex(m=>!m.handicap);
    if(lastNonHandicap === -1) return; // 일반 착수가 없으면 무르기 불가
    let removed = 0;
    const target = (moveHistory.length>=2 && moveHistory[moveHistory.length-1].player===2 && !moveHistory[moveHistory.length-1].handicap) ? 2 : 1;
    while(removed < target && moveHistory.length){
      const m = moveHistory[moveHistory.length-1];
      if(m.handicap) break; // 핸디캡 돌에 닿으면 중단
      moveHistory.pop();
      board[m.r][m.c]=0;
      removed++;
    }
    if(removed===0) return; // 실제로 제거된 수가 없으면 UI 업데이트 불필요
    currentPlayer=1;
  }else{
    if(!moveHistory.length)return;
    const m=moveHistory.pop();board[m.r][m.c]=0;currentPlayer=m.player;
  }
  // [BUG FIX 2] aiThinking 강제 리셋 (AI 착수 직전 무르기 시 입력 블락 방지)
  aiThinking=false;
  gameOver=false;updateStatus();drawBoard();
  syncUndoBtn();
}

  if(practiceMode){

    midBtn.classList.remove('no-balance');
    masBtn.classList.remove('no-balance');

  }

  const BAL_MID = 200000;  // 중수: ₩20만
  const BAL_MAS = 300000;  // 고수: ₩30만

// [BUG FIX 3] async 함수로 래핑해 원본 aiMove(async)와 반환 타입 일치
aiMove = async function(){
  if(practiceMode){
    // 연습모드: 30% 랜덤 착수 + 70% 하수 AI
    if(Math.random() < 0.30){
      // 빈 칸 중 랜덤 착수 (중앙 근처 가중치)
      const empties = [];
      for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){

          const dist = Math.abs(r-7)+Math.abs(c-7);
          const w = Math.max(1, 10-dist);
          for(let i=0;i<w;i++) empties.push([r,c]);
        }
      }
      if(empties.length){
        const pick = empties[Math.floor(Math.random()*empties.length)];
        document.getElementById('thinkBar').classList.add('show');
        // Promise로 감싸 await 호출 시에도 정상 동작 보장
        await new Promise(res => setTimeout(()=>{
          document.getElementById('thinkBar').classList.remove('show');
          if(!gameOver) placeStone(pick[0],pick[1]);
          res();
        }, 300 + Math.random()*400));
        return;
      }
    }
    // 나머지 70%: 원래 하수 AI
  }
  return _origAiMove();
};
