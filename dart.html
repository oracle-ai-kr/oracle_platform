// ── ORACLE 토큰가드 ──
(function(){
  var t=sessionStorage.getItem('ORACLE_ENTRY');
  var ok=t&&(Date.now()-Number(t)<5000);
  if(ok) sessionStorage.removeItem('ORACLE_ENTRY');
  if(ok) return;
  function _show404(){
    document.body.style.cssText='margin:0;padding:0;overflow:hidden';
    Array.from(document.body.children).forEach(function(el){el.style.display='none'});
    var d=document.createElement('div');
    d.id='_oracle404';
    d.innerHTML='<div style="position:fixed;inset:0;z-index:999999;background:#0f1724;color:#e8eaf0;'
      +'font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;display:flex;align-items:center;'
      +'justify-content:center;text-align:center;padding:20px">'

      +'<div style="width:120px;height:120px;background:#fff;border-radius:50%;margin:0 auto 32px;'
      +'display:flex;align-items:center;justify-content:center">'
      +'<div style="width:72px;height:52px;border:3px solid #333;border-radius:6px;position:relative;'
      +'display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:24px;'
      +'font-weight:700;color:#d32f2f">404</div></div>'
      +'<h1 style="font-size:20px;font-weight:700;margin:0 0 12px">페이지를 찾을 수 없습니다.</h1>'
      +'<p style="font-size:14px;color:#8a91a0;line-height:1.6;margin:0 0 32px">'
      +'존재하지 않는 주소를 입력하셨거나,<br>'
      +'요청하신 페이지의 주소가 변경/삭제되어 찾을 수 없습니다.</p>'
      +'<a href="index.html" style="display:block;width:100%;padding:16px;background:#d32f2f;color:#fff;'
      +'font-size:16px;font-weight:700;border:none;border-radius:8px;cursor:pointer;text-decoration:none;'
      +'text-align:center">홈으로 이동</a>'
      +'</div></div>';
    document.body.appendChild(d);
  }
  if(document.body) _show404();
  else document.addEventListener('DOMContentLoaded', _show404);
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🎯 다트존</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@400;700;900&display=swap');
:root{
  --bg:#0a0c12;--surface:#12151e;--surface2:#1a1e2a;
  --border:rgba(255,255,255,0.07);
  --accent:#00e5ff;--gold:#ffd166;--text:#e8eaf0;--sub:#6b7280;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);
  font-family:'Noto Sans KR',sans-serif;overflow-x:hidden;overflow-y:auto;
  overscroll-behavior:none;}

.header{position:sticky;top:0;z-index:50;display:flex;align-items:center;
  justify-content:space-between;padding:10px 16px;
  background:rgba(10,12,18,0.95);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);}
.header-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--accent);}
.hud-row{display:flex;gap:10px;align-items:center;}
.hud-badge{background:var(--surface2);border:1px solid var(--border);border-radius:20px;
  padding:4px 10px;font-size:11px;font-weight:700;color:var(--sub);}
.hud-badge span{color:var(--text);}
.btn-settings{width:34px;height:34px;background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;color:var(--sub);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;}

.main{padding:8px 14px 16px;display:flex;flex-direction:column;gap:10px;
  max-width:480px;margin:0 auto;}

.stage{background:var(--surface);border-radius:20px;border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column;}
.stage-info{display:flex;justify-content:space-between;align-items:center;
  padding:6px 14px;border-top:1px solid var(--border);font-size:12px;color:var(--sub);}
.stage-info b{color:var(--text);font-size:14px;}

/* 다트판 */
.board-wrap{position:relative;width:100%;aspect-ratio:1;max-width:300px;margin:10px auto;flex-shrink:0;}
#dartSvg{width:100%;height:100%;border-radius:50%;
  filter:drop-shadow(0 0 24px rgba(0,229,255,0.12));}
.dart-mark{position:absolute;width:14px;height:14px;
  transform:translate(-50%,-50%);pointer-events:none;z-index:2;}

/* 결과 텍스트 */
.result-text{text-align:center;font-size:11px;color:var(--sub);
  padding:2px 14px 4px;min-height:18px;}

/* 게이지 */
.gauges{padding:7px 14px 8px;display:flex;flex-direction:column;gap:7px;
  border-top:1px solid var(--border);min-height:110px;}
.gauge-row{display:flex;flex-direction:column;gap:3px;}
.gauge-label-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--sub);}
.gauge-label-row .gval{font-weight:700;color:var(--text);width:70px;text-align:right;flex-shrink:0;font-size:11px;height:16px;line-height:16px;overflow:hidden;}

/* 바늘형 트랙 (상하/좌우) */
.needle-track{position:relative;height:8px;background:rgba(255,255,255,0.05);
  border-radius:4px;overflow:visible;}
.needle-track::after{content:'';position:absolute;left:50%;top:50%;
  width:1px;height:14px;background:rgba(255,255,255,0.2);
  transform:translate(-50%,-50%);}
.needle{position:absolute;top:50%;width:12px;height:12px;
  background:var(--accent);border-radius:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 0 6px var(--accent),0 0 12px rgba(0,229,255,0.35);}
.needle.h{background:#ff9f1c;box-shadow:0 0 6px #ff9f1c,0 0 12px rgba(255,159,28,0.35);}

/* 파워 게이지 over 효과 */
.gauge-fill.over{animation:overFlicker .2s infinite alternate;}
@keyframes overFlicker{from{opacity:1;}to{opacity:.5;filter:brightness(1.6);}}



/* 발사 버튼 */
.fire-btn-wrap{padding:12px 14px 14px;touch-action:none;flex-shrink:0;}
#btnFire{width:100%;height:68px;border:none;border-radius:14px;
  background:linear-gradient(135deg,#ffd166,#ff9f1c);
  color:#1a1200;font-size:20px;font-weight:900;
  font-family:'Bebas Neue',sans-serif;letter-spacing:2px;cursor:pointer;
  box-shadow:0 4px 16px rgba(255,209,102,0.3);
  user-select:none;-webkit-user-select:none;touch-action:none;
  -webkit-tap-highlight-color:transparent;
  transition:transform .08s,opacity .2s;}
#btnFire:active{filter:brightness(0.9);}
#btnFire.locked{opacity:0.55;}


.lock-bar-wrap{
  height:3px; margin-top:6px;
  background:rgba(255,255,255,0.07);
  border-radius:2px; overflow:hidden;
  opacity:0; transition:opacity .15s;
}
.lock-bar-wrap.show{opacity:1;visibility:visible;}
.lock-bar{
  height:100%; width:0%;
  background:var(--accent);
  border-radius:2px;
  box-shadow:0 0 6px var(--accent);
  transition:width linear;
}


/* 조준점 */
.crosshair{position:absolute;width:40px;height:40px;
  transform:translate(-50%,-50%);pointer-events:none;z-index:5;
  opacity:0;transition:opacity .12s;}
.crosshair.show{opacity:1;}
.crosshair svg{filter:drop-shadow(0 0 6px #00e5ff) drop-shadow(0 0 12px rgba(0,229,255,0.6));}

/* 화살촉 반짝이 테두리 */
@keyframes markGlow {
  0%   { filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 4px #fff); }
  25%  { filter: drop-shadow(0 0 2px #ffd166) drop-shadow(0 0 4px #ffd166); }
  50%  { filter: drop-shadow(0 0 2px #00e5ff) drop-shadow(0 0 4px #00e5ff); }
  75%  { filter: drop-shadow(0 0 2px #ff3d6b) drop-shadow(0 0 4px #ff3d6b); }
  100% { filter: drop-shadow(0 0 2px #06d6a0) drop-shadow(0 0 4px #06d6a0); }
}
.dart-mark svg, .arrow-mark svg {
  animation: markGlow 1.2s linear infinite;
}
/* 결과 오버레이 */
.result-overlay{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,0.75);
  backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .3s;}
.result-overlay.show{opacity:1;pointer-events:all;}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:24px;
  padding:24px 20px;width:calc(100% - 32px);max-width:380px;
  box-shadow:0 20px 60px rgba(0,0,0,0.6);}
.result-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;
  text-align:center;margin-bottom:16px;color:var(--accent);}
.score-display{text-align:center;font-family:'Bebas Neue',sans-serif;
  font-size:72px;line-height:1;color:var(--gold);margin-bottom:4px;}
.score-sub{text-align:center;font-size:12px;color:var(--sub);margin-bottom:18px;}
.shots-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:18px;}
.shot-chip{background:var(--surface2);border-radius:8px;padding:6px 4px;text-align:center;}
.shot-chip .pt{font-weight:900;font-size:14px;color:var(--accent);}
.shot-chip .lb{color:var(--sub);font-size:9px;}
.reward-box{background:rgba(0,229,255,0.06);border:1px solid rgba(0,229,255,0.18);
  border-radius:12px;padding:14px;text-align:center;margin-bottom:14px;}
.reward-label{font-size:11px;color:var(--sub);margin-bottom:4px;}
.reward-amount{font-family:'Bebas Neue',sans-serif;font-size:36px;color:var(--gold);letter-spacing:1px;}
.reward-detail{font-size:11px;color:var(--sub);margin-top:2px;}
.btn-close{width:100%;height:48px;border:1px solid var(--border);border-radius:12px;
  background:var(--surface2);color:var(--text);font-size:14px;font-weight:700;
  cursor:pointer;font-family:'Noto Sans KR',sans-serif;}

/* 플래시 */
.fx-flash{position:fixed;inset:0;z-index:90;pointer-events:none;opacity:0;transition:opacity .08s;}
.fx-flash.bull{background:radial-gradient(circle,rgba(255,209,102,0.55),transparent 65%);}
.fx-flash.good{background:radial-gradient(circle,rgba(0,229,255,0.3),transparent 65%);}
.fx-flash.miss{background:radial-gradient(circle,rgba(255,61,107,0.25),transparent 65%);}

/* 토스트 */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(10px);
  background:var(--surface2);border:1px solid var(--border);border-radius:20px;
  padding:8px 18px;font-size:13px;font-weight:700;
  opacity:0;transition:all .2s;z-index:100;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* 콤보 */
.combo-pop{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%) scale(0);
  z-index:70;pointer-events:none;font-family:'Bebas Neue',sans-serif;
  font-size:52px;letter-spacing:3px;color:var(--gold);
  text-shadow:0 0 30px rgba(255,209,102,0.8);
  transition:transform .15s cubic-bezier(.34,1.56,.64,1),opacity .3s;opacity:0;}
.combo-pop.show{transform:translate(-50%,-50%) scale(1);opacity:1;}

/* 히스토리 */
.history-wrap{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;}
.history-title{font-size:12px;color:var(--sub);font-weight:700;margin-bottom:10px;
  text-transform:uppercase;letter-spacing:1px;}
.history-list{display:flex;flex-direction:column;gap:6px;max-height:160px;overflow-y:auto;}
.history-item{display:flex;justify-content:space-between;align-items:center;
  padding:7px 10px;background:var(--surface2);border-radius:8px;font-size:12px;}
.history-item .hi-score{font-weight:900;color:var(--accent);}
.history-item .hi-reward{color:var(--gold);font-weight:700;}
.history-item .hi-mode{color:var(--sub);}
.history-empty{text-align:center;color:var(--sub);font-size:12px;padding:12px;}

/* 설정 */
.settings-panel{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,0.6);
  backdrop-filter:blur(6px);display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;transition:opacity .25s;}
.settings-panel.show{opacity:1;pointer-events:all;}
.settings-sheet{background:var(--surface);border-radius:24px 24px 0 0;
  border-top:1px solid var(--border);width:100%;padding:20px 20px 40px;
  max-width:480px;margin:0 auto;}
.settings-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;
  color:var(--accent);margin-bottom:16px;}
.settings-row{display:flex;justify-content:space-between;align-items:center;
  padding:12px 0;border-bottom:1px solid var(--border);font-size:14px;}
.settings-row label{color:var(--sub);}
.settings-row b{color:var(--text);}
.btn-start-fee,.btn-test{width:100%;height:52px;border:none;border-radius:14px;
  font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;
  font-family:'Noto Sans KR',sans-serif;}
.btn-start-fee{background:linear-gradient(135deg,var(--accent),#0077ff);color:#000;}
.btn-test{background:var(--surface2);border:1px solid var(--border);color:var(--sub);}

/* iframe 내 실행 시 header padding 보정 */
body.in-iframe .header{border-top:none;}
</style>
</head>
<body>

<div class="header">
  <div class="header-title">🎯 DART ZONE</div>
  <div class="hud-row">
    <div class="hud-badge">P <span id="hudP">-</span></div>
    <div class="hud-badge">잔액 <span id="hudBal">-</span></div>
    <button class="btn-settings" id="btnSettings">⚙️</button>
  </div>
</div>

<div class="main">
  <div class="stage">
    <div class="board-wrap">
      <svg id="dartSvg" viewBox="0 0 500 500" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="crosshair" id="crosshair">
        <svg width="40" height="40" viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="8" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.9"/>
          <line x1="20" y1="2"  x2="20" y2="12" stroke="#00e5ff" stroke-width="1.5"/>
          <line x1="20" y1="28" x2="20" y2="38" stroke="#00e5ff" stroke-width="1.5"/>
          <line x1="2"  y1="20" x2="12" y2="20" stroke="#00e5ff" stroke-width="1.5"/>
          <line x1="28" y1="20" x2="38" y2="20" stroke="#00e5ff" stroke-width="1.5"/>
          <circle cx="20" cy="20" r="1.5" fill="#00e5ff"/>

    <div class="stage-info">

      <span id="infoReward" style="color:var(--gold);font-weight:700;font-size:11px;"></span>
    </div>
    <div class="result-text" id="resultText">게임을 시작하세요</div>

    <div class="gauges">
      <!-- 좌/우 각도 -->
      <div class="gauge-row">
        <div class="gauge-label-row">
          <span>↔ 각도 좌/우</span>
          <span class="gval" id="hVal">-</span>
        </div>
        <div class="needle-track">
          <div class="needle h" id="hNeedle"></div>
        </div>
      </div>
      <!-- 파워 -->
      <div class="gauge-row">
        <div class="gauge-label-row">
          <span>💪 파워 (상/하)</span>
          <span class="gval" id="powerVal">— 대기중</span>
        </div>
        <div class="needle-track" style="overflow:visible;">
          <div class="gauge-fill" id="powerFill" style="width:0%;height:100%;border-radius:4px;
            background:linear-gradient(90deg,#1e7cff 0%,#06d6a0 50%,#ffd166 80%,#ff3d6b 100%);"></div>
          <div style="position:absolute;left:50%;top:0;bottom:0;width:1px;
            background:rgba(255,255,255,0.3);transform:translateX(-50%);pointer-events:none;"></div>
          <!-- 100% 자동발사 경계 실선 (POWER_MAX=110 → 100/110=90.9%) -->
          <div style="position:absolute;left:calc(100% * 100 / 110);top:-3px;bottom:-3px;
            width:2px;background:rgba(255,255,255,0.5);border-radius:1px;pointer-events:none;
            box-shadow:0 0 4px rgba(255,255,255,0.6);"></div>

    </div>

    <div class="fire-btn-wrap">
      <button id="btnFire">🎯</button>

        <div class="lock-bar" id="lockBar"></div>

  <div class="history-wrap">

    <div class="history-list" id="historyList">
      <div class="history-empty">아직 기록이 없어요</div>
    </div>

</div>

<div class="result-overlay" id="resultOverlay">
  <div class="result-card">
    <div class="result-title">🎯 라운드 결과</div>
    <div class="score-display" id="resultScore">0</div>
    <div class="score-sub" id="resultScoreSub"></div>
    <div class="shots-grid" id="shotsGrid"></div>
    <div class="reward-box">
      <div class="reward-label">획득 보상</div>
      <div class="reward-amount" id="rewardAmount">₩0</div>
      <div class="reward-detail" id="rewardDetail"></div>
    </div>
    <button class="btn-close" id="btnClose">확인</button>
  </div>
</div>

<div class="combo-pop" id="comboPop"></div>
<div class="fx-flash" id="fxFlash"></div>
<div class="toast" id="toast"></div>

<div class="settings-panel" id="settingsPanel">
  <div class="settings-sheet">
    <div class="settings-title">⚙️ 다트존</div>
    <div class="settings-row"><label>발수</label><b>10발</b></div>
    <div class="settings-row"><label>입장료</label><b>₩100,000 P</b></div>
    <button class="btn-start-fee" id="btnStartFee">💰 ₩100,000 내고 시작</button>
    <button class="btn-test" id="btnTest">🎓 연습 모드 (무료)</button>
  </div>
</div>

<script>
// ══════════════════════════════════════
// 상수
// ══════════════════════════════════════
const GAME_ID    = 'dart';
const TOTAL_SHOTS = 10;
const FEE        = 100000;

const LOCK_MS    = 800;    // 연속클릭 방지

// 게이지 속도 (rad/ms)
// 상하: 1왕복 약 1.7초 (π*2/1700)
// 좌우: 1왕복 약 2.3초 → 억박자
// 속도: 1왕복 2초
const POWER_RATE = 0.0842;  // per ms, 0→100 약 2초 (중앙 가까울수록 빠름)
const H_RATE = Math.PI * 2 / 5000;
// 속도 게이지 제거

// 최대 각도 (좌우)
const MAX_ANGLE = 45;
// 파워 → 상하 각도 매핑: 0%=아래MAX, 50%=중앙, 100%=위MAX
const POWER_MAX = 110; // 110에서 자동발사 (수동 타이밍 확보)

// ── 보상 ──
function calcReward(score) {
  let base = 0;
  if      (score >= 350) base = 500000;
  else if (score >= 251) base = 300000;
  else if (score >= 201) base = 250000;
  else if (score >= 151) base = 200000;
  else if (score >= 101) base = 100000;
  // 100점 이하 0원
  return { base, total: base };
}

// ══════════════════════════════════════
// postMessage
// ══════════════════════════════════════
let hubState = { points: null, balance: null };
let spendPending = false;

const ALLOWED_ORIGINS = [window.location.origin, 'null'];
function isTrusted(o) { return ALLOWED_ORIGINS.includes(o) || o === window.location.origin; }
function post(msg) { try { parent.postMessage(msg, window.location.origin); } catch(e) {} }

window.addEventListener('message', e => {
  if (!isTrusted(e.origin)) return;
  const d = e.data; if (!d || !d.type) return;
  if (d.type === 'INIT' || d.type === 'POINT_UPDATE') {
    hubState.points  = d.points  ?? hubState.points;
    hubState.balance = d.balance ?? hubState.balance;
    if (d.type === 'INIT') document.body.classList.add('in-iframe');
    syncHud();
  }
  if (d.type === 'AI_PROFILE' && d.profile) {
    // tier 정보 수신 (향후 UI 활용 가능)
    hubState.aiProfile = d.profile;
  }
  if (d.type === 'CHARGE') {
    hubState.balance = d.balance ?? hubState.balance;
    syncHud();
    toast(`💰 충전 완료! ${fmtMoney(d.amount || 0)}`);
  }
  if (d.type === 'BALANCE_UPDATE') {
    hubState.balance = d.balance ?? hubState.balance;
    syncHud();
  }
  if (d.type === 'SPEND_RESULT') {
    if (d.ok) { spendPending = false; startGame(); }
    else      { spendPending = false; toast('포인트 부족!'); closeSettings(); }
  }
});

function syncHud() {
  $('hudP').textContent   = hubState.points  != null ? hubState.points + 'P' : '-';
  $('hudBal').textContent = hubState.balance != null ? fmtMoney(hubState.balance) : '-';
}

// ══════════════════════════════════════
// 유틸
// ══════════════════════════════════════
const $ = id => document.getElementById(id);
const fmtMoney = v => '₩' + Math.abs(Math.round(v)).toLocaleString('ko-KR');
let _toastT;
function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(_toastT); _toastT = setTimeout(() => el.classList.remove('show'), 1400);
}
function flash(type) {
  const el = $('fxFlash'); el.className = 'fx-flash ' + type; el.style.opacity = '0.9';
  setTimeout(() => { el.style.opacity = '0'; }, 180);
}
function vibrate(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch(_) {}
}

// ══════════════════════════════════════
// 다트판 SVG
// ══════════════════════════════════════
function buildBoard() {
  const svg = $('dartSvg'); svg.innerHTML = '';
  const NS = 'http://www.w3.org/2000/svg';
  const cx = 250, cy = 250;
  const nums = [20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
  const mk = (tag, attrs) => {
    const el = document.createElementNS(NS, tag);
    Object.entries(attrs).forEach(([k,v]) => el.setAttribute(k,v));
    return el;
  };
  const polar = (a,r) => {
    const rad = (a-90)*Math.PI/180;
    return [cx+r*Math.cos(rad), cy+r*Math.sin(rad)];
  };
  const sector = (s,e,r1,r2,fill) => {
    const [x1,y1]=polar(s,r2),[x2,y2]=polar(e,r2),[x3,y3]=polar(e,r1),[x4,y4]=polar(s,r1);
    return mk('path',{
      d:`M${x1},${y1} A${r2},${r2} 0 0,1 ${x2},${y2} L${x3},${y3} A${r1},${r1} 0 0,0 ${x4},${y4}Z`,
      fill, stroke:'rgba(0,0,0,.6)', 'stroke-width':'1.5'
    });
  };
  svg.appendChild(mk('circle',{cx,cy,r:249,fill:'#111'}));
  svg.appendChild(mk('circle',{cx,cy,r:237,fill:'#181818'}));
  const g = mk('g',{});
  const si = ['#1c1c1c','#f0ede0'], tr = ['#cc2233','#2a8c3a'], db = ['#cc2233','#2a8c3a'];
  for (let i=0;i<20;i++) {
    const s=i*18-9, e=(i+1)*18-9;
    g.appendChild(sector(s,e,38,132,si[i%2]));
    g.appendChild(sector(s,e,132,152,tr[i%2]));
    g.appendChild(sector(s,e,152,178,si[i%2]));
    g.appendChild(sector(s,e,178,193,db[i%2]));
  }
  svg.appendChild(g);
  const ng = mk('g',{});
  for (let i=0;i<20;i++) {
    const [x,y]=polar(i*18,220);
    const t = mk('text',{x,y,'text-anchor':'middle','dominant-baseline':'middle',
      fill:'#ddd','font-family':'Arial Black','font-size':nums[i]===20?21:17,'font-weight':'bold'});
    t.textContent=nums[i]; ng.appendChild(t);
  }
  svg.appendChild(ng);
  svg.appendChild(mk('circle',{cx,cy,r:38,fill:'#1c6e32'}));
  svg.appendChild(mk('circle',{cx,cy,r:14,fill:'#cc2233'}));
  svg.appendChild(mk('circle',{cx,cy,r:5, fill:'#ff4455'}));
}

// ══════════════════════════════════════
// 점수 계산
// ══════════════════════════════════════
const SECTORS = [20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];

function calcDartScore(nx, ny) {
  // nx,ny: -1~1 (중심=0,0), 기준 반지름=237px(SVG보드)
  const r = Math.sqrt(nx*nx + ny*ny);
  if (r <= 0.021) return {score:50, label:'불스아이 🎯', ring:'bull'};  // SVG r=5/(250*0.95)
  if (r <= 0.059) return {score:25, label:'불 ⭕',       ring:'bull25'};
  if (r > 0.814)  return {score:0,  label:'미스 ❌',     ring:'miss'};  // 193/237
  const angle = ((Math.atan2(nx,-ny)*180/Math.PI)+360)%360;
  const si    = Math.floor(((angle+9)%360)/18);
  const base  = SECTORS[si%20];
  if (r <= 0.557) return {score:base,   label:`${base}`,   ring:'single'};  // 132/237
  if (r <= 0.641) return {score:base*3, label:`T${base}`,  ring:'triple'};  // 152/237
  if (r <= 0.751) return {score:base,   label:`${base}`,   ring:'single'};  // 178/237
                  return {score:base*2, label:`D${base}`,  ring:'double'};
}

// 각도(도) → 판 위 정규화 좌표
// vAngle: 상하 (-MAX~+MAX, +가 아래)
// hAngle: 좌우 (-MAX~+MAX, +가 오른쪽)
function angleToNorm(vAngle, hAngle) {
  const nx = Math.sin(hAngle * Math.PI / 180);
  const ny = Math.sin(vAngle * Math.PI / 180);
  return { nx, ny };
}

// 판 위 픽셀 좌표
function normToPixel(nx, ny) {
  const boardEl = document.querySelector('.board-wrap');
  const half = boardEl ? boardEl.clientWidth / 2 : 150;
  return {
    x: half + nx * half * 0.95,
    y: half + ny * half * 0.95,
  };
}

// ══════════════════════════════════════
// 상태
// ══════════════════════════════════════
let S = {};
function initState() {
  return {
    active:   false,
    isTest:   false,
    score:    0,
    shots:    [],
    remaining: TOTAL_SHOTS,
    combo:    0,
    history:  S.history || [],
    // 게이지 위상 (랜덤 시작)
    power:       0,      // 0~POWER_MAX
    powerActive: false,  // 버튼 누르는 중
    autoFired:   false,
    hPhase:   Math.random() * Math.PI * 2,
    // 현재 값
    vVal:     0,   // 파워→상하 변환값
    hVal:     0,
    // 연속클릭 방지
    lockUntil: 0,
    // 펜딩 착탄 목록
    pending:  [],  // [{vAngle, hAngle, delay, elapsed}]
  };
}
S = initState();
let rafId = null, lastTs = null;

// ══════════════════════════════════════
// 메인 루프
// ══════════════════════════════════════
function loop(ts) {
  rafId = requestAnimationFrame(loop);
  if (!lastTs) { lastTs = ts; return; }
  const dt = Math.min(40, ts - lastTs);
  lastTs = ts;

  // 좌우 게이지는 항상 움직임 (시작 전에도)
  S.hPhase += H_RATE * dt;
  S.hVal = Math.sin(S.hPhase) * MAX_ANGLE;

  if (!S.active) {
    updateGaugeUI();
    return;
  }

  // ── 게이지 위상 업데이트 (게임 중)
  // 파워: 버튼 누르는 동안 증가
  if (S.powerActive) {
    const base = POWER_RATE * dt;
    let spd;
    const dc = Math.abs(S.power - 50); // 중앙까지 거리 (0=중앙, 50=끝)
    if (S.power >= 100) {
      spd = base / 2.5;                  // 100+ 자동발사 패널티 (느림)
    } else if (dc > 40) spd = base / 3.5;
    else if   (dc > 30) spd = base / 2.0;
    else if   (dc > 20) spd = base / 1.3;
    else if   (dc > 10) spd = base / 1.0;
    else                spd = base * 1.5; // 40~60 중앙 부근 (빠름)
    S.power = Math.min(POWER_MAX, S.power + spd);
    // 파워 → 상하 각도: 0%=아래MAX, 50%=중앙(0), 100%=위MAX
    S.vVal = ((S.power / 100) - 0.5) * 2 * -MAX_ANGLE;

    if (S.power >= POWER_MAX && !S.autoFired) {
      S.autoFired = true;
      S.powerActive = false;
      fire();
    }
  }

  // ── UI 업데이트
  updateGaugeUI();

  // ── 펜딩 착탄 처리
  for (let i = S.pending.length - 1; i >= 0; i--) {
    S.pending[i].elapsed += dt;
    if (S.pending[i].elapsed >= S.pending[i].delay) {
      resolveDart(S.pending.splice(i, 1)[0]);
    }
  }
}

function updateGaugeUI() {
  // 상하 바늘: 0%(왼쪽)=위MAX, 50%=중앙, 100%(오른쪽)=아래MAX
  const hPct = (S.hVal + MAX_ANGLE) / (MAX_ANGLE * 2) * 100;
  $('hNeedle').style.left = hPct.toFixed(1) + '%';

  // 라벨
  const hDir = S.hVal < -1 ? '좌' : S.hVal > 1 ? '우' : '정중앙';
  $('hVal').textContent = Math.abs(S.hVal) < 1 ? '정중앙' : `${hDir} ${Math.abs(S.hVal).toFixed(0)}°`;

  // 파워 게이지
  const NORMAL_PCT = 100 / POWER_MAX * 100;
  let fillPct;
  if (S.power <= 100) {
    fillPct = (S.power / 100) * NORMAL_PCT;
  } else {
    fillPct = NORMAL_PCT + ((S.power - 100) / (POWER_MAX - 100)) * (100 - NORMAL_PCT);
  }
  const isOver = S.power > 100;
  const pFill = $('powerFill');
  pFill.style.width = fillPct.toFixed(1) + '%';
  pFill.classList.toggle('over', isOver);
  // 라벨
  const pwrDir = S.power < 49 ? '아래' : S.power > 51 ? '위' : '정중앙';
  const pwrDeg = Math.abs(S.vVal).toFixed(0);
  $('powerVal').textContent = !S.powerActive ? '— 대기중' :
    (Math.abs(S.vVal) < 1 ? '정중앙' : `${pwrDir} ${pwrDeg}°`);

  // 조준점 위치 업데이트 (차징 중일 때만 표시)
  if (S.active) {
    const ch = $('crosshair');
    if (S.powerActive && S.isTest) {
      const { nx, ny } = angleToNorm(S.vVal, S.hVal);
      const { x, y }   = normToPixel(nx, ny);
      ch.style.left = x + 'px';
      ch.style.top  = y + 'px';
      ch.classList.add('show');
    } else {
      ch.classList.remove('show');
    }
  }

  // 버튼 잠금 표시
  const locked = Date.now() < S.lockUntil;
  $('btnFire').classList.toggle('locked', locked);
  if (locked) {
    $('btnFire').textContent = '⏳ 재충전 중...';
  } else if (!S.active) {
    $('btnFire').textContent = '🎯 발사';
  } else if (!S.powerActive) {
    $('btnFire').textContent = '🎯 발사';
  }
}

// ══════════════════════════════════════
// 발사
// ══════════════════════════════════════
function fire() {
  const vAngle = S.vVal;  // 파워→상하 각도
  vibrate(25);
  const hAngle = S.hVal;  // 좌우 바늘 위치

  S.remaining--;
  $('infoShots').textContent = S.remaining;

  // 즉시 착탄
  S.power      = 0;
  S.autoFired  = false;
  S.powerActive = false;
  // S.vVal은 현재 위치 유지 (갑작스러운 점프 제거)
  S.pending.push({ vAngle, hAngle, delay: 0, elapsed: 0 });
  S.lockUntil = Date.now() + LOCK_MS;
  startLockRing(LOCK_MS);
  $('powerFill').style.width = '0%';
  $('powerFill').classList.remove('over'); // over 깜빡임 즉시 제거

  $('powerVal').textContent = '— 대기중';
  $('resultText').textContent = '🎯 발사!';
}

// ══════════════════════════════════════
// 착탄 확정
// ══════════════════════════════════════
function resolveDart(snap) {
  const { nx, ny } = angleToNorm(snap.vAngle, snap.hAngle);
  const result = calcDartScore(nx, ny);
  const { x, y } = normToPixel(nx, ny);

  addMark(x, y, result.ring);

  S.shots.push({ score: result.score, label: result.label, ring: result.ring });
  S.score += result.score;
  $('infoScore').textContent = S.score;

  // 예상 보상 실시간 표시
  const projected = calcReward(S.score);
  const rewEl = $('infoReward');
  if (rewEl) {
    if (projected.total > 0) {
      rewEl.textContent = `→ ${fmtMoney(projected.total)}`;
      rewEl.style.opacity = '1';
    } else {
      rewEl.textContent = '';
    }
  }

  // 콤보
  if (result.score >= 25) {
    S.combo++;
    if (S.combo >= 3) showCombo(S.combo);
  } else { S.combo = 0; }

  // 플래시
  if      (result.ring === 'bull')  { flash('bull'); vibrate([60,30,60]); }
  else if (result.score >= 20)      { flash('good'); vibrate([40]); }
  else if (result.score === 0)      { flash('miss'); vibrate([15]); }
  else                              { vibrate([25]); }

  $('resultText').textContent = `${result.label} · +${result.score}점`;

  // 종료 체크
  if (S.remaining <= 0 && S.pending.length === 0) {
    setTimeout(showResult, 500);
  }
}

// ══════════════════════════════════════
// 화살 마크
// ══════════════════════════════════════
function addMark(x, y, ring) {
  const wrap = document.querySelector('.board-wrap');
  const mk = document.createElement('div');
  mk.className = 'dart-mark';
  mk.style.left = x + 'px';
  mk.style.top  = y + 'px';
  const colors = {
    bull:'#ffd166', bull25:'#ffd166',
    triple:'#ff3d6b', double:'#ff3d6b',
    single:'#00e5ff', miss:'#6b7280'
  };
  mk.innerHTML = `<svg width="14" height="14" viewBox="0 0 14 14">
    <polygon points="7,0 8.5,5.5 14,5.5 9.5,9 11,14 7,11 3,14 4.5,9 0,5.5 5.5,5.5"
      fill="${colors[ring]||'#aaa'}" opacity="0.95"/>
  </svg>`;
  wrap.appendChild(mk);
}
function clearMarks() { document.querySelectorAll('.dart-mark').forEach(m=>m.remove()); }

// ══════════════════════════════════════
// 잠금 링 애니메이션
// ══════════════════════════════════════
function startLockRing(ms) {
  const wrap = $('lockBarWrap');
  const bar  = $('lockBar');

  // 초기화
  bar.style.transition = 'none';
  bar.style.width = '0%';
  wrap.classList.add('show');

  // 한 프레임 후 애니메이션
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      bar.style.transition = `width ${ms}ms linear`;
      bar.style.width = '100%';
    });
  });

  // 완료 후 숨김
  setTimeout(() => {
    wrap.classList.remove('show');
    bar.style.transition = 'none';
    bar.style.width = '0%';
  }, ms + 50);
}

// ══════════════════════════════════════
// 콤보
// ══════════════════════════════════════
function showCombo(n) {
  const el = $('comboPop');
  el.textContent = `🔥 ${n} COMBO!`;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 900);
}

// ══════════════════════════════════════
// 결과
// ══════════════════════════════════════
function showResult() {
  const r = calcReward(S.score);
  const total = r.total || 0;

  $('resultScore').textContent = S.score;
  $('resultScoreSub').textContent =
    `총 ${TOTAL_SHOTS}발 · 평균 ${(S.score/TOTAL_SHOTS).toFixed(1)}점`;

  const grid = $('shotsGrid');
  grid.innerHTML = '';
  S.shots.forEach(s => {
    const c = document.createElement('div');
    c.className = 'shot-chip';
    c.innerHTML = `<div class="pt">${s.score}</div><div class="lb">${s.label}</div>`;
    grid.appendChild(c);
  });

  const rewardBox = document.querySelector('.reward-box');
  if (S.isTest) {
    rewardBox.style.background = 'rgba(255,255,255,0.04)';
    rewardBox.style.borderColor = 'rgba(255,255,255,0.1)';
  } else {
    rewardBox.style.background = '';
    rewardBox.style.borderColor = '';
  }
  $('rewardAmount').textContent = S.isTest ? '연습 모드' : fmtMoney(total);
  $('rewardDetail').textContent = S.isTest
    ? '연습 모드 · 보상이 적용되지 않습니다'
    : (total > 0 ? `${S.score}점 달성 → ${fmtMoney(total)}` : '100점 이하 보상 없음 (101점 이상 필요)');

  const now = new Date();
  const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  S.history.unshift({ score: S.score, reward: total, time: timeStr, test: S.isTest });
  if (S.history.length > 10) S.history.pop();
  renderHistory();

  $('resultOverlay').classList.add('show');

  if (total > 0 && !S.isTest) {
    post({ type:'EARN_POINTS', deltaPoints: Math.round(total / 100000), source: GAME_ID, meta:{ score: S.score } });
    post({ type:'SAVE_BALANCE', balance: (hubState.balance||0) + total, gameId: GAME_ID });
    hubState.balance = (hubState.balance||0) + total;
    syncHud();
  }
  post({ type:'GAME_OVER', gameId: GAME_ID, score: S.score, reward: Math.round(total / 100000) });
}

function renderHistory() {
  const list = $('historyList');
  if (!S.history.length) {
    list.innerHTML = '<div class="history-empty">아직 기록이 없어요</div>'; return;
  }
  list.innerHTML = S.history.map(h =>
    `<div class="history-item">
      <span class="hi-mode">${h.test ? '🎓' : '🎯'} ${h.time || ''}</span>
      <span class="hi-score">${h.score}점</span>
      <span class="hi-reward">${h.test ? '연습' : (h.reward>0?fmtMoney(h.reward):'꽝')}</span>
    </div>`
  ).join('');
}

// ══════════════════════════════════════
// 게임 시작
// ══════════════════════════════════════
function startGame(isTest = false) {
  clearMarks();
  vibrate(40);
  const hist = S.history;
  S = initState();
  S.history = hist;
  S.active  = true;
  S.isTest  = isTest;
  // 게이지는 랜덤 위상에서 시작 (initState에서 처리됨)

  $('infoShots').textContent  = TOTAL_SHOTS;
  $('infoScore').textContent  = 0;
  const rewEl = $('infoReward'); if(rewEl) rewEl.textContent = '';
  $('resultText').textContent = S.isTest ? '🎓 연습 모드 · 버튼을 눌러 발사!' : '버튼을 눌러 발사!';
  $('resultOverlay').classList.remove('show');
  closeSettings();
}

// ══════════════════════════════════════
// 설정
// ══════════════════════════════════════
function openSettings()  { $('settingsPanel').classList.add('show'); }
function closeSettings() { $('settingsPanel').classList.remove('show'); }

// ══════════════════════════════════════
// 이벤트
// ══════════════════════════════════════
$('btnFire').addEventListener('pointerdown', e => {
  e.preventDefault();
  e.stopPropagation();
  if (!S.active) { toast('게임을 먼저 시작하세요!'); return; }
  if (S.remaining <= 0) return;
  if (Date.now() < S.lockUntil) return;
  if (S.powerActive) return;
  try { e.target.setPointerCapture(e.pointerId); } catch(_) {}
  S.power       = 0;
  S.autoFired   = false;
  S.powerActive = true;
}, {passive: false});

$('btnFire').addEventListener('pointerup', e => {
  e.preventDefault();
  if (!S.powerActive) return;
  S.powerActive = false;
  fire();
}, {passive: false});

$('btnFire').addEventListener('pointercancel', e => {
  if (!S.powerActive) return;
  S.powerActive = false;
  fire();
}, {passive: false});

$('btnSettings').onclick = openSettings;
$('settingsPanel').addEventListener('click', e => {
  if (e.target === $('settingsPanel')) closeSettings();
});
$('btnStartFee').onclick = () => {
  if (spendPending) { toast('처리 중입니다...'); return; }
  if (hubState.balance === null || hubState.balance < FEE) { toast('잔액이 부족합니다!'); return; }
  spendPending = true;
  post({ type:'SPEND_POINTS', gameId:GAME_ID, amount: FEE });
};
$('btnTest').onclick = () => { closeSettings(); startGame(true); };
$('btnClose').onclick = () => { $('resultOverlay').classList.remove('show'); };

// ══════════════════════════════════════
// 초기화
// ══════════════════════════════════════
if (window.self !== window.top) { document.body.classList.add('in-iframe'); }
document.addEventListener('DOMContentLoaded', () => {
  buildBoard();
  renderHistory();
  post({ type:'REQUEST_POINT_INFO' });
  rafId = requestAnimationFrame(loop);
  setTimeout(openSettings, 300);
});
</script>
</body>
</html>
